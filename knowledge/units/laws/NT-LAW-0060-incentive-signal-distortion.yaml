id: NT-LAW-0060
type: law
status: frozen
version: 0.1.0
title: Sự bóp méo tín hiệu khuyến khích
summary: Khi một chỉ số đo lường trở thành mục tiêu khuyến khích rõ ràng, các tác nhân sẽ tối ưu hóa chỉ số đó thay vì kết quả thực tế mà tổ chức hướng tới.
primary_domain: tu-than
secondary_domains:
- hop-chung
definition: 'Định luật Goodhart áp dụng vào quản trị tổ chức: khi một chỉ số được chọn để chi trả các khoản thưởng khuyến khích, các tác nhân sẽ tối ưu hóa chính chỉ số đó.'
conditions:
- Các phần thưởng bên ngoài có giá trị cao gắn liền trực tiếp với các chỉ số hiệu suất hạn hẹp.
exceptions:
- Các công việc vật lý mang tính định hình thuần túy, nơi sản lượng đo lường được phản ánh hoàn hảo chất lượng.
applications:
  incentive_design:
  - Kết hợp các mục tiêu định lượng với các rào cản chất lượng mang tính định tính.
risks:
- Tạo ra các động lực ngược chiều vô tình dung túng cho các hành vi gây hại.
