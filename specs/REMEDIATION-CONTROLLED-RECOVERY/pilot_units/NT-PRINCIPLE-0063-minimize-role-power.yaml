proposed_unit:
  id: NT-PRINCIPLE-0063
  type: principle
  status: frozen
  version: 1.0.0
  title: Giảm thiểu quyền lực vai trò
  summary: Tiết chế việc sử dụng quyền lực vị trí trong các cuộc thảo luận chuyên
    môn để bảo vệ luồng thông tin phản biện chân thực từ tuyến đầu.
  primary_domain: dung-nhan
  domain_area: NT-DA-0011
  secondary_domains:
  - tu-than
  definition: Nguyên tắc quản trị tương tác nhằm hạn chế tối đa sự can thiệp của cấp
    bậc hành chính vào quá trình tranh luận kỹ thuật và phân tích dữ liệu thực tế.
  mechanism:
  - Người chủ trì cuộc họp phát biểu sau cùng để tránh tạo hiệu ứng mỏ neo quyền lực.
  - Cấp dưới được bảo đảm quyền nêu các dữ liệu trái chiều mà không chịu rủi ro quy
    kết cá nhân.
  - Quyết định dựa trên trọng số bằng chứng và luận cứ logic thay vì cấp bậc người
    phát biểu.
  conditions:
  - Các quyết định kỹ thuật, kiến trúc sản phẩm, chẩn đoán nguyên nhân gốc rễ (post-mortem)
    hoặc đánh giá rủi ro đầu tư.
  - Đội ngũ có đủ năng lực chuyên môn và thiện chí hợp tác để đóng góp ý kiến có căn
    cứ.
  exceptions:
  - Tình huống ứng cứu khẩn cấp đòi hỏi chuỗi chỉ huy tập trung một đầu mối để hành
    động tức thời.
  - Các quyết định thuộc thẩm quyền chịu trách nhiệm pháp lý cá nhân không thể ủy
    quyền của người đại diện theo pháp luật.
  applications:
    management:
    - Quy định người có quyền lực cao nhất phát biểu cuối cùng trong các phiên phản
      biện chuyên môn
  risks:
  - Đánh đồng việc tiết chế quyền lực chức danh với việc buông lỏng trách nhiệm chốt
    quyết định cuối cùng.
  - Tạo khoảng trống quyền lực hình thức khiến các nhóm lợi ích ngầm thao túng cuộc
    họp.
