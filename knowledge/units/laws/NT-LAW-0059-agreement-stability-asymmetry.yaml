mechanism:
- Thỏa thuận được thiết lập dựa trên phương án thay thế của từng bên.
- Chi phí rời bỏ và giá trị phương án thay thế khác nhau giữa các bên.
- Bên có phương án thay thế tốt hơn chịu ít tổn thất khi phá vỡ thỏa thuận.
- Cấu trúc thỏa thuận không tính bất đối xứng này sẽ mất ổn định khi bối cảnh thay đổi.
