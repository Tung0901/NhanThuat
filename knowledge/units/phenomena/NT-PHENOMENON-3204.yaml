id: NT-PHENOMENON-3204
type: phenomenon
title: Gói ghép cám dỗ
summary: Kết hợp một hành vi tốt cho bạn về lâu dài với một hành vi mang lại cảm giác dễ chịu trong ngắn hạn.
primary_domain: tri-nhan
domain_area: NT-DA-0028
definition: Một chiến lược can thiệp hành vi được thiết kế để giải quyết thiên kiến hiện tại bằng cách gắn kết một hoạt động mang lại khoái cảm tức thì (muốn làm) với một hoạt động có sự trì hoãn phần thưởng (nên làm).
mechanism:
- Xác định một nhiệm vụ 'nên làm' thiếu phần thưởng tức thì.
- Xác định một nhiệm vụ 'muốn làm' mang lại khoái cảm tức thì.
- Hạn chế nghiêm ngặt nhiệm vụ 'muốn làm' để nó chỉ có thể thực hiện đồng thời với nhiệm vụ 'nên làm'.
conditions:
- 'Các nhiệm vụ có thể thực hiện đồng thời về mặt thể chất hoặc nhận thức (ví dụ: chạy trên máy chạy bộ và nghe sách nói).'
exceptions:
- Các nhiệm vụ đòi hỏi sự tập trung sâu không thể ghép với những phần thưởng gây mất tập trung cao độ.
applications:
  habit_formation:
  - Chỉ cho phép xem một chương trình yêu thích khi đang làm báo cáo chi phí hành chính.
risks:
- Quy tắc sụp đổ nếu cá nhân thiếu ý chí tự chủ để duy trì sự hạn chế.
evidence:
  level: strong
  references:
  - Milkman, K. L., Minson, J. A., & Volpp, K. G. (2014). 'Holding the Hunger Games Hostage at the Gym'. Management Science.
