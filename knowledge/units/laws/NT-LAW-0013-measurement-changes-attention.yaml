id: NT-LAW-0013
type: law
status: frozen
version: 0.1.0
title: Việc đo lường làm thay đổi sự chú ý
summary: Những gì một hệ thống đo lường lặp đi lặp lại sẽ trở nên dễ thấy hơn, dễ thảo luận hơn và định hình hành vi mạnh mẽ hơn những gì không được đo lường.
primary_domain: thanh-su
secondary_domains:
- dung-nhan
- hop-chung
definition: Đo lường định hướng sự chú ý bằng cách làm cho các kết quả được lựa chọn trở nên dễ nhận biết, so sánh, khen thưởng và quản lý hơn.
mechanism:
- Lựa chọn một chỉ số đo lường
- Đánh giá chỉ số đó một cách lặp đi lặp lại
- Chuyển dịch sự chú ý và hành vi hướng về những gì hiển hiện.
conditions:
- Các chỉ số đo lường được xem xét bởi những người có tầm ảnh hưởng
- Yếu tố được đo lường có ảnh hưởng đến việc đánh giá hoặc ra quyết định.
exceptions:
- Mọi người có thể phớt lờ các chỉ số đo lường mà họ không tin tưởng
- Các giá trị không được đo lường vẫn có thể đóng vai trò quan trọng về mặt văn hóa.
applications:
  operations:
  - Đo lường các chỉ số dẫn dắt cũng như các kết quả cuối cùng.
  management:
  - Kiểm toán những gì mà các bảng điều khiển hiện tại đang che khuất.
risks:
- Tối ưu hóa chỉ số đo lường thay vì tập trung vào sứ mệnh
- Triệt tiêu các đánh giá mang tính định tính.
