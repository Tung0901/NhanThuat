id: NT-PHENOMENON-3101
type: phenomenon
title: Phụ thuộc điểm tham chiếu
summary: Kết quả không được đánh giá theo giá trị tuyệt đối, mà theo độ lệch tích cực hoặc tiêu cực (thắng hoặc thua) so với một điểm tham chiếu chủ quan.
primary_domain: tri-nhan
domain_area: NT-DA-0027
definition: Cơ chế tâm lý cốt lõi của Lý thuyết triển vọng, trong đó hiện trạng (hoặc kỳ vọng) nền tảng quyết định liệu một kết quả được nhìn nhận là thành công hay thất bại.
mechanism:
- 'Một điểm tham chiếu nền tảng được thiết lập (ví dụ: mức lương hiện tại).'
- Các kết quả mới được so sánh nghiêm ngặt với điểm tham chiếu này.
- Mức tài sản tuyệt đối ít quan trọng hơn độ lệch so với điểm tham chiếu.
conditions:
- Các tình huống mà kỳ vọng hoặc hiện trạng nổi bật rõ rệt.
exceptions:
- Các nhu cầu sinh tồn cơ bản, nơi các ngưỡng tuyệt đối quan trọng hơn các thay đổi tương đối.
applications:
  negotiation:
  - Quản lý kỳ vọng sớm để neo điểm tham chiếu theo hướng có lợi.
risks:
- 'Nhân viên bất mãn dù có mức đãi ngộ tuyệt đối cao, nếu điểm tham chiếu (ví dụ: lương của đồng nghiệp) cao hơn.'
evidence:
  level: strong
  references:
  - 'Tversky, A., & Kahneman, D. (1991). ''Loss Aversion in Riskless Choice: A Reference-Dependent Model''. Quarterly Journal of Economics.'
relations:
