id: NT-PRINCIPLE-0077
type: principle
status: frozen
version: 0.2.0
title: Tách truyền đạt khỏi ảnh hưởng
summary: Gửi thông tin đầy đủ không tự động tạo ra ảnh hưởng. Cần tách hai việc này để thiết kế đúng cách tác động và đánh giá đúng kết quả truyền đạt.
primary_domain: tri-nhan
secondary_domains:
- dung-nhan
definition: Tách truyền đạt khỏi ảnh hưởng là nguyên tắc phân biệt giữa việc chuyển giao thông tin (truyền đạt) và việc thay đổi nhận thức, quyết định hoặc hành vi của người nhận (ảnh hưởng).
conditions:
- Tồn tại mục tiêu thay đổi hành vi gắn với hoạt động truyền thông.
- Có thể đo lường riêng mức độ tiếp nhận và mức độ thay đổi.
exceptions:
- Truyền đạt thuần túy theo quy định không kèm mục tiêu ảnh hưởng hành vi.
- Ảnh hưởng không phù hợp đạo đức như thao túng thông tin bị loại trừ.
applications:
  communication:
  - 'Đặt mục tiêu riêng cho từng chiến dịch: ghi nhận, thấu hiểu hay thay đổi hành vi.'
  - Đo lường riêng mức độ hiểu và mức độ hành động sau truyền thông.
  leadership:
  - Phân biệt giữa đã thông báo và đã tạo được đồng thuận.
  change-management:
  - Thiết kế chuỗi hoạt động từ cung cấp thông tin tới tạo điều kiện thay đổi hành vi.
risks:
- Tăng khối lượng truyền thông nhưng hành vi không thay đổi.
- Đánh giá hiệu quả truyền thông bằng số lượng thay vì mức thay đổi.
- Dùng truyền đạt để lảng tránh trách nhiệm tạo ảnh hưởng thực chất.
