id: NT-LAW-0050
type: law
status: frozen
version: 0.1.0
title: Kiệt quệ do quá tải nhận thức
summary: Đơn vị tri thức cấu trúc về hiện tượng kiệt quệ do quá tải nhận thức trong tổ chức.
primary_domain: tu-than
secondary_domains:
- tri-nhan
definition: Định nghĩa chuẩn tắc về sự kiệt quệ do quá tải nhận thức trong cấu trúc Nhân Thuật.
conditions:
- Bối cảnh quản trị vận hành tổ chức.
exceptions:
- Cơ chế can thiệp ưu tiên trong tình trạng khủng hoảng khẩn cấp.
applications:
  governance:
  - Ứng dụng nguyên lý kiệt quệ tải nhận thức vào việc tối ưu hóa quy trình làm việc tổ chức.
risks:
- Áp dụng sai nguyên lý kiệt quệ tải nhận thức dẫn đến suy giảm hiệu suất hoạt động.
