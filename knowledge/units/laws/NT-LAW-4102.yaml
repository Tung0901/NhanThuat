id: NT-LAW-4102
type: law
status: draft
version: 1.0.0
title: Quy luật Ngại Mất Mát (Loss Aversion)
summary: Tâm lý trước một khoản tổn thất tiềm năng thường có cường độ phản ứng mạnh hơn so với một khoản thu lợi tương đương trong cùng điểm tham chiếu, với biên độ thực nghiệm điển hình dao động quanh 1.5 đến 2.5 lần tùy bối cảnh.
primary_domain: tu-than
domain_area: NT-DA-0027
secondary_domains:
- tri-nhan
definition: Quyết định của con người thường có xu hướng tránh rủi ro mất mát nhiều hơn tìm kiếm lợi ích tương đương khi điểm tham chiếu được xác lập rõ ràng.
conditions:
- Khi phải đưa ra lựa chọn giữa các phương án mang rủi ro rõ ràng.
exceptions:
- Khi cá nhân đã rơi vào bước đường cùng, lúc này họ chấp nhận rủi ro cực đoan.
applications:
  general:
  - Áp dụng trong quản trị và kinh doanh.
risks:
- Tạo ra quyết định bảo thủ, bỏ lỡ cơ hội đổi mới.
evidence:
  level: strong
  references:
  - '[Empirical Study] Kahneman, D., & Tversky, A. (1979). Prospect Theory: An Analysis of Decision
    under Risk. Econometrica, 47(2), 263-291 (Hàm giá trị bất đối xứng giữa vùng lãi và vùng lỗ).'
  - '[Empirical Study] Walasek, L., & Stewart, N. (2015). How to make loss aversion disappear and
    reverse. Journal of Experimental Psychology: General, 144(1), 7-11 (Điều kiện biên làm suy giảm hoặc
    đảo chiều hệ số ngại mất mát).'
  - '[Classical Analogy] Tôn Vũ — Tôn Tử Binh Pháp, thiên Cửu Địa (Phân tích tâm lý sĩ tốt khi rơi vào thế
    tử địa so với tán địa).'
  - '[Editorial Inference] Khung hiệu chỉnh thiên kiến phòng thủ trong quyết định phân bổ vốn và cắt lỗ
    dự án.'
relations:
  supports: []
  conflicts_with: []
  depends_on: []
  applies_to: []
tags:
