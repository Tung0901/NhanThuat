id: NT-LAW-3002
type: law
status: frozen
version: 0.1.0
title: Sự chú ý là Hữu hạn và Có hướng
summary: Sự chú ý là một nguồn lực bị giới hạn nghiêm ngặt và chỉ có thể được định hướng một cách tuần tự, khiến cho việc đa nhiệm thực chất chỉ là ảo tưởng về sự chuyển đổi ngữ cảnh nhanh chóng với chi phí chuyển đổi rất cao.
primary_domain: tri-nhan
domain_area: NT-DA-0026
secondary_domains:
- tu-than
definition: Não bộ con người xử lý sự chú ý có ý thức theo phương thức nối tiếp. Mọi nỗ lực phân chia sự chú ý cho nhiều tác vụ phức tạp cùng lúc đều dẫn đến việc chuyển đổi nhanh chóng giữa các tác vụ, làm giảm hiệu suất và gia tăng sự mệt mỏi về mặt nhận thức.
mechanism:
- Não bộ tập trung hoàn toàn vào Tác vụ A.
- Một kích thích hoặc tín hiệu từ Tác vụ B gây gián đoạn.
- Não bộ ngắt kết nối khỏi Tác vụ A, định hướng lại và bắt đầu xử lý Tác vụ B.
- Độ chính xác và tốc độ xử lý giảm mạnh so với việc tập trung tuần tự.
conditions:
- Các tác vụ đòi hỏi phải sử dụng bộ nhớ làm việc có ý thức.
exceptions:
- Kết hợp một tác vụ vật lý đã được tự động hóa cao với một tác vụ nhận thức.
applications:
  management:
  - Giới hạn số lượng dự án hoạt động đồng thời của mỗi cá nhân.
  environment:
  - Thiết kế không gian làm việc giúp bảo vệ nhân viên khỏi các tác nhân gây gián đoạn thường xuyên.
risks:
- Nhầm lẫn giữa việc chuyển đổi tác vụ nhanh chóng với năng suất làm việc cao.
evidence:
  level: strong
  references:
  - Kahneman, D. (1973). 'Attention and Effort'. Prentice-Hall.
