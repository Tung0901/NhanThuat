id: NT-PHENOMENON-3303
type: phenomenon
title: Hiệu ứng hào quang
summary: Xu hướng những ấn tượng tích cực về một người, công ty, thương hiệu hoặc sản phẩm ở một lĩnh vực ảnh hưởng tích cực đến ý kiến hoặc cảm xúc của ta ở các lĩnh vực khác.
primary_domain: tri-nhan
domain_area: NT-DA-0029
definition: 'Một thiên kiến nhận thức trong đó một đặc điểm tích cực đơn lẻ (ví dụ: ngoại hình ưa nhìn, sức hút cá nhân hoặc thành công trong quá khứ) tạo ra một luồng hào quang tích cực bao trùm, làm sai lệch việc đánh giá các đặc điểm không liên quan (ví dụ: trí thông minh, năng lực).'
mechanism:
- Một cá nhân thể hiện một đặc điểm tích cực nổi bật.
- Người quan sát hình thành một phản ứng cảm xúc tích cực mạnh mẽ.
- Phản ứng cảm xúc này lan sang mọi đánh giá sau đó về cá nhân, lấn át các dữ liệu khách quan.
conditions:
- Các đánh giá chủ quan, đặc biệt trong tuyển dụng, đánh giá hiệu suất hoặc bầu cử chính trị.
exceptions:
- 'Khi các tiêu chí đánh giá được định lượng chặt chẽ và ẩn danh (ví dụ: bài kiểm tra mã nguồn mù).'
applications:
  leadership:
  - Xây dựng uy tín ban đầu thông qua một chiến thắng nhanh, dễ thấy để giành được niềm tin cho những sáng kiến khó khăn hơn về sau.
risks:
- Thăng chức một nhân viên lôi cuốn nhưng kém năng lực lên vị trí lãnh đạo (Nguyên tắc Peter).
evidence:
  level: strong
  references:
  - Thorndike, E. L. (1920). 'A constant error in psychological ratings'. Journal of Applied Psychology.
