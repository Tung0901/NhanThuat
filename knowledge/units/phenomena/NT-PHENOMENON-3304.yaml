id: NT-PHENOMENON-3304
type: phenomenon
title: Tư duy bầy đàn
summary: Hiện tượng tâm lý xảy ra trong một nhóm người khi mong muốn hòa hợp hoặc tuân thủ dẫn đến một kết quả ra quyết định phi lý hoặc rối loạn chức năng.
primary_domain: tri-nhan
domain_area: NT-DA-0029
definition: Một kiểu tư duy mà con người thực hiện khi họ tham gia sâu vào một nhóm nội bộ gắn kết chặt chẽ, khi nỗ lực đạt sự nhất trí của các thành viên lấn át động lực đánh giá một cách thực tế các phương án hành động thay thế.
mechanism:
- Một nhóm gắn kết cao đối mặt với một quyết định phức tạp.
- Để duy trì sự hòa hợp trong nhóm và tránh xung đột, các ý kiến bất đồng bị tự kiểm duyệt hoặc chủ động bị đàn áp.
- Nhóm tạo ra những ảo tưởng về tính bất khả xâm phạm và sự nhất trí, dẫn đến những tính toán sai lầm thảm khốc.
conditions:
- Các nhóm gắn kết cao, biệt lập, dẫn dắt bởi một người lãnh đạo mạnh mẽ, chỉ đạo trực tiếp trong điều kiện áp lực cao.
exceptions:
- Các nhóm sử dụng phương thức "red teaming" chính thức hoặc các người phản biện được chỉ định (devil's advocate).
applications:
  decision_making:
  - Các nhà lãnh đạo nên giữ kín ý kiến của mình đến cuối buổi họp để tránh neo giữ định hướng của cả nhóm.
risks:
- Tiếp tục các chiến dịch ra mắt sản phẩm hoặc khoản đầu tư thảm họa dù nội bộ biết rõ rằng chúng sẽ thất bại.
evidence:
  level: strong
  references:
  - 'Janis, I. L. (1972). ''Victims of Groupthink: A psychological study of foreign-policy decisions and fiascoes''. Houghton Mifflin.'
