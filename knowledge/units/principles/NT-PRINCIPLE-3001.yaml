id: NT-PRINCIPLE-3001
type: principle
status: frozen
version: 0.1.0
title: Tối ưu hóa tải nhận thức
summary: Thiết kế môi trường, giao tiếp và quy trình để giảm thiểu tải nhận thức không cần thiết, giải phóng năng lực cho việc giải quyết vấn đề cốt lõi.
primary_domain: tri-nhan
domain_area: NT-DA-0026
secondary_domains:
- thanh-su
definition: Việc cấu trúc thông tin và quy trình làm việc sao cho trí nhớ làm việc không bị cạn kiệt bởi việc điều hướng hình thức trình bày, cho phép toàn bộ năng lực dồn vào nhiệm vụ thực tế.
mechanism:
- Xác định nhiệm vụ cốt lõi.
- Xác định ma sát cấu trúc hoặc định dạng trình bày không rõ ràng.
- Loại bỏ tải không cần thiết thông qua thiết kế, mặc định hoặc phân khối tốt hơn.
- Năng lực trí nhớ làm việc được giải phóng cho việc giải quyết vấn đề thực tế.
conditions:
- Các nhiệm vụ phức tạp đòi hỏi sự tập trung bền bỉ và trí nhớ làm việc.
exceptions:
- Khi học một giao diện hoặc công cụ mới, tải không cần thiết là điều tạm thời khó tránh.
applications:
  communication:
  - Dùng tiêu đề rõ ràng, gạch đầu dòng và câu chủ động để giảm công sức đọc hiểu văn bản.
  design:
  - Chuẩn hóa các lựa chọn lặp đi lặp lại để chúng trở thành hành vi tự động.
risks:
- Đơn giản hóa quá mức một vấn đề phức tạp để giảm tải, làm mất các sắc thái thiết yếu.
evidence:
  level: supported
  references:
  - 'Sweller, J. (1988). ''Cognitive load during problem solving: Effects on learning''. Cognitive Science.'
relations:
