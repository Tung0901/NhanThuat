id: NT-PHENOMENON-3411
type: phenomenon
title: Nghịch lý của sự lựa chọn (Quá tải lựa chọn)
summary: Trong khi có lựa chọn vẫn tốt hơn không có lựa chọn nào, thì sự dư thừa các phương án lại dẫn đến tê liệt quyết định, lo âu và mức độ hài lòng thấp hơn sau khi ra quyết định.
primary_domain: tri-nhan
domain_area: NT-DA-0030
definition: Hiện tượng khi tăng số lượng lựa chọn dành cho người tiêu dùng vượt quá một ngưỡng nhất định sẽ làm giảm khả năng mua hàng và làm tăng sự hối tiếc.
mechanism:
- Cá nhân được trình bày hàng chục phương án.
- Tải nhận thức khi so sánh mọi biến số làm quá tải chức năng điều hành.
- Sự hối tiếc dự kiến khi đưa ra lựa chọn 'sai' tăng vọt.
- Cá nhân mặc định không đưa ra lựa chọn nào cả (thiên kiến hiện trạng).
conditions:
- Các môi trường có nhiều biến số phức tạp, các phương án tương tự nhau và thiếu sự phân loại rõ ràng.
exceptions:
- Các chuyên gia cực kỳ sâu về lĩnh vực, những người biết chính xác họ muốn gì và thích sàng lọc qua hàng loạt kho hàng khổng lồ.
applications:
  product_design:
  - 'Giới hạn các gói giá ở 3 mức (ví dụ: Cơ bản, Chuyên nghiệp, Doanh nghiệp) thay vì cung cấp 15 gói có khả năng tùy chỉnh cao.'
risks:
- Mất khách hàng ngách do đơn giản hóa quá mức một dòng sản phẩm vốn đòi hỏi khả năng tùy chỉnh cao.
evidence:
  level: strong
  references:
  - 'Iyengar, S. S., & Lepper, M. R. (2000). ''When choice is demotivating: Can one desire too much of a good thing?''. Journal of Personality and Social Psychology.'
  - Schwartz, B. (2004). 'The Paradox of Choice'.
