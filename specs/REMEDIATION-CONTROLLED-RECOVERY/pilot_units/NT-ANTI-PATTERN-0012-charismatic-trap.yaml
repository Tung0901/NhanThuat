proposed_unit:
  id: NT-ANTI-PATTERN-0012
  type: anti-pattern
  status: frozen
  version: 1.0.0
  title: Bẫy sức hút cá nhân
  summary: Tổ chức phụ thuộc quá mức vào sức hút và phán đoán cảm tính của một lãnh
    đạo trung tâm, dẫn đến sự xói mòn của quy trình kiểm soát độc lập.
  primary_domain: dung-nhan
  domain_area: NT-DA-0011
  secondary_domains:
  - tu-than
  definition: Xu hướng tập thể quy gán mọi thành công cho tài năng xuất chúng của
    một cá nhân và nới lỏng các hàng rào kiểm soát rủi ro thể chế.
  mechanism:
  - Lãnh đạo có sức hút tạo dựng niềm tin mạnh mẽ ban đầu qua các thành tích nổi bật.
  - Tập thể và hội đồng quản trị giảm tần suất chất vấn và kiểm tra chéo các quyết
    định.
  - Ý kiến phản biện bị cô lập hoặc xem là thiếu trung thành.
  - Sai lầm chiến lược tích tụ trong bóng tối cho đến khi bùng phát thành khủng hoảng
    hệ thống.
  conditions:
  - Tổ chức vừa trải qua khủng hoảng hoặc tăng trưởng nóng nhờ một cá nhân dẫn dắt.
  - Hội đồng quản trị hoặc ban kiểm soát thiếu tính độc lập về thông tin và chuyên
    môn.
  exceptions:
  - Khi sức hút truyền cảm hứng đi kèm với quy trình phản biện bắt buộc và đội ngũ
    kế cận có quyền phủ quyết kỹ thuật.
  - Giai đoạn khởi nghiệp rất sớm khi cấu trúc quy trình chưa kịp hình thành, với
    điều kiện sớm thể chế hóa.
  applications:
    management:
    - Thiết lập hội đồng cố vấn độc lập và quy định bắt buộc phải có thẩm định kỹ
      thuật trước khi thông qua quyết định lớn
  risks:
  - Cực đoan hóa thành việc bài xích những nhà lãnh đạo có khả năng truyền cảm hứng.
  - Áp đặt bộ máy quan liêu cứng nhắc làm triệt tiêu tính quyết đoán cần thiết.
