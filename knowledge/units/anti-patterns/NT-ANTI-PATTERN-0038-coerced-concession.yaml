mechanism:
- Một bên tạo áp lực bằng thời hạn, quyền lực hoặc nguy cơ tổn thất.
- Bên kia nhượng bộ để tránh hậu quả trước mắt.
- Thỏa thuận đạt được nhưng thiếu cam kết tự nguyện.
- Bên bị ép tìm cách lách, trì hoãn hoặc phá vỡ khi có cơ hội.
