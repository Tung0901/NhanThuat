mechanism:
- Phân biệt cảm giác thiện cảm với bằng chứng về độ tin cậy.
- Đánh giá đối tác qua tính nhất quán hành vi và kết quả đã kiểm chứng.
- Thiết kế cơ chế bảo đảm cho các điểm thiếu dữ liệu tin cậy.
- Duy trì đánh giá định kỳ dựa trên hành vi thay vì cảm nhận.
