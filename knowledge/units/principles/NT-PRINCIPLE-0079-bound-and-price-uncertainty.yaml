id: NT-PRINCIPLE-0079
type: principle
status: frozen
version: 0.2.0
title: Giới hạn và định giá sự không chắc chắn
summary: Đặt giới hạn và định giá cụ thể cho sự không chắc chắn thay vì giả định nó bằng không. Xử lý bất định có phương pháp giúp quyết định tỉnh táo hơn.
primary_domain: tri-nhan
secondary_domains:
- thanh-su
definition: Giới hạn và định giá sự không chắc chắn là nguyên tắc quản trị rủi ro yêu cầu mọi kế hoạch quan trọng phải nêu rõ phạm vi bất định, xác suất ước lượng và chi phí đi kèm của khả năng sai khác.
conditions:
- Kế hoạch có ảnh hưởng lớn và phụ thuộc vào giả định.
- Có dữ liệu hoặc kinh nghiệm để ước lượng phạm vi bất định.
exceptions:
- Công việc thử nghiệm nhỏ, chi phí sai thấp có thể chấp nhận bất định cao không cần định giá.
- Quyết định khẩn cấp phải hành động trước khi đủ thông tin định giá.
applications:
  planning:
  - Bắt buộc ghi phạm vi bất định và phương án dự phòng trong kế hoạch trọng yếu.
  - Phân bổ ngân sách dự phòng theo mức bất định thực tế.
  negotiation:
  - Đưa điều khoản điều chỉnh cho các biến số không chắc chắn trong hợp đồng.
  governance:
  - Yêu cầu trình bày kịch bản xấu nhất và chi phí của nó trước khi phê duyệt.
risks:
- Giả định bất định bằng không dẫn tới sốc khi sai khác lớn.
- Định giá bất định hình thức không gắn với ngân sách thực.
- Dùng bất định làm cái cớ cho mọi thất bại.
evidence:
