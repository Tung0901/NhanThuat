id: NT-ANTI-PATTERN-0010
type: anti-pattern
status: frozen
version: 0.1.0
title: Tyranny of simplistic typology
summary: Using branded, binary personality profiles as rigid, deterministic labels to exclude, select, or make absolute placement decisions.
primary_domain: tri-nhan
secondary_domains: [dung-nhan]
definition: The misuse of personality assessments to label individuals permanently, ignoring the context-dependence of behavior, compensatory skills, and gradual trait development.
mechanism:
  - Apply binary classification test (e.g. MBTI, DISC).
  - Label individuals as fixed, immutable types.
  - Make deterministic hiring, delegation, or promotion decisions based on type matching.
  - Block growth and development opportunities based on type stereotypes.
conditions:
  - Organizations rely on trademarked psychometric tests to filter candidates or assign responsibilities automatically.
exceptions:
  - Using general trait terms as non-binding, shared vocabulary to discuss communication styles.
applications:
  governance: [Prohibit using personality typologies as screening filters or gatekeepers in recruitment and assignment.]
  coaching: [Focus development on skills, self-regulation strategies, and context sensitivity rather than rigid profiles.]
risks:
  - Restricting team development by ignoring individual agency and learning capacity.
