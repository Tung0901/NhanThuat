id: NT-ANTI-PATTERN-0045
type: anti-pattern
status: frozen
version: 0.1.0
title: Khoảng trống thẩm quyền
summary: Không chỉ định rõ người chịu trách nhiệm quyết định, dẫn đến sự đình trệ, các cuộc tranh luận vô hồi kết của hội đồng và thất bại không ai nhận trách nhiệm.
primary_domain: dung-nhan
secondary_domains:
- hop-chung
definition: Khoảng trống thẩm quyền xảy ra khi ban lãnh đạo từ chối giao quyền quyết định rõ ràng cho một cá nhân cụ thể.
mechanism:
- Cần phải đưa ra một quyết định.
- Không có cá nhân nào được giao quyền quyết định chính.
- Các hội đồng tranh luận kéo dài không hồi kết.
- Dẫn đến kết quả tồi tệ và thất bại.
conditions:
- Văn hóa tổ chức quá ám ảnh bởi sự đồng thuận tập thể.
exceptions:
- Các cơ quan bỏ phiếu dân chủ được thành lập rõ ràng theo điều lệ.
applications:
  governance_audit:
  - Đảm bảo mỗi sáng kiến chiến lược đều có duy nhất một người đứng tên chịu trách nhiệm quyết định.
risks:
- Giao quyền cho kẻ độc tài mà thiếu các cơ chế tham vấn cần thiết.
evidence:
  level: supported
  references:
  - EV-REQ-0013-01
relations:
  supports: []
  conflicts_with:
  - NT-PRINCIPLE-0096
  depends_on:
  - NT-LAW-0064
  applies_to: []
