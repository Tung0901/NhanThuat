id: NT-MODEL-0025
type: model
status: frozen
version: 0.1.0
title: Quy trình hạ nhiệt xung đột
summary: Mô hình vận hành 4 giai đoạn nhằm vô hiệu hóa cảm giác bị đe dọa cá nhân và tái lập sự gắn kết tập trung vào nhiệm vụ.
primary_domain: hop-chung
secondary_domains:
- tri-nhan
definition: 'Quy trình hạ nhiệt xung đột vạch ra các bước giải quyết mâu thuẫn giữa các cá nhân: Vô hiệu hóa mối đe dọa, Cô lập vấn đề, Lập bản đồ lợi ích, Cam kết thỏa thuận.'
mechanism:
- 'Giai đoạn 1: Tái khẳng định sự tôn trọng lẫn nhau.'
- 'Giai đoạn 2: Tách biệt và cô lập các sự kiện khách quan của nhiệm vụ.'
- 'Giai đoạn 3: Lập bản đồ các lợi ích cốt lõi tiềm ẩn.'
- 'Giai đoạn 4: Thống nhất các cam kết hành động.'
conditions:
- Giải quyết các xung đột giữa các cá nhân đang diễn ra trong đội nhóm.
exceptions:
- Các tranh chấp pháp lý liên quan đến tố tụng chính thức.
applications:
  coaching:
  - Hướng dẫn các nhà quản lý cách xoa dịu những cuộc tranh cãi gay gắt trong nội bộ nhóm.
risks:
- Chuyển sang Giai đoạn 3 trước khi mối đe dọa về mặt cảm xúc được vô hiệu hóa hoàn toàn.
evidence:
