id: NT-PHENOMENON-3104
type: phenomenon
title: Hiệu ứng đóng khung
summary: Rút ra những kết luận khác nhau từ cùng một thông tin, tùy thuộc vào cách thông tin đó được trình bày.
primary_domain: tri-nhan
domain_area: NT-DA-0027
definition: 'Một thiên kiến nhận thức, trong đó các lựa chọn bị ảnh hưởng mạnh bởi việc các phương án được trình bày với hàm ý tích cực hay tiêu cực (ví dụ: ''sống sót 90%'' so với ''tử vong 10%'').'
mechanism:
- Thông tin được tiếp nhận với một khung ngữ nghĩa cụ thể.
- Khung đó dịch chuyển điểm tham chiếu chủ quan.
- Các quyết định bị đảo ngược tùy thuộc vào việc khung mang lại góc nhìn thắng hay mất.
conditions:
- Thông tin phức tạp hoặc thống kê được trình bày cho những người không chuyên.
exceptions:
- Khi khán giả có sẵn các mô hình nhận thức tường minh vững chắc về chủ đề.
applications:
  communication:
  - Đóng khung phản hồi theo hướng tích cực để khuyến khích chấp nhận rủi ro, hoặc tiêu cực để thúc ép sự tuân thủ.
risks:
- Thao túng không chủ ý các bên liên quan thông qua báo cáo thiên lệch.
evidence:
  level: strong
  references:
  - Tversky, A., & Kahneman, D. (1981). 'The framing of decisions and the psychology of choice'. Science.
