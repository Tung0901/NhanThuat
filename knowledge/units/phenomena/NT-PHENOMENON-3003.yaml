id: NT-PHENOMENON-3003
type: phenomenon
status: frozen
version: 0.1.0
title: Ngụy biện Heuristic Khả dụng
summary: Đánh giá tần suất hoặc xác suất của một sự kiện dựa trên mức độ dễ dàng khi nhớ lại các ví dụ, dẫn đến việc tính toán sai lầm trầm trọng về rủi ro.
primary_domain: tri-nhan
domain_area: NT-DA-0026
secondary_domains:
- thanh-su
definition: Một lối tắt nhận thức trong đó bộ não thay thế "độ dễ nhớ" bằng "tần suất thống kê", khiến các sự kiện sống động, mang tính cảm xúc hoặc mới xảy ra bị coi là phổ biến hơn nhiều so với thực tế.
mechanism:
- Một câu hỏi về tần suất hoặc rủi ro xuất hiện.
- Bộ não tìm kiếm các ví dụ trong trí nhớ.
- Các ví dụ sống động, gần đây hoặc được quảng bá rầm rộ được truy xuất ngay lập tức.
- Bộ não kết luận rằng sự kiện đó có xác suất xảy ra rất cao.
conditions:
- Áp lực thời gian hoặc thiếu quyền truy cập ngay lập tức vào dữ liệu tỷ lệ cơ sở thống kê.
exceptions:
- Các lĩnh vực mà tác giả đã nội tâm hóa các tỷ lệ cơ sở chính xác thông qua kinh nghiệm lâu năm.
- 'Hậu quả: Phân bổ quá mức tài nguyên để phòng ngừa các rủi ro kịch tính nhưng hiếm gặp; Phân bổ quá ít tài nguyên cho các rủi ro nhàm chán, phổ biến.'
- 'Dấu hiệu nhận biết: Các thay đổi chính sách hoàn toàn được thúc đẩy bởi một thất bại rõ ràng, gần đây thay vì dữ liệu xu hướng.'
applications:
  management:
  - Buộc phải sử dụng tỷ lệ cơ sở (mức trung bình lịch sử) khi đánh giá xác suất của một kết quả.
risks:
- Tê liệt do bỏ qua các cảnh báo trực quan hợp lệ để ưu tiên cho các tập dữ liệu có lỗi.
evidence:
  level: strong
  references:
  - 'Tversky, A., & Kahneman, D. (1973). ''Availability: A heuristic for judging frequency and probability''. Cognitive Psychology.'
