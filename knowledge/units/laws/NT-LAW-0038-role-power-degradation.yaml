id: NT-LAW-0038
type: law
status: frozen
version: 0.2.0
title: Suy giảm quyền lực theo vai trò
summary: Quyền lực gắn với vị trí suy giảm khi khoảng cách giữa người nắm quyền và nơi công việc thực sự diễn ra tăng lên. Thông tin và khả năng kiểm soát thực tế dịch chuyển về phía người gần công việc.
primary_domain: dung-nhan
secondary_domains:
- tri-nhan
definition: 'Suy giảm quyền lực theo vai trò là quy luật mô tả quá trình hao mòn quyền lực vị trí: quyền hạn danh nghĩa không tự động chuyển thành ảnh hưởng thực tế khi khoảng cách vận hành tăng.'
conditions:
- Tồn tại khoảng cách vận hành giữa vị trí quyền lực và nơi công việc diễn ra.
- Người vận hành có quyền tự quyết trong phạm vi công việc.
exceptions:
- Cơ chế báo cáo và kiểm soát trực tuyến thời gian thực thu hẹp khoảng cách thông tin.
- Quyền lực dựa trên chuyên môn sâu không suy giảm theo khoảng cách.
applications:
  governance:
  - Thiết kế cơ chế báo cáo trực tiếp từ điểm vận hành tới người ra quyết định.
  - Rà soát định kỳ sự lệch giữa sơ đồ quyền hạn và ảnh hưởng thực tế.
  management:
  - Duy trì hiện diện vận hành định kỳ để cập nhật thông tin thực địa.
  organization-design:
  - Phân bổ quyền quyết định theo khoảng cách thông tin, không chỉ theo cấp bậc.
risks:
- Người nắm vị trí nhầm quyền hạn danh nghĩa với ảnh hưởng thực tế.
- Quyết định đưa ra chậm và lệch do thiếu thông tin vận hành.
- Xung đột ngầm giữa quyền lực chính thức và quyền lực thông tin.
