id: NT-LAW-0018
type: law
status: frozen
version: 0.1.0
title: Vai trò định hình nhận thức
summary: Con người diễn giải các tình huống thông qua trách nhiệm, động lực, rào cản và bản sắc gắn liền với vai trò của họ.
primary_domain: dung-nhan
secondary_domains:
- tri-nhan
- hop-chung
definition: Một vai trò sẽ sàng lọc những gì một cá nhân chú ý, coi trọng, bỏ qua và bảo vệ vì nó xác định đóng góp kỳ vọng và mức độ ảnh hưởng của họ.
mechanism:
- Đảm nhận một vai trò
- Trải nghiệm các áp lực đặc thù của vai trò đó
- Diễn giải các sự kiện thông qua trách nhiệm của vai trò.
conditions:
- Vai trò đó đi kèm với các kỳ vọng và hệ quả rõ ràng
- Cá nhân tự đồng nhất mình với vai trò hoặc phụ thuộc vào vai trò đó.
exceptions:
- Sự tiếp xúc liên chức năng có thể mở rộng nhận thức
- Các giá trị cá nhân có thể vượt lên trên áp lực từ vai trò.
applications:
  management:
  - Đặt câu hỏi về những gì vai trò đó làm nổi bật hoặc che khuất.
  collaboration:
  - Chuyển dịch các vấn đề qua lăng kính của các vai trò khác nhau.
risks:
- Quy kết ý đồ xấu từ những điểm mù do vai trò định hình
- Thiết kế các vai trò có các tín hiệu hoặc thông điệp mâu thuẫn nhau.
