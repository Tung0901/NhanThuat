id: NT-LAW-0039
type: law
status: frozen
version: 0.2.0
title: Điểm mù do triệt tiêu phản biện
summary: Khi bất đồng bị triệt tiêu, tổ chức mất kênh phát hiện sự thật và tích lũy điểm mù nhận thức. Những gì không được nói ra sẽ không được sửa.
primary_domain: tri-nhan
secondary_domains:
- hop-chung
definition: 'Điểm mù do triệt tiêu phản biện là quy luật về hệ quả nhận thức của việc đàn áp bất đồng: khả năng tự phát hiện sai lệch của hệ thống suy giảm tương ứng với mức độ phản biện bị chặn.'
conditions:
- Người ra quyết định có quyền lực áp đặt hoặc trừng phạt.
- Thiếu kênh phản biện độc lập được bảo vệ.
exceptions:
- Kênh phản biện ẩn danh hoặc bên thứ ba độc lập vẫn duy trì dòng thông tin.
- Văn hóa tổ chức coi bất đồng là nghĩa vụ nghề nghiệp.
applications:
  governance:
  - Thiết lập kênh phản biện được bảo vệ và quy trình xử lý thông tin bất lợi không trừng phạt.
  - Định kỳ kiểm tra chéo các quyết định quan trọng bằng vai trò phản biện chỉ định.
  leadership:
  - Chủ động mời ý kiến trái chiều và cảm ơn người nêu vấn đề trước tập thể.
  culture:
  - Đưa tiêu chí dám nói sự thật vào đánh giá văn hóa định kỳ.
risks:
- Quyết định dựa trên thông tin đã được lọc theo hướng có lợi.
- Sự cố tích tụ phát nổ với quy mô lớn hơn nhiều so với nếu được xử lý sớm.
- Nhân sự giỏi rời đi vì không được nói thật.
