id: NT-PRINCIPLE-3302
type: principle
title: Kích hoạt chuẩn mực (Mô tả so với Mệnh lệnh)
summary: Khi cố gắng thay đổi hành vi, không bao giờ công khai rằng hành vi xấu đang phổ biến; thay vào đó, hãy nêu bật hành vi mong muốn như chuẩn mực xã hội.
primary_domain: tri-nhan
domain_area: NT-DA-0029
definition: Việc sử dụng chiến lược các chuẩn mực mô tả (điều mọi người thực sự làm) và chuẩn mực mệnh lệnh (điều mọi người nên làm) để tận dụng sự tuân thủ cho các kết quả tích cực.
mechanism:
- Con người tự nhiên tuân theo các chuẩn mực mô tả.
- Nếu một tấm biển ghi "Nhiều người trộm cắp trong khu rừng này, xin đừng làm vậy", nó vô tình chuẩn hóa hành vi trộm cắp.
- Thông điệp hiệu quả phải liên kết chuẩn mực mô tả ("Hầu hết mọi người bảo vệ khu rừng") với chuẩn mực mệnh lệnh ("Bạn cũng nên bảo vệ nó").
conditions:
- Thông điệp công khai, biển báo và đào tạo tuân thủ doanh nghiệp.
exceptions:
- Khi đang cố gắng khơi mào một cuộc nổi dậy chống lại một quyền lực đã được thiết lập.
applications:
  compliance:
  - Thay vì "Nhiều nhân viên không hoàn thành đào tạo bảo mật", hãy dùng "95% đồng nghiệp của bạn đã hoàn thành đào tạo".
risks:
- Vô tình gia tăng hành vi tiêu cực bằng cách phổ biến sự tồn tại của nó.
evidence:
  level: strong
  references:
  - Cialdini, R. B. (2003). 'Crafting normative messages to protect the environment'. Current Directions in Psychological Science.
