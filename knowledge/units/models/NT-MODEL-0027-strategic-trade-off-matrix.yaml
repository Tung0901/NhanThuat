version: 0.1.0
title: Ma trận đánh đổi chiến lược
summary: Mô hình 2x2 đối chiếu Trọng tâm chiến lược với Mức độ cam kết nguồn lực để đánh giá tính toàn vẹn của chiến lược.
primary_domain: thanh-su
secondary_domains:
- dung-nhan
definition: 'Ma trận đánh đổi chiến lược đánh giá chiến lược dựa trên hai trục: Trọng tâm chiến lược và Cam kết nguồn lực.'
mechanism:
- Đánh giá trọng tâm chiến lược.
- Đánh giá mức độ cam kết nguồn lực.
- Xác định vị trí trên góc phần tư.
- Chuyển dịch hướng tới Thực thi nhất quán.
conditions:
- Kiểm toán chiến lược và rà soát danh mục định kỳ hàng năm.
exceptions:
- Không có.
applications:
  portfolio_audit:
  - Kiểm toán danh mục sản phẩm để loại bỏ các sáng kiến mang tính kỳ vọng viển vông.
risks:
- Tập trung quá mức nguồn lực vào một thị trường đang suy thoái.
