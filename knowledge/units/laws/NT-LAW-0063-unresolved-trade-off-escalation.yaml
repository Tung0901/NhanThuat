created_at: '2026-07-22'
updated_at: '2026-09-14'
mechanism:
- Tồn tại các đánh đổi cấu trúc chưa được giải quyết giữa các bộ phận.
- Căng thẳng tích tụ mà không có kênh xử lý chính thức.
- Áp lực được chuyển thành quy kết cá nhân và xích mích.
- Xung đột quan hệ làm giảm phối hợp và tăng ma sát vận hành.
- Vấn đề cấu trúc gốc vẫn không được giải quyết và tiếp tục tái diễn.
