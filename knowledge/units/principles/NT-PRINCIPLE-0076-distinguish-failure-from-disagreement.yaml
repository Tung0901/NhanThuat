id: NT-PRINCIPLE-0076
type: principle
status: frozen
version: 0.2.0
title: Phân biệt thất bại với bất đồng
summary: Thất bại và bất đồng là hai loại thông tin khác nhau. Trộn lẫn chúng làm mất khả năng học hỏi từ sai sót và làm suy yếu văn hóa phản biện.
primary_domain: tri-nhan
secondary_domains:
- hop-chung
definition: 'Phân biệt thất bại với bất đồng là nguyên tắc xử lý thông tin tổ chức: một kết quả không đạt mục tiêu khác về bản chất với việc một quan điểm không được chấp nhận, và hai loại cần quy trình xử lý riêng.'
conditions:
- Tổ chức có cả hoạt động thực thi lẫn hoạt động ra quyết định tập thể.
- Tồn tại áp lực đồng nhất quan điểm trong nhóm.
exceptions:
- Thất bại do vi phạm đạo đức hoặc pháp lý thuộc diện xử lý riêng.
- Bất đồng về nguyên tắc nền tảng cần quy trình đặc biệt.
applications:
  management:
  - Tách phiên tổng kết thất bại khỏi phiên xử lý bất đồng quan điểm.
  - Không đánh giá năng lực cá nhân dựa trên việc người đó từng bất đồng.
  learning:
  - Xây quy trình học hỏi từ thất bại tập trung vào nguyên nhân hệ thống.
  - Ghi nhận giá trị của bất đồng ngay cả khi quan điểm không được chọn.
  culture:
  - Truyền đạt rõ hai khái niệm để nhân sự không né tránh cả hai.
risks:
- Coi bất đồng là dấu hiệu thiếu năng lực dẫn tới im lặng tập thể.
- Coi thất bại là vấn đề quan điểm khiến lỗi hệ thống không được sửa.
- Dùng học hỏi từ thất bại để né tránh trách nhiệm cá nhân rõ ràng.
evidence:
