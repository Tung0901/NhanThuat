  content: "### 1. Cơ chế Khuếch đại Độ nhiễu trong Khủng hoảng\n**Định luật Entropy\
    \ trong Khủng hoảng** (`NT-LAW-2101`) chỉ ra rằng trong các hệ thống tổ chức có\
    \ độ liên kết chặt (tightly coupled systems), khoảng trống thông tin và độ trễ\
    \ chỉ huy không giữ nguyên trạng thái tĩnh mà thường kích hoạt các phản ứng suy\
    \ đoán, tự vệ cục bộ và lan truyền sự cố sang các bộ phận lân cận.\n\n### 2. Điều\
    \ kiện áp dụng & Ngoại lệ\n- **Điều kiện áp dụng:**\n  - Các sự cố vận hành, thanh\
    \ khoản, an ninh dữ liệu hoặc truyền thông có tốc độ lan truyền nhanh và liên\
    \ quan đến nhiều bên phụ thuộc lẫn nhau.\n  - Kênh thông tin chính thức bị gián\
    \ đoạn khiến các đơn vị cơ sở tự hành động theo tin đồn hoặc giả định cục bộ.\n\
    - **Ngoại lệ:**\n  - Các sự cố kỹ thuật đã được phân lập vật lý hoặc có cầu chì\
    \ ngắt tự động (circuit breakers) tách biệt hoàn toàn khỏi hệ thống chính.\n \
    \ - Những biến động diễn tiến chậm, có dữ liệu quan trắc đầy đủ; trong trường\
    \ hợp này việc can thiệp vội vã có thể gây nhiễu nhiều hơn việc quan sát thêm.\n\
    \n### 3. Mức bất định & Rủi ro diễn giải sai\n- **Mức bất định:** Trung bình -\
    \ Cao. Tốc độ gia tăng độ hỗn loạn phụ thuộc lớn vào cấu trúc phân quyền sẵn có\
    \ và mức độ tập dượt quy trình ứng phó sự cố trước đó (Weick, 1993).\n- **Rủi\
    \ ro diễn giải sai:**\n  - Đồng nhất việc phản ứng kịp thời với việc ra lệnh chuyên\
    \ quyền thiếu kiểm chứng, dẫn đến sửa sai chỗ này nhưng làm vỡ cấu trúc chỗ khác.\n\
    \  - Hoang mang phóng đại các sự cố cục bộ nhỏ thành khủng hoảng toàn diện làm\
    \ kiệt sức đội ngũ.\n\n### 4. Nguồn truy nguyên & Đối chiếu Đông - Tây\n- **Nguồn\
    \ truy nguyên:** Nghiên cứu thực địa về sự sụp đổ kiến tạo ý nghĩa trong thảm\
    \ họa Mann Gulch của Karl Weick (1993) và lý thuyết tai nạn hệ thống của Charles\
    \ Perrow (1984).\n- **Đối chiếu cổ điển `[Classical Analogy]`:** Tôn Tử Binh Pháp\
    \ (thiên *Binh Thế*) phân biệt giữa *loạn* sinh ra từ *trị* khi có phân định bộ\
    \ ngũ, hiệu lệnh rõ ràng với sự hỗn loạn dây chuyền khi đứt gãy thông tin chỉ\
    \ huy.\n"
