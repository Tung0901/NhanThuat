id: NT-LAW-0066
type: law
status: frozen
version: 0.2.0
title: Tính tối thượng của phân bổ nguồn lực
summary: Một chiến lược thực sự không tồn tại cho đến khi các nguồn lực khan hiếm được phân bổ lại để hỗ trợ cho các lựa chọn của chiến lược đó.
primary_domain: thanh-su
secondary_domains:
- dung-nhan
definition: Chiến lược được định nghĩa bằng các cam kết về nguồn lực (vốn, thời gian kỹ thuật, nhân tài), chứ không phải bằng các tuyên bố sứ mệnh.
conditions:
- Hoạch định chiến lược và chu kỳ ngân sách hàng năm.
exceptions:
- Các thử nghiệm thăm dò với lượng phân bổ nguồn lực ban đầu rất nhỏ.
applications:
  strategic-audit:
  - Đo lường sự dịch chuyển nhân tài và ngân sách giữa các sáng kiến.
risks:
- Tuyên bố chuyển dịch chiến lược nhưng không thay đổi việc phân bổ ngân sách.
evidence:
  level: supported
  references:
  - EV-REQ-0016-01
relations:
  supports: []
  conflicts_with: []
  depends_on:
  - NT-LAW-0048
  applies_to: []
tags:
- strategy
- resource-allocation
- commitments
- strategy-execution
- budgeting
- talent-commitment
created_at: '2026-07-22'
updated_at: '2026-09-14'
mechanism:
- Tổ chức tuyên bố ưu tiên chiến lược trong các văn bản.
- Phân bổ nguồn lực thực tế vẫn theo quán tính cũ.
- Khoảng cách giữa tuyên bố và phân bổ khiến chiến lược không được thực thi.
- Các sáng kiến chiến lược thiếu nguồn lực và thất bại.
- Tổ chức quay lại trạng thái cân bằng cũ bất kể tuyên bố mới.
