mechanism:
- Ghi nhận lập trường được tuyên bố của các bên.
- Đặt câu hỏi mở để tìm nhu cầu và lo ngại thật phía sau.
- 'Phân loại lợi ích: chung, khác biệt có thể bổ trợ, và xung đột thật.'
- Thiết kế phương án dựa trên lợi ích thay vì mặc cả trên lập trường.
