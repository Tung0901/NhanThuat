id: NT-MODEL-3002
type: model
status: frozen
version: 0.1.0
title: Vòng lặp Kiến tạo Ý nghĩa
summary: Quy trình lặp đi lặp lại giúp các cá nhân và tập thể định hình những yếu tố chưa biết nhằm thúc đẩy hành động.
primary_domain: tri-nhan
domain_area: NT-DA-0026
secondary_domains:
- hop-chung
definition: Kiến tạo ý nghĩa (Sensemaking) là một vòng lặp liên tục gồm việc trích xuất các dấu hiệu từ môi trường mơ hồ, đóng khung chúng thành những câu chuyện hợp lý và thực hiện hành động để kiểm chứng các câu chuyện đó.
mechanism:
- Môi trường xuất hiện các dấu hiệu mơ hồ hoặc bất ngờ.
- Chủ thể nhận thấy các dấu hiệu cụ thể.
- Chủ thể ánh xạ các dấu hiệu này vào các mô hình tư duy hiện có.
- Chủ thể xây dựng một câu chuyện hợp lý để giải thích sự bất thường.
- Chủ thể hành động dựa trên câu chuyện đó, từ đó tạo ra các dấu hiệu mới.
conditions:
- Mức độ mơ hồ, bất định hoặc tính mới mẻ cao.
- Các kỳ vọng mang tính thường lệ bị phá vỡ.
exceptions:
- Các hoạt động thường quy nơi quy trình vận hành tiêu chuẩn được áp dụng mà không có sự mơ hồ.
applications:
  leadership:
  - Cung cấp một khung nhận thức hợp lý thay vì chỉ dữ liệu thô trong các cuộc khủng hoảng.
  strategy:
  - Sử dụng các phép thử nhỏ, an toàn để thất bại nhằm tạo ra các dấu hiệu tốt hơn trong các lĩnh vực phức tạp.
risks:
- Bị khóa chặt vào một câu chuyện sai lệch ban đầu (thiên kiến xác nhận).
evidence:
  level: supported
  references:
  - Weick, K. E. (1995). 'Sensemaking in Organizations'. Sage Publications.
  - Pirolli, P., & Card, S. (2005). 'The sensemaking process and leverage points for analyst technology'.
