  definition: Khung tư duy chiến lược giúp đội ngũ lãnh đạo phân bổ nguồn lực cân
    đối trên ba mặt trận khi đối mặt với khủng hoảng tổ chức.
  mechanism:
  - 'Khoanh vùng: Thiết lập hàng rào ngăn sự cố lan rộng sang các cấu phần lân cận.'
  - 'Truyền thông: Cung cấp thông tin đã xác minh cho các bên liên quan để bảo toàn
    sự tin cậy.'
  - 'Khắc phục: Sửa chữa nguyên nhân gốc rễ và khôi phục hoạt động bền vững.'
  conditions:
  - Áp dụng cho các biến cố tổ chức và sự cố vận hành có nguy cơ lan tỏa đa chiều
    (kỹ thuật, danh tiếng, pháp lý).
  - Tổ chức có khả năng phân tách vai trò giữa nhóm kỹ thuật xử lý hiện trường và
    nhóm điều phối thông tin.
  exceptions:
  - Các lỗi kỹ thuật nội bộ nhỏ được khắc phục tự động trước khi ảnh hưởng đến bên
    ngoài.
  - Các vụ việc điều tra pháp lý hoặc an ninh đang trong giai đoạn bảo mật bắt buộc
    theo luật định.
  applications:
    management:
    - Định tuyến và điều phối đội đặc nhiệm xử lý sự cố đa chức năng
  risks:
  - Quá tập trung vào kỹ thuật khoanh vùng mà chậm trễ truyền thông gây mất uy tín.
  - Hứa hẹn khắc phục vượt quá khả năng thực tế làm trầm trọng thêm khủng hoảng niềm
    tin.
