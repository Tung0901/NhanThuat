id: NT-PRINCIPLE-0043
type: principle
status: frozen
version: 0.1.0
title: Preserve standards while protecting candor
summary: Keep standards explicit while making it safe for people to report gaps, risks,
  and mistakes early.
primary_domain: hop-chung
secondary_domains:
- dung-nhan
- thanh-su
definition: High standards and candor support each other when reporting problems is
  treated as responsibility rather than disloyalty or incompetence.
mechanism:
- Affirm the standard
- Reward early reporting
- Close the loop with corrective action.
conditions:
- Quality or trust depends on early truth
- People may hide problems.
exceptions:
- Repeated concealment may require accountability
- Confidential constraints may limit disclosure.
applications:
  operations:
  - Recognize early risk signals before celebrating outcomes.
  leadership:
  - Make truth-telling part of the standard
  - not an exception to it.
risks:
- Lowering standards in the name of safety
- Punishing candor indirectly.
evidence:
  level: provisional
