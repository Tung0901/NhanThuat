id: NT-PRINCIPLE-3003
type: principle
status: frozen
version: 0.1.0
title: Thúc đẩy phản tư siêu nhận thức
summary: Thiết kế quy trình làm việc có các điểm dừng cấu trúc bắt buộc, buộc đội ngũ và cá nhân thoát khỏi vòng thực thi để đánh giá lại cách tiếp cận nhận thức của họ.
primary_domain: tri-nhan
domain_area: NT-DA-0026
secondary_domains:
- hop-chung
definition: Một hoạt động thực hành phá vỡ dòng chảy liên tục của quá trình thực thi nhằm kích hoạt lớp siêu nhận thức, đảm bảo bản thân chiến lược là đúng đắn trước khi tiêu tốn thêm công sức.
mechanism:
- Việc thực thi được tạm dừng tại một ranh giới cấu trúc được xác định trước.
- Đội ngũ chuyển trọng tâm từ "Chúng ta đang làm gì?" sang "Chúng ta đang suy nghĩ về việc này như thế nào?".
- Các giả định sai lầm hoặc chiến lược đang thất bại được xác định và điều chỉnh.
conditions:
- Các dự án phức tạp, kéo dài với mức độ mơ hồ cao.
exceptions:
- Các khoảnh khắc khủng hoảng đòi hỏi thực thi chiến thuật không bị gián đoạn theo một kế hoạch đã biết.
applications:
  project-management:
  - Thể chế hóa "pre-mortem" (khảo sát rủi ro trước thực thi) và "post-mortem" (rút kinh nghiệm sau thực thi) thành các điểm phản tư cấu trúc bắt buộc.
risks:
- 'Xử lý quá mức: làm gián đoạn trạng thái dòng chảy bằng phân tích siêu mức không cần thiết.'
evidence:
  level: supported
  references:
  - Flavell, J. H. (1979). 'Metacognition and cognitive monitoring'. American Psychologist.
