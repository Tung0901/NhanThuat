id: NT-PHENOMENON-3407
type: phenomenon
title: Kỹ thuật đặt chân vào cửa
summary: Để khiến một người đồng ý với một yêu cầu lớn, trước hết hãy khiến họ đồng ý với một yêu cầu khiêm tốn.
primary_domain: tri-nhan
domain_area: NT-DA-0030
definition: Một thủ thuật tuân phục theo trình tự vận dụng nguyên tắc nhất quán, trong đó sự đồng ý ban đầu nhỏ bé làm thay đổi vĩnh viễn hình ảnh bản thân của đối tượng theo hướng có lợi cho mục tiêu của người thuyết phục.
mechanism:
- 'Đưa ra một yêu cầu cực nhỏ mà hầu như ai cũng chấp nhận (ví dụ: ký tên vào một bản kiến nghị).'
- Đối tượng tuân theo.
- Hình ảnh bản thân của đối tượng dịch chuyển tinh tế ('Tôi là kiểu người ủng hộ mục tiêu này').
- 'Sau đó, một yêu cầu lớn được đưa ra (ví dụ: một khoản quyên góp lớn).'
- Đối tượng tuân theo để duy trì sự nhất quán với bản sắc mới.
conditions:
- Yêu cầu ban đầu phải cùng chủ đề với yêu cầu cuối cùng và phải hoàn toàn tự nguyện.
exceptions:
- Khi yêu cầu ban đầu được đền bù bằng tiền hậu hĩnh, làm chuyển sự quy kết từ bản sắc nội tại sang phần thưởng bên ngoài.
applications:
  ux_design:
  - Dùng thử miễn phí hoặc chỉ yêu cầu một địa chỉ email trước khi yêu cầu số thẻ tín dụng.
risks:
- Làm mất lòng người dùng nếu sự leo thang từ yêu cầu nhỏ lên lớn diễn ra quá nhanh hoặc quá gay gắt.
evidence:
  level: strong
  references:
  - 'Freedman, J. L., & Fraser, S. C. (1966). ''Compliance without pressure: the foot-in-the-door technique''. Journal of Personality and Social Psychology.'
