id: NT-ANTI-PATTERN-0018
type: anti-pattern
status: frozen
version: 0.2.0
title: Đội nhóm cô lập
summary: Đơn vị kiến thức cấu trúc về mẫu chống hình Đội nhóm cô lập (Siloed Team).
primary_domain: hop-chung
secondary_domains:
- dung-nhan
definition: Định nghĩa chính thức về mẫu chống hình Đội nhóm cô lập trong kiến trúc Nhân Thuật.
conditions:
- Các bối cảnh quản trị vận hành.
exceptions:
- Các trường hợp ghi đè quyền hạn trong khủng hoảng khẩn cấp.
applications:
  governance:
  - Áp dụng nhận diện Đội nhóm cô lập vào quy trình làm việc của tổ chức.
risks:
- Áp dụng sai hoặc xử lý không đúng Đội nhóm cô lập dẫn đến hiệu suất kém tối ưu.
evidence:
  level: supported
  references:
  - EV-REQ-0001-01
relations:
  supports: []
  conflicts_with: []
  depends_on:
  - NT-LAW-0043
  applies_to: []
tags:
- anti-pattern
- hop-chung
- siloed-team
- silo-effect
- organizational-silo
- cross-functional-barrier
created_at: '2026-07-22'
updated_at: '2026-09-14'
mechanism:
- Các bộ phận được thiết kế mục tiêu và chỉ số riêng biệt.
- Thông tin và nguồn lực bị giữ lại trong từng bộ phận.
- Hợp tác liên phòng ban trở thành ngoại lệ thay vì mặc định.
- Xung đột lợi ích cục bộ làm chậm các sáng kiến chung.
- Tổ chức mất khả năng phối hợp ở các vấn đề xuyên chức năng.
