id: NT-LAW-0067
type: law
status: frozen
version: 0.1.0
title: Strategic Trade-off Inevitability
summary: Achieving superior performance in one dimension requires accepting deliberate
  underperformance in another.
primary_domain: thanh-su
secondary_domains:
- tri-nhan
definition: Trade-offs are the core of strategy. Superior strategic positioning requires
  explicitly deciding what not to optimize.
conditions:
- Competitive positioning and product strategy choices.
exceptions:
- Removing operational waste before reaching efficiency frontier.
applications:
  positioning:
  - Define explicit non-goals for product releases.
risks:
- Attempting to be all things to all customers.
evidence:
  level: supported
  references:
  - EV-REQ-0016-01
