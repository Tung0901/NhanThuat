id: NT-ANTI-PATTERN-0049
type: anti-pattern
status: frozen
version: 0.1.0
title: Lãng phí do xoay chuyển liên tục
summary: Việc thay đổi ưu tiên dự án liên tục giữa sprint, tiêu tốn năng lượng của đội ngũ vào chi phí chuyển đổi bối cảnh mà không hoàn thành được kết quả nào.
primary_domain: dung-nhan
secondary_domains:
- thanh-su
definition: Hiện tượng xoay chuyển liên tục xảy ra khi ban lãnh đạo mang tính phản ứng thay đổi các ưu tiên của đội ngũ vài ngày một lần.
mechanism:
- Lãnh đạo đưa vào một nhiệm vụ khẩn cấp mới.
- Đội ngũ phải chuyển đổi bối cảnh công việc.
- Ưu tiên mới lại xuất hiện vào tuần tiếp theo.
- Không có nhiệm vụ nào được hoàn thành.
conditions:
- Lãnh đạo mang tính phản ứng và thiếu ranh giới bảo vệ sprint.
exceptions:
- Các sự cố vi phạm bảo mật nghiêm trọng trong thực tế.
applications:
  sprint_governance:
  - Bảo vệ backlog sprint đang chạy khỏi những thay đổi phạm vi giữa chu kỳ.
risks:
- Từ chối điều chỉnh hướng đi khi có thông tin bất ngờ mang tính thảm họa xảy ra.
evidence:
  level: supported
  references:
  - EV-REQ-0017-01
relations:
