id: NT-PRINCIPLE-0020
type: principle
status: frozen
version: 0.1.0
title: Giải quyết xung đột ở đúng cấp độ
summary: Giải quyết xung đột ở cấp độ nơi sự đánh đổi thực sự có thể được quyết định, cấp nguồn lực hoặc tái thiết kế.
primary_domain: thanh-su
secondary_domains:
- hop-chung
- dung-nhan
definition: Xung đột kéo dài khi con người được yêu cầu giải quyết một sự đánh đổi mà họ không có quyền hạn hoặc nguồn lực để phân định.
mechanism:
- Xác định sự đánh đổi chưa được phân định.
- Xác định quyền ra quyết định.
- Chuyển quyết định đến đúng cấp độ.
conditions:
- Xung đột phụ thuộc vào các ràng buộc ngoài tầm của các bên.
- Quyền hạn được phân tán.
exceptions:
- Sửa chữa giữa các cá nhân vẫn có thể cần thiết.
- Nhóm địa phương có thể tự giải quyết một số đánh đổi.
applications:
  management:
  - Leo thang các xung đột ưu tiên mà nhóm không thể phân định.
  operations:
  - Thay đổi quy tắc nguồn lực khi xung đột bàn giao tái diễn.
risks:
- Leo thang mọi bất đồng.
- Trốn tránh trách nhiệm giữa các cá nhân.
