      nghiệm về tác động của chế tài và phần thưởng ngoại tại lên động lực nội tại).'
    - '[Classical Analogy] Luận Ngữ — Vi Chính (Khổng Tử phân biệt hiệu quả giữa mệnh
      lệnh hình phạt với đạo đức lễ nghi).'
