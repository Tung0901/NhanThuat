id: NT-ANTI-PATTERN-0041
type: anti-pattern
status: frozen
version: 0.1.0
title: Bẫy Biện Minh Thừa
summary: Gắn các khoản tiền thưởng nhỏ vào công việc sáng tạo hoặc hợp tác nhóm, biến những nhân sự có động lực nội tại thành những kẻ hành động vì tiền.
primary_domain: tu-than
secondary_domains:
- tri-nhan
definition: Bẫy Biện Minh Thừa xảy ra khi các nhà lãnh đạo đưa ra các khoản tiền thưởng nhỏ cho những công việc mà nhân viên trước đây từng làm vì niềm tự hào.
mechanism:
- Ban quản lý đưa ra các khoản tiền thưởng nhỏ.
- Nhân viên chuyển góc nhìn sang việc tính toán lợi ích tiền bạc.
- Hành vi tự nguyện giúp đỡ dừng lại.
conditions:
- Môi trường làm việc tri thức trình độ cao.
exceptions:
- Các vị trí hưởng hoa hồng kinh doanh.
applications:
  culture_design:
  - Bảo vệ các chương trình ghi nhận lẫn nhau giữa đồng nghiệp khỏi bị thương mại hóa bằng tiền mặt.
risks:
- Trả lương thấp cho nhân viên dưới cái mác bảo vệ động lực nội tại.
evidence:
  level: supported
  references:
  - EV-REQ-0009-01
