id: NT-ANTI-PATTERN-2101
type: anti-pattern
status: frozen
version: 1.0.0
title: Chiến lược đà điểu
summary: Phớt lờ khủng hoảng với hy vọng nó sẽ tự qua đi hoặc không ai chú ý đến.
primary_domain: thanh-su
domain_area: NT-DA-0021
secondary_domains:
- tu-than
definition: Phản xạ tâm lý phòng thủ khi đối mặt với rủi ro lớn, dẫn đến việc từ chối thừa nhận mức độ nghiêm trọng của vấn đề.
mechanism:
- Trì hoãn việc thu thập dữ liệu thực tế.
- Đổ lỗi cho các yếu tố ngoại cảnh.
conditions:
- Văn hóa tổ chức có mức độ an toàn tâm lý thấp.
exceptions:
- Rủi ro thực tế không tồn tại.
applications:
  management:
  - Loại bỏ tư duy né tránh này trong ban điều hành.
risks:
- Khủng hoảng leo thang và phình to đến mức không thể kiểm soát.
