id: NT-PRINCIPLE-0080
type: principle
status: frozen
version: 0.2.0
title: Làm rõ chi phí cơ hội
summary: Nêu rõ cái gì bị từ bỏ khi chọn một phương án để quyết định sáng suốt hơn. Chi phí cơ hội ẩn là nguồn gốc của nhiều lựa chọn kém.
primary_domain: tri-nhan
secondary_domains:
- thanh-su
definition: Làm rõ chi phí cơ hội là nguyên tắc ra quyết định yêu cầu mọi phương án được đánh giá kèm giá trị của phương án tốt nhất bị từ bỏ, không chỉ chi phí trực tiếp của phương án được chọn.
conditions:
- Quyết định sử dụng nguồn lực khan hiếm như thời gian, tiền, nhân sự.
- Tồn tại nhiều phương án cạnh tranh đáng kể.
exceptions:
- Quyết định không tiêu tốn nguồn lực khan hiếm hoặc đã cam kết không thể thay đổi.
- Phương án bị từ bỏ không thực sự khả dụng.
applications:
  decision-making:
  - Ghi rõ phương án tốt nhất bị từ bỏ trong hồ sơ quyết định.
  - So sánh định kỳ giá trị theo đuổi với giá trị của nguồn lực đang dùng.
  resource-allocation:
  - Đánh giá lại phân bổ nguồn lực khi cơ hội mới xuất hiện.
  management:
  - Nhận diện các nguồn lực bị khóa vào hoạt động kém giá trị hơn cơ hội hiện có.
risks:
- Bỏ qua chi phí cơ hội làm duy trì hoạt động kém hiệu quả.
- Thay đổi quá thường xuyên vì sợ lỡ cơ hội mới.
- Đánh giá sai giá trị phương án bị từ bỏ do thiếu dữ liệu.
evidence:
  level: supported
  references:
  - EV-REQ-0001-01
