id: NT-MODEL-0009
type: model
status: frozen
version: 0.2.0
title: Mô hình tương tác phát sinh
summary: Mô hình mô tả cách hành vi tập thể phát sinh từ tương tác cục bộ giữa các cá nhân, không do thiết kế trung tâm. Kết quả nhóm có thể khác xa tổng ý định của từng thành viên.
primary_domain: tri-nhan
secondary_domains:
- hop-chung
definition: 'Mô hình tương tác phát sinh là khung phân tích về sự hình thành hành vi cấp hệ thống từ các tương tác cục bộ lặp lại: quy tắc tương tác đơn giản giữa các cá nhân tạo ra mẫu hành vi tập thể khó suy ra từ từng cá nhân riêng lẻ.'
conditions:
- Nhiều cá nhân tương tác lặp lại theo quy tắc cục bộ.
- Không có cơ chế điều khiển tập trung hoàn toàn hành vi nhóm.
exceptions:
- Hệ thống có thiết kế tập trung áp đặt hành vi từ trên xuống.
- Nhóm nhỏ đến mức mọi tương tác đều được quan sát trực tiếp.
applications:
  organization-design:
  - Phân tích các quy tắc tương tác cục bộ thay vì chỉ nhìn sơ đồ tổ chức.
  - Điều chỉnh điều kiện tương tác để thay đổi hành vi tập thể phát sinh.
  change-management:
  - Nhận diện các mẫu hành vi tự phát cần can thiệp ở tầng quy tắc tương tác.
  culture:
  - Theo dõi các chuẩn mực ngầm hình thành từ tương tác hằng ngày.
risks:
- Can thiệp vào cá nhân mà bỏ qua quy tắc tương tác sinh ra hành vi.
- Đánh giá thấp tốc độ lan truyền của hành vi tiêu cực phát sinh.
- Nhầm mẫu phát sinh nhất thời là đặc điểm cố định của nhóm.
evidence:
  level: supported
  references:
  - EV-REQ-0001-01
relations:
  supports: []
  conflicts_with: []
  depends_on:
