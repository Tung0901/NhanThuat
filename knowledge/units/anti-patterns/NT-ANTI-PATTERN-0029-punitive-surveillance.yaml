mechanism:
- Cơ chế giám sát được thiết kế tập trung vào phát hiện lỗi.
- Nhân sự học rằng sai sót dẫn tới trừng phạt thay vì học hỏi.
- Che giấu sai sót trở thành chiến lược tự bảo vệ hợp lý.
- Dữ liệu giám sát mất giá trị vì phản ánh bề mặt đã được tô vẽ.
