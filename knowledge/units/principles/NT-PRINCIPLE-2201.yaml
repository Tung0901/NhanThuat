title: Tiền tệ trao đổi
summary: Để ảnh hưởng, bạn phải biết đối phương định giá loại tiền tệ vô hình nào.
primary_domain: dung-nhan
domain_area: NT-DA-0022
secondary_domains:
- tri-nhan
definition: Sử dụng mệnh lệnh là không đủ. Lãnh đạo phải trao đổi giá trị mà các bên cho là quan trọng.
mechanism:
- Xác định nhu cầu cốt lõi.
- Tích lũy tiền tệ vô hình.
- Trao đổi chiến lược.
conditions:
- Dẫn dắt các dự án cross-functional.
exceptions:
- Trong quân đội khi có lệnh trực tiếp.
