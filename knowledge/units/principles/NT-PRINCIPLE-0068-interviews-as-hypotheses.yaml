mechanism:
- Hình thành giả thuyết cụ thể cần kiểm định cho từng ứng viên.
- Thiết kế câu hỏi và tình huống có khả năng phân biệt giả thuyết đúng/sai.
- Ghi nhận bằng chứng hành vi thay vì cảm nhận chung.
- Cập nhật đánh giá theo bằng chứng và tìm giả thuyết thay thế khi cần.
