id: NT-PRINCIPLE-0067
type: principle
status: frozen
version: 0.2.0
title: Chuẩn hóa đánh giá
summary: Dùng tiêu chí đánh giá được chuẩn hóa để giảm thiên kiến và tăng khả năng so sánh. Chuẩn hóa không làm mất tính cá nhân hóa nếu tiêu chí được thiết kế đúng.
primary_domain: tri-nhan
secondary_domains:
- dung-nhan
definition: Chuẩn hóa đánh giá là nguyên tắc áp dụng bộ tiêu chí thống nhất, có thang đo rõ ràng và được kiểm tra định kỳ cho các quyết định về con người, nhằm giảm ảnh hưởng của ấn tượng chủ quan.
conditions:
- Quyết định về con người được đưa ra thường xuyên và ảnh hưởng lớn.
- Có nhiều người tham gia đánh giá cần đảm bảo tính nhất quán.
exceptions:
- Đánh giá cho mục đích phát triển cá nhân có thể linh hoạt hơn.
- Vai trò đặc thù chưa có đủ dữ liệu để chuẩn hóa.
applications:
  hiring:
  - Dùng bộ tiêu chí và thang điểm chung cho mọi ứng viên cùng vị trí.
  - Hiệu chỉnh kết quả đánh giá giữa các nhóm phỏng vấn viên khác nhau.
  performance-review:
  - Áp dụng thang đo hành vi cụ thể thay vì nhận xét chung chung.
  governance:
  - Kiểm toán định kỳ phân bố kết quả đánh giá theo nhóm để phát hiện thiên kiến.
risks:
- Thang đo cứng nhắc bỏ qua bối cảnh đặc thù của từng vai trò.
- Dùng số liệu chuẩn hóa để hợp thức hóa quyết định đã định sẵn.
- Người đánh giá lạm dụng thang đo thay vì quan sát hành vi thực tế.
evidence:
  level: supported
  references:
  - EV-REQ-0001-01
