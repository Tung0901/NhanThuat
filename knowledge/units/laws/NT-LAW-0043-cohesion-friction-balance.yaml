id: NT-LAW-0043
type: law
status: frozen
version: 0.2.0
title: Cân Bằng Gắn Kết và Ma Sát
summary: Gắn kết quá cao kết hợp ma sát quá thấp triệt tiêu phản biện. Hiệu suất nhóm bền vững nằm ở vùng cân bằng giữa tin cậy đủ dày và bất đồng chức năng đủ mạnh.
primary_domain: hop-chung
secondary_domains:
- tri-nhan
definition: 'Cân bằng gắn kết và ma sát là quy luật về điều kiện tối ưu của nhóm: độ gắn kết và mức ma sát phải được giữ trong tương quan cho phép vừa hợp tác vừa kiểm chứng lẫn nhau.'
conditions:
- Nhóm làm việc phụ thuộc lẫn nhau trong thời gian dài.
- Chất lượng quyết định tập thể quan trọng hơn tốc độ đồng thuận.
exceptions:
- Nhóm khủng hoảng cần đồng thuận nhanh có thể tạm nén ma sát.
- Nhóm mới thành lập cần ưu tiên gắn kết trước khi tăng ma sát chức năng.
applications:
  team-management:
  - Duy trì nghi thức phản biện định kỳ như một phần bắt buộc của vận hành nhóm.
  - Theo dõi dấu hiệu đồng thuận quá nhanh và chủ động mời ý kiến trái chiều.
  leadership:
  - Làm gương tách bất đồng công việc khỏi quan hệ cá nhân.
  culture:
  - Đưa tiêu chí sức khỏe bất đồng vào đánh giá định kỳ của nhóm.
risks:
- Nhóm dễ dãi đồng thuận dẫn tới quyết định kém kiểm chứng.
- Xung đột quan hệ núp dưới danh nghĩa phản biện thẳng thắn.
- Ma sát bị triệt tiêu sau một vài xung đột gay gắt.
evidence:
