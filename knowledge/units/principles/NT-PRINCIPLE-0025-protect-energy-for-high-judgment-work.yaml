id: NT-PRINCIPLE-0025
type: principle
status: frozen
version: 0.1.0
title: Giữ năng lượng cho công việc đòi hỏi phán đoán cao
summary: Dành năng lượng nhận thức và cảm xúc tốt nhất của con người cho các quyết định và tương tác nơi phán đoán quan trọng nhất.
primary_domain: tu-than
secondary_domains:
- dung-nhan
- thanh-su
definition: Công việc đòi hỏi phán đoán cao nên được lên lịch và thiết kế quanh năng lực thực tế của con người, không được coi là nỗ lực vô hạn.
mechanism:
- Xác định công việc đòi hỏi phán đoán cao.
- Dành riêng năng lượng và sự tập trung.
- Giảm các tiêu hao giá trị thấp.
conditions:
- Công việc đòi hỏi phán đoán.
- Giới hạn năng lượng có thể ảnh hưởng đến chất lượng.
exceptions:
- Tính khẩn cấp có thể vượt qua thời điểm lý tưởng.
- Một số công việc thường nhật vẫn phải diễn ra.
applications:
  execution:
  - Đặt các quyết định phức tạp trước những tiêu hao có thể tránh được.
  management:
  - Giảm tải cuộc họp quanh các giai đoạn phán đoán quan trọng.
risks:
- Bảo vệ con người quá mức khỏi khối lượng công việc cần thiết.
- Coi năng lượng là ràng buộc duy nhất.
