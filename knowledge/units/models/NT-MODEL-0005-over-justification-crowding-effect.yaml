id: NT-MODEL-0005
type: model
status: frozen
version: 0.1.0
title: Over-justification crowding effect
summary: A structural pattern showing how adding heavy external rewards or tight monitoring to intrinsically motivated activities shifts focus to compliance and reduces voluntary effort when rewards cease.
primary_domain: tu-than
secondary_domains: [tri-nhan, thanh-su]
definition: Heavy external rewards undermine internal locus of control, leading individuals to attribute their effort solely to the external reward.
mechanism: [Observe intrinsic task interest, Introduce heavy extrinsic reward, Re-attribute motive externally, Erode voluntary drive upon reward removal.]
conditions: [Initial activity possesses baseline intrinsic interest.]
exceptions: [Purely mechanical or unpleasant tasks where intrinsic interest is naturally zero.]
applications: {compensation-design: [Decouple creative problem solving from micro-bonus schemes.], management: [Maintain intrinsic craft pride alongside fair baseline pay.]}
risks: [Unintentionally destroying organizational passion through excessive transactional incentives.]
evidence: {level: provisional, references: []}
relations: {supports: [NT-PRINCIPLE-0053, NT-PRINCIPLE-0057], conflicts_with: [], depends_on: [NT-LAW-0030], applies_to: []}
tags: [model, pattern, intrinsic, crowding-effect, reward]
