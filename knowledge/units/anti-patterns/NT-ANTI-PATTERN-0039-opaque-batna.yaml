created_at: '2026-07-22'
updated_at: '2026-09-14'
mechanism:
- Người đàm phán bước vào bàn đàm phán mà chưa xác định phương án thay thế.
- Không có mốc so sánh nên không biết đâu là điểm từ chối hợp lý.
- Áp lực thỏa thuận khiến các nhượng bộ vượt ngưỡng cần thiết.
- Thỏa thuận có thể tệ hơn cả phương án thay thế chưa được nhận diện.
