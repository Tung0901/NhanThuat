id: NT-LAW-0045
type: law
status: frozen
version: 0.2.0
title: Phân nhánh Thoái thác - Kiểm soát Quá mức
summary: 'Khi năng lực ủy quyền bị vượt, hành vi quản trị phân nhánh thành hai cực: buông bỏ hoặc vi quản lý. Cả hai cực đều phá vỡ trách nhiệm và chất lượng thực thi.'
primary_domain: dung-nhan
secondary_domains:
- tri-nhan
definition: 'Phân nhánh thoái thác - kiểm soát quá mức là quy luật về cách hệ thống phản ứng khi ủy quyền vượt ngưỡng: thay vì điều chỉnh cấu trúc, người quản lý có xu hướng rơi về một trong hai cực trên.'
conditions:
- Ủy quyền vượt ngưỡng năng lực theo dõi.
- Áp lực trách nhiệm cao trong khi công cụ kiểm soát không đủ.
exceptions:
- Cơ chế giám sát theo ngoại lệ và ranh giới rõ giữ được mức ủy quyền lành mạnh.
- Sai sót nhỏ được xử lý như dữ liệu học tập thay vì cớ siết kiểm soát.
applications:
  management:
  - Thay đổi cấu trúc công việc khi phát hiện dấu hiệu quá tải thay vì tăng kiểm soát.
  - Định nghĩa rõ ranh giới quyết định và điểm cần báo cáo bất thường.
  governance:
  - Thiết lập cơ chế leo thang theo ngoại lệ để giảm nhu cầu kiểm soát toàn bộ.
  leadership:
  - Tự nhận diện xu hướng phản ứng cực đoan của bản thân khi căng thẳng.
risks:
- Vi quản lý làm mất chủ động và động lực của nhân sự.
- Buông bỏ trách nhiệm núp dưới danh nghĩa trao quyền.
- Chu kỳ lặp lại giữa hai cực gây bất ổn vận hành kéo dài.
