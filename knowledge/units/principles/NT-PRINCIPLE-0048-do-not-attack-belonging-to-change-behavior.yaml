id: NT-PRINCIPLE-0048
type: principle
status: frozen
version: 0.1.0
title: Do not attack belonging to change behavior
summary: Avoid using exclusion threats as the default tool for changing behavior because they trigger defense and distort truth.
primary_domain: tri-nhan
secondary_domains: [hop-chung, dung-nhan]
definition: Belonging is a deep human concern, so casual threats to belonging often produce compliance, concealment, or resentment rather than learning.
mechanism: [Separate behavior from belonging, State boundaries, Use proportional consequences.]
conditions: [A group relationship matters, Behavior change is being requested.]
exceptions: [Some conduct legitimately ends membership, group safety may require exclusion.]
applications: {culture: [Correct norms without making every mistake an exile signal.], leadership: [Reserve removal threats for genuine boundary violations.]}
risks: [Tolerating harmful behavior, Avoiding necessary exclusion.]
evidence: {level: provisional, references: []}
relations: {supports: [], conflicts_with: [], depends_on: [NT-LAW-0026, NT-LAW-0025], applies_to: []}
tags: [belonging, behavior-change, defense]
created_at: '2026-07-21'
updated_at: '2026-07-21'
