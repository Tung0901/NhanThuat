id: NT-PRINCIPLE-0109
type: principle
status: frozen
version: 0.1.0
title: Căn chỉnh phần thưởng với các giá trị đã công bố
summary: Đảm bảo thăng tiến, thưởng và sự công nhận công khai thực sự tôn vinh các hành vi phù hợp với các nguyên tắc văn hóa.
primary_domain: hop-chung
secondary_domains:
- dung-nhan
definition: Đừng thăng chức những người vi phạm giá trị văn hóa. Thăng chức một quản lý độc hại dù có hiệu suất cao sẽ khiến các giá trị trở nên vô nghĩa.
conditions:
- Các phiên đánh giá hiệu suất và hiệu chuẩn thăng tiến.
exceptions:
- Không có.
applications:
  promotion_calibration:
  - Yêu cầu xác nhận Tuân thủ Giá trị Văn hóa trước khi phê duyệt thăng tiến.
risks:
- Áp dụng tuân thủ giá trị một cách chủ quan.
