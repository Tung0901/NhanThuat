id: NT-PRINCIPLE-0034
type: principle
status: frozen
version: 0.1.0
title: Loại bỏ ma sát khỏi mặc định mong muốn
summary: Làm cho hành vi ưu tiên dễ bắt đầu, lặp lại và kiểm chứng hơn hành vi mà nó thay thế.
primary_domain: thanh-su
secondary_domains:
- tu-than
- hop-chung
definition: Hệ thống giữ lại điều dễ lặp lại nhất, nên thay đổi bền vững thường bắt đầu bằng việc giảm ma sát quanh mặc định mong muốn.
mechanism:
- Xác định mặc định mong muốn
- Loại bỏ các bước không cần thiết
- Bổ sung tín hiệu xác nhận đơn giản.
conditions:
- Hành vi lặp lại nên trở thành điều bình thường
- Môi trường có thể được điều chỉnh.
exceptions:
- Một số rào cản an toàn cần ma sát có chủ đích
- Quá dễ dàng có thể làm giảm phán đoán thấu đáo.
applications:
  operations:
  - Đưa mẫu biểu quan trọng
  - danh sách kiểm tra
  - và bàn giao vào quy trình làm việc thông thường.
  management:
  - Làm cho thực hành kỳ vọng dễ dàng hơn lối tắt.
risks:
- Tối ưu sự tiện lợi hơn chất lượng
- Che giấu lý do đằng sau hành vi.
evidence:
  level: provisional
