id: NT-PHENOMENON-3410
type: phenomenon
title: Đóng khung thông điệp (Lợi ích so với Mất mát)
summary: Cách một lựa chọn được trình bày (đóng khung) dưới dạng lợi ích hoặc mất mát làm thay đổi đáng kể khả năng thuyết phục, ngay cả khi kết quả khách quan là giống hệt nhau.
primary_domain: tri-nhan
domain_area: NT-DA-0030
definition: Việc ứng dụng Lý thuyết triển vọng vào truyền thông thuyết phục, khẳng định rằng con người ngại rủi ro khi đối diện với lợi ích, nhưng lại tìm kiếm rủi ro khi đối diện với mất mát.
mechanism:
- Xác định xem hành vi mong muốn được đối tượng nhận định là an toàn hay rủi ro.
- 'Nếu an toàn (ví dụ: dùng kem chống nắng), hãy dùng khung lợi ích (''Dùng kem chống nắng để duy trì làn da khỏe mạnh'').'
- 'Nếu rủi ro (ví dụ: chụp nhũ ảnh có thể phát hiện ung thư), hãy dùng khung mất mát (''Không chụp nhũ ảnh có thể khiến bạn mất mạng'').'
conditions:
- Truyền thông chăm sóc sức khỏe, tư vấn tài chính và bán hàng có mức đặt cược cao.
exceptions:
- Khi đối tượng đang ở trạng thái phân tích cao độ, 'Hệ thống 2', và chủ động quy đổi các xác suất.
applications:
  marketing:
  - Bán bảo hiểm đòi hỏi đóng khung mất mát; bán gói du lịch đòi hỏi đóng khung lợi ích.
risks:
- Lạm dụng đóng khung mất mát có thể gây lo âu và khiến đối tượng hoàn toàn né tránh thông điệp (né tránh phòng vệ).
evidence:
  level: strong
  references:
  - 'Rothman, A. J., & Salovey, P. (1997). ''Shaping perceptions to motivate healthy behavior: the role of message framing''. Psychological Bulletin.'
