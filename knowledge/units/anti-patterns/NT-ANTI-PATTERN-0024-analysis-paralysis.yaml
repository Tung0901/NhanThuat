id: NT-ANTI-PATTERN-0024
type: anti-pattern
status: frozen
version: 0.2.0
title: Tê liệt Phân tích
summary: Đơn vị kiến thức cấu trúc về Tê liệt Phân tích (Analysis Paralysis) trong quản trị và ra quyết định.
primary_domain: tri-nhan
secondary_domains:
- thanh-su
definition: Định nghĩa chính thức về Tê liệt Phân tích trong kiến trúc Nhân Thuật, chỉ trạng thái tư duy hoặc phân tích quá mức khiến việc đưa ra quyết định hay hành động bị trì hoãn vô thời hạn.
conditions:
- Trong các bối cảnh quản trị vận hành tổ chức.
exceptions:
- Các trường hợp ghi đè trong tình huống khủng hoảng khẩn cấp.
applications:
  governance:
  - Xử lý và ngăn chặn Tê liệt Phân tích trong quy trình làm việc của tổ chức.
risks:
- Nhận diện hoặc can thiệp không đúng trạng thái Tê liệt Phân tích dẫn đến làm giảm hiệu suất hoạt động.
evidence:
  level: supported
  references:
  - EV-REQ-0001-01
relations:
  supports: []
  conflicts_with: []
  depends_on:
  - NT-LAW-0049
  applies_to: []
tags:
- anti-pattern
- tri-nhan
- analysis-paralysis
- overthinking
- decision-fatigue
- governance
created_at: '2026-07-22'
updated_at: '2026-09-14'
mechanism:
- Vấn đề quan trọng cần quyết định trong điều kiện chưa đủ thông tin.
- Nhu cầu chắc chắn khiến người ra quyết định tiếp tục thu thập và phân tích.
- Mỗi vòng phân tích mở ra thêm câu hỏi thay vì đóng lại quyết định.
- Thời điểm hành động tốt nhất trôi qua trong khi phân tích vẫn tiếp diễn.
- Chi phí cơ hội của sự chậm trễ tích lũy và có thể vượt chi phí sai lầm.
