id: NT-ANTI-PATTERN-0009
type: anti-pattern
status: frozen
version: 0.1.0
title: Ngụy biện ý chí trong sự lệch pha đặc tính
summary: Quy kết sự sụt giảm hiệu suất hoặc sai sót hành vi gây ra bởi sự lệch pha mãn tính giữa đặc tính và vai trò cùng chi phí thích ứng cao là do thiếu động lực, phẩm chất hoặc ý chí.
primary_domain: tri-nhan
secondary_domains:
- tu-than
- dung-nhan
definition: Một hình thái thất bại trong quản lý khi bỏ qua chi phí thích ứng của hệ thống, kỳ vọng nhân viên đè nén các đặc tính cố định của họ một cách vô hạn chỉ bằng nỗ lực và kỷ luật bản thân thuần túy.
mechanism:
- Đặt cá nhân vào vai trò có sự lệch pha lớn giữa xu hướng tự nhiên và kỳ vọng công việc.
- Kỳ vọng sự điều chỉnh hành vi liên tục mà không điều chỉnh nhiệm vụ hay môi trường.
- Tích tụ sự mệt mỏi tự điều chỉnh mãn tính và kiệt sức về mặt cảm xúc.
- Đổ lỗi cho sự sụt giảm hiệu suất hoặc sai sót hành vi sau đó là do thiếu ý chí hoặc thái độ kém.
conditions:
- Ban quản lý kỳ vọng sự thích ứng hành vi liên tục mà không tái thiết kế nhiệm vụ hoặc môi trường làm việc.
exceptions:
- Các tình huống khủng hoảng ngắn hạn, nơi việc tạm thời nén đặc tính cá nhân là cần thiết và được hỗ trợ.
applications:
  review:
  - Rà soát đánh giá hiệu suất để đảm bảo nhân viên không bị phạt vì phong cách mặc định khi kỹ năng và kết quả vẫn đạt chuẩn.
  role-design:
  - Tái thiết kế các nhiệm vụ có độ ma sát cao để giảm chi phí thích ứng thay vì đòi hỏi gia tăng nỗ lực ý chí.
risks:
- Hạ thấp tiêu chuẩn năng lực cần thiết dưới danh nghĩa thích ứng với đặc tính cá nhân.
