id: NT-LAW-0015
type: law
status: frozen
version: 0.1.0
title: Năng lượng giới hạn khả năng thực thi
summary: Chất lượng thực thi sẽ suy giảm khi năng lượng nhận thức, cảm xúc hoặc thể chất giảm xuống dưới mức yêu cầu của công việc.
primary_domain: tu-than
secondary_domains:
- dung-nhan
- thanh-su
definition: Con người không thể duy trì khả năng phán đoán, kỷ luật và sự nhạy bén khi năng lượng cần thiết cho một nhiệm vụ vượt quá khả năng đáp ứng hiện có trong thời gian quá dài.
mechanism:
- Tiêu hao năng lượng cho các quyết định và hành động
- Khả năng đáp ứng suy giảm dưới áp lực công việc
- Chất lượng giảm sút hoặc xu hướng né tránh gia tăng.
conditions:
- Công việc đòi hỏi sự tập trung liên tục hoặc khả năng tự kiểm soát
- Thời gian hoặc khả năng phục hồi bị hạn chế.
exceptions:
- Những nỗ lực bộc phát trong ngắn hạn có thể vượt qua các giới hạn thông thường
- Hệ thống vận hành mạnh mẽ có thể giảm bớt gánh nặng năng lượng cho từng cá nhân.
applications:
  execution:
  - Lập kế hoạch phục hồi như một phần của năng lực định mức
  - chứ không phải là một phương án bổ sung sau cùng.
  management:
  - Xem xét các giới hạn về năng lượng trước khi quy kết cho các vấn đề về thái độ.
risks:
- Lãng mạn hóa sự kiệt sức
- Bao biện cho quy trình thiết kế kém là do điểm yếu của cá nhân.
