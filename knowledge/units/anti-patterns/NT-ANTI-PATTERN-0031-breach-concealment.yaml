id: NT-ANTI-PATTERN-0031
type: anti-pattern
status: frozen
version: 0.1.0
title: Hành vi che giấu vi phạm
summary: Đơn vị tri thức cấu trúc về Hành vi che giấu vi phạm trong quản trị và tuân thủ tổ chức.
primary_domain: tri-nhan
secondary_domains:
- hop-chung
definition: Định nghĩa chính thức về Hành vi che giấu vi phạm (Breach Concealment) trong kiến trúc Nhân Thuật, miêu tả hành động cố tình không báo cáo hoặc lấp liếm các sai sót, sự cố quy trình và vi phạm chính sách.
conditions:
- Bối cảnh quản trị vận hành tổ chức.
exceptions:
- Trường hợp ghi đè trong khủng hoảng khẩn cấp.
applications:
  governance:
  - Áp dụng nhận diện và ngăn chặn Hành vi che giấu vi phạm vào quy trình làm việc tổ chức.
risks:
- Việc để xảy ra Hành vi che giấu vi phạm dẫn đến rủi ro hệ thống bùng phát và giảm hiệu suất tổ chức.
