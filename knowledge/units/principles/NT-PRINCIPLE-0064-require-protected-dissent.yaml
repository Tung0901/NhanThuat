mechanism:
- Xác định các loại quyết định bắt buộc phải qua bước phản biện.
- Chỉ định người hoặc vai trò chịu trách nhiệm nêu ý kiến trái chiều.
- Bảo vệ người phản biện khỏi hậu quả tiêu cực về đánh giá và đãi ngộ.
- Ghi nhận và xử lý công khai các rủi ro được nêu trước khi chốt.
