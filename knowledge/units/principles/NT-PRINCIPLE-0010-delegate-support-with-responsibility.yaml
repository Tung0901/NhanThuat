id: NT-PRINCIPLE-0010
type: principle
status: frozen
version: 0.1.0
title: Delegate support with responsibility
summary: When assigning responsibility, include the authority, resources, feedback,
  and escalation path needed to carry it.
primary_domain: dung-nhan
secondary_domains:
- thanh-su
- hop-chung
definition: Delegation is complete only when the receiver has enough support and authority
  to act on the responsibility.
mechanism:
- Define responsibility
- Match authority and resources
- Create feedback and escalation channels.
conditions:
- The task has meaningful autonomy
- Outcome quality depends on decisions.
exceptions:
- Training tasks may intentionally limit authority
- Regulated work may require tighter controls.
applications:
  management:
  - Ask what support is missing before judging ownership.
  execution:
  - Clarify escalation rights before work starts.
risks:
- Over-supporting and removing autonomy
- Assigning support without standards.
