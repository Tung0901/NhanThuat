id: NT-PHENOMENON-3310
type: phenomenon
title: Sự thiếu hiểu biết tập thể
summary: Tình huống trong đó đa số thành viên trong nhóm riêng tư bác bỏ một chuẩn mực, nhưng lại lầm tưởng rằng hầu hết người khác chấp nhận nó, và vì vậy xuôi theo chuẩn mực đó.
primary_domain: tri-nhan
domain_area: NT-DA-0029
definition: Một ảo tưởng nhận thức về sự nhất trí trong đó các cá nhân che giấu niềm tin thật của mình vì sợ bị xã hội cô lập, duy trì một chuẩn mực mà thực ra không ai ủng hộ.
mechanism:
- Các cá nhân giữ một niềm tin riêng tư trái ngược với chuẩn mực công khai được nhận thức.
- Vì ai cũng che giấu niềm tin riêng tư của mình, chuẩn mực công khai có vẻ được ủng hộ nhất trí.
- Không ai lên tiếng, càng củng cố chuẩn mực sai lầm.
conditions:
- Các môi trường có an toàn tâm lý thấp và hậu quả xã hội cao cho sự bất đồng.
exceptions:
- Khi một người bất đồng duy nhất, lên tiếng rõ ràng phá vỡ ảo tưởng, thường khiến chuẩn mực sụp đổ nhanh chóng.
applications:
  culture:
  - Các khảo sát ẩn danh là yếu tố then chốt để phơi bày sự thiếu hiểu biết tập thể xung quanh những chính sách công ty độc hại.
risks:
- Nghịch lý Abilene—một nhóm cùng quyết định một đường hướng hành động đi ngược lại sở thích của từng cá nhân trong nhóm.
evidence:
  level: strong
  references:
  - Katz, D., & Allport, F. H. (1931). 'Students' Attitudes'. Craftsman.
