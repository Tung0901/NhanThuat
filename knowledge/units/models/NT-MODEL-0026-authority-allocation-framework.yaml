id: NT-MODEL-0026
type: model
status: frozen
version: 0.1.0
title: Khung phân bổ thẩm quyền
summary: Mô hình ủy quyền 4 cấp độ phân định quyền ra quyết định từ Chỉ đạo trực tiếp đến Tự chủ hoàn toàn.
primary_domain: dung-nhan
secondary_domains:
- hop-chung
definition: 'Khung phân bổ thẩm quyền xác định 4 cấp độ đại diện ra quyết định: Chỉ đạo trực tiếp, Đề xuất & Phê duyệt, Quyết định & Báo cáo, Tự chủ hoàn toàn.'
mechanism:
- Đánh giá năng lực và rủi ro.
- Gán cấp độ thẩm quyền phù hợp.
- Đánh giá và điều chỉnh cấp độ theo thời gian.
conditions:
- Thiết kế cơ chế ủy quyền trong tổ chức.
exceptions:
- Các hành động pháp lý khẩn cấp.
applications:
  delegation_tooling:
  - Cấu hình các quy tắc phân công nhiệm vụ trên BusinessOS với các cấp độ thẩm quyền rõ ràng.
risks:
- Đánh giá sai mức độ sẵn sàng của nhân viên và giao Cấp độ 4 quá sớm.
evidence:
  level: supported
  references:
