id: NT-PRINCIPLE-3103
type: principle
title: Thêm trở ngại cho quyết định rủi ro cao
summary: Cố ý đưa vào ma sát nhận thức hoặc vật lý để làm chậm quá trình xử lý tự động (Hệ thống 1) trước các hành động không thể đảo ngược hoặc rủi ro cao.
primary_domain: tri-nhan
domain_area: NT-DA-0027
definition: 'Nghịch đảo của cú huých: sử dụng kiến trúc lựa chọn để cố ý khiến một hành động khó thực hiện hơn, buộc phải có phản tư siêu nhận thức.'
mechanism:
- Xác định một đường thất bại thảm khốc thường được thực hiện qua thói quen tự động.
- 'Chèn một rào cản thủ tục (ví dụ: gõ tên kho lưu trữ trước khi xóa nó).'
- Rào cản phá vỡ tính tự động và buộc Hệ thống 2 tham gia.
conditions:
- Các thao tác không thể đảo ngược, chi phí cao hoặc yêu cầu bảo mật cao.
exceptions:
- Các tác vụ vận hành tần suất cao, rủi ro thấp, nơi ma sát gây ra sự mệt mỏi.
applications:
  devops:
  - Yêu cầu phê duyệt thủ công lần hai cho các bản triển khai sản xuất vào chiều thứ Sáu.
risks:
- Sự mệt mỏi vì cảnh báo — nếu có quá nhiều ma sát ở mọi nơi, người dùng sẽ tự động hóa việc né tránh nó.
evidence:
  level: strong
  references:
  - Kahneman, D. (2011). 'Thinking, Fast and Slow'. Farrar, Straus and Giroux.
