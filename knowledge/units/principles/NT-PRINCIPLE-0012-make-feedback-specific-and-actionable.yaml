id: NT-PRINCIPLE-0012
type: principle
status: frozen
version: 0.1.0
title: Làm cho phản hồi cụ thể và khả thi
summary: Phản hồi nên xác định hành vi, hệ quả và điều chỉnh tiếp theo thay vì gán nhãn cho con người.
primary_domain: dung-nhan
secondary_domains:
- tu-than
- hop-chung
definition: Phản hồi cụ thể bảo vệ việc học bằng cách tập trung chú ý vào hành vi có thể thay đổi và các bước tiếp theo khả dụng.
mechanism:
- Nêu hành vi quan sát được.
- Giải thích hệ quả.
- Đề xuất hoặc yêu cầu một điều chỉnh cụ thể.
conditions:
- Hành vi có thể được quan sát hoặc mô tả.
- Tồn tại một hành động tiếp theo.
exceptions:
- Phản hồi cấp độ khuôn mẫu có thể cần nhiều ví dụ.
- Vi phạm giá trị có thể cần đóng khung mạnh hơn.
applications:
  management:
  - Thay nhãn dán bằng ví dụ và kỳ vọng tiếp theo.
  learning:
  - Biến phê bình thành mục tiêu thực hành.
risks:
- Cụ thể nhưng thiếu tử tế.
- Tập trung quá mức vào hành vi nhỏ trong khi bỏ qua nguyên nhân hệ thống.
