id: NT-MODEL-0022
type: model
status: frozen
version: 0.2.0
title: Đường ống quy trình đàm phán
summary: 'Đường ống quy trình đàm phán gồm năm giai đoạn nối tiếp: chuẩn bị, khai vấn, đề xuất, mặc cả và chốt thỏa thuận. Mỗi giai đoạn có mục tiêu và sai lầm điển hình riêng.'
primary_domain: thanh-su
secondary_domains:
- tri-nhan
definition: Đường ống quy trình đàm phán là mô hình mô tả tiến trình đàm phán như một chuỗi giai đoạn có thứ tự, trong đó kết quả mỗi giai đoạn là đầu vào cho giai đoạn tiếp theo và bỏ qua giai đoạn nào sẽ làm suy yếu toàn bộ tiến trình.
conditions:
- Đàm phán có độ phức tạp cần tiến trình có cấu trúc.
- Các bên có thể chuẩn bị trước và trao đổi nhiều vòng.
exceptions:
- Đàm phán đơn giản, giá trị thấp có thể rút gọn các giai đoạn.
- Tình huống khẩn cấp cần chốt nhanh theo kịch bản định sẵn.
applications:
  negotiation:
  - Kiểm tra tiến trình đàm phán có bỏ qua giai đoạn chuẩn bị hoặc khai vấn không.
  - Chuẩn bị phương án thay thế tốt nhất trước khi ngồi vào bàn.
  sales:
  - Áp dụng cấu trúc chuẩn bị - khai vấn - đề xuất cho chu kỳ bán hàng phức tạp.
  procurement:
  - Chuẩn hóa tiến trình đàm phán nhà cung cấp theo các giai đoạn của đường ống.
risks:
- Nhảy thẳng vào mặc cả khi chưa hiểu lợi ích đối phương.
- Bỏ qua giai đoạn chuẩn bị phương án thay thế nên mất lợi thế.
- Coi đường ống là quy trình cứng nhắc thay vì khung linh hoạt.
evidence:
