id: NT-LAW-2101
type: law
status: frozen
version: 1.0.0
title: Định luật Entropy trong Khủng hoảng
summary: Trong bối cảnh khủng hoảng, sự thiếu hụt thông tin và độ trễ trong phản hồi sẽ liên tục khuếch
  đại mức độ nghiêm trọng nếu không có sự can thiệp kịp thời để cắt đứt chuỗi phản ứng.
primary_domain: thanh-su
domain_area: NT-DA-0021
secondary_domains:
- hop-chung
definition: Khủng hoảng không phải là một trạng thái tĩnh mà là một chuỗi các phản ứng dây chuyền liên
  tục; do đó, đòi hỏi các hành động can thiệp chủ động để phá vỡ chuỗi liên kết này.
mechanism:
- Nhận diện và định vị các điểm đứt gãy thông tin.
- Khoanh vùng và phân lập khu vực xảy ra khủng hoảng.
- Ra quyết định nhanh chóng và quyết liệt để ngăn chặn sự lan rộng.
conditions:
- Môi trường vận hành có độ bất định và biến động cao.
- Áp lực thời gian cực kỳ lớn đối với người ra quyết định.
exceptions:
- Các cuộc khủng hoảng có tốc độ diễn tiến chậm và có thể dự báo trước.
applications:
  management:
  - Thiết lập phòng tác chiến (war-room) để tập trung nguồn lực xử lý.
risks:
- Trì hoãn phản ứng do rơi vào trạng thái tê liệt phân tích.
evidence:
  level: supported
  references:
  - '[Nghiên cứu thực nghiệm] Weick, K. E. (1993). The collapse of sensemaking in organizations: The Mann
    Gulch disaster. Administrative Science Quarterly, 38(4), 628-652 (Sự tan rã cấu trúc nhận thức khi
    khủng hoảng thiếu phản hồi).'
  - '[Nguồn cổ điển] Tôn Vũ — Tôn Tử Binh Pháp, thiên Binh Thế & Cửu Biến (Quản trị nhịp độ và cắt đứt
    hiệu ứng dây chuyền khi biến cố phát sinh).'
  - '[Sách phổ thông] Perrow, C. (1984). Normal Accidents: Living with High-Risk Technologies. Basic Books
    (Cơ chế khuếch đại sự cố trong hệ thống liên kết chặt).'
  - '[Suy luận biên tập] Quy trình phân lập sự cố và thiết lập nhịp thông tin trong vận hành doanh nghiệp.'
