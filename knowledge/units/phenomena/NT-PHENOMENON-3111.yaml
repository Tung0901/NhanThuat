id: NT-PHENOMENON-3111
type: phenomenon
title: Bỏ qua tỷ lệ nền
summary: Xu hướng bỏ qua thông tin thống kê chung (tỷ lệ nền) để ưu tiên thông tin riêng lẻ cụ thể, thường không liên quan.
primary_domain: tri-nhan
domain_area: NT-DA-0027
definition: Một ngụy biện nhận thức, trong đó người ra quyết định không tích hợp xác suất tiên nghiệm của một sự kiện khi đánh giá các bằng chứng mô tả mới.
mechanism:
- Người ra quyết định nhận được một câu chuyện cụ thể, thuyết phục về một thực thể.
- Họ nhận được xác suất thống kê chung của loại thực thể đó.
- Câu chuyện lấn át số liệu thống kê trong mô hình nhận thức của họ.
conditions:
- Khi thông tin mô tả mang tính khuôn mẫu cao hoặc nổi bật về mặt cảm xúc.
exceptions:
- Khi tỷ lệ nền được trình bày theo cách nhân quả thay vì thuần túy thống kê.
applications:
  forecasting:
  - Ép buộc trình bày tường minh 'góc nhìn bên ngoài' (tỷ lệ thất bại nền) trước khi dự đoán sự thành công của một dự án.
risks:
- Đánh giá quá cao khả năng xảy ra của các sự kiện hiếm gặp hoặc tỷ lệ thành công của các sáng kiến thông thường.
evidence:
  level: strong
  references:
  - Kahneman, D., & Tversky, A. (1973). 'On the psychology of prediction'. Psychological Review.
