id: NT-MODEL-0007
type: model
status: frozen
version: 0.1.0
title: Mô hình tương thích cá nhân - vai trò
summary: Một mô hình chẩn đoán ánh xạ sự liên kết giữa các thiên hướng tính cách tiềm ẩn mặc định với các kỳ vọng của vai trò để ước tính chi phí thích ứng tiềm ẩn và gánh nặng tự điều chỉnh.
primary_domain: tri-nhan
secondary_domains:
- dung-nhan
- tu-than
definition: Mô hình hóa cách thức sự sai lệch giữa thiên hướng tính cách tiềm ẩn mặc định của một cá nhân và các yêu cầu hành vi của vai trò tạo ra sự ma sát thích ứng, tiêu hao năng lượng nhận thức và sinh lý.
mechanism:
- Ánh xạ các thiên hướng tính cách tiềm ẩn mặc định của cá nhân.
- Kiểm định các kỳ vọng hành vi của vai trò và yêu cầu nhiệm vụ.
- Đánh giá các ràng buộc về sức mạnh tình huống trong môi trường làm việc.
- Tính toán khoảng cách để ước tính chi phí thích ứng và gánh nặng tự điều chỉnh.
- Xác định các khu vực mục tiêu cho các chiến lược bù đắp và hỗ trợ từ môi trường.
conditions:
- Phân tích phân công vai trò, sắp xếp nhân sự lãnh đạo hoặc thiết kế công việc được thực hiện.
exceptions:
- Các nhiệm vụ tạm thời hoặc có tần suất thấp nơi chi phí thích ứng không bị tích lũy.
applications:
  diagnosis:
  - Xác định các phân công công việc có độ ma sát cao bằng cách ánh xạ các thiên hướng mặc định của cá nhân với các yêu cầu hành vi của vai trò.
  design:
  - Đưa vào các hỗ trợ tùy chỉnh hoặc điều chỉnh sức mạnh tình huống để giảm gánh nặng thích ứng trong các vai trò không tương thích.
risks:
- Sử dụng các đánh giá mức độ tương thích làm bộ lọc dự đoán hiệu suất hoặc tiêu chí sàng lọc tuyển dụng.
- Coi các thiên hướng mặc định là giới hạn tuyệt đối của năng lực hoặc khả năng.
