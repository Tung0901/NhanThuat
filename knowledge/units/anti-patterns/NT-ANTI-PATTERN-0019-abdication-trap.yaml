id: NT-ANTI-PATTERN-0019
type: anti-pattern
status: frozen
version: 0.2.0
title: Bẫy buông bỏ trách nhiệm
summary: Đơn vị kiến thức cấu trúc về mẫu chống hình Bẫy buông bỏ trách nhiệm (Abdication Trap).
primary_domain: dung-nhan
secondary_domains:
- tri-nhan
definition: Định nghĩa chính thức về mẫu chống hình Bẫy buông bỏ trách nhiệm trong kiến trúc Nhân Thuật.
conditions:
- Các bối cảnh quản trị vận hành.
exceptions:
- Các trường hợp ghi đè quyền hạn trong khủng hoảng khẩn cấp.
applications:
  governance:
  - Áp dụng nhận diện Bẫy buông bỏ trách nhiệm vào quy trình làm việc của tổ chức.
risks:
- Áp dụng sai hoặc xử lý không đúng Bẫy buông bỏ trách nhiệm dẫn đến hiệu suất kém tối ưu.
evidence:
  level: supported
  references:
  - EV-REQ-0001-01
relations:
  supports: []
  conflicts_with: []
  depends_on:
  - NT-LAW-0045
  applies_to: []
tags:
- anti-pattern
- dung-nhan
- abdication-trap
- delegation-failure
- leadership-trap
- accountability-evasion
created_at: '2026-07-22'
updated_at: '2026-09-14'
mechanism:
- Người quản lý giao việc hoặc dự án cho cấp dưới.
- Việc theo dõi, hỗ trợ và chịu trách nhiệm cuối cùng không được thực hiện.
- Vấn đề phát sinh không được phát hiện kịp thời.
- Khi thất bại xảy ra, trách nhiệm được đẩy về phía người nhận việc.
- Niềm tin và hiệu suất của đội ngũ suy giảm.
