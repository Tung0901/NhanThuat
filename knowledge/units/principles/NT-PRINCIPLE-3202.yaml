id: NT-PRINCIPLE-3202
type: principle
title: Che chắn mục tiêu
summary: Chủ động ức chế các mục tiêu hoặc yếu tố gây xao nhãng khác để bảo vệ mục tiêu trọng tâm.
primary_domain: tri-nhan
domain_area: NT-DA-0028
definition: Hoạt động thực hành về nhận thức và môi trường nhằm vô hiệu hóa các mục tiêu cạnh tranh để đảm bảo sự chú ý và nguồn lực đủ dành cho mục tiêu chính.
mechanism:
- Một mục tiêu chính được kích hoạt.
- Các mục tiêu thay thế bị ức chế về mặt nhận thức hoặc bị loại bỏ về mặt vật lý khỏi môi trường.
- Sự tập trung được duy trì mà không cần ý chí liên tục để chống lại các lựa chọn thay thế.
conditions:
- Các môi trường có mức độ dễ bị xao nhãng cao hoặc có nhiều ưu tiên xung đột.
exceptions:
- Các giai đoạn động não hoặc khám phá nơi cần tư duy phân kỳ.
applications:
  productivity:
  - Chặn mọi trang mạng xã hội bằng phần mềm trong các khối làm việc sâu.
risks:
- Tầm nhìn hẹp — bỏ qua thông tin mới quan trọng vì nó không khớp với mục tiêu đang được che chắn.
evidence:
  level: strong
  references:
  - 'Shah, J. Y., Friedman, R., & Kruglanski, A. W. (2002). ''Forgetting all else: on the antecedents and consequences of goal shielding''. Journal of Personality and Social Psychology.'
