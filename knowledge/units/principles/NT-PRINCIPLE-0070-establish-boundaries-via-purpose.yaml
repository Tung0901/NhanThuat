id: NT-PRINCIPLE-0070
type: principle
status: frozen
version: 0.2.0
title: Thiết lập ranh giới thông qua mục đích
summary: Dùng mục đích chung để xác định ranh giới tự chủ cho từng vai trò thay vì quy định chi tiết từng việc. Mục đích rõ giúp vừa thống nhất vừa trao tự do hành động.
primary_domain: hop-chung
secondary_domains:
- dung-nhan
definition: 'Thiết lập ranh giới thông qua mục đích là nguyên tắc quản trị trao quyền: xác định rõ mục tiêu và giới hạn cần tôn trọng, để người thực hiện tự quyết cách đạt mục tiêu trong ranh giới đó.'
conditions:
- Người thực hiện có đủ năng lực và thông tin để tự quyết.
- Mục đích và ranh giới có thể diễn đạt rõ ràng.
exceptions:
- Công việc đòi hỏi quy trình bắt buộc nghiêm ngặt vì an toàn hoặc pháp lý.
- Người thực hiện chưa đủ năng lực cần hướng dẫn chi tiết ban đầu.
applications:
  delegation:
  - Giao mục tiêu và ranh giới thay vì danh sách công việc chi tiết.
  - Xác nhận người nhận hiểu đúng mục đích và giới hạn trước khi bắt đầu.
  leadership:
  - Chuyển từ kiểm tra tiến trình sang đánh giá kết quả và mức tuân thủ ranh giới.
  organization-design:
  - Thiết kế vai trò theo mục đích và ranh giới để giảm chi tiết quản lý.
risks:
- Mục đích mơ hồ dẫn tới tự quyết lệch hướng.
- Ranh giới không rõ khiến sai phạm xảy ra không ai chịu trách nhiệm.
- Trao tự do hình thức nhưng vẫn can thiệp từng bước.
evidence:
  level: supported
  references:
  - EV-REQ-0001-01
relations:
