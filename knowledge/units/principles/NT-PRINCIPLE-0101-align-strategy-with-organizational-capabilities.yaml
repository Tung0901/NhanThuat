id: NT-PRINCIPLE-0101
type: principle
status: frozen
version: 0.1.0
title: Căn chỉnh chiến lược với năng lực của tổ chức
summary: Đảm bảo các hướng chiến lược được chọn khai thác năng lực cốt lõi hiện có hoặc có thể xây dựng, thay vì dựa vào mơ tưởng.
primary_domain: thanh-su
secondary_domains:
- dung-nhan
definition: Một chiến lược đòi hỏi những năng lực mà tổ chức không có và không thể có được chính là ảo tưởng.
conditions:
- Lập kế hoạch chiến lược và thâm nhập thị trường mới.
exceptions:
- Các dự án R&D táo bạo kiểu moonshot.
applications:
  hiring_alignment:
  - Đối chiếu năng lực trong lộ trình chiến lược với tồn kho nhân tài hiện tại.
risks:
- Đặt mục tiêu quá thận trọng khiến tổ chức không thể đổi mới.
