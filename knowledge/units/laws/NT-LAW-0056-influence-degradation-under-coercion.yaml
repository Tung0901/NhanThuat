mechanism:
- Chủ thể dùng chế tài hoặc áp lực để buộc thay đổi hành vi.
- Người nhận điều chỉnh hành vi để tránh hậu quả trong khi vẫn giữ quan điểm cũ.
- Kênh ảnh hưởng nội tâm giữa hai bên thu hẹp dần.
- Khi áp lực giảm, hành vi quay lại trạng thái trước hoặc phản kháng ngầm.
