id: NT-ANTI-PATTERN-0020
type: anti-pattern
status: frozen
version: 0.1.0
title: Ảo tưởng quyền lực
summary: Đơn vị kiến thức cấu trúc về Ảo tưởng quyền lực (Authority Mirage) trong quản trị tổ chức.
primary_domain: dung-nhan
secondary_domains:
- tri-nhan
definition: Định nghĩa chính thức về Ảo tưởng quyền lực trong kiến trúc Nhân Thuật, mô tả hiện tượng tổ chức tạo ra cảm giác giả tạo về thẩm quyền hoặc năng lực ra quyết định mà không có thực lực thực tế.
conditions:
- Các bối cảnh quản trị vận hành tổ chức.
exceptions:
- Các trường hợp ưu tiên đè thẩm quyền trong khủng hoảng khẩn cấp.
applications:
  governance:
  - Áp dụng nhận diện Ảo tưởng quyền lực vào quy trình làm việc của tổ chức.
risks:
- Áp dụng sai hoặc không nhận diện được Ảo tưởng quyền lực dẫn đến hiệu suất tổ chức không đạt mức tối ưu.
evidence:
