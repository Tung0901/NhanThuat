id: NT-PRINCIPLE-0018
type: principle
status: frozen
version: 0.1.0
title: Sửa chữa vi phạm trước khi đòi hỏi niềm tin
summary: Khi niềm tin bị tổn hại, hãy thừa nhận vi phạm, giải thích nguyên nhân và thay đổi hành vi trước khi yêu cầu người khác tin tưởng trở lại.
primary_domain: hop-chung
secondary_domains:
- tri-nhan
- thanh-su
definition: Sửa chữa niềm tin đòi hỏi trách nhiệm giải trình rõ ràng và những khuôn mẫu đã thay đổi, không phải yêu cầu sự tin cậy mà không có bằng chứng.
mechanism:
- Nêu tên vi phạm.
- Nhận lấy tác động.
- Chứng minh hành vi đã thay đổi theo thời gian.
conditions:
- Đã xảy ra vi phạm niềm tin.
- Sự hợp tác trong tương lai vẫn quan trọng.
exceptions:
- Một số vi phạm chấm dứt mối quan hệ.
- Vấn đề pháp lý hoặc an toàn có thể hạn chế việc công khai.
applications:
  leadership:
  - Giải thích điều gì sẽ khác đi sau một cam kết bị phá vỡ.
  teamwork:
  - Tái dựng thông qua bằng chứng, không phải áp lực.
risks:
- Xin lỗi mang tính trình diễn.
- Đòi hỏi sự tha thứ tức thời.
