id: NT-PRINCIPLE-0047
type: principle
status: frozen
version: 0.1.0
title: Hỏi bản sắc nào đang được bảo vệ
summary: Khi mọi người chống đối thay đổi, hãy hỏi sự chống đối có thể đang bảo vệ bản sắc, năng lực, sự thuộc về hoặc địa vị nào.
primary_domain: tri-nhan
secondary_domains:
- tu-than
- hop-chung
definition: Sự chống đối thường trở nên dễ hiểu khi mối quan tâm về hình ảnh bản thân được bảo vệ hoặc sự thuộc về được gọi tên trước khi phán xét hành vi.
mechanism:
- Nhận thấy sự chống đối
- Xác định bản sắc có thể được bảo vệ
- Kiểm tra giả thuyết một cách tôn trọng
- Điều chỉnh cách tiếp cận.
conditions:
- Thay đổi ảnh hưởng đến hình ảnh bản thân, địa vị, sự thuộc về hoặc năng lực.
exceptions:
- Sự chống đối có thể phản ánh vấn đề thiết kế thực sự
- phân tích bản sắc có thể trở thành suy đoán.
applications:
  change:
  - Chẩn đoán mối đe dọa bản sắc trước khi gia tăng áp lực.
  coaching:
  - Hỏi người đó lo sợ sự thay đổi nói gì về họ.
risks:
- Tâm lý hóa quá mức sự bất đồng
- tránh né chuẩn mực hợp pháp.
evidence:
  level: provisional
  references: []
