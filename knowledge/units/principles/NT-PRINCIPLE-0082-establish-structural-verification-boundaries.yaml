id: NT-PRINCIPLE-0082
type: principle
status: frozen
version: 0.2.0
title: Thiết lập ranh giới xác minh cấu trúc
summary: Xác định ranh giới xác minh rõ ràng cho từng loại công việc để cân bằng giữa chất lượng và tốc độ. Xác minh tràn lan làm chậm vận hành, xác minh thiếu làm tăng rủi ro.
primary_domain: dung-nhan
secondary_domains:
- hop-chung
definition: Thiết lập ranh giới xác minh cấu trúc là nguyên tắc quy định mức độ kiểm tra bắt buộc theo mức rủi ro và giá trị của từng loại quyết định hoặc sản phẩm bàn giao.
conditions:
- Tổ chức có nhiều loại công việc với mức rủi ro khác nhau.
- Chi phí kiểm tra ảnh hưởng đáng kể tới tốc độ vận hành.
exceptions:
- Sản phẩm thử nghiệm nội bộ có thể áp dụng mức xác minh tối thiểu.
- Tình huống khẩn cấp có thể xác minh sau khi hành động.
applications:
  quality-control:
  - Áp dụng ma trận mức rủi ro - mức xác minh cho các sản phẩm bàn giao.
  - Tập trung nguồn lực kiểm tra vào các điểm khó đảo ngược.
  operations:
  - Rút ngắn thời gian xác minh ở các khâu rủi ro thấp bằng tự động hóa.
  governance:
  - Rà soát định kỳ các cấp xác minh để tránh chồng chéo hoặc bỏ sót.
risks:
- Xác minh hình thức ở cấp thấp gây cảm giác an toàn giả.
- Chồng chéo kiểm tra làm tăng thời gian mà không tăng chất lượng.
- Rủi ro mới chưa được cập nhật vào ma trận xác minh.
evidence:
  level: supported
  references:
  - EV-REQ-0001-01
relations:
