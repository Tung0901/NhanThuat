id: NT-ANTI-PATTERN-0015
type: anti-pattern
status: frozen
version: 0.1.0
title: Bẫy Phù hợp Văn hóa
summary: Đơn vị kiến thức cấu trúc về Bẫy Phù hợp Văn hóa (Culture Fit Trap) trong quản trị và tuyển dụng.
primary_domain: tri-nhan
secondary_domains:
- hop-chung
definition: Định nghĩa chính thức về Bẫy Phù hợp Văn hóa trong kiến trúc Nhân Thuật, mô tả rủi ro vô tình tạo ra tính tư duy đồng nhất và loại trừ sự đa dạng do ưu tiên tính đồng điệu văn hóa hơn năng lực chuyên môn.
conditions:
- Bối cảnh quản trị vận hành tổ chức.
exceptions:
- Trường hợp ghi đè trong khủng hoảng khẩn cấp.
applications:
  governance:
  - Áp dụng nhận diện Bẫy Phù hợp Văn hóa vào quy trình làm việc tổ chức.
risks:
- Áp dụng sai Bẫy Phù hợp Văn hóa dẫn đến hiệu suất không đạt tối ưu.
