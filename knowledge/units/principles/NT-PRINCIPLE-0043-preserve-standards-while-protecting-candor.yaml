id: NT-PRINCIPLE-0043
type: principle
status: frozen
version: 0.1.0
title: Giữ chuẩn mực đồng thời bảo vệ sự thẳng thắn
summary: Giữ chuẩn mực minh bạch đồng thời làm cho mọi người an toàn khi báo cáo khoảng trống, rủi ro và sai lầm sớm.
primary_domain: hop-chung
secondary_domains:
- dung-nhan
- thanh-su
definition: Chuẩn mực cao và sự thẳng thắn hỗ trợ lẫn nhau khi việc báo cáo vấn đề được coi là trách nhiệm thay vì không trung thành hay bất tài.
mechanism:
- Khẳng định chuẩn mực
- Khen thưởng báo cáo sớm
- Khép kín vòng lặp bằng hành động khắc phục.
conditions:
- Chất lượng hoặc niềm tin phụ thuộc vào sự thật sớm
- Mọi người có thể che giấu vấn đề.
exceptions:
- Che giấu lặp lại có thể cần trách nhiệm giải trình
- Ràng buộc bảo mật có thể giới hạn việc tiết lộ.
applications:
  operations:
  - Nhận diện tín hiệu rủi ro sớm trước khi ăn mừng kết quả.
  leadership:
  - Làm cho việc nói sự thật thành một phần của chuẩn mực
  - không phải ngoại lệ của nó.
risks:
- Hạ thấp chuẩn mực nhân danh an toàn
- Trừng phạt sự thẳng thắn một cách gián tiếp.
evidence:
