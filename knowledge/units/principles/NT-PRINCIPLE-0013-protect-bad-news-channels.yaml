id: NT-PRINCIPLE-0013
type: principle
status: frozen
version: 0.1.0
title: Bảo vệ kênh tin xấu
summary: Tạo ra các kênh để rủi ro, sai sót và bất đồng có thể lan truyền mà không bị trừng phạt không cân xứng hay mất vị thế.
primary_domain: hop-chung
secondary_domains:
- thanh-su
- dung-nhan
definition: Sự thật chỉ đến được tay người ra quyết định khi con người tin rằng việc báo cáo vấn đề sẽ được xử lý công bằng và hữu ích.
mechanism:
- Tạo kênh an toàn.
- Khen thưởng tín hiệu sớm.
- Phản hồi mang tính xây dựng với tin xấu.
conditions:
- Tin xấu ảnh hưởng đến quyết định.
- Con người sợ hậu quả khi lên tiếng.
exceptions:
- Báo cáo ác ý vẫn cần trách nhiệm giải trình.
- Giới hạn bảo mật có thể được áp dụng.
applications:
  leadership:
  - Cảm ơn các báo cáo rủi ro sớm trước khi giải quyết chúng.
  governance:
  - Tách biệt việc báo cáo sai sót khỏi việc che giấu sai sót.
risks:
- Tạo ra các kênh không ai tin tưởng.
- Bảo vệ hành vi bất cẩn thay vì sự thẳng thắn.
