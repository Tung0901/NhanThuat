id: NT-ANTI-PATTERN-0033
type: anti-pattern
status: frozen
version: 0.1.0
title: Ép buộc dựa trên vị thế
summary: Đơn vị kiến thức cấu trúc về Ép buộc dựa trên vị thế (Positional Forcing) trong quản trị hành vi và đàm phán.
primary_domain: dung-nhan
secondary_domains:
- tri-nhan
definition: Định nghĩa chính thức về Ép buộc dựa trên vị thế trong kiến trúc Nhân Thuật, chỉ việc lạm dụng quyền lực, địa vị hoặc lợi thế sẵn có để áp đặt quyết định lên bên yếu thế hơn mà không dựa trên sự đồng thuận hay lý lẽ khách quan.
conditions:
- Các bối cảnh quản trị vận hành tổ chức.
exceptions:
- Các trường hợp ghi đè trong tình huống khủng hoảng khẩn cấp.
applications:
  governance:
  - Nhận diện và xử lý hành vi ép buộc dựa trên vị thế trong quy trình làm việc tổ chức.
risks:
- Việc áp dụng sai hoặc lạm dụng ép buộc dựa trên vị thế dẫn đến sự bất mãn và giảm hiệu suất làm việc.
