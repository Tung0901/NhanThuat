id: NT-LAW-0010
type: law
status: frozen
version: 0.1.0
title: Tinh thần làm chủ đi liền với quyền quyết định
summary: Mọi người chỉ thực sự nhận trách nhiệm làm chủ khi họ có thể tác động đến các quyết định, nguồn lực và sự đánh đổi quyết định kết quả.
primary_domain: dung-nhan
secondary_domains:
- hop-chung
- thanh-su
definition: Tinh thần làm chủ sẽ suy giảm khi trách nhiệm được giao mà không đi kèm với quyền quyết định thực chất đối với lộ trình đạt được kết quả.
mechanism:
- Nhận trách nhiệm
- Đánh giá mức độ kiểm soát đối với các lựa chọn
- Đầu tư tinh thần làm chủ tương xứng với quyền tự quyết.
conditions:
- Kết quả phụ thuộc vào sự phán đoán và các quyết định đánh đổi
- Cá nhân hiểu rõ các kết quả kỳ vọng.
exceptions:
- Các vai trò bị giới hạn nghiêm ngặt vẫn có thể chịu trách nhiệm về chất lượng thực thi
- Trách nhiệm làm chủ chung có thể phân bổ quyền quyết định.
applications:
  management:
  - Gắn liền trách nhiệm giải trình với thẩm quyền quyết định.
  operations:
  - Báo cáo lên cấp trên các quyết định vượt quá thẩm quyền cục bộ.
risks:
- Tạo ra trách nhiệm giải trình mà không trao quyền tự quyết
- Nhầm lẫn giữa việc tham vấn ý kiến và thẩm quyền quyết định.
