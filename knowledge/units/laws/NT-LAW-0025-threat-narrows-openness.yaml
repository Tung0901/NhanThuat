id: NT-LAW-0025
type: law
status: frozen
version: 0.1.0
title: Mối đe dọa thu hẹp sự cởi mở
summary: Khi mọi người cảm thấy bị đe dọa, họ sẽ bảo vệ quyền kiểm soát, địa vị, sự thuộc về hoặc lòng tự trọng trước khi xử lý đầy đủ thông tin mới.
primary_domain: tri-nhan
secondary_domains:
- tu-than
- hop-chung
definition: Mối đe dọa được nhận thức sẽ chuyển dịch hành vi sang hướng phòng thủ, khiến sự tò mò, tính chân thành và việc học hỏi trở nên khó khăn hơn cho đến khi cảm giác an toàn được khôi phục đầy đủ.
mechanism:
- Phát hiện mối đe dọa
- Bảo vệ bản thân
- Thu hẹp cách diễn giải
- Kháng cự sự bộc lộ.
conditions:
- Cá nhân dự đoán sự mất mát
- sự làm bẽ mặt
- hình phạt
- sự loại trừ
- hoặc mất kiểm soát.
exceptions:
- Sự tin tưởng cao có thể giảm thiểu tác động của mối đe dọa
- Một số vai trò được đào tạo chuyên sâu vẫn duy trì sự cởi mở dưới áp lực.
applications:
  review:
  - Giảm thiểu mối đe dọa không cần thiết trước khi yêu cầu sự phản tỉnh trung thực.
  management:
  - Tách biệt việc sửa sai khỏi sự làm bẽ mặt.
risks:
- Tránh né trách nhiệm giải trình cần thiết
- Coi mọi sự khó chịu đều là tổn hại.
