id: NT-PHENOMENON-3303
type: phenomenon
title: Halo Effect
summary: The tendency for positive impressions of a person, company, brand or product
  in one area to positively influence one's opinion or feelings in other areas.
primary_domain: tri-nhan
domain_area: NT-DA-0029
definition: A cognitive bias where a single positive trait (e.g., physical attractiveness,
  charisma, or past success) creates a generalized positive aura that biases the evaluation
  of unrelated traits (e.g., intelligence, competence).
mechanism:
- An individual exhibits an outstanding positive trait.
- The observer forms a strong positive affective response.
- This affective response bleeds into all subsequent evaluations of the individual,
  overriding objective data.
conditions:
- Subjective evaluations, especially in hiring, performance reviews, or political
  elections.
exceptions:
- When evaluation criteria are strictly quantified and anonymized (e.g., blind coding
  tests).
applications:
  leadership:
  - Building early credibility through a quick, visible win to secure trust for future,
    harder initiatives.
risks:
- Promoting a charismatic but incompetent employee to leadership (The Peter Principle).
evidence:
  level: strong
  references:
  - Thorndike, E. L. (1920). 'A constant error in psychological ratings'. Journal
    of Applied Psychology.
