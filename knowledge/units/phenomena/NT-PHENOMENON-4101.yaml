id: NT-PHENOMENON-4101
type: phenomenon
status: draft
version: 1.0.0
title: Hiệu ứng Hàng hiệu (Veblen Effect)
summary: Nghịch lý của nhu cầu khi một sản phẩm càng có giá cao, khao khát sở hữu nó càng lớn do tác động của việc phô trương địa vị xã hội.
primary_domain: thanh-su
domain_area: NT-DA-0031
secondary_domains:
  - tri-nhan
definition: Khách hàng sẵn sàng chi trả mức giá phi lý cho một sản phẩm không phải vì chất lượng vượt trội, mà vì mức giá đó chứng minh đẳng cấp của người sở hữu.
conditions:
  - Sản phẩm phải có tính độc quyền hoặc số lượng giới hạn.
exceptions:
  - Giai đoạn khủng hoảng kinh tế sâu sắc.
applications:
  general:
    - Áp dụng trong quản trị và kinh doanh.
risks:
  - Giảm giá sẽ làm mất tính độc quyền.
evidence:
  level: strong
  references:
    - Thorstein Veblen, The Theory of the Leisure Class (1899)
relations:
  supports: []
  conflicts_with: []
  depends_on: []
  applies_to: []
tags:
  - status-signaling
  - luxury-psychology
