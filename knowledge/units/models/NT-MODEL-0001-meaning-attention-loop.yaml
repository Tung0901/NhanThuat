id: NT-MODEL-0001
type: model
status: frozen
version: 0.1.0
title: Vòng lặp ý nghĩa - chú ý
summary: Một mô hình mẫu chỉ ra cách thức ý nghĩa được diễn giải định hướng cho sự chú ý, và sự chú ý lặp đi lặp lại sẽ củng cố ý nghĩa được nhận thức.
primary_domain: tri-nhan
secondary_domains:
- tu-than
- hop-chung
definition: Con người có xu hướng chú ý đến những gì có vẻ có ý nghĩa, sau đó sự chú ý lặp đi lặp lại làm cho ý nghĩa đó cảm giác như có thật hơn, khẩn cấp hơn hoặc mang tính trung tâm hơn.
mechanism:
- Diễn giải ý nghĩa
- Phân bổ sự chú ý
- Củng cố tính nổi bật
- Cập nhật sự chú ý trong tương lai.
conditions:
- Các tín hiệu lặp lại
- Có sự hiện diện của mối liên hệ cảm xúc hoặc bản sắc cá nhân.
exceptions:
- Sự suy ngẫm có chủ ý có thể làm gián đoạn vòng lặp
- Các yêu cầu từ bên ngoài có thể chuyển hướng sự chú ý.
applications:
  communication:
  - Thiết kế các thông điệp làm rõ ý nghĩa mà không phóng đại mức độ khẩn cấp.
  self-management:
  - Nhận biết những gì đang trở nên lớn hơn do sự chú ý lặp đi lặp lại của bản thân.
risks:
- Sự nghiền ngẫm tiêu cực
- Sự khẩn cấp giả tạo.
