id: NT-PRINCIPLE-0096
type: principle
status: frozen
version: 0.1.0
title: Khớp quyền hạn với trách nhiệm giải trình
summary: Đảm bảo bất kỳ ai chịu trách nhiệm giải trình cho một kết quả đều được trao quyền hạn chính thức và ngân sách tương ứng để tác động lên kết quả đó.
primary_domain: dung-nhan
secondary_domains:
- hop-chung
definition: Giao trách nhiệm giải trình về kết quả cho nhân viên mà không trao quyền kiểm soát nguồn lực sẽ tạo ra căng thẳng cực độ.
conditions:
- Thiết kế ủy quyền và định nghĩa vai trò.
exceptions:
- Các vai trò quản lý ma trận đòi hỏi phối hợp dựa trên ảnh hưởng.
applications:
  role_design:
  - Rà soát vai trò quản lý để xác minh quyền phê duyệt ngân sách khớp với các KPI về hiệu suất.
risks:
- Trao quyền hạn mà không thiết lập các rào chắn trách nhiệm giải trình.
