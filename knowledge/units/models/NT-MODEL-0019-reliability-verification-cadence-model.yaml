mechanism:
- Phân loại hoạt động theo mức rủi ro và hậu quả khi sai.
- Ghi nhận lịch sử độ tin cậy của đối tượng qua thời gian.
- Đặt nhịp độ xác minh ban đầu tương xứng mức rủi ro và lịch sử.
- 'Điều chỉnh nhịp độ theo kết quả: giảm khi ổn định, tăng khi có dấu hiệu suy giảm.'
