id: NT-PRINCIPLE-0055
type: principle
status: frozen
version: 0.1.0
title: Kết nối nhiệm vụ với bản sắc và mục đích
summary: Đóng khung trách nhiệm để cá nhân hiểu cách công việc của họ phản ánh chuẩn mực nghề nghiệp, giá trị cá nhân và đóng góp cho một mục đích lớn hơn.
primary_domain: tu-than
secondary_domains:
- tri-nhan
- dung-nhan
definition: Con người duy trì nỗ lực qua những thách thức khó khăn khi họ nhận thấy công việc của mình là biểu hiện có ý nghĩa của bản sắc và cam kết.
mechanism:
- Xác định bản sắc và giá trị cốt lõi
- Đóng khung tính liên quan của nhiệm vụ
- Củng cố sự đồng nhất
- Duy trì nỗ lực bền vững.
conditions:
- Nhiệm vụ lặp lại, đòi hỏi hoặc cần sự bền bỉ lâu dài.
exceptions:
- Việc tạm thời thuần giao dịch có thể không cần sự đồng nhất bản sắc sâu.
applications:
  onboarding:
  - Giúp nhân viên mới kết nối kỳ vọng vai trò với sự phát triển nghề nghiệp cá nhân.
  communication:
  - Nêu bật tác động con người của các kết quả tổ chức.
risks:
- Tuyên bố mục đích giả tạo hoặc thao túng thiếu thực tế vận hành.
