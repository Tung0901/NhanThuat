id: NT-ANTI-PATTERN-0046
type: anti-pattern
status: frozen
version: 0.1.0
title: Ngụy biện Mọi thứ đều ưu tiên
summary: Tuyên bố hàng tá ưu tiên hàng đầu mà không đưa ra sự đánh đổi kiên quyết, dẫn đến pha loãng nguồn lực và kiệt sức ở đội ngũ.
primary_domain: thanh-su
secondary_domains:
- dung-nhan
definition: Ngụy biện Mọi thứ đều ưu tiên xảy ra khi ban lãnh đạo từ chối đưa ra những lựa chọn và đánh đổi khó khăn.
mechanism:
- Ban lãnh đạo bổ sung mục tiêu mới mà không loại bỏ bớt mục tiêu cũ.
- Nguồn lực bị phân tán manh mún.
- Tiến độ công việc bị đình trệ.
conditions:
- Ban điều hành thiếu quyết đoán.
exceptions:
- Các tập đoàn đa ngành lớn có dòng vốn và ngân sách độc lập.
applications:
  executive_coaching:
  - Giới hạn ban điều hành chỉ tập trung tối đa 3 ưu tiên chiến lược hàng đầu.
risks:
- Bỏ qua việc theo dõi các chỉ số sức khỏe vận hành phụ.
evidence:
  level: supported
  references:
