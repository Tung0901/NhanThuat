id: NT-ANTI-PATTERN-0026
type: anti-pattern
status: frozen
version: 0.1.0
title: Bẫy Chi Phí Chìm
summary: Bẫy chi phí chìm là hiện tượng tổ chức tiếp tục đổ nguồn lực vào các dự án hoặc quyết định không hiệu quả chỉ vì đã lỡ đầu tư nhiều tài nguyên trước đó.
primary_domain: tri-nhan
secondary_domains:
- tu-than
definition: Định nghĩa chính thức về Bẫy chi phí chìm trong kiến trúc NhanThuat, mô tả sai lầm nhận thức khi coi các khoản chi phí không thể thu hồi trong quá khứ là căn cứ để tiếp tục duy trì hoạt động kém hiệu quả.
conditions:
- Các bối cảnh quản trị vận hành và ra quyết định đầu tư.
exceptions:
- Các trường hợp ghi đè trong tình huống khủng hoảng khẩn cấp.
applications:
  governance:
  - Áp dụng nhận diện Bẫy chi phí chìm vào quy trình rà soát dự án và tái phân bổ nguồn lực tổ chức.
risks:
- Nhận diện hoặc xử lý sai Bẫy chi phí chìm dẫn đến lãng phí nguồn lực kéo dài và giảm hiệu suất vận hành.
