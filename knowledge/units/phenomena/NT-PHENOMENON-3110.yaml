id: NT-PHENOMENON-3110
type: phenomenon
title: Quy tắc đỉnh–cuối
summary: Con người đánh giá một trải nghiệm phần lớn dựa trên cảm xúc của họ tại đỉnh điểm (thời điểm mãnh liệt nhất) và ở cuối trải nghiệm, thay vì dựa trên tổng số hoặc trung bình của mọi khoảnh khắc.
primary_domain: tri-nhan
domain_area: NT-DA-0027
definition: Một lối tắt tâm lý, trong đó ký ức về một sự kiện bị quyết định chủ yếu bởi cao trào cảm xúc và phần kết của nó, bỏ qua thời lượng của sự kiện.
mechanism:
- Sự kiện diễn ra theo thời gian.
- Bộ não mã hóa có chọn lọc khoảnh khắc nổi bật nhất về mặt cảm xúc (đỉnh) và những khoảnh khắc cuối cùng (kết thúc).
- Các quyết định tương lai về việc lặp lại sự kiện chỉ dựa trên hai khung ký ức này.
conditions:
- 'Các trải nghiệm kéo dài theo thời gian (ví dụ: thủ thuật y tế, kỳ nghỉ, quá trình giới thiệu người dùng).'
exceptions:
- Các trải nghiệm ngắn, đồng nhất, không có sự biến thiên về cường độ cảm xúc.
applications:
  ux_design:
  - Luôn kết thúc hành trình người dùng hoặc quá trình thoát khỏi dịch vụ bằng một nốt tích cực, mang lại cảm giác được đền đáp.
risks:
- Đầu tư nhiều vào việc cải thiện trải nghiệm 'trung bình' trong khi bỏ qua một phần kết gây khó chịu, dẫn đến tỷ lệ giữ chân tiêu cực.
evidence:
  level: strong
  references:
  - 'Kahneman, D., Fredrickson, B. L., Schreiber, C. A., & Redelmeier, D. A. (1993). ''When more pain is preferred to less: Adding a better end''. Psychological Science.'
