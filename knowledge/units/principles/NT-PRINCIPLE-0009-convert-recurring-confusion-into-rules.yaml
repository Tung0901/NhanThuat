id: NT-PRINCIPLE-0009
type: principle
status: frozen
version: 0.1.0
title: Chuyển sự mơ hồ lặp lại thành quy tắc
summary: Khi cùng một sự nhầm lẫn tái diễn, hãy tạo ra một quy tắc, tiêu chuẩn hoặc lộ trình quyết định đơn giản thay vì dựa vào việc giải thích lặp đi lặp lại.
primary_domain: hop-chung
secondary_domains:
- thanh-su
- dung-nhan
definition: Sự mơ hồ tái diễn nên trở thành quy tắc vận hành để con người không tiếp tục dành sự chú ý cho cùng một câu hỏi phối hợp.
mechanism:
- Nhận ra sự nhầm lẫn lặp lại.
- Xác định quy tắc còn thiếu.
- Công bố một mặc định đơn giản.
conditions:
- Sự nhầm lẫn tái diễn.
- Một mặc định ổn định sẽ hữu ích.
exceptions:
- Công việc mới có thể cần phán đoán hơn là quy tắc.
- Quá nhiều quy tắc có thể che khuất các ưu tiên.
applications:
  operations:
  - Biến các câu hỏi lặp lại thành các mục trong sổ tay vận hành.
  management:
  - Làm rõ lộ trình quyết định sau nhiều lần leo thang lặp lại.
risks:
- Chuẩn hóa quá mức phán đoán phức tạp.
- Bỏ qua nhu cầu đào tạo.
