mechanism:
- Các bên nhận diện khác biệt về ưu tiên, nguồn lực và năng lực.
- Khác biệt được chuyển thành các trao đổi bù trừ thay vì đối đầu.
- Tổng giá trị của thỏa thuận được mở rộng qua thiết kế phương án.
- Phần giá trị mở rộng được phân bổ theo đóng góp và thỏa thuận.
