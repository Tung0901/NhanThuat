id: NT-ANTI-PATTERN-0032
type: anti-pattern
status: frozen
version: 0.1.0
title: Thao túng khung nhận thức
summary: Đơn vị kiến thức cấu trúc về Thao túng khung nhận thức (Manipulative Framing) trong quản trị hành vi.
primary_domain: tri-nhan
secondary_domains:
- tu-than
definition: Định nghĩa chính thức về Thao túng khung nhận thức trong kiến trúc Nhân Thuật, chỉ hành vi bóp méo hoặc cố tình trình bày thông tin theo cách định hướng nhằm thao túng nhận thức và quyết định của người khác.
conditions:
- Các bối cảnh quản trị vận hành tổ chức.
exceptions:
- Các trường hợp ghi đè trong tình huống khủng hoảng khẩn cấp.
applications:
  governance:
  - Nhận diện và ngăn chặn hành vi thao túng khung nhận thức trong quy trình làm việc tổ chức.
risks:
- Áp dụng sai hoặc không kiểm soát được thao túng khung nhận thức dẫn đến suy giảm niềm tin và hiệu suất tổ chức.
