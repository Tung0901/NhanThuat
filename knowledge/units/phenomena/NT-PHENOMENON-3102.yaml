id: NT-PHENOMENON-3102
type: phenomenon
title: Ác cảm mất mát
summary: Tác động tâm lý của việc mất đi một thứ gì đó mạnh gần gấp đôi tác động của việc đạt được thứ tương đương.
primary_domain: tri-nhan
domain_area: NT-DA-0027
definition: Một hiện tượng nhận thức vững chắc, trong đó con người ưa thích tránh mất mát hơn là đạt được lợi ích tương đương, thúc đẩy hành vi chấp nhận rủi ro trong vùng mất và hành vi né tránh rủi ro trong vùng được.
mechanism:
- Một kết quả được diễn giải như một sự mất mát.
- Hạch hạnh nhân và vỏ đảo kích hoạt các phản ứng cảm xúc tiêu cực mạnh mẽ.
- Cá nhân nỗ lực một cách không cân xứng để tránh hiện thực hóa sự mất mát.
conditions:
- Khả năng nhìn thấy rõ những gì có thể mất.
exceptions:
- 'Khi giao dịch các loại hàng hóa thông thường (ví dụ: tiêu tiền để mua cà phê).'
applications:
  change_management:
  - Diễn giải chi phí của việc không thay đổi (mất mát) thay vì chỉ nêu lợi ích của việc thay đổi (thắng lợi).
risks:
- Từ chối cắt lỗ đối với các dự án đang thất bại (leo thang cam kết).
evidence:
  level: strong
  references:
  - 'Kahneman, D., & Tversky, A. (1979). ''Prospect Theory: An Analysis of Decision under Risk''.'
relations:
  supports: []
  conflicts_with: []
  depends_on:
  - NT-PHENOMENON-3101
  applies_to: []
