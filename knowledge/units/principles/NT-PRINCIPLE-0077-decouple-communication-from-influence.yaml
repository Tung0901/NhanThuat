mechanism:
- 'Xác định mục tiêu thực sự: cần thông tin được biết đến hay cần hành vi thay đổi.'
- Thiết kế kênh và nội dung phù hợp với mục tiêu đó.
- Đánh giá kết quả truyền đạt bằng mức độ tiếp nhận thông tin.
- Đánh giá kết quả ảnh hưởng bằng thay đổi hành vi hoặc quyết định thực tế.
