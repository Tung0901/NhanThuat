id: NT-LAW-0072
type: law
status: frozen
version: 0.1.0
title: Sự nhất quán trong hành vi làm gương
summary: Văn hóa tổ chức được định hình bởi những hành vi mà các nhà lãnh đạo dung thứ và làm gương khi chịu áp lực, chứ không phải bởi các tuyên bố giá trị cốt lõi bằng văn bản.
primary_domain: hop-chung
secondary_domains:
- tu-than
definition: Nhân viên đánh giá văn hóa thực tế của tổ chức bằng cách quan sát hành động của ban điều hành trong các giai đoạn khủng hoảng.
conditions:
- Sự phát triển văn hóa và năng lực lãnh đạo trong khủng hoảng.
exceptions:
- Không có.
applications:
  culture_audit:
  - Kiểm toán các hành vi của ban lãnh đạo khi chịu áp lực để xác định các tín hiệu văn hóa thực tế.
risks:
- Giả định rằng các tuyên bố giá trị bằng văn bản có thể tạo ra văn hóa mà không cần đến hành vi làm gương của người lãnh đạo.
