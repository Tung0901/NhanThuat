id: NT-MODEL-0008
type: model
status: frozen
version: 0.1.0
title: Default expression under load model
summary: A diagnostic model mapping cognitive, emotional, and physical load to predict the statistical probability of behavioral defaults overriding deliberate adaptations.
primary_domain: tri-nhan
secondary_domains: [tu-than]
definition: Explains how sustained load stresses cognitive resources (executive control), leading to a higher probability that observed behavior will fall back onto stable latent defaults.
mechanism:
  - Measure sustained cognitive, emotional, or physical demands.
  - Monitor executive control resource allocation and prioritization.
  - Observe subsequent reduction in deliberate adaptive self-regulation.
  - Record probabilistic shift of behavioral expression toward automatic latent defaults.
conditions:
  - Individuals operate under high stress, fatigue, distraction, or cognitive load.
exceptions:
  - Highly automated habits or strong external situation strength cues can temporarily suppress defaults even under load.
applications:
  diagnosis: [Determine if performance drops or protocol slips under stress are due to cognitive overload triggering behavioral defaults.]
  design: [Reduce task load or introduce cognitive aids during high-stress operations to protect critical adaptive behaviors.]
risks:
  - Excusing deliberate misconduct, negligence, or ethical failures as unavoidable default expression.
evidence:
  level: provisional
  references: []
