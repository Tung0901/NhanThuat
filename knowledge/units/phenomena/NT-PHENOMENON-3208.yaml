id: NT-PHENOMENON-3208
type: phenomenon
title: Cam kết trước
summary: Đưa ra một quyết định ràng buộc từ trước khi ở trạng thái lý trí, điềm tĩnh nhằm ngăn chặn hành động thiếu lý trí ở trạng thái bốc đồng trong tương lai.
primary_domain: tri-nhan
domain_area: NT-DA-0028
definition: Cơ chế tâm lý nền tảng của các công cụ cam kết, bắt nguồn từ nhận thức về sở thích không nhất quán theo thời gian của chính mình.
mechanism:
- Cá nhân dự đoán trước một lần thất bại trong tự kiểm soát trong tương lai.
- Họ thay đổi kiến trúc lựa chọn của môi trường tương lai.
- Bản thân trong tương lai bị buộc phải thực hiện kế hoạch hợp lý.
conditions:
- Nhận thức siêu nhận thức cao về những điểm yếu của bản thân.
exceptions:
- Khi trạng thái tương lai khó dự đoán ở mức cao.
applications:
  health:
  - Mua thẻ hội viên phòng gym theo năm; xóa các ứng dụng giao đồ ăn.
risks:
- Sự bực bội hướng về bản thân trong quá khứ khi ràng buộc bị kích hoạt.
evidence:
  level: strong
  references:
  - 'Ariely, D., & Wertenbroch, K. (2002). ''Procrastination, deadlines, and performance: Self-control by precommitment''. Psychological Science.'
relations:
