id: NT-PHENOMENON-3004
type: phenomenon
status: frozen
version: 0.1.0
title: Ảo tưởng Tự tin Thái quá
summary: Xu hướng cấu trúc khiến các cá nhân tự tin hơn vào các phán đoán và dự đoán của họ so với mức độ chính xác khách quan thực tế.
primary_domain: tri-nhan
domain_area: NT-DA-0026
secondary_domains:
- tu-than
definition: Một mẫu chống (anti-pattern) trong đó độ chắc chắn chủ quan vượt qua độ chính xác khách quan, thường được thúc đẩy bởi sự trôi chảy của quá trình xử lý nội bộ thay vì sự hỗ trợ thực tế từ bằng chứng.
mechanism:
- Bộ não xử lý một phán đoán một cách dễ dàng (độ trôi chảy cao).
- Độ trôi chảy cao được diễn giải thành độ chính xác cao.
- Tác nhân thể hiện mức độ chắc chắn cao.
- Phép đo khách quan cho thấy khoảng cách đáng kể giữa độ chắc chắn và độ chính xác.
conditions:
- Các nhiệm vụ có độ khó từ trung bình đến cao, nơi phản hồi bị trì hoãn hoặc mơ hồ.
exceptions:
- Các nhiệm vụ có tính lặp lại cao với phản hồi khách quan ngay lập tức.
- 'Hậu quả: Các khoản đặt cược thảm khốc vào các chiến lược chưa được kiểm chứng; Thất bại trong việc xây dựng các biên an toàn hoặc phương án dự phòng cần thiết.'
- 'Dấu hiệu nhận biết: Ước tính điểm (ví dụ: ''Sẽ mất 3 ngày'') thay vì khoảng tin cậy (''3 đến 7 ngày'').'
applications:
  decision-making:
  - Yêu cầu các khoảng tin cậy thay vì các dự đoán tuyệt đối.
risks:
- Nhầm lẫn tiện ích xã hội của việc thể hiện sự tự tin (tín hiệu lãnh đạo) với độ chính xác nhận thức luận.
evidence:
  level: strong
  references:
  - Moore, D. A., & Healy, P. J. (2008). 'The trouble with overconfidence'. Psychological Review.
