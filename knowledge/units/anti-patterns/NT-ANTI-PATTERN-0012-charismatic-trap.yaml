id: NT-ANTI-PATTERN-0012
type: anti-pattern
status: frozen
version: 0.2.0
title: Bẫy sức hút cá nhân
summary: Tổ chức phụ thuộc quá mức vào sức hút cá nhân của một lãnh đạo, khiến phán đoán tập thể bị thay thế bằng niềm tin vào hình ảnh cá nhân. Khi người đó rời đi hoặc sai lầm, hệ thống sụp đổ nhanh vì không có cấu trúc đỡ.
primary_domain: tri-nhan
secondary_domains:
- dung-nhan
definition: Bẫy sức hút cá nhân là phản-mẫu trong đó uy tín, sự tự tin và sức hấp dẫn của một cá nhân lấn át các cơ chế kiểm chứng, phản biện và phân quyền vốn cần thiết cho quyết định tập thể.
conditions:
- Người lãnh đạo có sức hút mạnh và thành tích quá khứ ấn tượng.
- Cơ chế phản biện và kế nhiệm yếu hoặc hình thức.
exceptions:
- Sức hút cá nhân đi kèm cấu trúc phân quyền và phản biện mạnh thì rủi ro được hạn chế.
- Giai đoạn khủng hoảng cần tập trung vào một đầu mối có thể chấp nhận ngắn hạn.
applications:
  governance:
  - Xây dựng cơ chế phản biện bắt buộc cho các quyết định lớn bất kể ai đề xuất.
  - Chuẩn bị kế hoạch kế nhiệm cho các vị trí tập trung ảnh hưởng.
  leadership:
  - Chủ động chia sẻ quyền quyết định và công khai điểm yếu của bản thân.
  - Khuyến khích nhân sự phản biện thẳng thắn mà không sợ hậu quả.
  organization-design:
  - Phân tán các điểm ảnh hưởng quan trọng thay vì dồn vào một cá nhân.
risks:
- Sụp đổ hệ thống khi nhân vật trung tâm rời đi hoặc mắc sai lầm lớn.
- Điểm mù tập thể tích lũy vì không ai dám phản biện.
- Văn hóa sùng bái cá nhân làm lu mờ năng lực tập thể.
evidence:
