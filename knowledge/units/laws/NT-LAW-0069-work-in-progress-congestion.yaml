id: NT-LAW-0069
type: law
status: frozen
version: 0.1.0
title: Work-in-Progress Congestion
summary: As active Work-in-Progress (WIP) exceeds system throughput capacity, lead
  times expand non-linearly.
primary_domain: dung-nhan
secondary_domains:
- thanh-su
definition: 'Little''s Law in operations: context-switching overhead increases exponentially
  as WIP increases.'
conditions:
- Multi-tasking teams under high project load.
exceptions:
- Fully automated parallel compute workers.
applications:
  workflow_management:
  - Set strict WIP limits on Kanban boards.
risks:
- Setting WIP limits too low, leaving staff idle.
evidence:
  level: supported
  references:
  - EV-REQ-0017-01
