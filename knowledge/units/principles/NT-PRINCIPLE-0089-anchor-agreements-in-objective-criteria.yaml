id: NT-PRINCIPLE-0089
type: principle
status: frozen
version: 0.2.0
title: Cố định thỏa thuận vào tiêu chí khách quan
summary: Dùng tiêu chí khách quan làm điểm neo cho thỏa thuận thay vì đấu trí ý chí. Tiêu chí khách quan giúp thỏa thuận công bằng và dễ được chấp nhận.
primary_domain: thanh-su
secondary_domains:
- dung-nhan
definition: Cố định thỏa thuận vào tiêu chí khách quan là nguyên tắc đàm phán dựa trên chuẩn mực bên ngoài như thị trường, luật lệ, tiêu chuẩn nghề nghiệp và tiền lệ hợp lý, thay vì nhượng bộ ngẫu nhiên theo sức ép.
conditions:
- Tồn tại chuẩn mực bên ngoài có thể tham chiếu cho vấn đề đang bàn.
- Các bên cần thỏa thuận có khả năng được chấp nhận rộng rãi.
exceptions:
- Vấn đề chưa có tiêu chuẩn tham chiếu, cần thống nhất tiêu chí mới.
- Đàm phán quan hệ dài hạn có thể linh hoạt hơn để duy trì hợp tác.
applications:
  negotiation:
  - Neo đề xuất vào dữ liệu thị trường, tiêu chuẩn ngành hoặc tiền lệ hợp lý.
  - Thống nhất trước tiêu chí đánh giá để giảm tranh cãi về con số.
  procurement:
  - Dùng bảng tiêu chí đánh giá công khai cho lựa chọn nhà cung cấp.
  governance:
  - Áp dụng tiêu chí khách quan cho phân bổ ngân sách và đánh giá kết quả.
risks:
- Chọn tiêu chí có lợi cho một bên và gọi đó là khách quan.
- Tiêu chí đã lỗi thời không còn phù hợp thực tế.
- Dùng tiêu chí khách quan để né tránh đối thoại về giá trị.
evidence:
