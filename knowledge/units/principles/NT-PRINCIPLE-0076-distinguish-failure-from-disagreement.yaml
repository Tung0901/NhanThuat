mechanism:
- 'Phân loại sự kiện: đây là thất bại kết quả hay bất đồng quan điểm.'
- Áp dụng quy trình học hỏi phù hợp cho từng loại.
- 'Với thất bại: phân tích nguyên nhân hệ thống, tách khỏi quy trách nhiệm cá nhân.'
- 'Với bất đồng: ghi nhận quan điểm, đánh giá trên lập luận và bằng chứng.'
