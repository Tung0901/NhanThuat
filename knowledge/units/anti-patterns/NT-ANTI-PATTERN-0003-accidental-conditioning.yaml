id: NT-ANTI-PATTERN-0003
type: anti-pattern
status: frozen
version: 0.1.0
title: Điều kiện hóa vô tình
summary: Một mô hình độc hại trong đó việc khen thưởng và xử phạt lặp đi lặp lại vô tình rèn luyện hành vi đi ngược lại với giá trị đã tuyên bố.
primary_domain: tri-nhan
secondary_domains:
- thanh-su
- hop-chung
definition: Các hệ thống vô tình điều kiện hóa con người khi các giá trị chính thức tuyên bố một đằng nhưng hệ quả thực tế lặp đi lặp lại lại dạy một nẻo.
mechanism:
- Tuyên bố giá trị
- Khen thưởng hành vi trái ngược
- Lặp lại sự mâu thuẫn
- Bình thường hóa sự thích nghi
conditions:
- Giá trị tuyên bố và hệ quả thực tế tồn tại sự mâu thuẫn.
exceptions:
- Ngoại lệ tạm thời có thể được chấp nhận nếu được chỉ rõ và khắc phục kịp thời.
applications:
  culture:
  - So sánh những gì được biểu dương với những gì thực sự được tưởng thưởng.
  operations:
  - Tìm kiếm các cơ chế khuyến khích lặp đi lặp lại mâu thuẫn với các tiêu chuẩn đã tuyên bố.
risks:
- Sự hoài nghi tiêu cực
- Thao túng ngầm
