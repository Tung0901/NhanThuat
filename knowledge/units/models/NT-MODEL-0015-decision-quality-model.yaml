mechanism:
- Kiểm tra vấn đề được phát biểu có đúng gốc rễ không.
- Đánh giá chất lượng và độ đầy đủ của thông tin đầu vào.
- Kiểm tra số lượng và độ đa dạng của các lựa chọn đã xem xét.
- Đánh giá tiêu chí, lập luận và tính khả thi của điều kiện thực thi.
