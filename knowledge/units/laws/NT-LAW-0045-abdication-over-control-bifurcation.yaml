mechanism:
- Khối lượng hoặc độ phức tạp công việc vượt năng lực ủy quyền.
- Người quản lý mất khả năng theo dõi chi tiết toàn bộ công việc.
- Xuất hiện sai sót hoặc chậm trễ ở một số đầu việc.
- 'Phản ứng phân nhánh: hoặc buông hẳn trách nhiệm, hoặc tăng kiểm soát vi mô lên toàn bộ.'
- Cả hai cực làm xói mòn chủ động của người nhận và chất lượng hệ thống.
