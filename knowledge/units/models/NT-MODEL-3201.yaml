id: NT-MODEL-3201
type: model
title: Vòng lặp Thói quen (Gợi ý - Hành vi - Phần thưởng)
summary: Một vòng lặp thần kinh chi phối mọi thói quen, bao gồm tín hiệu gợi ý kích hoạt não bộ, chuỗi hành vi thực thi và phần thưởng nhận được.
primary_domain: tri-nhan
domain_area: NT-DA-0028
definition: Mô hình nền tảng về sự hình thành thói quen, mô tả cách các hành vi trở nên tự động thông qua một vòng phản hồi điều kiện hóa từ kết quả gồm ba bước.
mechanism:
- 'Gợi ý: Tín hiệu kích hoạt báo cho não bộ chuyển sang chế độ vận hành tự động.'
- 'Hành vi: Chuỗi hành động về thể chất, tinh thần hoặc cảm xúc được thực thi.'
- 'Phần thưởng: Sự củng cố tích cực giúp não bộ nhận biết vòng lặp này đáng để ghi nhớ.'
- Theo thời gian, gợi ý và phần thưởng liên kết chặt chẽ cho đến khi một cảm giác thèm muốn hoặc thôi thúc xuất hiện.
conditions:
- Các hành vi được lặp đi lặp lại thường xuyên trong bối cảnh và môi trường ổn định.
exceptions:
- Các nhiệm vụ hoàn toàn mới, phức tạp hoặc nguy hiểm đòi hỏi sự chú ý liên tục của Hệ thống tư duy 2.
applications:
  behavior_change:
  - Để thay đổi một thói quen, hãy giữ nguyên gợi ý cũ, mang lại phần thưởng cũ, nhưng chèn vào một chuỗi hành vi mới.
risks:
- Vô tình hình thành các thói quen tổ chức tiêu cực (như dập tắt các ý kiến trái chiều) vì chúng mang lại phần thưởng cảm xúc tức thì (giảm thiểu xung đột).
evidence:
  level: strong
  references:
  - Duhigg, C. (2012). 'The Power of Habit'. Random House.
