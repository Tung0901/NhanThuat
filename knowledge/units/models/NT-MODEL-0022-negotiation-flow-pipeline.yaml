mechanism:
- 'Chuẩn bị: xác định lợi ích, phương án thay thế và giới hạn của mình.'
- 'Khai vấn: tìm hiểu lợi ích, ưu tiên và lo ngại của đối phương.'
- 'Đề xuất: trình bày phương án dựa trên lợi ích đã trao đổi.'
- 'Mặc cả: xử lý khác biệt bằng tiêu chí khách quan và nhượng bộ có điều kiện.'
- 'Chốt: ghi nhận thỏa thuận, trách nhiệm và cơ chế xử lý thay đổi.'
