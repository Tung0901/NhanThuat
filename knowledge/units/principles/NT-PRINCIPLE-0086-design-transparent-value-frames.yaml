id: NT-PRINCIPLE-0086
type: principle
status: frozen
version: 0.2.0
title: Thiết kế khung giá trị minh bạch
summary: Thiết kế khung giá trị minh bạch để các bên hiểu đúng điều được mời chào và điều được trao đổi. Khung giá trị mờ ám tạo nghi ngờ và bế tắc đàm phán.
primary_domain: tri-nhan
secondary_domains:
- hop-chung
definition: Thiết kế khung giá trị minh bạch là nguyên tắc trình bày rõ các chiều giá trị, tiêu chí trao đổi và giả định tính toán trong tương tác thương lượng, để các bên đánh giá trên cùng cơ sở.
conditions:
- Tương tác có nhiều chiều giá trị không dễ quy về tiền.
- Các bên cần đủ tin nhau để thảo luận giá trị thực.
exceptions:
- Thông tin chiến lược có thể được giữ kín có chủ đích nhưng không được gây hiểu lầm.
- Đàm phán cạnh tranh có thể không chia sẻ toàn bộ khung giá trị.
applications:
  negotiation:
  - Trình bày bảng giá trị đa chiều thay vì chỉ tập trung vào giá.
  - Nêu rõ giả định tính toán khi đưa ra đề xuất tài chính.
  sales:
  - Giải thích cấu trúc giá trị cho khách hàng thay vì che giấu chi phí.
  governance:
  - Minh bạch tiêu chí phân bổ nguồn lực giữa các bộ phận.
risks:
- Minh bạch hình thức che giấu điều khoản quan trọng.
- Gây quá tải thông tin khiến khung giá trị không còn hữu ích.
- Đối phương khai thác thông tin minh bạch để chiếm lợi thế.
evidence:
