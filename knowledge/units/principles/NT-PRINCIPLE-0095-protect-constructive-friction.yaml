id: NT-PRINCIPLE-0095
type: principle
status: frozen
version: 0.1.0
title: Bảo vệ ma sát mang tính xây dựng
summary: Chủ động nuôi dưỡng môi trường trong đó sự phản biện nghiêm túc về nhiệm vụ được bảo vệ như một lá chắn chống lại tư duy bầy đàn.
primary_domain: hop-chung
secondary_domains:
- tri-nhan
definition: Một đội ngũ không có xung đột về nhiệm vụ đang phải chịu sự hòa hợp giả tạo hoặc sự sợ hãi.
conditions:
- Ra quyết định chiến lược có rủi ro cao.
exceptions:
- Các giai đoạn thực thi khẩn cấp khi sự đồng thuận đã đạt được.
applications:
  culture:
  - Bố trí luân phiên vai trò Người phản biện (Devil's Advocate) trong các buổi rà soát chiến lược lớn.
risks:
- Để ma sát kéo dài làm chậm tiến độ sau khi quyết định đã được chốt.
