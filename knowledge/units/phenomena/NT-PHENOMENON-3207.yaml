id: NT-PHENOMENON-3207
type: phenomenon
title: Hiệu ứng quá mức hóa lý do (Lấn át động lực ngoại sinh)
summary: Việc trao một phần thưởng bên ngoài cho một hoạt động vốn đã mang lại sự hài lòng nội tại sẽ làm giảm động lực nội tại của một người đối với hoạt động đó.
primary_domain: tri-nhan
domain_area: NT-DA-0028
definition: Hiện tượng trong đó các khuyến khích bên ngoài được kỳ vọng như tiền bạc hoặc giải thưởng làm giảm động lực nội tại của một người khi thực hiện một nhiệm vụ.
mechanism:
- Một cá nhân thích thú với nhiệm vụ vì chính bản thân nhiệm vụ đó.
- Một phần thưởng bên ngoài được đưa ra cho việc thực hiện nhiệm vụ.
- Não bộ chuyển sự quy kết hành vi từ "Tôi làm việc này vì tôi thích" sang "Tôi làm việc này vì tôi được trả công".
- Khi phần thưởng bị gỡ bỏ, hành vi cũng chấm dứt.
conditions:
- Các nhiệm vụ vốn đã có động lực nội tại và mức độ hứng thú cao.
exceptions:
- Các nhiệm vụ thường nhật, tẻ nhạt hoặc mang tính cơ học với động lực nội tại bằng không (phần thưởng bên ngoài phát huy hiệu quả tốt trong trường hợp này).
applications:
  management:
  - Không trao thưởng tài chính cho hoạt động khám phá sáng tạo, tự định hướng cao trừ khi thật sự cần thiết.
risks:
- Vô tình phá hủy một cộng đồng mã nguồn mở hoặc tình nguyện viên đầy nhiệt huyết bằng cách thương mại hóa hoặc trả công cho họ.
evidence:
  level: strong
  references:
  - Lepper, M. R., Greene, D., & Nisbett, R. E. (1973). 'Undermining children's intrinsic interest with extrinsic reward'. Journal of Personality and Social Psychology.
