id: NT-LAW-0069
type: law
status: frozen
version: 0.2.0
title: Tắc nghẽn công việc đang xử lý
summary: Khi lượng công việc đang xử lý (WIP) vượt quá năng suất của hệ thống, thời gian hoàn thành (lead time) sẽ tăng lên theo cấp số nhân phi tuyến tính.
primary_domain: dung-nhan
secondary_domains:
- thanh-su
definition: 'Định luật Little trong vận hành: chi phí chuyển đổi ngữ cảnh tăng theo cấp số nhân khi lượng công việc đang xử lý (WIP) tăng lên.'
conditions:
- Các đội ngũ đa nhiệm chịu tải lượng dự án cao.
exceptions:
- Các tiến trình tính toán song song được tự động hóa hoàn toàn.
applications:
  workflow-management:
  - Thiết lập giới hạn WIP nghiêm ngặt trên bảng Kanban.
risks:
- Thiết lập giới hạn WIP quá thấp dẫn đến việc nhân viên bị nhàn rỗi.
evidence:
  level: supported
  references:
  - EV-REQ-0017-01
relations:
  supports: []
  conflicts_with: []
  depends_on:
  - NT-LAW-0022
  applies_to: []
tags:
- execution
- wip
- queueing
- work-in-progress
- wip-limit
- littles-law
- context-switching
- workflow-congestion
created_at: '2026-07-22'
updated_at: '2026-09-14'
mechanism:
- Khối lượng công việc đang xử lý (WIP) vượt năng suất hệ thống.
- Chuyển đổi ngữ cảnh giữa các tác vụ tiêu hao thời gian và chú ý.
- Thời gian hoàn thành mỗi công việc tăng phi tuyến.
- Hàng đợi chờ ngày càng dài và tiến độ tổng thể chậm lại.
- Giảm WIP là cách duy nhất khôi phục tốc độ hoàn thành.
