id: NT-LAW-0075
type: law
status: frozen
version: 0.1.0
title: Hiệu ứng dốc trượt đạo đức
summary: Những thỏa hiệp đạo đức nhỏ không được chấn chỉnh kịp thời sẽ làm giảm khả năng kháng cự nhận thức đối với các hành vi gian lận lớn và sai phạm mang tính hệ thống theo thời gian.
primary_domain: tu-than
secondary_domains:
- tri-nhan
definition: 'Sự hợp lý hóa tăng dần: những lối tắt đạo đức nhỏ làm giảm sự nhạy cảm của các tác nhân đối với các ranh giới đạo đức.'
conditions:
- Kế toán, báo cáo doanh số và tuân thủ.
exceptions:
- Không có.
applications:
  compliance_audit:
  - Can thiệp quyết liệt vào các thỏa hiệp đạo đức nhỏ để ngăn chặn sự leo thang.
risks:
- Tạo ra một văn hóa trừng phạt quá mức, biến những sai sót nhỏ vô ý thành những sự kiện chấm dứt sự nghiệp.
evidence:
  level: supported
  references:
  - EV-REQ-0020-01
