id: NT-PHENOMENON-3301
type: phenomenon
title: Bằng chứng xã hội và sự tuân thủ
summary: Cá nhân nhìn vào hành vi của người khác để xác định hành vi đúng cho chính mình, đặc biệt trong những tình huống mơ hồ.
primary_domain: tri-nhan
domain_area: NT-DA-0029
definition: Xu hướng tâm lý áp dụng ý kiến, hành vi và hành động của số đông (hoặc nhóm đồng trang lứa) như một lối tắt cho điều gì là đúng đắn hoặc phù hợp.
mechanism:
- Một cá nhân đối mặt với một tình huống mơ hồ hoặc áp lực cao.
- Họ quan sát hành động hoặc niềm tin đã được phát biểu của nhóm xung quanh.
- Họ điều chỉnh hành vi của mình cho khớp, cho rằng nhóm sở hữu kiến thức vượt trội hoặc để tránh bị xã hội xa lánh.
conditions:
- Mức độ không chắc chắn hoặc mơ hồ cao, hoặc mong muốn mạnh mẽ được nhóm chấp nhận.
exceptions:
- Khi cá nhân có chuyên môn vượt trội và độ chắc chắn tuyệt đối.
applications:
  marketing:
  - Nhấn mạnh rằng "90% bạn bè của bạn dùng sản phẩm này" hiệu quả hơn việc nhấn mạnh các tính năng của sản phẩm.
risks:
- Sự tuân thủ Asch—đồng tình với một đáp án rõ ràng sai chỉ để hòa nhập, dẫn đến những sai lầm chiến lược thảm khốc.
evidence:
  level: strong
  references:
  - Asch, S. E. (1951). 'Effects of group pressure upon the modification and distortion of judgments'.
  - 'Cialdini, R. B. (1984). ''Influence: The Psychology of Persuasion''.'
