title: Ma Trận Quyền Lực
summary: 'Phân loại năm nguồn gốc quyền lực cơ bản trong tổ chức: Chuyên gia, Vị trí, Phần thưởng, Trừng
  phạt và Tham chiếu.'
primary_domain: dung-nhan
domain_area: NT-DA-0022
secondary_domains:
- tu-than
definition: Công cụ phân tích giúp nhà lãnh đạo nhận diện loại quyền lực họ đang sở hữu và xác định các
  nguồn lực cần phát triển thêm.
mechanism:
- Sử dụng quyền lực chuyên gia dựa trên tri thức và năng lực thực tế.
- Sử dụng quyền lực tham chiếu dựa trên sự uy tín và lòng kính trọng.
conditions:
- Tùy thuộc vào mức độ trưởng thành và văn hóa làm việc của nhân viên.
exceptions:
- Các tổ chức phi lợi nhuận có cấu trúc phẳng (thường hạn chế quyền lực cưỡng bức).
applications:
  management:
  - Xây dựng tầm ảnh hưởng cá nhân và tổ chức
risks:
- Lạm dụng quyền lực cưỡng phạt gây tâm lý bất mãn và chống đối.
