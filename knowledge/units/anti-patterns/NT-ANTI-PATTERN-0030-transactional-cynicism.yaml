created_at: '2026-07-22'
updated_at: '2026-09-14'
mechanism:
- Tổ chức đối xử với nhân sự thuần túy qua chỉ số và chi phí.
- Nhân sự điều chỉnh kỳ vọng xuống mức trao đổi tương xứng tối thiểu.
- Hành vi dấn thân ngoài chức trách biến mất.
- Văn hóa hoài nghi lan rộng và tự củng cố qua các chu kỳ tiếp theo.
