id: NT-PHENOMENON-3105
type: phenomenon
title: Thiên kiến hiện tại (Chiết khấu hyperbolic)
summary: Xu hướng ưa thích một cách không cân xứng những phần thưởng nhỏ, tức thì hơn những phần thưởng lớn hơn nhưng đến muộn hơn.
primary_domain: tri-nhan
domain_area: NT-DA-0027
definition: Một mô hình chiết khấu không nhất quán theo thời gian, trong đó tỷ lệ chiết khấu giảm nhanh với các khoảng thời gian trì hoãn ngắn và giảm chậm với các khoảng thời gian trì hoãn dài hơn.
mechanism:
- Phần thưởng tức thì kích hoạt hệ viền (dopamine).
- Phần thưởng tương lai đòi hỏi xử lý trừu tượng ở vỏ não trước trán.
- Giá trị chủ quan của phần thưởng tương lai bị chiết khấu mạnh so với cảm giác tức thì.
conditions:
- Khi một phần thưởng tức thì có thể đạt được một cách cụ thể ngay lúc này.
exceptions:
- Khi cá nhân sử dụng các thiết bị ràng buộc cam kết để trói buộc bản thân trong tương lai.
applications:
  incentives:
  - Đưa ra sự ghi nhận nhỏ, tức thì thay vì chỉ dựa vào thưởng cuối năm.
risks:
- Hy sinh kiến trúc chiến lược dài hạn để đổi lấy việc giao tính năng ngắn hạn.
evidence:
  level: strong
  references:
  - Laibson, D. (1997). 'Golden eggs and hyperbolic discounting'. Quarterly Journal of Economics.
