id: NT-PRINCIPLE-0074
type: principle
status: frozen
version: 0.2.0
title: Hiệu chỉnh theo năng lực đã chứng minh
summary: Mở rộng quyền hạn và trách nhiệm theo năng lực đã được chứng minh qua kết quả thực tế. Hiệu chỉnh theo năng lực giúp trao quyền chính xác và duy trì niềm tin.
primary_domain: dung-nhan
secondary_domains:
- tri-nhan
definition: 'Hiệu chỉnh theo năng lực đã chứng minh là nguyên tắc giao quyền theo bằng chứng: mức độ tự chủ và phạm vi quyết định được điều chỉnh dựa trên thành tích hành vi đã kiểm chứng, không dựa trên thâm niên hoặc lời hứa.'
conditions:
- Có tiêu chí và dữ liệu đánh giá năng lực đủ tin cậy.
- Phạm vi quyền hạn có thể điều chỉnh theo bước.
exceptions:
- Tình huống khủng hoảng cần giao quyền đặc biệt vượt năng lực đã chứng minh.
- Vai trò mới chưa có lịch sử cần giai đoạn đánh giá trước khi mở quyền.
applications:
  delegation:
  - Giao quyền theo mức năng lực đã chứng minh và mở rộng dần theo kết quả.
  - Thu hẹp quyền hạn khi bằng chứng cho thấy năng lực chưa tương xứng.
  management:
  - Dùng lộ trình mở rộng quyền hạn như công cụ phát triển nhân sự.
  governance:
  - Rà soát định kỳ mức quyền hạn thực tế so với năng lực đã chứng minh.
risks:
- Đánh giá năng lực dựa trên một vài kết quả may mắn.
- Thu hẹp quyền hạn quá nhanh làm suy giảm động lực.
- Thiếu lộ trình mở rộng khiến nhân sự giỏi bị giữ ở mức thấp.
evidence:
