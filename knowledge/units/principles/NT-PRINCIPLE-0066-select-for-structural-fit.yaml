id: NT-PRINCIPLE-0066
type: principle
status: frozen
version: 0.2.0
title: Tuyển chọn theo sự khớp cấu trúc
summary: Tuyển chọn dựa trên mức phù hợp với cấu trúc công việc thực tế thay vì chỉ dựa vào hồ sơ hay ấn tượng. Khớp cấu trúc bền vững hơn khớp hình thức.
primary_domain: tri-nhan
secondary_domains:
- dung-nhan
definition: 'Tuyển chọn theo sự khớp cấu trúc là nguyên tắc đánh giá ứng viên theo mức tương thích với yêu cầu cấu trúc của vai trò: mức tự chủ, mức hợp tác, độ bất định và tiêu chuẩn đầu ra của công việc.'
conditions:
- Vai trò có cấu trúc công việc được mô tả đủ rõ.
- Có thể quan sát hành vi ứng viên trong tình huống gần với thực tế.
exceptions:
- Vai trò được thiết kế riêng cho một cá nhân cụ thể với cấu trúc linh hoạt.
- Vị trí dự kiến tái cấu trúc ngay sau khi tuyển.
applications:
  hiring:
  - Mô tả cấu trúc công việc trước khi viết mô tả vị trí và tiêu chí đánh giá.
  - Dùng bài kiểm tra mô phỏng tình huống gần với công việc thật.
  management:
  - Đánh giá lại độ khớp cấu trúc khi vai trò thay đổi theo thời gian.
  talent-development:
  - Lập kế hoạch thu hẹp khoảng cách cấu trúc cho nhân sự có tiềm năng.
risks:
- Chọn người giỏi nhưng lệch cấu trúc dẫn tới xung đột âm ỉ.
- Đánh giá cấu trúc cứng nhắc bỏ lỡ khả năng thích ứng của con người.
- Coi độ khớp cấu trúc là yếu tố duy nhất thay vì cân nhắc tổng thể.
evidence:
  level: supported
  references:
  - EV-REQ-0001-01
