id: NT-ANTI-PATTERN-0014
type: anti-pattern
status: frozen
version: 0.2.0
title: Ảo tưởng Vị trí Chính thức
summary: Đơn vị kiến thức cấu trúc về Ảo tưởng Vị trí Chính thức (Formal Position Illusion) trong quản trị tổ chức.
primary_domain: dung-nhan
secondary_domains:
- tri-nhan
definition: Định nghĩa chính thức về Ảo tưởng Vị trí Chính thức trong kiến trúc Nhân Thuật, mô tả sự ngộ nhận rằng quyền lực và ảnh hưởng thực tế hoàn toàn xuất phát từ chức danh chính thức thay vì năng lực và sự tín nhiệm.
conditions:
- Bối cảnh quản trị vận hành tổ chức.
exceptions:
- Trường hợp ghi đè trong khủng hoảng khẩn cấp.
applications:
  governance:
  - Áp dụng nhận diện Ảo tưởng Vị trí Chính thức vào quy trình làm việc tổ chức.
risks:
- Áp dụng sai Ảo tưởng Vị trí Chính thức dẫn đến hiệu suất không đạt tối ưu.
evidence:
  level: supported
  references:
  - EV-REQ-0001-01
relations:
  supports: []
  conflicts_with: []
  depends_on:
  - NT-LAW-0038
  applies_to: []
tags:
- anti-pattern
- dung-nhan
- formal-position-illusion
- positional-power
- authority-bias
- organizational-governance
created_at: '2026-07-22'
updated_at: '2026-09-14'
mechanism:
- Một cá nhân được bổ nhiệm vào vị trí chính thức với quyền hạn danh nghĩa.
- Người đó mặc định rằng chức danh tự động tạo ra ảnh hưởng thực tế.
- Bỏ qua việc xây dựng năng lực, quan hệ và sự tín nhiệm cần thiết.
- Khi cần huy động nỗ lực thực chất, tập thể không phản hồi như kỳ vọng.
- Người nắm vị trí gia tăng áp lực chính thức thay vì điều chỉnh cách tiếp cận.
