id: NT-LAW-0038
type: law
status: frozen
version: 0.1.0
title: Suy giảm quyền lực theo vai trò
summary: Đơn vị tri thức cấu trúc về quy luật suy giảm quyền lực theo vị trí vai trò.
primary_domain: dung-nhan
secondary_domains:
- tri-nhan
definition: Định nghĩa chuẩn tắc về sự suy thoái quyền lực vai trò trong kiến trúc Nhân Thuật.
conditions:
- Bối cảnh quản trị vận hành của tổ chức.
exceptions:
- Trường hợp can thiệp ưu tiên trong tình huống khủng hoảng khẩn cấp.
applications:
  governance:
  - Ứng dụng nguyên lý suy giảm quyền lực vai trò vào tối ưu hóa luồng công việc tổ chức.
risks:
- Áp dụng sai nguyên lý suy giảm quyền lực vai trò dẫn đến hiệu suất hoạt động kém tối ưu.
