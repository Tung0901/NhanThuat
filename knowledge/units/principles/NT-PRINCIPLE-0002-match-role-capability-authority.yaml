id: NT-PRINCIPLE-0002
type: principle
status: frozen
version: 1.0.0
title: "Nguyên tắc tam hợp: Khớp nối Vai trò, Năng lực và Thẩm quyền"
summary: "Chỉ giao phó một trọng trách khi và chỉ khi Kết quả kỳ vọng của vai trò (Role Expectation), Năng lực thực chiến của con người (Capability) và Thẩm quyền ra quyết định (Authority) đã được căn chỉnh khớp khít với nhau thành một tam giác cân bằng."
primary_domain: dung-nhan
secondary_domains:
- hop-chung
- thanh-su
definition: "Trong kiến trúc thiết kế tổ chức và dụng nhân, mọi vị trí chức danh đều vận hành trên 3 chân kiềng: Trách nhiệm đầu ra (Role), Tài năng thực hiện (Capability) và Quyền lực điều động nguồn lực (Authority). Nếu một trong ba chân kiềng này bị lệch—như giao việc lớn cho người thiếu năng lực, hoặc người có năng lực gánh việc lớn nhưng không được trao thẩm quyền tương xứng—chiếc ghế đó tất yếu sẽ gãy đổ, gây oán thán cho nhân sự và thiệt hại cho đại cuộc."
mechanism:
- "Định chuẩn Đầu ra Vai trò (Role Outcome Specification): Xác định rõ 3–5 kết quả định lượng cốt lõi mà vị trí đó phải tạo ra trong 90–180 ngày tới."
- "Đối chiếu Năng lực Thực chứng (Capability Verification): Kiểm tra xem người đảm nhận đã có đủ kỹ năng, kinh nghiệm phán đoán và độ chín tâm lý để gánh vác độ khó đó chưa."
- "Cấp phát Thẩm quyền Đồng bộ (Authority Synchronization): Trao quyền quyết định nhân sự, ngân sách và thông tin tương xứng với trách nhiệm được giao."
- "Bù đắp khoảng hở bằng Hệ thống Hỗ trợ: Nếu năng lực hiện tại đạt 80% yêu cầu của vai trò, chủ động thiết lập cơ chế kèm cặp (Mentoring) và chốt chặn phê duyệt cho 20% còn thiếu trong giai đoạn chuyển giao."
- "Tái cân bằng định kỳ: Khi quy mô vai trò phình to theo đà tăng trưởng của công ty, phải kịp thời nâng cấp năng lực hoặc phân tách lại vai trò và quyền hạn."
conditions:
- "Vai trò có mục tiêu đầu ra rõ ràng và có tác động quan trọng đến chuỗi giá trị của tổ chức."
- "Lãnh đạo có khả năng đánh giá khách quan năng lực của ứng viên và thiết kế lại phạm vi thẩm quyền trước hoặc trong khi bổ nhiệm."
exceptions:
- "Các nhiệm vụ thử thách ngắn hạn (Stretch Roles) được giao có chủ đích để rèn luyện tướng trẻ dưới sự giám sát và bảo hiểm rủi ro trực tiếp của cấp trên."
- "Trong các lĩnh vực rủi ro pháp lý hoặc an toàn sinh mạng đặc biệt, thẩm quyền cá nhân vẫn phải chịu sự kiểm soát chéo (Four-eyes Principle) dù người đó có năng lực rất cao."
applications:
  management:
  - "Thực hiện Kiểm toán Tam Hợp (R-C-A Audit) trước khi khiển trách cấp dưới: Khi một vị trí hoạt động kém hiệu quả, hãy kiểm tra xem lỗi nằm ở (1) Vai trò thiết kế quá ôm đồm bất khả thi, (2) Người ngồi chưa đủ tầm năng lực, hay (3) Họ bị trói tay không có thẩm quyền quyết định."
  - "Thiết kế Bảng Phân quyền (Delegation Matrix) đi kèm ngay trong Quyết định Bổ nhiệm, không bao giờ bổ nhiệm chức danh suông trên giấy."
  hiring:
  - "Tuyển dụng dựa trên Năng lực giải quyết bài toán thực tế của vai trò trong 12 tháng tới thay vì tuyển theo bằng cấp hào nhoáng hoặc thâm niên quá khứ."
risks:
- "Hiệu ứng Peter (The Peter Principle): Thăng chức cho một chuyên viên kỹ thuật giỏi lên làm Giám đốc Quản lý—nơi đòi hỏi năng lực lãnh đạo hoàn toàn khác—khiến công ty mất đi một kỹ sư giỏi và có thêm một giám đốc tồi."
- "Trao trách nhiệm ngàn cân nhưng chỉ trao quyền hạn sợi chỉ (Responsibility without Authority)."
- "Trao quyền lực tối thượng cho người có tài nhưng thiếu năng lực tự kiểm soát đạo đức và thiếu cơ chế hậu kiểm."
evidence:
  level: strong
  references:
  - "Hàn Phi Tử - Thiên Hình Danh & Bát Kinh (Nguyên lý 'Chức dữ năng tương xứng, quyền dữ trách tương đương' — Chức vụ phải khớp với tài năng thực tế, quyền hạn phải tương đương với trách nhiệm gánh vác)"
  - "Tuân Tử - Thiên Vương Bá & Quân Đạo (Luận về thuật lượng tài trao chức của bậc minh quân: 'Độ năng nhi thụ quan, xứng chức nhi nhậm sự')"
  - "Laurence J. Peter & Raymond Hull - The Peter Principle (1969 — Giải phẫu bi kịch tổ chức khi thăng chức con người vượt quá ngưỡng năng lực phù hợp của vai trò)"
  - "Elliott Jaques - Requisite Organization (Mô hình căn chỉnh giữa Độ phức tạp của Vai trò - Role Complexity, Năng lực nhận thức của Cá nhân - Individual Capability và Thẩm quyền tự quyết - Accountability/Authority)"
