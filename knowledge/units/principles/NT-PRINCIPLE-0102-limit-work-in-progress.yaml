mechanism:
- Đo lường số lượng công việc đang triển khai của từng đội ngũ và cá nhân.
- Xác định ngưỡng WIP tối đa cho phép dựa trên năng suất thực tế.
- Chặn nhận việc mới khi đạt ngưỡng cho tới khi hoàn thành việc đang làm.
- Ưu tiên hoàn thành hơn bắt đầu trong các quyết định điều phối.
- Theo dõi tác động lên thời gian hoàn thành và điều chỉnh ngưỡng.
