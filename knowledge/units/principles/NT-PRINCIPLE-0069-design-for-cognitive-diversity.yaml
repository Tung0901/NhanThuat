id: NT-PRINCIPLE-0069
type: principle
status: frozen
version: 0.2.0
title: Thiết kế cho đa dạng nhận thức
summary: Thiết kế nhóm làm việc có phổ nhận thức khác biệt để tăng khả năng giải quyết vấn đề phức tạp. Đa dạng nhận thức cần được thiết kế có chủ đích, không để tự phát.
primary_domain: hop-chung
secondary_domains:
- tri-nhan
definition: 'Thiết kế cho đa dạng nhận thức là nguyên tắc cấu trúc nhóm: chủ động bố trí các kiểu tư duy, kinh nghiệm và cách tiếp cận khác nhau vào nhóm giải quyết vấn đề, kèm cơ chế tích hợp các góc nhìn.'
conditions:
- Công việc có độ phức tạp và bất định cao.
- Nhóm có thời gian và nghi thức phù hợp để xử lý khác biệt.
exceptions:
- Công việc chuẩn hóa, quy trình cố định không cần phổ nhận thức rộng.
- Nhóm khẩn cấp ngắn hạn cần tốc độ hơn đa dạng góc nhìn.
applications:
  team-design:
  - Bố trí đa dạng kiểu tư duy cho các nhóm chiến lược và giải quyết vấn đề.
  - Bổ sung vai trò phản biện và tổng hợp vào nhóm tự quản.
  hiring:
  - Cân nhắc tính bổ trợ nhận thức khi tuyển vào nhóm hiện có.
  management:
  - Bảo vệ tiếng nói thiểu số trong các phiên thảo luận quan trọng.
risks:
- Đa dạng không có cơ chế tích hợp gây tê liệt quyết định.
- Lấy đa dạng hồ sơ thay cho đa dạng cách tư duy thực chất.
- Áp lực đồng thuận xóa dần khác biệt sau thời gian đầu.
evidence:
  level: supported
  references:
