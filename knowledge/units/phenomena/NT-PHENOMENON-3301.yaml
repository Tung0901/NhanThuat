id: NT-PHENOMENON-3301
type: phenomenon
title: Social Proof and Conformity
summary: Individuals look to the behavior of others to determine the correct behavior
  for themselves, particularly in ambiguous situations.
primary_domain: tri-nhan
domain_area: NT-DA-0029
definition: The psychological tendency to adopt the opinions, behaviors, and actions
  of the majority (or peers) as a heuristic for what is correct or appropriate.
mechanism:
- An individual encounters an ambiguous or high-pressure situation.
- They observe the actions or stated beliefs of the surrounding group.
- They align their own behavior to match, assuming the group possesses superior knowledge
  or to avoid social ostracization.
conditions:
- High uncertainty, ambiguity, or a strong desire for group acceptance.
exceptions:
- When the individual has overwhelming domain expertise and absolute certainty.
applications:
  marketing:
  - Highlighting that '90% of your peers use this product' is more effective than
    highlighting the product's features.
risks:
- Asch conformity—agreeing with an obviously wrong answer just to fit in, leading
  to disastrous strategic errors.
evidence:
  level: strong
  references:
  - Asch, S. E. (1951). 'Effects of group pressure upon the modification and distortion
    of judgments'.
  - 'Cialdini, R. B. (1984). ''Influence: The Psychology of Persuasion''.'
