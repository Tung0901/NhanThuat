id: NT-PRINCIPLE-0045
type: principle
status: frozen
version: 0.1.0
title: Hạ thấp mối đe dọa trước khi tìm kiếm sự thật
summary: Giảm mối đe dọa không cần thiết trước khi yêu cầu mọi người tiết lộ sai lầm, bất đồng, rủi ro hoặc sự không chắc chắn.
primary_domain: tri-nhan
secondary_domains:
- hop-chung
- dung-nhan
definition: Sự thẳng thắn trở nên khả thi hơn khi mọi người có thể nói sự thật mà không phải lo về sự bẽ mặt, trừng phạt hoặc loại trừ có thể tránh được.
mechanism:
- Gọi tên mục đích
- Bảo vệ phẩm giá
- Yêu cầu sự thật
- Phản hồi nhất quán.
conditions:
- Sự thật đang được cần đến
- Mọi người có thể cảm thấy bị phơi bày.
exceptions:
- Tổn hại nghiêm trọng có thể cần trách nhiệm giải trình ngay lập tức
- An toàn không thể có nghĩa là không có chuẩn mực.
applications:
  review:
  - Bắt đầu buổi hồi tố bằng việc tách học hỏi khỏi đổ lỗi.
  management:
  - Khen thưởng báo cáo rủi ro sớm.
risks:
- Nới lỏng chuẩn mực cần thiết
- Nhầm lẫn sự thoải mái với an toàn.
evidence:
