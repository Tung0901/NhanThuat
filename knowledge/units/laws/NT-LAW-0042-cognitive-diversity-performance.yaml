id: NT-LAW-0042
type: law
status: frozen
version: 0.2.0
title: Hiệu Suất Đa Dạng Nhận Thức
summary: Đa dạng về cách xử lý thông tin nâng cao chất lượng quyết định phức tạp khi được phối hợp đúng cách. Khác biệt nhận thức là nguồn lực, không phải trở ngại.
primary_domain: hop-chung
secondary_domains:
- tri-nhan
definition: 'Hiệu suất đa dạng nhận thức là quy luật về lợi ích của khác biệt trong cách tư duy: nhóm có phổ nhận thức rộng xử lý vấn đề bất định tốt hơn nhóm đồng nhất cùng năng lực.'
conditions:
- Công việc có độ phức tạp và bất định cao.
- Nhóm có cơ chế phối hợp và xử lý bất đồng hiệu quả.
exceptions:
- Công việc đơn giản, quy trình hóa cao không cần phổ nhận thức rộng.
- Khác biệt nhận thức không được điều phối có thể làm chậm quyết định.
applications:
  team-design:
  - Thiết kế nhóm giải bài toán khó với phổ kiểu tư duy khác nhau thay vì nhân bản một kiểu giỏi.
  - Phân vai phản biện và tổng hợp rõ ràng cho các phiên giải quyết vấn đề.
  management:
  - Bảo vệ người có góc nhìn thiểu số trong các cuộc thảo luận quan trọng.
  decision-making:
  - Yêu cầu ít nhất hai cách tiếp cận độc lập trước khi chốt phương án lớn.
risks:
- Nhầm đa dạng nhận thức với đa dạng hồ sơ hình thức.
- Khác biệt không được điều phối biến thành xung đột tiêu hao.
- Tiêu chuẩn nhóm thấp làm đa dạng trở thành bất đồng vô hiệu.
evidence:
