id: NT-PRINCIPLE-0023
type: principle
status: frozen
version: 0.1.0
title: Gìn giữ thể diện khi thay đổi lập trường
summary: Giúp con người điều chỉnh cam kết bằng cách trao cho họ một con đường đáng tin để thay đổi mà không bị sỉ nhục hay mất bản sắc không cần thiết.
primary_domain: tri-nhan
secondary_domains:
- hop-chung
- thanh-su
definition: Việc thay đổi lập trường trở nên dễ dàng hơn khi con người có thể giữ được phẩm giá, bản sắc và tính liên tục trong khi cập nhật phán đoán.
mechanism:
- Nhận diện rủi ro về bản sắc.
- Đưa ra cầu nối gìn giữ thể diện.
- Củng cố quyết định đã được cập nhật.
conditions:
- Lập trường gắn liền với bản sắc.
- Việc thay đổi là đáng mong muốn và khả thi.
exceptions:
- Tác hại nghiêm trọng có thể đòi hỏi trách nhiệm giải trình công khai.
- Một số người lợi dụng việc gìn giữ thể diện để trốn tránh trách nhiệm.
applications:
  negotiation:
  - Cho phép người khác cập nhật mà không cần tuyên bố thất bại.
  leadership:
  - Khen ngợi việc học hỏi thay vì việc đảo ngược.
risks:
- Bảo vệ cái tôi hơn sự thật.
- Trốn tránh trách nhiệm giải trình cần thiết.
evidence:
