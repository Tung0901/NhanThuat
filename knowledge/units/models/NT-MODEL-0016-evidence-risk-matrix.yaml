mechanism:
- Đánh giá mức mạnh của bằng chứng đang có cho quyết định.
- Đánh giá mức rủi ro và độ khó đảo ngược của quyết định.
- Định vị quyết định trên ma trận hai chiều.
- 'Áp dụng quy tắc tương ứng: hành động, thu thập thêm, leo thang thẩm quyền hoặc dừng lại.'
