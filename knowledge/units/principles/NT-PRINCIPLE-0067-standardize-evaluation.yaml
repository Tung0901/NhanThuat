mechanism:
- Xác định các chiều năng lực và hành vi cần đánh giá.
- Xây dựng thang đo và mô tả mức độ cụ thể cho từng chiều.
- Đào tạo người đánh giá cách sử dụng thang đo nhất quán.
- Kiểm tra phân bố kết quả định kỳ để phát hiện thiên kiến hệ thống.
