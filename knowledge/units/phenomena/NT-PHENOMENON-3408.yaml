id: NT-PHENOMENON-3408
type: phenomenon
title: Hiệu ứng Ben Franklin
summary: Một người đã giúp đỡ ai đó có xu hướng giúp đỡ người đó lần nữa nhiều hơn so với khi họ đã nhận được sự giúp đỡ từ người đó.
primary_domain: tri-nhan
domain_area: NT-DA-0030
definition: Một ứng dụng cụ thể của bất hòa nhận thức, trong đó một cá nhân hợp lý hóa hành vi giúp đỡ của chính mình bằng cách vô thức tự thuyết phục rằng chắc hẳn họ phải quý mến người mà họ đã giúp.
mechanism:
- Người A nhờ Người B một việc nhỏ, hợp lý.
- Người B đồng ý.
- 'Người B trải qua sự bất hòa: ''Tại sao tôi lại giúp người này? Chắc tôi thực sự quý họ.'''
- Thái độ của Người B đối với Người A trở nên rất tích cực.
conditions:
- Việc giúp đỡ phải mang tính cá nhân, không bị ép buộc và không được đền đáp (không có thanh toán).
exceptions:
- Nhờ một việc quá nặng nề, xúc phạm hoặc không phù hợp với sự chênh lệch quyền lực.
applications:
  relationship_building:
  - Nhờ một đồng nghiệp có thái độ thù địch một lời khuyên nhỏ để hóa giải sự thù địch và xây dựng sự thân thiết.
risks:
- Trông có vẻ kém năng lực hoặc hay phiền hà nếu lạm dụng.
evidence:
  level: strong
  references:
  - Jecker, J., & Landy, D. (1969). 'Liking a person as a function of doing him a favor'. Human Relations.
