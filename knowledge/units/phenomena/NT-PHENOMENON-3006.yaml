id: NT-PHENOMENON-3006
type: phenomenon
status: frozen
version: 0.1.0
title: Hiệu ứngỏm (Neo thông tin)
summary: Thông tin đầu tiên xuất hiện trong bối cảnh quyết định tạo ra ảnh hưởng lớn đến tất cả các đánh giá và ước tính tiếp theo.
primary_domain: tri-nhan
domain_area: NT-DA-0026
secondary_domains:
- thanh-su
definition: Một loại sai lệch nhận thức có cấu trúc, trong đó người ra quyết định vô thức phụ thuộc quá nhiều vào điểm tham chiếu ban đầu (điểm neo) khi ước tính giá trị, xác suất hoặc quy mô, và điều chỉnh không đủ từ điểm neo đó.
mechanism:
- Một con số, khái niệm hoặc khung tham chiếu ban đầu được giới thiệu vào môi trường.
- Bộ não sử dụng điểm neo này làm điểm khởi đầu cho việc đánh giá.
- Bộ não tìm kiếm lý do tại sao điểm neo có thể hợp lý.
- Quá trình điều chỉnh rời khỏi điểm neo kết thúc sớm ngay khi đạt đến ranh giới hợp lý.
conditions:
- Sự bất định hoặc mơ hồ cao về giá trị khách quan hoặc tính chân thực.
exceptions:
- Người ra quyết định có kiến thức vững chắc, đã được kiểm chứng thực nghiệm về giá trị thực tế.
applications:
  negotiation:
  - Thiết lập điểm neo ban đầu một cách có cân nhắc để định hình vùng thỏa thuận khả thi.
  estimation:
  - Yêu cầu các ước tính độc lập trước khi thảo luận về các con số theo nhóm nhằm ngăn chặn hiệu ứng neo.
risks:
- Bị thao túng bởi các con số tùy ý do đối thủ đặt ra.
evidence:
  level: strong
  references:
  - 'Tversky, A., & Kahneman, D. (1974). ''Judgment under Uncertainty: Heuristics and Biases''. Science.'
