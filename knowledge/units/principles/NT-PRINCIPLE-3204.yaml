id: NT-PRINCIPLE-3204
type: principle
title: Thói quen khả thi tối thiểu (Thói quen nhỏ)
summary: Thu nhỏ một hành vi mới mong muốn xuống phiên bản nhỏ đến mức phi lý, dễ thực hiện để đảm bảo sự kiên định.
primary_domain: tri-nhan
domain_area: NT-DA-0028
definition: Một chiến lược thiết kế hành vi bỏ qua nhu cầu động lực cao bằng cách làm cho hành vi mục tiêu nhỏ đến mức gần như không đòi hỏi năng lực hay nỗ lực nào.
mechanism:
- 'Xác định thói quen mục tiêu (ví dụ: đọc một cuốn sách mỗi tuần).'
- 'Thu nhỏ nó xuống hành động khả thi tối thiểu tuyệt đối (ví dụ: đọc một câu).'
- Thực hiện một cách kiên định.
- Một khi đường dẫn thần kinh được thiết lập, tự nhiên mở rộng hành vi.
conditions:
- Khi muốn xây dựng một thói quen hoàn toàn mới từ con số không trong cuộc sống bận rộn.
exceptions:
- 'Khi một hạn chót đòi hỏi khối lượng lớn ngay lập tức (ví dụ: nhồi nhét cho kỳ thi).'
applications:
  onboarding:
  - Yêu cầu người dùng mới chỉ hoàn thành một trường hồ sơ cực kỳ đơn giản thay vì một trình hướng dẫn 10 bước đồ sộ.
risks:
- Dậm chân tại chỗ ở phiên bản nhỏ và không bao giờ mở rộng lên mục tiêu thực sự.
evidence:
  level: strong
  references:
  - 'Fogg, B. J. (2019). ''Tiny Habits: The Small Changes That Change Everything''. Houghton Mifflin Harcourt.'
