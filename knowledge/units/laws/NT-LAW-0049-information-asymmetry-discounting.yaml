mechanism:
- Hai bên nắm mức độ thông tin không cân xứng về một giao dịch hoặc vấn đề.
- Bên thiếu thông tin không thể xác minh đầy đủ giá trị thông tin được trao.
- Bên thiếu thông tin chiết khấu giá trị đó theo mức nghi ngờ.
- Chiết khấu quá sâu khiến các phương án tốt bị loại bỏ hoặc đàm phán thất bại.
