id: NT-PRINCIPLE-0059
type: principle
status: frozen
version: 0.1.0
title: Phân biệt sự cấp bách với động lực bền vững
summary: Tránh nhầm lẫn các đợt nỗ lực ngắn hạn do khủng hoảng với động lực lành mạnh, bền vững khi lập kế hoạch cam kết của tổ chức.
primary_domain: tu-than
secondary_domains:
- tri-nhan
- dung-nhan
definition: Sự cấp bách ngắn hạn tiêu hao nguồn dự trữ; dựa vào chế độ khủng hoảng vĩnh viễn dẫn đến kiệt sức hệ thống thay vì sự gắn kết thực sự.
mechanism:
- Xác định nguồn động lực
- Tách đợt khủng hoảng khỏi mức nền
- Xây dựng nhịp bền vững
- Bảo vệ năng lượng dài hạn.
conditions:
- Nhóm thường xuyên đối mặt với áp lực hạn chót hoặc leo thang khẩn cấp.
exceptions:
- Tình huống khẩn cấp chiến lược thực sự cần huy động sự cấp bách ngắn hạn.
applications:
  planning:
  - Lên lịch giai đoạn phục hồi sau các đợt chạy nước rút hạn chót căng thẳng.
  leadership:
  - Từ chối vận hành ở chế độ khẩn cấp vĩnh viễn.
risks:
- Không phản hồi nhanh khi tình huống khẩn cấp thực sự xảy ra.
