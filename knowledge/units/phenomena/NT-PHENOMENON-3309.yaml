id: NT-PHENOMENON-3309
type: phenomenon
title: Lý thuyết so sánh xã hội
summary: Cá nhân xác định giá trị xã hội và giá trị cá nhân của chính mình dựa trên cách họ đứng vững so với người khác.
primary_domain: tri-nhan
domain_area: NT-DA-0029
definition: Động lực bên trong các cá nhân nhằm đạt được sự tự đánh giá chính xác bằng cách so sánh mình với người khác, sử dụng so sánh đi lên (để tạo động lực) hoặc so sánh đi xuống (để bảo vệ cái tôi).
mechanism:
- Các thước đo khách quan cho giá trị bản thân không tồn tại.
- Cá nhân xác định một nhóm tham chiếu đồng trang lứa.
- Cá nhân đánh giá đặc điểm, của cải hoặc thành công của mình so với nhóm cụ thể này.
conditions:
- Các tình huống thiếu tiêu chuẩn khách quan, rất phổ biến trong các thứ bậc địa vị và đàm phán lương thưởng.
exceptions:
- Các cá nhân đã áp dụng các khuôn khổ đánh giá nội tại nghiêm ngặt, khắc kỷ (stoic) hoặc dựa trên sự thuần thục tuyệt đối.
applications:
  motivation:
  - Công bố bảng xếp hạng của nhóm có thể thúc đẩy hiệu suất thông qua so sánh xã hội đi lên.
risks:
- Nhân viên mất động lực nghiêm trọng khi phát hiện một đồng nghiệp kiếm được nhiều hơn dù chỉ một chút, bất kể mức thu nhập tuyệt đối của chính họ.
evidence:
  level: strong
  references:
  - Festinger, L. (1954). 'A Theory of Social Comparison Processes'. Human Relations.
