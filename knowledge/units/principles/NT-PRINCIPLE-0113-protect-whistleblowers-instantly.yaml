id: NT-PRINCIPLE-0113
type: principle
status: frozen
version: 0.1.0
title: Bảo vệ người tố giác ngay lập tức
summary: Đảm bảo sự bảo vệ tuyệt đối về pháp lý, tài chính và thể chất cho những cá nhân báo cáo các vi phạm đạo đức nội bộ.
primary_domain: tu-than
secondary_domains:
- tri-nhan
definition: Người tố giác là hệ miễn dịch tối thượng của tổ chức. Hãy thiết lập các kênh báo cáo mã hóa, ẩn danh.
conditions:
- Quản trị doanh nghiệp và tuân thủ.
exceptions:
- Các cáo buộc sai trái có chủ đích ác ý đã được chứng minh.
applications:
  whistleblower_hotline:
  - Triển khai công cụ báo cáo mã hóa zero-knowledge trong BusinessOS.
risks:
- Xử lý các cáo buộc sai ẩn danh nhắm vào đồng nghiệp vô tội.
