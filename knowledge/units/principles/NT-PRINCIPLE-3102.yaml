id: NT-PRINCIPLE-3102
type: principle
title: Tận dụng cấu hình mặc định
summary: Đặt tùy chọn mặc định là lựa chọn tối ưu nhất về mặt xã hội hoặc hệ thống, vì phần lớn người dùng sẽ không bao giờ thay đổi nó.
primary_domain: tri-nhan
domain_area: NT-DA-0027
definition: Vận dụng thiên kiến hiện trạng theo hướng chỉ định bằng cách chọn sẵn tùy chọn được khuyến nghị trong bất kỳ hệ thống ra quyết định nào.
mechanism:
- Giá trị mặc định được coi là khuyến nghị ngầm từ người thiết kế kiến trúc lựa chọn.
- Việc thay đổi giá trị mặc định đòi hỏi nỗ lực nhận thức và gợi ra nỗi sợ mắc sai lầm.
- Do đó, giá trị mặc định hoạt động như một nam châm hành vi mạnh mẽ.
conditions:
- Các quyết định phức tạp khi người dùng thiếu sở thích hoặc chuyên môn vững chắc đã có từ trước.
exceptions:
- 'Các quyết định có hệ quả lớn, không thể đảo ngược, đòi hỏi sự đồng ý rõ ràng (ví dụ: xóa cơ sở dữ liệu).'
applications:
  security:
  - Đặt cấu hình bảo vệ quyền riêng tư và bảo mật làm trải nghiệm mặc định ngay khi sử dụng.
risks:
- Đặt các giá trị mặc định có hại khai thác sự lười biếng của người dùng.
evidence:
  level: strong
  references:
  - Johnson, E. J., & Goldstein, D. (2003). 'Do Defaults Save Lives?'. Science.
