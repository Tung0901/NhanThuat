id: NT-PHENOMENON-3311
type: phenomenon
title: Sự tuân phục quyền uy
summary: Xu hướng ăn sâu trong việc tuân thủ chỉ thị từ một nhân vật quyền lực, ngay cả khi những chỉ thị đó mâu thuẫn với lương tâm cá nhân.
primary_domain: tri-nhan
domain_area: NT-DA-0029
definition: Một đặc điểm hành vi trong đó các cá nhân nhường lại quyền hành động cá nhân và trách nhiệm đạo đức của mình cho một nhân vật quyền lực được nhận thức là hợp pháp.
mechanism:
- Một nhân vật quyền lực đưa ra mệnh lệnh.
- Cá nhân trải qua "sự chuyển dịch quyền chủ thể", tự xem mình chỉ là một công cụ thực hiện mong muốn của người có quyền lực.
- Trách nhiệm đạo đức được chuyển giao cho nhân vật quyền lực.
conditions:
- Nhân vật quyền lực được nhận thức là hợp pháp, có thẩm quyền và sẵn sàng chịu trách nhiệm về kết quả.
exceptions:
- Khi có các nhân vật quyền lực mâu thuẫn nhau, hoặc khi cá nhân bị tách rời về mặt thể chất khỏi nhân vật quyền lực.
applications:
  security:
  - 'Các cuộc tấn công kỹ thuật xã hội khai thác mạnh mẽ ảo tưởng về quyền uy (ví dụ: giả danh CEO) để vượt qua các quy trình bảo mật.'
risks:
- Nhân viên thực thi các chỉ thị doanh nghiệp bất hợp pháp hoặc phi đạo đức mà không thắc mắc ("Tôi chỉ làm theo lệnh").
evidence:
  level: strong
  references:
  - Milgram, S. (1963). 'Behavioral Study of Obedience'. Journal of Abnormal and Social Psychology.
