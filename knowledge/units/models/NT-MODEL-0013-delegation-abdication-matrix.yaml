mechanism:
- Đánh giá mức tự chủ thực tế đang được trao cho người nhận.
- Đánh giá mức hỗ trợ và giám sát đang được cung cấp kèm.
- Định vị từng quan hệ giao việc trên ma trận hai chiều.
- Điều chỉnh về vùng ủy quyền lành mạnh phù hợp năng lực người nhận.
