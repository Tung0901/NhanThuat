id: NT-MODEL-3402
type: model
title: Thuyết Tiêm chủng Tâm lý
summary: Con người có thể được tạo miễn dịch trước các đòn tấn công thuyết phục và tin giả bằng cách chủ động tiếp xúc trước với phiên bản suy yếu của luận điểm đối lập.
primary_domain: tri-nhan
domain_area: NT-DA-0030
definition: 'Mô hình tâm lý học về khả năng kháng cự sự thuyết phục, vận hành tương tự cơ chế vắc-xin sinh học: việc tiếp xúc với liều lượng nhỏ của luận điểm đối lập sẽ kích hoạt hệ miễn dịch nhận thức xây dựng các cơ chế phòng thủ.'
mechanism:
- Đưa ra một phiên bản suy yếu, dễ bị phản bác của lập luận phía đối thủ (đóng vai trò như 'vi-rút').
- Cung cấp sẵn các luận điểm phản bác sắc bén (đóng vai trò như 'kháng thể').
- Khi đối tượng tiếp xúc với luận điểm hoàn chỉnh của đối thủ về sau, họ sẽ phản xạ bác bỏ luận điểm đó dựa trên hệ thống phòng thủ đã chuẩn bị.
conditions:
- Khi cần bảo vệ thương hiệu, hệ tư tưởng hoặc tổ chức trước các cuộc tấn công truyền thông dữ dội đã được dự báo trước.
exceptions:
- Khi luận điểm 'suy yếu' ban đầu được trình bày quá mức thuyết phục, vô tình khiến đối tượng bị thuyết phục thay vì được tạo miễn dịch.
applications:
  politics:
  - '''Đối thủ sẽ nói với quý vị rằng chính sách này làm tăng thuế. Nhưng điều họ không nói là chính sách này xóa bỏ hoàn toàn các loại phí ẩn, giúp quý vị tiết kiệm tiền về tổng thể.'''
risks:
- 'Hiệu ứng phản tác dụng: vô tình tạo diễn đàn lan truyền các thông tin sai lệch nguy hiểm mà đối tượng mục tiêu trước đó chưa từng biết đến.'
evidence:
  level: strong
  references:
  - McGuire, W. J. (1961). 'The effectiveness of supportive and behavioral defenses in immunizing against persuasion'. Sociometry.
