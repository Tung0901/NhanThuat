id: NT-MODEL-0014
type: model
status: frozen
version: 0.2.0
title: Mô hình Truyền thông Vòng lặp Kín
summary: Mô hình truyền thông yêu cầu vòng phản hồi kín từ người nhận trở lại người gửi để xác nhận thông điệp được hiểu đúng. Giao tiếp một chiều tạo khoảng trống sai lệch.
primary_domain: tri-nhan
secondary_domains:
- hop-chung
definition: 'Mô hình Truyền thông Vòng lặp Kín là khung thiết kế giao tiếp gồm bốn khối nối tiếp: mã hóa, truyền tải, giải mã và phản hồi xác nhận, trong đó khối phản hồi bắt buộc khép kín vòng lặp để điều chỉnh sai lệch.'
conditions:
- Thông điệp quan trọng hoặc có độ phức tạp cao.
- Có kênh phản hồi khả dụng giữa các bên.
exceptions:
- Thông báo một chiều đơn giản không cần vòng phản hồi đầy đủ.
- Kênh truyền đạt theo quy định không cho phép phản hồi trực tiếp.
applications:
  communication:
  - Thiết kế mọi giao tiếp quan trọng kèm cơ chế xác nhận hai chiều.
  - Yêu cầu người nhận trình bày lại cách hiểu của mình.
  management:
  - Kiểm tra mức độ hiểu thực tế sau khi giao việc quan trọng.
  process-design:
  - Tích hợp bước phản hồi bắt buộc vào quy trình chuyển giao thông tin.
risks:
- Phản hồi hình thức không phản ánh cách hiểu thật.
- Vòng lặp kín bị bỏ qua trong giao tiếp văn bản quan trọng.
- Quá tải phản hồi làm chậm các kênh thông tin đơn giản.
evidence:
  level: supported
  references:
