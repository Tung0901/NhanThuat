id: NT-MODEL-0031
type: model
status: frozen
version: 0.1.0
title: Ma trận Rào chắn Đạo đức
summary: Mô hình 2x2 đánh giá các quyết định dựa trên mức độ Bất đối xứng Rủi ro và Tính minh bạch về Ý định.
primary_domain: tu-than
secondary_domains:
- hop-chung
definition: 'Ma trận Rào chắn Đạo đức phân loại các lựa chọn vận hành: Trao đổi Công bằng, Bóc lột Trục lợi, Đàm phán Mập mờ, Nghĩa vụ Chăm sóc có Kiểm soát.'
mechanism:
- Đánh giá mức độ Bất đối xứng Rủi ro.
- Đánh giá Tính minh bạch về Ý định.
- Phân loại vào góc phần tư tương ứng.
- Ngăn chặn các lựa chọn mang tính Bóc lột Trục lợi.
conditions:
- Kiểm toán quyết định từ AI và rà soát mô hình kinh doanh.
exceptions:
- Không có.
applications:
  ai_audit:
  - Kiểm toán các mô hình gợi ý của AI nhằm ngăn chặn các hành vi mang tính bóc lột trục lợi.
risks:
- Phân loại nhầm các khoản đầu tư rủi ro cao hợp pháp thành hành vi bóc lột trục lợi.
evidence:
