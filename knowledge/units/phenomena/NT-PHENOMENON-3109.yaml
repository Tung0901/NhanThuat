id: NT-PHENOMENON-3109
type: phenomenon
title: Hiệu ứng mồi nhử (Thống trị bất đối xứng)
summary: Sở thích giữa hai lựa chọn thay đổi đáng kể khi xuất hiện một lựa chọn thứ ba, rõ ràng kém hơn (mồi nhử).
primary_domain: tri-nhan
domain_area: NT-DA-0027
definition: Một thiên kiến nhận thức, trong đó sự hiện diện của một lựa chọn bị thống trị bất đối xứng làm tăng sức hấp dẫn của lựa chọn thống trị, vi phạm tính độc lập của các phương án thay thế không liên quan.
mechanism:
- Người ra quyết định gặp khó khăn khi so sánh các lựa chọn có các thuộc tính mâu thuẫn nhau.
- Một mồi nhử được đưa ra, tương tự nhưng kém hơn hẳn Phương án A.
- Mồi nhử cung cấp một điểm chuẩn rõ ràng để so sánh, khiến Phương án A trông vượt trội hơn.
conditions:
- 'Các lựa chọn liên quan đến nhiều thuộc tính (ví dụ: giá và chất lượng) nơi việc cân nhắc đánh đổi khó tính toán.'
exceptions:
- Khi người ra quyết định có các thuật toán định giá đã tính sẵn một cách chặt chẽ.
applications:
  pricing:
  - Trình bày ba bậc giá, trong đó bậc giữa đẩy người mua về bậc cao cấp.
risks:
- Bị các cấu trúc định giá của nhà cung cấp thao túng để mua vượt nhu cầu.
evidence:
  level: strong
  references:
  - Huber, J., Payne, J. W., & Puto, C. (1982). 'Adding asymmetrically dominated alternatives'. Journal of Consumer Research.
