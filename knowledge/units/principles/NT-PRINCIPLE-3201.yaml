id: NT-PRINCIPLE-3201
type: principle
title: Công cụ ràng buộc cam kết
summary: Chủ động giới hạn các lựa chọn trong tương lai để ngăn bản thân hành động trái với lợi ích dài hạn.
primary_domain: tri-nhan
domain_area: NT-DA-0028
definition: Một thỏa thuận được thiết lập ở hiện tại nhằm hạn chế các hành động trong tương lai của bản thân để giảm thiểu tác động của thiên kiến hiện tại hoặc cám dỗ được dự báo trước.
mechanism:
- Thừa nhận điểm yếu trong tương lai (thiên kiến hiện tại).
- Thiết lập một ràng buộc hoặc hình phạt cố định (tài chính, xã hội hoặc vật lý) trong trạng thái tỉnh táo, lý trí.
- Khi cám dỗ xuất hiện trong tương lai, công cụ nâng cái giá của việc khuất phục lên một cách giả tạo, buộc phải tuân thủ.
conditions:
- Khi thiên kiến hiện tại mạnh và cá nhân có nhận thức về nó.
exceptions:
- Các môi trường nơi tính linh hoạt là cần thiết về mặt chiến lược để sống sót qua các sự kiện thiên nga đen.
applications:
  savings:
  - Tự động chuyển 10% tiền lương vào một tài khoản bị khóa trước khi nó chạm vào tài khoản vãng lai.
risks:
- Tự ràng buộc quá mức và không thể tiếp cận nguồn lực trong những trường hợp khẩn cấp thực sự.
evidence:
  level: strong
  references:
  - Thaler, R. H., & Benartzi, S. (2004). 'Save More Tomorrow'. Journal of Political Economy.
