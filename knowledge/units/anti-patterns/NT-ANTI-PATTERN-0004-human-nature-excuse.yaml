id: NT-ANTI-PATTERN-0004
type: anti-pattern
status: frozen
version: 0.1.0
title: Lấy bản tính con người làm cớ
summary: Một mô hình độc hại trong đó việc viện dẫn bản tính con người được dùng để bào chữa cho sự cưỡng ép, thái độ hoài nghi tiêu cực, tiêu chuẩn thấp hoặc tổn hại có thể tránh được.
primary_domain: tri-nhan
secondary_domains:
- tu-than
- hop-chung
definition: Tri thức về Bản tính Con người trở nên độc hại khi các thiên hướng bị coi là định mệnh hoặc là cái cớ để thao túng người khác.
mechanism:
- Nêu ra một thiên hướng
- Coi đó là điều bất biến
- Bào chữa cho sự kiểm soát
- Né tránh trách nhiệm
conditions:
- Một cá nhân sử dụng việc khái quát hóa hành vi để tước bỏ quyền tự quyết
- Phẩm giá
- Hoặc rào cản đạo đức.
exceptions:
- Các giới hạn thực tế vẫn cần được xem xét khi thiết kế hệ thống
- Lòng trắc ẩn có thể đòi hỏi sự điều chỉnh kỳ vọng cho phù hợp.
applications:
  ethics:
  - Đặt câu hỏi xem một thiên hướng của con người đang được tôn trọng hay bị lợi dụng.
  leadership:
  - Vận dụng Bản tính Con người để thiết kế các điều kiện tốt hơn
  - Không phải để bào chữa cho sự tổn hại.
risks:
- Chủ nghĩa định mệnh
- Thao túng tâm lý
- Sự bất lực do tập nhiễm
