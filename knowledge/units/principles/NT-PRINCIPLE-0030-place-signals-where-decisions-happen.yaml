id: NT-PRINCIPLE-0030
type: principle
status: review
version: 0.1.0
title: Place signals where decisions happen
summary: Put the most important cues, standards, and constraints at the point where people actually choose.
primary_domain: thanh-su
secondary_domains: [dung-nhan, tri-nhan]
definition: Guidance works better when it is visible at the moment of decision rather than stored far from action.
mechanism: [Locate decision point, Identify needed signal, Place cue or standard there.]
conditions: [Decisions repeat, People may forget or overlook distant guidance.]
exceptions: [Sensitive decisions may need private preparation, Too many signals can create noise.]
applications: {operations: [Put quality checks at handoff points.], management: [Make standards visible in workflow.]} 
risks: [Cluttering work with reminders, Treating signage as training.]
evidence: {level: provisional, references: []}
relations: {supports: [], conflicts_with: [], depends_on: [NT-LAW-0017, NT-LAW-0006], applies_to: []}
tags: [signals, decisions, workflow]
