mechanism:
- Xác định hệ giá trị và tiêu chuẩn xử lý bất biến cần giữ.
- Quan sát phong cách tiếp nhận thông tin của từng đối tượng.
- Điều chỉnh cách truyền đạt cho phù hợp mà không thay đổi bản chất nội dung.
- Kiểm tra định kỳ xem sự thích ứng có làm trôi lệch chuẩn mực hay không.
