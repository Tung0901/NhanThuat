title: Bẫy sức hút cá nhân
summary: Đơn vị tri thức cấu trúc về Bẫy sức hút cá nhân trong quản trị và lãnh đạo tổ chức.
primary_domain: tri-nhan
secondary_domains:
- dung-nhan
definition: Định nghĩa chính thức về Bẫy sức hút cá nhân (Charismatic Trap) trong kiến trúc Nhân Thuật.
conditions:
- Bối cảnh quản trị vận hành.
exceptions:
- Các trường hợp đè quyền trong khủng hoảng khẩn cấp.
applications:
  governance:
  - Áp dụng Bẫy sức hút cá nhân vào quy trình làm việc của tổ chức.
risks:
- Áp dụng sai Bẫy sức hút cá nhân dẫn đến hiệu suất không đạt mức tối ưu.
