id: NT-PRINCIPLE-0007
type: principle
status: review
version: 0.1.0
title: Align measures with values
summary: If a value matters, ensure the system's measures, rewards, and review rhythms do not teach people to neglect it.
primary_domain: thanh-su
secondary_domains: [hop-chung, dung-nhan]
definition: Values become operational when measures and reinforcement make them visible in recurring decisions.
mechanism: [Name the value, Compare it with measures and rewards, Adjust reinforcement to support the value.]
conditions: [The value affects repeated work, Measures influence decisions.]
exceptions: [Some values resist simple measurement, Over-measurement can distort judgment.]
applications: {governance: [Review whether metrics contradict stated principles.], leadership: [Recognize behavior that protects non-obvious values.]} 
risks: [Reducing values to metrics, Rewarding performance theater.]
