id: NT-PRINCIPLE-0098
type: principle
status: frozen
version: 0.1.0
title: Minimize Positional Override
summary: Avoid overriding delegated decisions unless a fundamental boundary, safety,
  or strategic violation has occurred.
primary_domain: dung-nhan
secondary_domains:
- tri-nhan
definition: Frequently overriding a delegate's decision destroys their sense of agency.
conditions:
- Executive oversight of delegated teams.
exceptions:
- High-risk errors carrying existential consequence.
applications:
  leadership_coaching:
  - Coach executives to support subordinate choices even when suboptimal.
risks:
- Allowing catastrophic errors to proceed to avoid overriding.
evidence:
  level: supported
  references:
  - EV-REQ-0013-01
relations:
  supports: []
  conflicts_with: []
  depends_on:
  - NT-LAW-0065
  applies_to: []
tags:
- authority
- override
- delegation
