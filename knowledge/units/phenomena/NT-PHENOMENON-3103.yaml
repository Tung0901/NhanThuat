id: NT-PHENOMENON-3103
type: phenomenon
title: Hiệu ứng sở hữu
summary: Cá nhân định giá cao hơn các món đồ chỉ vì họ sở hữu chúng.
primary_domain: tri-nhan
domain_area: NT-DA-0027
definition: Hệ quả trực tiếp của ác cảm mất mát, trong đó mức bồi thường tối thiểu mà một người yêu cầu để rời bỏ món đồ họ đang sở hữu luôn lớn hơn mức giá tối đa họ sẵn sàng trả để mua nó.
mechanism:
- Quyền sở hữu được thiết lập (dù chỉ trong chốc lát).
- Món đồ được tích hợp vào điểm tham chiếu.
- Việc từ bỏ nó được nhìn nhận như một sự mất mát, kích hoạt ác cảm mất mát.
conditions:
- Các món đồ không phải là hàng hóa trao đổi thuần túy về chức năng (như tiền).
exceptions:
- Các loại token, tiền tệ hoặc món đồ chỉ nhằm mục đích bán lại.
applications:
  product_design:
  - Dùng thử miễn phí tạo ra cảm giác sở hữu về mặt tâm lý, tăng tỷ lệ giữ chân khi kết thúc thời gian dùng thử.
risks:
- Định giá quá cao các hệ thống kế thừa hoặc công cụ nội bộ chỉ vì tổ chức đã tự xây dựng chúng.
evidence:
  level: strong
  references:
  - Thaler, R. (1980). 'Toward a positive theory of consumer choice'. Journal of Economic Behavior & Organization.
