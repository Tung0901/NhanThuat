mechanism:
- Phân tích dòng công việc để tìm điểm giao thoa thực chất giữa các vai trò.
- Thiết kế sản phẩm bàn giao chung buộc phải phối hợp.
- Định nghĩa quyền truy cập thông tin và nguồn lực chia sẻ.
- Đo lường kết quả hợp tác bên cạnh kết quả cá nhân.
