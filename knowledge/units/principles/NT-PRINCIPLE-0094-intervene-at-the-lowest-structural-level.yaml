id: NT-PRINCIPLE-0094
type: principle
status: frozen
version: 0.2.0
title: Can thiệp ở cấp cấu trúc thấp nhất
summary: Giải quyết xung đột trực tiếp giữa các bên liên quan chính trước khi leo thang lên cấp lãnh đạo điều hành.
primary_domain: hop-chung
secondary_domains:
- tri-nhan
definition: Leo thang sớm lên cấp quyền lực cao hơn tạo ra sự phụ thuộc và làm suy yếu khả năng tự quản của đội ngũ.
conditions:
- Các tranh chấp giữa cá nhân hoặc giữa các phòng ban.
exceptions:
- Quấy rối hoặc vi phạm đạo đức đòi hỏi phải leo thang tới bộ phận nhân sự ngay lập tức.
applications:
  management:
  - Từ chối hòa giải tranh chấp giữa hai bên ngang hàng cho đến khi cả hai đã tổ chức buổi gặp trực tiếp.
risks:
- Buộc nhân viên cấp thấp phải trực tiếp giải quyết tranh chấp với cấp trên quá khắt khe.
evidence:
  level: supported
  references:
  - EV-REQ-0011-01
relations:
  supports: []
  conflicts_with: []
  depends_on:
  - NT-LAW-0063
  applies_to: []
tags:
- conflict
- resolution
- escalation
- self-governance
- decentralization
created_at: '2026-07-22'
updated_at: '2026-09-14'
mechanism:
- Khi phát sinh xung đột, xác định cấp thấp nhất có đủ thẩm quyền giải quyết.
- Khuyến khích các bên trực tiếp trao đổi và tự tìm phương án.
- Chỉ leo thang khi vấn đề vượt quá thẩm quyền hoặc ảnh hưởng rộng.
- Ghi nhận cách giải quyết để tái sử dụng cho tình huống tương tự.
- Tránh leo thang sớm làm suy yếu năng lực tự quản của đội ngũ.
