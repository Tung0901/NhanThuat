id: NT-PRINCIPLE-3401
type: principle
title: Tương phản nhận thức
summary: Luôn trình bày tùy chọn đắt nhất, cực đoan nhất hoặc khó nhất trước để thay đổi điểm neo, khiến các tùy chọn tiếp theo có vẻ nhỏ hơn hoặc rẻ hơn đáng kể.
primary_domain: tri-nhan
domain_area: NT-DA-0030
definition: Một nguyên tắc tâm lý-vật lý nền tảng được áp dụng trong bán hàng và đàm phán, khẳng định rằng nhận thức của con người mang tính tương đối; trọng lượng chủ quan của một mặt hàng được đánh giá mạnh mẽ dựa trên mặt hàng ngay trước nó.
mechanism:
- Trình bày một mặt hàng có giá cao (bộ vest 2.000 USD).
- Đối tượng mục tiêu thích nghi với điểm neo cao.
- Trình bày một phụ kiện có giá vừa phải (cà vạt 150 USD).
- Trong cái bóng của 2.000 USD, cà vạt 150 USD có vẻ rẻ và nhỏ bé theo cảm nhận chủ quan, thúc đẩy việc mua hàng.
conditions:
- Việc trình bày phải tuần tự (lần lượt từng cái) và ngay lập tức.
exceptions:
- Nếu tùy chọn đầu tiên cao đến mức thiên văn khiến phá vỡ niềm tin hoặc bị coi như một trò đùa.
applications:
  sales:
  - Môi giới bất động sản cho xem một căn nhà "dàn dựng" tệ hại, giá trên trời trước khi cho xem căn nhà mục tiêu, khiến căn nhà này bỗng dưng trông như một món hời phi thường.
risks:
- Làm những khách hàng nhạy cảm về giá sợ hãi ngay trước khi họ nhìn thấy các lựa chọn thực sự.
evidence:
  level: strong
  references:
  - 'Cialdini, R. B. (1984). ''Influence: The Psychology of Persuasion''.'
