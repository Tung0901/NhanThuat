id: NT-LAW-0051
type: law
status: frozen
version: 0.1.0
title: Niềm tin nền tảng từ tính khả đoán
summary: Đơn vị tri thức cấu trúc về niềm tin nền tảng được thiết lập dựa trên tính nhất quán và khả đoán.
primary_domain: hop-chung
secondary_domains:
- tri-nhan
definition: Định nghĩa chuẩn tắc về niềm tin nền tảng từ tính khả đoán trong cấu trúc Nhân Thuật.
conditions:
- Bối cảnh quản trị vận hành tổ chức.
exceptions:
- Cơ chế can thiệp ưu tiên trong tình trạng khủng hoảng khẩn cấp.
applications:
  governance:
  - Ứng dụng nguyên lý niềm tin nền tảng từ tính khả đoán vào quy trình làm việc tổ chức.
risks:
- Áp dụng sai nguyên lý niềm tin nền tảng từ tính khả đoán dẫn đến suy giảm hiệu suất tổ chức.
