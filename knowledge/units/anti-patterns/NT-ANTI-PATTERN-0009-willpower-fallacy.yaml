id: NT-ANTI-PATTERN-0009
type: anti-pattern
status: frozen
version: 0.1.0
title: Willpower fallacy in trait mismatch
summary: Attribuing performance or behavioral slips caused by chronic trait-role mismatch and high adaptation costs to a lack of motivation, character, or willpower.
primary_domain: tri-nhan
secondary_domains: [tu-than, dung-nhan]
definition: A management failure mode that ignores systemic adaptation costs, expecting employees to indefinitely override their stable defaults through sheer effort and self-discipline.
mechanism:
  - Place individual in a role with high mismatch between defaults and expectations.
  - Expect continuous behavioral modification without task or environmental adjustment.
  - Accumulate chronic self-regulation fatigue and emotional exhaustion.
  - Blame the subsequent drop in performance or behavioral slips on lack of willpower or poor attitude.
conditions:
  - Management expects continuous behavior adaptation without task or environment redesign.
exceptions:
  - Short-term crisis situations where temporary masking is necessary and supported.
applications:
  review: [Audit performance reviews to ensure employees are not penalized for default styles when skills and outcomes are correct.]
  role-design: [Redesign high-friction tasks to lower adaptation costs rather than demanding increased willpower.]
risks:
  - Lowering standard competence requirements under the guise of accommodating traits.
