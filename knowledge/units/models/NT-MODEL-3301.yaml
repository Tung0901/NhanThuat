id: NT-MODEL-3301
type: model
title: Thuyết bản sắc xã hội
summary: Cảm nhận của một cá nhân về bản thân dựa trên nhóm mà họ thuộc về, từ đó thúc đẩy sự thiên vị nhóm trong và phân biệt đối xử với nhóm ngoài.
primary_domain: tri-nhan
domain_area: NT-DA-0029
definition: Khung lý thuyết nền tảng trong tâm lý học xã hội giải thích cách quá trình tự phân loại nhận thức dẫn đến nhu cầu cảm xúc muốn đề cao nhóm của mình hơn các nhóm khác.
mechanism:
- 'Phân loại: Chúng ta phân loại các đối tượng và con người để thấu hiểu họ.'
- 'Định danh xã hội: Chúng ta tiếp nhận bản sắc của nhóm mà mình tự xếp bản thân vào.'
- 'So sánh xã hội: Chúng ta so sánh nhóm của mình với các nhóm khác nhằm duy trì lòng tự trọng.'
conditions:
- 'Bất kỳ môi trường nào tồn tại nhiều phân nhóm riêng biệt (ví dụ: Đội ngũ Kỹ thuật vs Đội ngũ Kinh doanh).'
exceptions:
- Những cá nhân có tính chủ nghĩa cá nhân cực kỳ cao và kháng cự mọi sự phân loại nhóm.
applications:
  organizational_design:
  - Luân chuyển nhân viên qua các phòng ban khác nhau nhằm mở rộng bản sắc xã hội của họ gắn liền với toàn bộ công ty, giúp giảm thiểu xung đột giữa các phòng ban.
risks:
- Tạo ra tâm lý 'chúng ta đối đầu với họ' dẫn đến chủ nghĩa bè phái độc hại.
evidence:
  level: strong
  references:
  - Tajfel, H., & Turner, J. C. (1979). 'An integrative theory of intergroup conflict'. The social psychology of intergroup relations.
