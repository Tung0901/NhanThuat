mechanism:
- Một chủ thể được đánh giá mức phù hợp với vai trò dựa trên dữ liệu sẵn có.
- Dữ liệu đánh giá thường nghiêng về biểu hiện bề mặt trong bối cảnh có kiểm soát.
- Môi trường làm việc thực tế đặt ra yêu cầu khác với bối cảnh đánh giá.
- Khoảng cách giữa dự đoán và thực tế chuyển thành chi phí thích ứng do sai lệch.
