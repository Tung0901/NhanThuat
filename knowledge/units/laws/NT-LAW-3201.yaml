created_at: '2026-08-15'
updated_at: '2026-09-14'
mechanism:
- Người mua tiếp nhận sản phẩm qua bối cảnh, câu chuyện và kỳ vọng cảm xúc.
- Não bộ định giá dựa trên so sánh tương đối và cảm giác nhận được.
- Giá trị cảm nhận cao hoặc thấp được hình thành trước khi xem chi tiết.
- Giá trị cảm nhận dẫn dắt hành vi mua và mức sẵn sàng chi trả.
- Chi phí cấu thành hữu hình được người mua chiết khấu hoặc bù đắp thông qua cảm nhận về mức độ giải tỏa rủi ro.
content: "### 1. Cơ chế Hình thành Giá trị Cảm nhận\n**Quy luật Giá trị Cảm nhận** (`NT-LAW-3201`) phản\
  \ ánh hiện tượng người mua đánh giá sản phẩm thông qua khung tham chiếu bối cảnh, tín hiệu uy tín và\
  \ mức giải tỏa lo âu hơn là chỉ cộng dồn chi phí sản xuất vật lý. Trong kinh tế học hành vi, Richard\
  \ Thaler (1985) phân tách tổng hữu dụng thành *hữu dụng thu nhận* (acquisition utility) và *hữu dụng\
  \ giao dịch* (transaction utility): mức sẵn sàng chi trả phụ thuộc mạnh vào điểm neo tham chiếu mà bối\
  \ cảnh giao dịch thiết lập.\n\n### 2. Điều kiện áp dụng & Ngoại lệ\n- **Điều kiện áp dụng:**\n  - Giao\
  \ dịch có độ bất đối xứng thông tin cao hoặc chất lượng khó kiểm định ngay trước khi sử dụng (dịch vụ\
  \ tư vấn, phần mềm doanh nghiệp, sản phẩm trải nghiệm).\n  - Người mua chịu áp lực trách nhiệm giải\
  \ trình trước tập thể và cần tín hiệu giảm rủi ro tâm lý.\n- **Ngoại lệ:**\n  - Hàng hóa tiêu chuẩn\
  \ hóa (commodity) có thông số kỹ thuật minh bạch, mua sắm qua đấu thầu định lượng hoặc hợp đồng kỳ hạn.\n\
  \  - Bối cảnh người mua có quy trình kiểm thử kỹ thuật độc lập (blind testing) tách rời thương hiệu\
  \ khỏi hiệu năng thực tế.\n\n### 3. Mức bất định & Rủi ro diễn giải sai\n- **Mức bất định:** Trung bình\
  \ (phụ thuộc vào độ trưởng thành thông tin của thị trường và tần suất lặp lại giao dịch). Hiệu ứng bối\
  \ cảnh mạnh ở lần mua đầu nhưng suy giảm nhanh ở các chu kỳ gia hạn nếu hiệu năng vận hành thực tế không\
  \ đáp ứng kỳ vọng.\n- **Rủi ro diễn giải sai:**\n  - Nhầm lẫn quy luật này thành lời khuyên coi nhẹ\
  \ chất lượng cốt lõi để tập trung vào hình thức bề ngoài.\n  - Áp dụng định giá cảm xúc vào nhóm khách\
  \ hàng kỹ thuật chuyên sâu khiến đối tác nghi ngờ tính minh bạch.\n\n### 4. Nguồn truy nguyên & Đối\
  \ chiếu Đông - Tây\n- **Nguồn truy nguyên:** Kết hợp thực nghiệm thần kinh học tiêu dùng (Plassmann\
  \ et al., 2008), lý thuyết kế toán tâm lý (Thaler, 1985) và quan sát thực hành định vị của Rory Sutherland\
  \ (2019).\n- **Đối chiếu cổ điển `[Classical Analogy]`:** Chiến Quốc Sách (tích *Sở vương hiếu tế yêu* và\
  \ tích *Bá Nhạc xem ngựa*) chỉ ra rằng giá trị trao đổi trên thị trường biến thiên theo tín hiệu thẩm\
  \ định của người có uy tín và bối cảnh khan hiếm, nhưng về dài hạn vẫn phải chịu sự kiểm chứng của công\
  \ năng thực tế (*Hàn Phi Tử — Công Danh*).\n"
