id: NT-PRINCIPLE-0106
type: principle
status: frozen
version: 0.2.0
title: Rút ngắn chu kỳ phản hồi
summary: Chia nhỏ các sáng kiến phức tạp để nhận dữ liệu giám sát từ thực thi thực tế sớm nhất có thể.
primary_domain: tri-nhan
secondary_domains:
- thanh-su
definition: Xây dựng các phép thử nhỏ và phát hành sớm để thu thập dữ liệu giám sát thực tế từ khách hàng trước khi đầu tư nguồn lực khổng lồ.
conditions:
- Phát triển sản phẩm và thử nghiệm chiến lược.
exceptions:
- Các dự án xây dựng vốn lớn không thể chia nhỏ.
applications:
  mvp-testing:
  - Phát hành các tính năng nguyên mẫu tối thiểu để kiểm chứng các giả định cốt lõi về khách hàng.
risks:
- Phát hành nguyên mẫu chưa trau chuốt làm tổn hại danh tiếng thương hiệu.
evidence:
  level: supported
  references:
  - EV-REQ-0018-01
relations:
  supports: []
  conflicts_with: []
  depends_on:
  - NT-LAW-0071
  applies_to: []
tags:
- learning
- feedback
- probes
- mvp
- iteration
- telemetry
created_at: '2026-07-22'
updated_at: '2026-09-14'
mechanism:
- Chia nhỏ sáng kiến thành các phần có thể kiểm chứng độc lập.
- Phát hành phiên bản đầu tiên sớm cho nhóm người dùng nhỏ.
- Thu thập dữ liệu giám sát từ thực tế sử dụng.
- Điều chỉnh hướng đầu tư dựa trên bằng chứng thu được.
- Mở rộng dần khi tín hiệu thực tế xác nhận giả định.
