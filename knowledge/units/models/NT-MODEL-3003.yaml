id: NT-MODEL-3003
type: model
status: frozen
version: 0.1.0
title: Vòng lặp Điều hòa Siêu nhận thức
summary: Mô hình cấu trúc về cách con người giám sát, đánh giá và điều chỉnh các quá trình cùng chiến lược nhận thức của chính mình trong các nhiệm vụ phức tạp.
primary_domain: tri-nhan
domain_area: NT-DA-0026
secondary_domains:
- tu-than
definition: 'Siêu nhận thức bao gồm hai tầng riêng biệt: tầng sơ cấp nơi nhận thức diễn ra (thực thi nhiệm vụ) và tầng siêu cấp nơi chủ thể quan sát và định hướng nhận thức sơ cấp (tự điều hòa).'
mechanism:
- Chủ thể lựa chọn chiến lược nhận thức trước khi thực hiện nhiệm vụ (Lập kế hoạch).
- Chủ thể quan sát tiến độ và mức độ thấu hiểu của chính mình trong quá trình thực hiện nhiệm vụ (Giám sát).
- Chủ thể so sánh trạng thái hiện tại với mục tiêu đề ra (Đánh giá).
- Chủ thể điều chỉnh chiến lược, giảm tốc độ hoặc chuyển đổi trọng tâm nếu đi chệch hướng (Điều hòa).
conditions:
- Tải lượng nhận thức cao hoặc xuất hiện các thách thức mới lạ, phi thường quy.
exceptions:
- Các nhiệm vụ thường nhật, hoàn toàn tự động hóa không kích hoạt tầng siêu cấp.
applications:
  learning:
  - Đào tạo cá nhân không chỉ về kỹ năng mà còn về cách họ tự giám sát quá trình tiếp thu kỹ năng đó.
risks:
- Quá tải nhận thức khiến tầng siêu cấp ngừng hoạt động, giam cầm chủ thể trong một chiến lược thất bại.
evidence:
  level: supported
  references:
  - 'Nelson, T. O., & Narens, L. (1990). ''Metamemory: A theoretical framework and new findings''. The Psychology of Learning and Motivation.'
