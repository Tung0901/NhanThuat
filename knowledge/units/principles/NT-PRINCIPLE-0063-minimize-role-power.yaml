id: NT-PRINCIPLE-0063
type: principle
status: frozen
version: 0.2.0
title: Giảm thiểu quyền lực vai trò
summary: Giảm sự phụ thuộc vào quyền lực gắn với chức danh bằng cách chuyển ảnh hưởng sang năng lực, cấu
  trúc và tiêu chí khách quan. Quyền lực vị trí càng ít bị dùng làm công cụ, tổ chức càng giảm rủi ro
  điểm mù và đề kháng giả tạo.
primary_domain: dung-nhan
secondary_domains:
- tri-nhan
definition: Giảm thiểu quyền lực vai trò là nguyên tắc thiết kế tổ chức nhằm hạn chế việc dùng vị trí
  chức danh làm nguồn tác động chính; thay vào đó, ảnh hưởng được dựa trên năng lực đã chứng minh, luận
  cứ và cơ chế ra quyết định minh bạch.
conditions:
- Tổ chức có phân cấp chức danh nhưng công việc đòi hỏi phán đoán chuyên môn.
- Tồn tại cơ chế ghi nhận đóng góp ngoài thứ bậc.
exceptions:
- Tình huống khẩn cấp cần chuỗi chỉ huy rõ ràng và tập trung quyền quyết định.
- Vai trò chịu trách nhiệm pháp lý bắt buộc gắn với quyền quyết định tương ứng.
applications:
  organization-design:
  - Thiết kế quyền quyết định theo loại công việc thay vì mặc định theo cấp bậc.
  - Bổ sung vai trò chuyên môn có tiếng nói chính thức trong các quyết định kỹ thuật.
  governance:
  - Rà soát định kỳ ma trận quyền hạn để loại bỏ quyền lực không còn cần thiết.
  leadership:
  - Chủ động hạ thấp giọng nói quyền lực trong thảo luận để khuyến khích phản biện.
risks:
- Làm mờ trách nhiệm khi quyền hạn không đi kèm trách nhiệm giải trình rõ ràng.
- Kéo dài thời gian ra quyết định do phải đồng thuận rộng.
- Tạo khoảng trống quyền lực cho nhóm lợi ích ngầm chi phối.
evidence:
  level: supported
  references:
  - '[Nghiên cứu thực nghiệm] Edmondson, A. (1999). Psychological safety and learning behavior in work
    teams. Administrative Science Quarterly, 44(2), 350-383 (Tác động của chênh lệch quyền lực lên sự
    cởi mở thông tin và học hỏi nhóm).'
  - '[Nghiên cứu thực nghiệm] French, J. R., & Raven, B. (1959). The bases of social power. In D. Cartwright
    (Ed.), Studies in Social Power (pp. 150-167). University of Michigan Press.'
  - '[Nguồn cổ điển] Tư Mã Quang — Tư Trị Thông Giám (Điển tích Đường Thái Tông chủ động tiết chế uy quyền
    thiên tử để mở đường can gián cho Ngụy Trưng).'
  - '[Suy luận biên tập] Thiết kế quy tắc phát biểu và trọng số chuyên môn trong hội đồng.'
