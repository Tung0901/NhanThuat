mechanism:
- Xác định mục đích chung có thể công khai của tình huống.
- Kiểm tra xem nỗ lực ảnh hưởng có phục vụ mục đích đó hay chỉ lợi ích một bên.
- Điều chỉnh cách tiếp cận để lợi ích các bên được xem xét.
- Minh bạch ý định khi cần để duy trì niềm tin dài hạn.
