id: NT-PRINCIPLE-0054
type: principle
status: frozen
version: 0.1.0
title: Tránh dùng mối đe dọa cho công việc sáng tạo
summary: Đừng dựa vào sợ hãi, áp lực hoặc bất an để tạo động lực cho các nhiệm vụ cần đổi mới, giải quyết vấn đề hoặc hợp tác cởi mở.
primary_domain: tu-than
secondary_domains:
- tri-nhan
- hop-chung
definition: Mối đe dọa thu hẹp sự tập trung nhận thức về tự vệ, chặn đứng sự linh hoạt nhận thức cần thiết cho việc giải quyết vấn đề sáng tạo.
mechanism:
- Loại bỏ tín hiệu đe dọa
- Thiết lập an toàn cho thử nghiệm
- Kích hoạt sự tập trung khám phá
- Tạo ra giải pháp đổi mới.
conditions:
- Công việc liên quan đến giải quyết vấn đề phức tạp, thiết kế mới hoặc phân tích rủi ro hệ thống.
exceptions:
- Thực thi ranh giới đạo đức hoặc quy tắc an toàn không khoan nhượng có thể cần cảnh báo hậu quả nghiêm khắc.
applications:
  leadership:
  - Phân biệt chuẩn mực cao với áp lực gây sợ hãi.
  culture:
  - Bảo vệ an toàn tâm lý trong các giai đoạn khám phá.
risks:
- Hạ thấp chuẩn mực hiệu suất dưới chiêu bài loại bỏ áp lực.
