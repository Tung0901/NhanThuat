id: NT-ANTI-PATTERN-0001
type: anti-pattern
status: frozen
version: 0.1.0
title: Truth under threat
summary: A harmful pattern where people are asked for honesty while the environment punishes exposure, doubt, or bad news.
primary_domain: tri-nhan
secondary_domains: [hop-chung, dung-nhan]
definition: Truth-seeking fails when the social or organizational context makes truth feel unsafe to speak.
mechanism: [Ask for truth, Signal punishment, People conceal, Leaders misread silence.]
conditions: [Power imbalance exists, bad news is costly, prior candor was punished.]
exceptions: [Formal investigations may require constrained disclosure, some risks require protected channels.]
applications: {review: [Audit whether bad news has been punished.], leadership: [Create protected channels before demanding candor.]}
risks: [Rewarding irresponsibility, confusing anonymous complaint with verified truth.]
evidence: {level: provisional, references: []}
relations: {supports: [], conflicts_with: [], depends_on: [NT-LAW-0025], applies_to: []}
tags: [anti-pattern, truth, threat]
