mechanism:
- Một vai trò được giao quyền hạn dựa trên vị trí.
- Khoảng cách về thời gian, thông tin hoặc địa lý so với điểm ra quyết định thực tế tăng lên.
- Người trực tiếp vận hành tích lũy thông tin cục bộ và khả năng điều chỉnh thực tế.
- Quyền lực thực tế chuyển dần sang người kiểm soát thông tin và nguồn lực vận hành.
