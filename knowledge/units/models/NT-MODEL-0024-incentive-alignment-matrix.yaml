id: NT-MODEL-0024
type: model
status: frozen
version: 0.1.0
title: Ma trận căn chỉnh động lực khuyến khích
summary: Một khung phân tích 2x2 lập bản đồ giữa Độ tương thích của chỉ số và Sự gắn kết nội tại nhằm phân loại tình trạng sức khỏe của hệ thống đãi ngộ trong tổ chức.
primary_domain: tu-than
secondary_domains:
- hop-chung
definition: 'Ma trận căn chỉnh động lực khuyến khích biểu diễn các cấu trúc khen thưởng theo hai trục: Độ tương thích của chỉ số và Sự gắn kết nội tại.'
mechanism:
- Đánh giá độ tương thích của chỉ số (Metric Congruence).
- Đánh giá sự gắn kết động lực nội tại (Intrinsic Alignment).
- Phân loại góc phần tư tương ứng.
- Chuyển dịch hướng tới góc phần tư Cao/Cao.
conditions:
- Thiết kế lại cơ cấu đãi ngộ, lập kế hoạch hoa hồng bán hàng hoặc đánh giá OKR.
exceptions:
- Các hoạt động thiện nguyện tự nguyện phi công việc.
applications:
  compensation_audit:
  - Đánh giá các kế hoạch hoa hồng để loại bỏ nguy cơ lách luật tiêu cực (Toxic Gaming).
risks:
- Chẩn đoán sai năng lực kém của nhân viên thành lỗi sai cấu trúc trong ma trận khuyến khích.
evidence:
  level: supported
