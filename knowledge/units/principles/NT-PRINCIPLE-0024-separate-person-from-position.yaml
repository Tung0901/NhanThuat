id: NT-PRINCIPLE-0024
type: principle
status: frozen
version: 0.1.0
title: Tách con người khỏi lập trường
summary: Thách thức một lập trường theo cách không buộc người đó phải bảo vệ toàn bộ bản sắc của mình.
primary_domain: tri-nhan
secondary_domains:
- hop-chung
- tu-than
definition: Con người dễ xem lại ý tưởng hơn khi lời phê bình nhắm vào luận điểm, bằng chứng hoặc sự đánh đổi thay vì giá trị của bản thân họ.
mechanism:
- Nêu tên lập trường.
- Tách nó khỏi bản sắc.
- Đánh giá bằng chứng và hệ quả.
conditions:
- Vấn đề có thể thảo luận được.
- Mối đe dọa về bản sắc sẽ chặn việc học hỏi.
exceptions:
- Trách nhiệm giải trình theo vai trò có thể đòi hỏi nhận lỗi trực tiếp.
- Hành vi gây hại có thể cần được nêu tên mạnh mẽ hơn.
applications:
  conversation:
  - Hỏi điều gì sẽ làm thay đổi quan điểm.
  leadership:
  - Thách thức suy luận mà không tấn công địa vị.
risks:
- Tránh né trách nhiệm giải trình khó khăn.
- Làm mềm sự thật đến mức mơ hồ.
