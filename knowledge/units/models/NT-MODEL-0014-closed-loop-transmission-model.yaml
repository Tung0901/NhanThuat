mechanism:
- Người gửi mã hóa thông điệp theo ý định và ngữ cảnh của mình.
- Thông điệp được truyền qua kênh với các nhiễu tiềm ẩn.
- Người nhận giải mã và hình thành cách hiểu riêng.
- Người nhận phản hồi lại cách hiểu để người gửi kiểm tra và điều chỉnh.
