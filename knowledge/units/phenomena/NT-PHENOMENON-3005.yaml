id: NT-PHENOMENON-3005
type: phenomenon
status: frozen
version: 0.1.0
title: Sự ác cảm với mơ hồ
summary: Con người luôn ưu tiên rủi ro đã biết hơn sự bất định chưa rõ, thường chọn phương án kém hơn để tránh sự mơ hồ.
primary_domain: tri-nhan
domain_area: NT-DA-0026
secondary_domains:
- thanh-su
definition: Khi đối mặt với sự lựa chọn giữa xác suất đã biết và xác suất chưa biết, những người ra quyết định có xu hướng cấu trúc ưu tiên phương án đã biết, ngay cả khi giá trị kỳ vọng thấp hơn.
mechanism:
- Tác nhân gặp phải một tùy chọn bị thiếu thông tin hoặc có xác suất chưa được xác định rõ.
- Bộ não xử lý sự mơ hồ như một mối đe dọa tiềm ẩn.
- Phản ứng né tránh kích hoạt sở thích đối với các lựa chọn có rủi ro tính toán được.
conditions:
- Các lựa chọn bao gồm các mức độ thiếu thông tin khác nhau.
exceptions:
- Những cá nhân có đặc điểm thích rủi ro cao hoặc ở trong hoàn cảnh tuyệt vọng có thể tìm kiếm sự mơ hồ.
applications:
  negotiation:
  - Giảm bớt sự mơ hồ cho đối, tác để làm cho các thỏa thuận trở nên dễ chấp nhận hơn.
  change-management:
  - Trạng thái hiện tại thường được ưa chuộng đơn giản vì những rủi ro của nó đã được biết rõ.
risks:
- Quá tập trung vào các số liệu đo lường được trong khi bỏ qua các cơ hội mơ hồ nhưng có tiềm năng cao.
evidence:
  level: supported
  references:
  - Ellsberg, D. (1961). 'Risk, Ambiguity, and the Savage Axioms'. The Quarterly Journal of Economics.
