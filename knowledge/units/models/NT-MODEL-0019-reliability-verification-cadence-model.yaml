id: NT-MODEL-0019
type: model
status: frozen
version: 0.2.0
title: Mô hình nhịp độ xác minh độ tin cậy
summary: Mô hình xác định nhịp độ xác minh tương ứng với mức độ tin cậy của từng đối tượng, giảm dần kiểm tra khi độ tin cậy tăng và tăng lại khi có dấu hiệu suy giảm. Nhịp độ đúng giúp cân bằng rủi ro và hiệu quả.
primary_domain: dung-nhan
secondary_domains:
- hop-chung
definition: 'Mô hình nhịp độ xác minh độ tin cậy là khung thiết kế tần suất và mức độ kiểm tra theo ba biến: mức rủi ro của hoạt động, lịch sử độ tin cậy của đối tượng, và chi phí của việc xác minh.'
conditions:
- Quan hệ hợp tác kéo dài với nhiều chu kỳ bàn giao.
- Có thể đo lường kết quả của các lần xác minh trước đó.
exceptions:
- Hoạt động thuộc diện bắt buộc kiểm tra định kỳ theo quy định pháp lý.
- Đối tượng mới chưa có lịch sử cần nhịp độ xác minh dày ban đầu.
applications:
  governance:
  - Thiết kế lịch kiểm tra theo mức rủi ro và lịch sử tuân thủ.
  - Điều chỉnh tần suất hậu kiểm dựa trên dữ liệu vi phạm.
  operations:
  - Giảm kiểm tra ở khâu ổn định và tập trung nguồn lực vào khâu rủi ro cao.
  partnership:
  - Điều chỉnh mức độ xác minh đối tác theo lịch sử hợp tác.
risks:
- Giảm nhịp xác minh quá nhanh khiến rủi ro tích tụ ngầm.
- Duy trì nhịp kiểm tra dày đặc làm xói mòn quan hệ tin cậy.
- Dữ liệu lịch sử bị đọc sai dẫn tới nhịp độ không phù hợp.
evidence:
  level: supported
  references:
  - EV-REQ-0001-01
