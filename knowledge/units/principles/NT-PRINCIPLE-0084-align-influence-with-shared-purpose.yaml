id: NT-PRINCIPLE-0084
type: principle
status: frozen
version: 0.2.0
title: Căn chỉnh ảnh hưởng với mục đích chung
summary: Ảnh hưởng chỉ bền vững khi phục vụ mục đích chung thay vì lợi ích riêng. Căn chỉnh ảnh hưởng với mục đích chung tạo đồng thuận tự nguyện.
primary_domain: tri-nhan
secondary_domains:
- hop-chung
definition: 'Căn chỉnh ảnh hưởng với mục đích chung là nguyên tắc đạo đức và thực tiễn: mọi nỗ lực tác động người khác phải hướng tới mục tiêu mà các bên liên quan cùng chia sẻ hoặc có thể chấp nhận công khai.'
conditions:
- Tồn tại mục tiêu chung hoặc có thể xây dựng mục tiêu chung.
- Mối quan hệ ảnh hưởng có tính lặp lại hoặc dài hạn.
exceptions:
- Tình huống cạnh tranh chính danh như đàm phán mua bán có xung đột lợi ích hợp pháp.
- Can thiệp bảo vệ bên yếu thế có thể không được bên gây hại đồng thuận.
applications:
  leadership:
  - Trình bày rõ mục đích chung khi vận động thay đổi.
  - Kiểm tra tính chính đáng của mục tiêu trước khi dùng ảnh hưởng thuyết phục.
  negotiation:
  - Xây khung lợi ích chung trước khi thương lượng các điểm chia rẽ.
  communication:
  - Công khai ý định và mục tiêu để tránh bị nhận diện là thao túng.
risks:
- Dùng ngôn ngữ mục đích chung để che giấu lợi ích riêng.
- Mục đích chung mơ hồ không đủ để dẫn dắt hành động.
- Áp đặt định nghĩa mục đích chung theo quan điểm một bên.
evidence:
  level: supported
  references:
  - EV-REQ-0001-01
