id: NT-PRINCIPLE-0031
type: principle
status: frozen
version: 0.1.0
title: Chuyển dịch góc nhìn giữa các vai trò
summary: Trong công việc liên vai trò, hãy nêu rõ điều mỗi vai trò nhìn thấy, rủi ro đảm nhận, sở hữu và không thể nhìn thấy.
primary_domain: hop-chung
secondary_domains:
- dung-nhan
- tri-nhan
definition: Việc chuyển dịch giảm ma sát bằng cách làm lộ góc nhìn được định hình bởi vai trò trước khi mọi người coi điểm mù là ý đồ xấu.
mechanism:
- Xác định góc nhìn vai trò
- Gọi tên mối quan tâm nhìn thấy và không nhìn thấy
- Chuyển dịch các ràng buộc giữa các vai trò.
conditions:
- Nhiều vai trò cùng hợp tác
- Mỗi vai trò đối mặt với động lực hoặc thông tin khác nhau.
exceptions:
- Bàn giao đơn giản có thể không cần chuyển dịch
- Ý đồ xấu vẫn cần trách nhiệm giải trình.
applications:
  teamwork:
  - Hỏi từng vai trò họ đang quản lý rủi ro nào.
  management:
  - Dùng đánh giá liên vai trò cho ma sát lặp lại.
risks:
- Tạo ra việc nhìn nhận góc nhìn vô tận
- Bào chữa cho giao tiếp kém.
evidence:
