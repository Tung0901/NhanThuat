id: NT-PRINCIPLE-0007
type: principle
status: frozen
version: 0.1.0
title: Căn chỉnh thước đo với giá trị
summary: Nếu một giá trị quan trọng, hãy đảm bảo các thước đo, phần thưởng và nhịp đánh giá của hệ thống không khiến con người xao nhãng giá trị đó.
primary_domain: thanh-su
secondary_domains:
- hop-chung
- dung-nhan
definition: Giá trị trở nên vận hành được khi thước đo và sự củng cố làm cho chúng hiện hữu trong các quyết định lặp lại.
mechanism:
- Nêu tên giá trị.
- So sánh giá trị đó với thước đo và phần thưởng.
- Điều chỉnh sự củng cố để ủng hộ giá trị.
conditions:
- Giá trị ảnh hưởng đến công việc lặp lại.
- Thước đo tác động đến quyết định.
exceptions:
- Một số giá trị kháng lại việc đo lường đơn giản.
- Đo lường quá mức có thể bóp méo phán đoán.
applications:
  governance:
  - Rà soát xem chỉ số có mâu thuẫn với các nguyên tắc đã công bố hay không.
  leadership:
  - Ghi nhận hành vi bảo vệ các giá trị không dễ thấy.
risks:
- Quy giản giá trị thành chỉ số.
- Khen thưởng sự trình diễn hiệu quả.
