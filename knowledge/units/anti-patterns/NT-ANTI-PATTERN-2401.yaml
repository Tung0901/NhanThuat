id: NT-ANTI-PATTERN-2401
type: anti-pattern
status: frozen
version: 1.0.0
title: Điểm lỗi đơn lẻ
summary: Sự phụ thuộc hoàn toàn vào một nhân sự, tài nguyên hoặc quy trình duy nhất trong tổ chức.
primary_domain: hop-chung
domain_area: NT-DA-0024
secondary_domains:
- thanh-su
definition: Việc tập trung hóa quá mức nhằm tối ưu hóa chi phí ngắn hạn, vô tình tạo ra một điểm nghẽn có nguy cơ làm tê liệt toàn bộ hệ thống khi xảy ra sự cố.
mechanism:
- Giao quyền quyết định hoặc kiểm soát cốt lõi cho một nút thắt duy nhất.
- Thiếu hoạt động đào tạo chéo (cross-training) và chia sẻ kiến thức giữa các thành viên.
conditions:
- Bất kỳ tổ chức hoặc quy trình vận hành nào thiếu cơ chế dự phòng và nhân sự thay thế.
exceptions:
- Các vị trí chuyên môn hóa sâu nhưng không nằm trong chuỗi vận hành cốt lõi hoặc dễ dàng thay thế.
applications:
  management:
  - Thực hiện luân chuyển công việc định kỳ và xây dựng tài liệu quy trình chuẩn (SOP).
risks:
- Nguy cơ sụp đổ hoặc đình trệ toàn bộ hệ thống ngay lập tức khi nhân sự chủ chốt rời đi hoặc gặp sự cố.
