id: NT-LAW-0070
type: law
status: frozen
version: 0.1.0
title: Sự phụ thuộc giữa Học hỏi và An toàn tâm lý
summary: Tốc độ học hỏi của tổ chức bị giới hạn nghiêm ngặt bởi mức độ an toàn tâm lý của các kênh báo cáo lỗi.
primary_domain: tri-nhan
secondary_domains:
- hop-chung
definition: Khi tin xấu hoặc thất bại trong thực thi bị trừng phạt, nhân viên sẽ che giấu sai sót, từ đó phá hủy dữ liệu đo lường cần thiết cho việc học hỏi.
conditions:
- Phân tích rút kinh nghiệm sự cố và cải tiến chất lượng.
exceptions:
- Hành vi cố ý phá hoại có chủ đích.
applications:
  blameless_reviews:
  - Tiến hành đánh giá sự cố không đổ lỗi, tập trung vào thiết kế hệ thống.
risks:
- Nhầm lẫn giữa an toàn tâm lý với việc thiếu các tiêu chuẩn hiệu suất.
evidence:
  level: supported
  references:
