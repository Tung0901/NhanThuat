id: NT-ANTI-PATTERN-0038
type: anti-pattern
status: frozen
version: 0.1.0
title: Nhượng bộ Cưỡng ép
summary: Đơn vị tri thức cấu trúc về hiện tượng nhượng bộ do bị cưỡng ép trong quản trị tổ chức.
primary_domain: thanh-su
secondary_domains:
- dung-nhan
definition: Định nghĩa chính thức về Nhượng bộ Cưỡng ép (Coerced Concession) trong kiến trúc Nhân Thuật, mô tả hành vi dùng áp lực ép buộc đối phương đưa ra sự nhượng bộ ngoài ý muốn.
conditions:
- Bối cảnh quản trị vận hành tổ chức.
exceptions:
- Các trường hợp ghi đè trong khủng hoảng khẩn cấp.
applications:
  governance:
  - Ánh xạ và nhận diện hiện tượng Nhượng bộ Cưỡng ép trong quy trình làm việc của tổ chức.
risks:
- Nhận diện sai hoặc áp dụng sai khái niệm Nhượng bộ Cưỡng ép dẫn đến hiệu suất vận hành không tối ưu.
