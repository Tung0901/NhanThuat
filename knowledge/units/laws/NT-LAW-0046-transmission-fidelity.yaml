id: NT-LAW-0046
type: law
status: frozen
version: 0.2.0
title: Độ trung thực truyền tải
summary: Độ chính xác của thông tin suy giảm qua mỗi chặng truyền. Nhiễu tích lũy theo số lớp trung gian và khoảng cách quyền lực giữa người gửi và người nhận.
primary_domain: tri-nhan
secondary_domains:
- hop-chung
definition: 'Độ trung thực truyền tải là quy luật về suy giảm chất lượng thông tin trong chuỗi truyền đạt: mỗi lần chuyển tiếp làm mất mát hoặc bóp méo một phần nội dung gốc.'
conditions:
- Thông tin đi qua nhiều lớp trung gian trước khi tới người quyết định.
- Có khác biệt quyền lực hoặc lợi ích giữa các chặng truyền.
exceptions:
- Kênh truyền trực tiếp hoặc ghi nhận nguyên văn giữ được độ trung thực cao.
- Tiêu chuẩn truyền đạt viết và phản hồi xác nhận hai chiều giảm thất thoát.
applications:
  communication:
  - Giảm số lớp trung gian cho thông tin quan trọng.
  - Yêu cầu xác nhận hai chiều bằng cách để người nhận diễn giải lại.
  governance:
  - Dùng kênh báo cáo trực tiếp cho tin xấu quan trọng.
  operations:
  - Chuẩn hóa mẫu ghi nhận hiện trường gốc trước khi tổng hợp.
risks:
- Ra quyết định trên thông tin đã bị bóp méo qua nhiều lớp.
- Tin xấu bị làm mềm dẫn tới phản ứng chậm với khủng hoảng.
- Trách nhiệm không truy được nguồn gốc khi sai lệch tích lũy.
