id: NT-PRINCIPLE-0058
type: principle
status: frozen
version: 0.1.0
title: Lower friction before demanding willpower
summary: Reduce procedural, technical, and cognitive obstacles before expecting individuals to overcome demotivation through increased willpower.
primary_domain: tu-than
secondary_domains: [thanh-su, tri-nhan]
definition: System friction consumes cognitive energy; removing friction increases effective motivation without increasing human strain.
mechanism: [Identify execution bottlenecks, Simplify workflow steps, Reduce cognitive load, Enable smooth effort flow.]
conditions: [Work environment contains high administrative or technical friction.]
exceptions: [Deliberate friction can be useful to prevent accidental high-risk errors.]
applications: {process-improvement: [Eliminate redundant approvals and tool friction.], leadership: [Audit workflow pain points before blaming employee engagement.]}
risks: [Removing necessary validation steps in pursuit of zero friction.]
evidence: {level: provisional, references: []}
relations: {supports: [], conflicts_with: [], depends_on: [NT-LAW-0029, NT-LAW-0027], applies_to: []}
tags: [motivation, principle, friction, willpower, load]
