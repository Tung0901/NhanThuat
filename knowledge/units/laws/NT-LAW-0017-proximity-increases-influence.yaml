id: NT-LAW-0017
type: law
status: frozen
version: 1.0.0
title: "Quy luật độ gần tâm lý quyết định trọng lượng ảnh hưởng"
summary: "Con người bị chi phối mạnh mẽ hơn gấp bội bởi những con người, tín hiệu và hệ quả có sự gần gũi trực tiếp về mặt thời gian, không gian vật lý, mối quan hệ thân sơ hoặc sự sống động thị giác so với những mục tiêu trừu tượng xa xôi."
primary_domain: tri-nhan
secondary_domains:
- hop-chung
- thanh-su
definition: "Trong tâm lý học tiến hóa và kinh tế học hành vi, bộ não con người được thiết kế để ưu tiên sinh tồn trước những mối đe dọa hoặc phần thưởng ngay trước mắt (Here and Now). Một lợi ích nhỏ nhưng nhận được ngay hôm nay, một lời nói của người ngồi ngay bên cạnh, hoặc một sự cố nhìn thấy tận mắt sẽ tạo ra lực thúc đẩy hành vi lớn hơn rất nhiều so với một mục tiêu chiến lược vĩ đại nhưng nằm ở 3 năm sau hoặc một chỉ thị văn bản gửi từ trụ sở cách xa hàng ngàn cây số."
mechanism:
- "Chiết khấu theo khoảng cách (Psychological Distance Discounting): Não bộ tự động giảm trừ trọng số quan trọng của một sự kiện theo 4 chiều khoảng cách: Thời gian (Temporal), Không gian (Spatial), Quan hệ xã hội (Social) và Xác suất (Hypothetical)."
- "Chiếm quyền ưu tiên của tín hiệu gần: Những yêu cầu trước mắt, tiếng chuông điện thoại, hoặc thái độ của người quản lý trực tiếp ngay tại phòng làm việc lập tức lấn át các mục tiêu dài hạn."
- "Thiên kiến thân cận (Proximity Bias): Người lãnh đạo có xu hướng đánh giá cao và tin tưởng những nhân sự thường xuyên xuất hiện trong tầm mắt mình hơn những người làm việc âm thầm ở chi nhánh xa."
- "Rút ngắn khoảng cách nhận thức: Muốn một mục tiêu chiến lược xa xôi có sức nặng hành động, phải kéo nó lại gần bằng cách chia nhỏ thành hệ quả ngay trong ngày hôm nay và đặt tín hiệu nhắc nhở ngay tại điểm thao tác."
- "Thiết kế đối trọng chống thiên kiến gần: Xây dựng cơ chế đánh giá dựa trên dữ liệu đầu ra khách quan để bảo vệ công bằng cho các đơn vị ở xa trung tâm quyền lực."
conditions:
- "Cá nhân phải lựa chọn phân bổ thời gian và nguồn lực giữa các nhiệm vụ khẩn cấp trước mắt và các mục tiêu quan trọng dài hạn."
- "Tổ chức hoạt động phân tán qua nhiều địa điểm, chi nhánh hoặc nhiều tầng quản lý trung gian."
- "Hệ thống thiếu các cơ chế neo buộc mục tiêu dài hạn vào hành động hàng ngày."
exceptions:
- "Những cá nhân có tầm nhìn chiến lược xuất chúng và kỷ luật tự thân cao có khả năng duy trì trọng số ưu tiên cho các mục tiêu thập kỷ bất chấp cám dỗ ngắn hạn."
- "Khi một rủi ro ở xa nhưng mang tính chất hủy diệt toàn diện được mô phỏng sống động trước mắt, nó có thể vượt qua thiên kiến khoảng cách."
applications:
  communication:
  - "Cụ thể hóa và kéo gần mục tiêu chiến lược: Thay vì nói 'Năm sau công ty cần giảm 10% tỷ lệ rời bỏ của khách hàng', hãy đưa toàn bộ ban lãnh đạo đến ngồi nghe trực tiếp cuộc gọi của một khách hàng đang bức xúc hủy hợp đồng ngay hôm nay."
  management:
  - "Đặt tín hiệu điều hướng ngay tại Điểm Quyết Định (Point-of-Decision Prompts): Đặt bảng tiêu chuẩn kiểm tra ngay trên bàn thao tác của công nhân thay vì cất trong tủ hồ sơ phòng Nhân sự."
  - "Thực hành Quản trị Hiện trường (Gemba Walk): Lãnh đạo định kỳ rời phòng máy lạnh xuống trực tiếp công trường và các chi nhánh xa để xóa bỏ khoảng cách không gian và quyền lực."
risks:
- "Bẫy Khẩn cấp nuốt chửng Quan trọng (The Eisenhower Trap): Cả công ty quay cuồng chữa cháy các việc vặt trước mắt mỗi ngày mà bỏ mặc các dự án nền tảng quyết định sự sống còn."
- "Thiên vị người ở gần (In-group / Proximity Favoritism): Thăng chức và thưởng lớn cho những kẻ khéo léo hay lượn lờ quanh phòng sếp, làm nản lòng những tướng lĩnh đang trấn giữ biên ải xa xôi."
- "Bị thao túng bởi những hiệu ứng trình diễn hào nhoáng bề nổi nhưng rỗng tuếch về giá trị dài hạn."
evidence:
  level: strong
  references:
  - "Hàn Phi Tử - Thiên Bát Thuyết & Cô Phẫn (Cảnh báo cạm bẫy của người cầm quyền: Thường dễ bị mê hoặc bởi lời nói ngọt ngào của đám cận thần hầu hạ ngay bên cạnh mỗi ngày mà nghi ngờ những bậc pháp thuật chi sĩ đang làm việc thực chất ở xa)"
  - "Tôn Tử Binh Pháp - Thiên Tác Chiến & Cửu Địa (Hiểu rõ tâm lý binh sĩ chỉ cảm nhận sâu sắc những hiểm nguy và phần thưởng hiện hữu ngay trước mắt tại chiến trường)"
  - "Yaacov Trope & Nira Liberman - Construal Level Theory of Psychological Distance (Lý thuyết Mức độ Kiến tạo Nhận thức: Khoảng cách thời gian, không gian và xã hội làm biến đổi hoàn toàn cách con người đánh giá và hành động)"
  - "George Ainslie - Picoeconomics & Hyperbolic Discounting (Lý thuyết Chiết khấu Hyperbolic trong kinh tế học hành vi: Con người đánh giá một phần thưởng nhỏ ngay hôm nay cao hơn vô lý so với phần thưởng lớn vào năm sau)"
