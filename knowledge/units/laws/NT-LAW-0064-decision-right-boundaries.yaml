id: NT-LAW-0064
type: law
status: frozen
version: 0.2.0
title: Ranh giới Quyền Quyết định
summary: Sự mơ hồ trong quyền quyết định chính thức làm gia tăng ma sát phối hợp trong tổ chức và gây ra tình trạng tê liệt quyết định.
primary_domain: dung-nhan
secondary_domains:
- hop-chung
definition: Các ranh giới rõ ràng xác định ai là người nắm giữ quyền quyết định chính thức là cần thiết để ngăn ngừa xung đột ranh giới quyền lực và sự tê liệt trong vận hành.
conditions:
- Thiết kế các cấp bậc quản lý và cấu trúc quản trị.
exceptions:
- Môi trường khởi nghiệp linh hoạt hoạt động dựa trên các vai trò không chính thức và mang tính ứng phó.
applications:
  governance:
  - Công bố ma trận quyền quyết định rõ ràng cho các sáng kiến chiến lược.
risks:
- Quy định quá chi tiết quyền quyết định đến mức tạo ra các rào cản phòng ban cứng nhắc.
evidence:
  level: supported
  references:
  - EV-REQ-0013-01
relations:
  supports: []
  conflicts_with: []
  depends_on:
  - NT-LAW-0010
  applies_to: []
tags:
- authority
- governance
- decision-rights
- organizational-boundaries
- governance-structure
- role-clarity
created_at: '2026-07-22'
updated_at: '2026-09-14'
mechanism:
- Quyền quyết định không được phân định rõ giữa các vai trò.
- Nhiều bên tin rằng mình có quyền quyết định hoặc không ai dám quyết.
- Các quyết định bị đẩy qua lại giữa các phòng ban.
- Thời gian và nguồn lực bị tiêu hao vào đàm phán ngầm về thẩm quyền.
- Tổ chức mất khả năng đưa ra quyết định kịp thời.
