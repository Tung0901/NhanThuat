mechanism:
- Gắn kết tăng giúp phối hợp trơn tru và giảm chi phí giao tiếp.
- Gắn kết vượt ngưỡng làm giảm động lực nêu bất đồng.
- Ma sát chức năng duy trì kiểm chứng và phát hiện sai lệch.
- Nhóm rơi vào suy giảm chất lượng quyết định khi một trong hai cực mất cân bằng.
