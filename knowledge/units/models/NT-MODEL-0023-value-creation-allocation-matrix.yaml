id: NT-MODEL-0023
type: model
status: frozen
version: 0.2.0
title: Ma trận tạo giá trị và phân bổ
summary: 'Ma trận phân biệt bốn loại giá trị trong đàm phán: giá trị khác biệt có thể trao đổi, giá trị chung, giá trị riêng mỗi bên, và giá trị xung đột. Chiến lược xử lý mỗi loại khác nhau.'
primary_domain: thanh-su
secondary_domains:
- hop-chung
definition: 'Ma trận tạo giá trị và phân bổ là khung phân loại các yếu tố giá trị trong thương lượng thành bốn vùng theo mức độ chia sẻ giữa các bên, giúp xác định cách xử lý: trao đổi, củng cố, giữ riêng hoặc đàm phán.'
conditions:
- Đàm phán có nhiều chiều giá trị ngoài giá tiền.
- Các bên có thể trao đổi thông tin về ưu tiên.
exceptions:
- Thương lượng thuần túy chia phần với một chiều giá trị duy nhất.
- Đối tác không sẵn sàng trao đổi thông tin ưu tiên.
applications:
  negotiation:
  - Phân loại các vấn đề đàm phán vào bốn vùng trước khi thiết kế đề xuất.
  - Tập trung mở rộng vùng giá trị khác biệt có thể trao đổi.
  partnership:
  - Thiết kế cấu trúc hợp tác phân vùng rõ giữa chia sẻ chung và bảo toàn riêng.
  conflict-resolution:
  - Cô lập các vùng xung đột thật để xử lý riêng khỏi các vùng hợp tác.
risks:
- Phân loại sai vùng dẫn tới chiến lược không phù hợp.
- Bộc lộ vùng giá trị riêng trong quan hệ thiếu tin cậy.
- Tối ưu từng vùng mà bỏ qua tính tổng thể của thỏa thuận.
