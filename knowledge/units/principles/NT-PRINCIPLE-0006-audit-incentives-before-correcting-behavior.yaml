id: NT-PRINCIPLE-0006
type: principle
status: frozen
version: 0.1.0
title: Rà soát động lực trước khi sửa chữa hành vi
summary: Trước khi sửa chữa hành vi lặp lại, hãy kiểm tra xem hệ thống đang khen thưởng, trừng phạt, phớt lờ hoặc làm dễ dàng điều gì.
primary_domain: thanh-su
secondary_domains:
- dung-nhan
- hop-chung
definition: Việc sửa chữa hành vi mạnh mẽ hơn khi nó nhắm vào khuôn mẫu động lực vốn không ngừng tái tạo ra hành vi đó.
mechanism:
- Xác định hành vi lặp lại.
- Truy vết cơ chế củng cố.
- Thay đổi việc sửa chữa và động lực cùng lúc.
conditions:
- Hành vi lặp lại theo thời gian hoặc giữa nhiều người.
- Môi trường định hình lợi ích nhận được.
exceptions:
- Hành vi sai trái đơn lẻ có thể cần xử lý trực tiếp.
- Năng lực cá nhân vẫn có thể đóng vai trò.
applications:
  management:
  - Kiểm tra xem mục tiêu có đang khen thưởng hành vi bị chỉ trích hay không.
  operations:
  - Loại bỏ phần thưởng cho các lối tắt gây hại cho sứ mệnh.
risks:
- Bỏ qua trách nhiệm cá nhân.
- Tạo ra các động lực chơi khăm mới.
evidence:
  level: provisional
  references: []
