id: NT-ANTI-PATTERN-0043
type: anti-pattern
status: frozen
version: 0.1.0
title: Sự Biến Tướng Cá Nhân Hóa
summary: Để sự bất đồng khách quan về công việc biến tướng thành các cuộc tấn công cá nhân, phá hủy lòng tin và sự gắn kết nhóm.
primary_domain: hop-chung
secondary_domains:
- tri-nhan
definition: Sự biến tướng cá nhân hóa xảy ra khi một cuộc tranh luận về sự thật công việc chuyển biến thành việc nghi ngờ năng lực hoặc nhân cách của đồng nghiệp.
mechanism:
- Cuộc tranh luận về công việc trở nên gay gắt.
- Người tham gia quay sang tấn công nhân cách đối phương.
- Thảo luận chuyển sang việc bảo vệ lòng tự trọng cá nhân.
- Sự tin tưởng sụp đổ.
conditions:
- Môi trường áp lực cao thiếu các quy tắc cuộc họp rõ ràng.
exceptions:
- Không có.
applications:
  team_coaching:
  - Can thiệp ngay lập tức khi một thành viên sử dụng ngôn từ tấn công cá nhân (ad hominem).
risks:
- Kiểm soát ngôn từ tranh luận quá mức đến mức dập tắt nhiệt huyết.
evidence:
  level: supported
  references:
