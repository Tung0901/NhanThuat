id: NT-LAW-0072
type: law
status: frozen
version: 0.1.0
title: Behavior Modeling Congruence
summary: Organizational culture is shaped by the behavior leaders tolerate and model
  under stress, not by written core value statements.
primary_domain: hop-chung
secondary_domains:
- tu-than
definition: Employees judge real culture by observing executive actions during crisis.
conditions:
- Cultural evolution and crisis leadership.
exceptions:
- None.
applications:
  culture_audit:
  - Audit leadership stress behaviors to identify true cultural signaling.
risks:
- Assuming written value statements create culture without leader modeling.
evidence:
  level: supported
  references:
  - EV-REQ-0019-01
