id: NT-PRINCIPLE-0078
type: principle
status: frozen
version: 0.2.0
title: Đánh giá quyết định theo quy trình, không theo kết quả
summary: Đánh giá chất lượng quyết định bằng quy trình đã dùng, không chỉ bằng kết quả cuối cùng. Đánh giá theo quy trình giúp học đúng bài học trong môi trường bất định.
primary_domain: tri-nhan
secondary_domains:
- dung-nhan
definition: Đánh giá quyết định theo quy trình, không theo kết quả là nguyên tắc kiểm điểm dựa trên chất lượng phân tích, giả định, dữ liệu và lập luận tại thời điểm ra quyết định, tách khỏi may mắn của kết quả.
conditions:
- Quyết định được đưa ra trong điều kiện bất định.
- Có thể ghi nhận lại quá trình ra quyết định.
exceptions:
- Trường hợp vi phạm quy trình bắt buộc rõ ràng vẫn xử lý theo quy chế.
- Môi trường ổn định cho phép dùng kết quả làm chỉ báo đủ tin cậy.
applications:
  governance:
  - Yêu cầu ghi lại giả định và lý do cho các quyết định trọng yếu.
  - Đánh giá quyết định định kỳ bằng chất lượng quy trình.
  management:
  - Khen thưởng quy trình tốt ngay cả khi kết quả chưa thuận lợi.
  - Không kết luận năng lực chỉ từ một kết quả đơn lẻ.
  learning:
  - Dùng phân tích kịch bản thay thế để học từ các quyết định đã qua.
risks:
- Bao biện cho quyết định kém bằng lý do bất định.
- Bỏ qua bài học từ kết quả thực tế khi quá tập trung vào quy trình.
- Đánh giá quy trình hình thức trong khi kết quả bị lờ đi.
evidence:
  level: supported
  references:
  - EV-REQ-0001-01
