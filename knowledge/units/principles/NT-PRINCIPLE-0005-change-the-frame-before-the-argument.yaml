id: NT-PRINCIPLE-0005
type: principle
status: frozen
version: 0.1.0
title: Thay đổi khung diễn giải trước khi tranh luận
summary: Khi mọi người diễn giải cùng một sự kiện theo cách khác nhau, hãy làm rõ hoặc thiết kế lại khung ra quyết định trước khi gia tăng áp lực thuyết phục.
primary_domain: tri-nhan
secondary_domains:
- hop-chung
- thanh-su
definition: Đóng khung lại có thể thay đổi những gì con người chú ý và coi trọng, khiến việc tranh luận chỉ trở nên hữu ích sau khi tình huống được diễn giải rõ ràng hơn.
mechanism:
- Phơi bày khung diễn giải hiện tại.
- Kiểm tra xem nó nhấn mạnh điều gì.
- Đưa ra một khung diễn giải tốt hơn cho quyết định.
conditions:
- Bất đồng phản ánh sự khác biệt trong diễn giải.
- Các bên có thể xem xét lại các giả định.
exceptions:
- Ý định xấu có thể phớt lờ việc đóng khung lại.
- Áp lực thời gian có thể đòi hỏi quyết định trực tiếp.
applications:
  negotiation:
  - Nêu rõ vấn đề chung trước khi tranh luận về các phương án.
  strategy:
  - Đóng khung lại các đánh đổi xoay quanh mục tiêu thực sự.
risks:
- Thao túng nhận thức.
- Tránh né các sự thật khó.
