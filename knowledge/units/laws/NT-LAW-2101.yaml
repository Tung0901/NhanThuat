id: NT-LAW-2101
type: law
status: frozen
version: 1.0.0
title: Law of Entropy in Crisis
summary: Trong khủng hoảng, thiếu thông tin và độ trễ phản hồi sẽ luôn làm khuếch
  đại mức độ nghiêm trọng nếu không có sự can thiệp cắt đứt chuỗi phản ứng.
primary_domain: thanh-su
domain_area: NT-DA-0021
secondary_domains:
- hop-chung
definition: Khủng hoảng không phải là một trạng thái tĩnh mà là một chuỗi phản ứng
  dây chuyền. Cần hành động để cắt đứt chuỗi này.
mechanism:
- Nhận diện các điểm đứt gãy thông tin.
- Phân lập vùng khủng hoảng.
- Ra quyết định nhanh.
conditions:
- Môi trường bất định.
- Áp lực thời gian cực cao.
exceptions:
- Các cuộc khủng hoảng chậm.
applications:
  management:
  - Thiết lập war-room
risks:
- Phản ứng chậm do tê liệt phân tích
