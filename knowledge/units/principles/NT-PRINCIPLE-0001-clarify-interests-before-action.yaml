id: NT-PRINCIPLE-0001
type: principle
status: frozen
version: 0.1.0
title: Làm rõ lợi ích trước khi thiết kế hành động
summary: Trước khi lựa chọn động lực, lập luận hoặc can thiệp, hãy xác định những lợi ích mà mỗi người tin rằng họ đang bảo vệ hoặc gia tăng.
primary_domain: tri-nhan
secondary_domains:
- dung-nhan
- thanh-su
definition: Thiết kế hành động hiệu quả bắt đầu bằng việc làm rõ lợi ích được nhận thức, vì hành vi thường đi theo những gì con người tin sẽ bảo vệ hoặc cải thiện vị thế của mình.
mechanism:
- Xác định chủ thể hành động và bối cảnh ra quyết định.
- Hỏi xem chủ thể nhận thức được lợi ích, mất mát, rủi ro, bản sắc hay nghĩa vụ nào.
- Thiết kế hành động xoay quanh lợi ích được nhận thức thay vì chỉ dựa vào lập trường đã công bố.
conditions:
- Chủ thể có quyền lựa chọn thực chất.
- Người quan sát có thể thu thập đủ bối cảnh để suy đoán lợi ích một cách có trách nhiệm.
exceptions:
- Hành động khẩn cấp có thể cần quyết định tạm thời trước khi lập bản đồ lợi ích đầy đủ.
- Cưỡng ép, thông tin sai lệch hoặc phản xạ có thể khiến việc phân tích lợi ích không trọn vẹn.
applications:
  negotiation:
  - Tách biệt lập trường đã công bố khỏi lợi ích nền tảng.
  management:
  - Căn chỉnh động lực với những gì thành viên trong nhóm thực sự coi trọng và lo ngại.
risks:
- Gán ghép lợi ích của bản thân lên người khác.
- Coi lợi ích thuần túy là tài chính hoặc thuần túy duy lý.
