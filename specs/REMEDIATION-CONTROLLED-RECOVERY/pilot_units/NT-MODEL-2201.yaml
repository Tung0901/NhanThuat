  content: "### 1. Cấu trúc Năm Nguồn Quyền lực Tổ chức\n**Ma Trận Quyền Lực** (`NT-MODEL-2201`)\
    \ chuẩn hóa phân loại kinh điển của French & Raven (1959) gồm hai nhóm nguồn lực\
    \ tác động:\n1. *Quyền lực gắn với vị trí (Positional Power)*: Quyền lực hợp pháp\
    \ (Legitimate), Quyền lực tưởng thưởng (Reward), Quyền lực cưỡng chế (Coercive).\n\
    2. *Quyền lực gắn với cá nhân (Personal Power)*: Quyền lực chuyên gia (Expert),\
    \ Quyền lực tham chiếu/uy tín (Referent).\n\nCác phân tích tổng hợp thực địa (Podsakoff\
    \ & Schriesheim, 1985) cho thấy quyền lực chuyên gia và tham chiếu có tương quan\
    \ dương bền vững hơn với sự gắn kết nội tâm, trong khi lạm dụng quyền lực cưỡng\
    \ chế thường chỉ tạo ra sự phục tùng ngắn hạn kèm chi phí giám sát cao.\n\n###\
    \ 2. Điều kiện áp dụng & Ngoại lệ\n- **Điều kiện áp dụng:**\n  - Chẩn đoán nguyên\
    \ nhân vì sao một chỉ đạo chiến lược không đi vào thực tế (do thiếu thẩm quyền\
    \ chính thức hay thiếu uy tín chuyên môn).\n  - Thiết kế lộ trình phát triển năng\
    \ lực lãnh đạo cho quản lý cấp trung và chuyên gia đầu ngành.\n- **Ngoại lệ:**\n\
    \  - Các môi trường vận hành có quy định an toàn sinh mạng hoặc kỷ luật quân sự\
    \ nghiêm ngặt — nơi quyền lực hợp pháp theo vị trí phải được ưu tiên tuân thủ\
    \ tức thời tại hiện trường.\n\n### 3. Mức bất định & Rủi ro diễn giải sai\n- **Mức\
    \ bất định:** Thấp - Trung bình. Dù phân loại 5 nguồn quyền lực có nền tảng thực\
    \ nghiệm rộng, hiệu quả tương đối của từng nguồn lực vẫn biến thiên theo văn hóa\
    \ tổ chức, giai đoạn trưởng thành của nhân sự và mức độ khủng hoảng.\n- **Rủi\
    \ ro diễn giải sai:**\n  - Phủ nhận hoàn toàn vai trò của quyền lực vị trí và\
    \ chế tài hợp pháp, khiến tổ chức thiếu ranh giới kỷ luật đối với các hành vi\
    \ vi phạm chuẩn mực.\n  - Nhầm lẫn sức hút bề nổi nhất thời với quyền lực tham\
    \ chiếu bền vững dựa trên sự chính trực.\n\n### 4. Nguồn truy nguyên & Đối chiếu\
    \ Đông - Tây\n- **Nguồn truy nguyên:** Mô hình 5 nguồn quyền lực của French &\
    \ Raven (1959) và tổng quan phê bình thực nghiệm của Podsakoff & Schriesheim (1985).\n\
    - **Đối chiếu cổ điển `[Classical Analogy]`:** Hàn Phi Tử phân định rõ *Thế* (vị\
    \ trí), *Pháp* (quy tắc thưởng phạt công minh) và *Thuật* (năng lực thẩm định),\
    \ đồng thời Tuân Tử (*Vương Chế*) bổ sung rằng nếu chỉ có *Thế* và *Hình* mà thiếu\
    \ *Đức/Tín* (tương ứng Referent Power) thì chỉ giữ được sự phục tùng bề mặt.\n"
