id: NT-ANTI-PATTERN-0042
type: anti-pattern
status: frozen
version: 0.1.0
title: Sự Hòa Hợp Giả Tạo
summary: Kìm hãm sự bất đồng chính đáng về công việc vì sợ xung đột, tạo ra sự đồng thuận mong manh và ma sát ngầm mang tính chống đối thụ động.
primary_domain: hop-chung
secondary_domains:
- tri-nhan
definition: Sự hòa hợp giả tạo xảy ra khi các thành viên trong đội ngũ gật đầu công khai nhưng lại mang trong mình những hoài nghi sâu sắc.
mechanism:
- Đội ngũ gặp phải một quyết định gây tranh cãi.
- Các thành viên giữ im lặng để tránh tranh luận.
- Quyết định tồi tệ được thông qua.
- Quá trình thực thi thất bại.
conditions:
- Văn hóa tổ chức có mức độ an toàn tâm lý thấp.
exceptions:
- Giai đoạn thực thi trong khủng hoảng đòi hỏi sự thống nhất ngay lập tức.
applications:
  culture_audit:
  - Nhận diện các đội ngũ không ghi nhận bất kỳ sự phản biện nào nhưng lại có tốc độ thực thi thấp.
risks:
- Nhầm lẫn sự hòa hợp giả tạo với sự đồng lòng thực sự trong tổ chức.
evidence:
  level: supported
  references:
  - EV-REQ-0011-01
relations:
