created_at: '2026-07-22'
updated_at: '2026-09-14'
mechanism:
- Xảy ra sai sót hoặc vi phạm trong quá trình vận hành.
- Người liên quan đánh giá chi phí báo cáo cao hơn chi phí che giấu.
- Thông tin bị lược bỏ hoặc làm nhẹ trong báo cáo.
- Rủi ro tích tụ ngoài tầm kiểm soát cho tới khi bộc lộ quy mô lớn.
