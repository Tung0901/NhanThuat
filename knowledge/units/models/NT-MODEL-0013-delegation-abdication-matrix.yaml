id: NT-MODEL-0013
type: model
status: frozen
version: 0.2.0
title: Ma trận Ủy quyền và Thoái thác
summary: Ma trận phân loại hành vi giao quyền theo mức chủ động của người nhận và mức can thiệp của người giao. Mô hình giúp phân biệt ủy quyền lành mạnh với thoái thác và vi quản lý.
primary_domain: dung-nhan
secondary_domains:
- tri-nhan
definition: 'Ma trận Ủy quyền và Thoái thác là khung hai chiều đối chiếu mức tự chủ được trao với mức hỗ trợ được cung cấp, xác định bốn vùng hành vi: ủy quyền lành mạnh, thoái thác, vi quản lý và kiểm soát chặt có hỗ trợ.'
conditions:
- Tồn tại quan hệ giao việc thường xuyên giữa các cấp.
- Mức tự chủ và hỗ trợ có thể quan sát và điều chỉnh.
exceptions:
- Giao việc cho người mới cần vùng kiểm soát chặt có hỗ trợ trong giai đoạn đầu.
- Khủng hoảng có thể tạm dịch chuyển về vùng kiểm soát tập trung.
applications:
  delegation:
  - Định vị các quan hệ giao việc hiện tại trên ma trận để phát hiện lệch chuẩn.
  - Điều chỉnh mức tự chủ theo năng lực thay vì theo cảm hứng.
  management:
  - Tự đánh giá xu hướng vi quản lý hoặc thoái thác của bản thân.
  talent-development:
  - Lộ trình dịch chuyển dần từ kiểm soát chặt sang ủy quyền lành mạnh.
risks:
- Định vị sai khiến can thiệp không đúng mức.
- Trao tự chủ không kèm hỗ trợ dẫn tới thất bại rồi siết quyền.
- Coi ma trận là công cụ chấm điểm cá nhân thay vì chẩn đoán cấu trúc.
evidence:
