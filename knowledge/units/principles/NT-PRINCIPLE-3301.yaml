id: NT-PRINCIPLE-3301
type: principle
title: Psychological Safety Design
summary: Systematically removing the interpersonal risks of speaking up to prevent
  pluralistic ignorance and groupthink.
primary_domain: tri-nhan
domain_area: NT-DA-0029
definition: The architectural requirement to build team environments where members
  feel safe to take risks, voice dissenting opinions, and admit mistakes without fear
  of punishment.
mechanism:
- Leaders explicitly model vulnerability and admit their own errors.
- Failures are framed as systemic learning opportunities rather than individual incompetence.
- The social cost of dissenting is artificially lowered.
conditions:
- Knowledge work and complex problem-solving environments where innovation and error-detection
  are critical.
exceptions:
- Strict execution-only environments where absolute compliance to a known safe procedure
  is required (e.g., a surgical checklist).
applications:
  culture:
  - Implementing blameless post-mortems for critical system outages.
risks:
- Confusing psychological safety with 'being nice' or lowering performance standards.
evidence:
  level: strong
  references:
  - Edmondson, A. (1999). 'Psychological Safety and Learning Behavior in Work Teams'.
    Administrative Science Quarterly.
