id: NT-ANTI-PATTERN-0039
type: anti-pattern
status: frozen
version: 0.2.0
title: BATNA Mù mờ
summary: Một bên đàm phán mà không biết rõ phương án thay thế tốt nhất của mình nếu thỏa thuận thất bại. Thiếu BATNA rõ ràng dẫn tới nhượng bộ quá mức hoặc chấp nhận điều kiện bất lợi.
primary_domain: thanh-su
secondary_domains:
- tri-nhan
definition: BATNA mù mờ là phản-mẫu đàm phán trong đó người đàm phán không xác định rõ phương án thay thế tốt nhất khi không đạt được thỏa thuận, dẫn đến mất khả năng đánh giá đúng giới hạn chấp nhận và sức mạnh đàm phán.
conditions:
- Đàm phán có tính cạnh tranh hoặc giá trị lớn.
- Người đàm phán chưa chuẩn bị phương án thay thế rõ ràng.
exceptions:
- Quan hệ hợp tác dài hạn coi trọng giá trị quan hệ hơn từng giao dịch.
- Đàm phán nội bộ trong tổ chức có thể ưu tiên mục tiêu chung.
applications:
  negotiation:
  - Xác định và cải thiện phương án thay thế trước mọi đàm phán quan trọng.
  - Dùng BATNA làm mốc từ chối thay vì ngưỡng nhượng bộ theo cảm tính.
  procurement:
  - Duy trì nhiều nhà cung cấp thay thế để tăng vị thế đàm phán.
  leadership:
  - Đào tạo đội ngũ kỹ năng chuẩn bị và đánh giá phương án thay thế.
risks:
- Chấp nhận thỏa thuận tệ hơn cả phương án thay thế chưa nhận diện.
- Nhượng bộ quá mức do thiếu mốc so sánh.
- Bị đối phương chi phối hoàn toàn nhịp và phạm vi đàm phán.
evidence:
  level: supported
  references:
  - EV-REQ-0001-01
relations:
  supports: []
  conflicts_with: []
  depends_on:
