mechanism:
- Một cá nhân gây ấn tượng mạnh về tầm nhìn và sự tự tin.
- Tập thể dần gán mọi phán đoán đúng cho cá nhân đó.
- Phản biện trở nên khó nói vì đối lập với hình ảnh được tôn sùng.
- Hệ thống mất khả năng kiểm chứng độc lập và tích lũy rủi ro ngầm.
content: "### 1. Cơ chế Thay thế Thể chế bằng Hào quang Cá nhân\n**Bẫy sức hút cá nhân** (`NT-ANTI-PATTERN-0012`)\
  \ xuất hiện khi tổ chức đặt niềm tin quá mức vào sự tự tin, khả năng hùng biện và thành tích quá khứ\
  \ của một cá nhân trung tâm, dẫn đến việc nới lỏng các hàng rào kiểm chứng độc lập, hội đồng thẩm định\
  \ và quy trình kế nhiệm (Khurana, 2002). House & Howell (1992) phân biệt rõ giữa lãnh đạo có sức hút\
  \ gắn với thể chế chung (socialized charisma) và lãnh đạo tập trung quyền lực vào cái tôi cá nhân (personalized\
  \ charisma) — nhóm thứ hai làm gia tăng rủi ro điểm mù chiến lược.\n\n### 2. Điều kiện áp dụng & Ngoại\
  \ lệ\n- **Điều kiện áp dụng:**\n  - Tổ chức vừa trải qua khủng hoảng hoặc tăng trưởng nóng nhờ một cá\
  \ nhân dẫn dắt, khiến tập thể hình thành tâm lý quy gán thành công cho một người.\n  - Hội đồng quản\
  \ trị hoặc ban kiểm soát thiếu tính độc lập về thông tin và chuyên môn.\n- **Ngoại lệ:**\n  - Khi sức\
  \ hút truyền cảm hứng của người đứng đầu đi kèm với quy trình phản biện bắt buộc, phân quyền rõ ràng\
  \ và đội ngũ kế cận đủ thẩm quyền phủ quyết kỹ thuật.\n  - Giai đoạn khởi nghiệp rất sớm hoặc ứng cứu\
  \ ngắn hạn khi cấu trúc quy trình chưa kịp hình thành, miễn là sớm chuyển giao sang cơ chế thể chế hóa.\n\
  \n### 3. Mức bất định & Rủi ro diễn giải sai\n- **Mức bất định:** Trung bình. Sức hút cá nhân không\
  \ tất yếu dẫn đến sụp đổ nếu tổ chức chủ động xây dựng cơ chế kiểm soát đối trọng; rủi ro chỉ trở thành\
  \ hiện thực khi hào quang cá nhân làm tê liệt kênh báo động sớm.\n- **Rủi ro diễn giải sai:**\n  - Cực\
  \ đoan hóa thành việc bài xích những nhà lãnh đạo có khả năng truyền cảm hứng và tầm nhìn mạnh mẽ.\n\
  \  - Áp đặt bộ máy quan liêu cứng nhắc làm triệt tiêu tính quyết đoán cần thiết của người đứng đầu.\n\
  \n### 4. Nguồn truy nguyên & Đối chiếu Đông - Tây\n- **Nguồn truy nguyên:** Nghiên cứu định lượng và\
  \ lịch sử doanh nghiệp của Rakesh Khurana (2002) tại Harvard cùng phân tích tâm lý lãnh đạo của House\
  \ & Howell (1992).\n- **Đối chiếu cổ điển `[Nguồn cổ điển]`:** Pháp gia (*Hàn Phi Tử — Nan Thế*) chỉ\
  \ rõ bậc hiền tài trăm năm mới xuất hiện một người, trong khi việc trị nước và vận hành tổ chức diễn\
  \ ra hàng ngày; vì vậy không thể lấy sự kỳ vọng vào một cá nhân phi thường để thay thế cho chuẩn mực\
  \ quy chế (*Pháp*) và cơ chế kiểm chứng (*Thuật*).\n"
