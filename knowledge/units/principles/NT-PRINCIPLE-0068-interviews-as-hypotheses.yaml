id: NT-PRINCIPLE-0068
type: principle
status: frozen
version: 0.2.0
title: Phỏng vấn như các giả thuyết
summary: Coi mỗi cuộc phỏng vấn là một phép kiểm định giả thuyết về ứng viên thay vì một phán quyết cảm tính. Giả thuyết rõ giúp thiết kế câu hỏi sắc bén và tránh kết luận sớm.
primary_domain: tri-nhan
secondary_domains:
- thanh-su
definition: 'Phỏng vấn như các giả thuyết là nguyên tắc đánh giá con người theo phương pháp khoa học: mỗi buổi phỏng vấn kiểm định một giả thuyết cụ thể về năng lực hoặc hành vi, với tiêu chí xác nhận và bác bỏ rõ ràng.'
conditions:
- Có mô tả công việc và tiêu chuẩn năng lực làm cơ sở hình thành giả thuyết.
- Người phỏng vấn được đào tạo về kỹ thuật đặt câu hỏi hành vi.
exceptions:
- Vòng phỏng vấn sàng lọc nhanh có thể dùng tiêu chí tối thiểu thay vì giả thuyết đầy đủ.
- Vị trí đặc biệt cần đánh giá qua thử việc dài hạn thay vì phỏng vấn.
applications:
  hiring:
  - Chuẩn bị bộ giả thuyết và câu hỏi kiểm định cho từng vòng phỏng vấn.
  - Yêu cầu người phỏng vấn ghi lại bằng chứng cụ thể thay vì kết luận chung.
  leadership:
  - Áp dụng cách đặt câu hỏi kiểm định giả thuyết khi tìm hiểu vấn đề của nhân sự.
  decision-making:
  - Dùng cấu trúc giả thuyết - bằng chứng cho mọi đánh giá quan trọng về con người.
risks:
- Giả thuyết ban đầu định hướng câu hỏi theo cách xác nhận thiên kiến.
- Ứng viên luyện tập trả lời làm giảm giá trị kiểm định.
- Quá nhiều giả thuyết làm buổi phỏng vấn phân tán.
