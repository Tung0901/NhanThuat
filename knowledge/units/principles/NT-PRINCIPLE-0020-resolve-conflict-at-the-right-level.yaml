id: NT-PRINCIPLE-0020
type: principle
status: frozen
version: 0.1.0
title: Resolve conflict at the right level
summary: Solve conflicts at the level where the tradeoff can actually be decided,
  resourced, or redesigned.
primary_domain: thanh-su
secondary_domains:
- hop-chung
- dung-nhan
definition: Conflict persists when people are asked to resolve a tradeoff they do
  not have authority or resources to settle.
mechanism:
- Locate the unresolved tradeoff
- Identify decision authority
- Move the decision to the right level.
conditions:
- Conflict depends on constraints beyond the parties
- Authority is distributed.
exceptions:
- Interpersonal repair may still be needed
- Local teams can resolve some tradeoffs themselves.
applications:
  management:
  - Escalate priority conflicts that teams cannot settle.
  operations:
  - Change resource rules when handoff conflict repeats.
risks:
- Escalating every disagreement
- Avoiding interpersonal responsibility.
evidence:
  level: provisional
  references: []
