proposed_unit:
  id: NT-MODEL-2201
  type: model
  status: frozen
  version: 1.1.0
  title: Ma Trận Quyền Lực
  summary: 'Mô hình phân loại các nguồn quyền lực tổ chức thành hai nhóm chính: quyền
    lực vị trí và quyền lực cá nhân.'
  primary_domain: thanh-su
  domain_area: NT-DA-0022
  secondary_domains:
  - dung-nhan
  definition: Khung phân tích giúp nhận diện và đo lường các nguồn lực tạo nên sức
    ảnh hưởng thực tế của một chủ thể trong hệ thống xã hội hoặc tổ chức.
  mechanism:
  - Chủ thể nắm giữ hoặc phát triển các nguồn lực (vị trí, chuyên môn, mối quan hệ,
    uy tín cá nhân).
  - Các nguồn lực này tạo ra mức độ phục tùng hoặc cam kết khác nhau từ cấp dưới.
  - Quyền lực vị trí tạo ra sự tuân thủ bề ngoài; quyền lực cá nhân tạo ra sự đồng
    thuận nội tâm.
  - Sự phối hợp cân bằng giữa các nguồn lực quyết định hiệu quả lãnh đạo bền vững.
  conditions:
  - Chẩn đoán nguyên nhân vì sao chỉ đạo chiến lược không đi vào thực tế (do thiếu
    thẩm quyền chính thức hay thiếu uy tín chuyên môn).
  - Thiết kế lộ trình phát triển năng lực lãnh đạo cho quản lý cấp trung và chuyên
    gia đầu ngành.
  exceptions:
  - Môi trường vận hành có quy định an toàn sinh mạng hoặc kỷ luật quân sự nghiêm
    ngặt — nơi quyền lực hợp pháp theo vị trí phải được ưu tiên tuân thủ tức thời
    tại hiện trường.
  applications:
    management:
    - Đánh giá cơ cấu quyền lực thực tế của ban lãnh đạo và chuyên gia
  risks:
  - Lạm dụng quyền lực cưỡng chế tạo ra sự chống đối ngầm và suy thoái văn hóa.
  - Ảo tưởng về quyền lực vị trí khi bước ra khỏi ranh giới bổ nhiệm chính thức.
