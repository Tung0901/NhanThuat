id: NT-PRINCIPLE-0105
type: principle
status: frozen
version: 0.2.0
title: Tách biệt học hỏi khỏi quy trách nhiệm
summary: Tách bạch rõ ràng các buổi rà soát sự cố tìm nguyên nhân gốc rễ khỏi các buổi đánh giá quản lý hiệu suất cá nhân.
primary_domain: tri-nhan
secondary_domains:
- hop-chung
definition: Nếu nhân viên lo sợ buổi rà soát sự cố sẽ ảnh hưởng đến xếp hạng hiệu suất của họ, họ sẽ giấu đi các chi tiết quan trọng.
conditions:
- Họp sau sự cố (post-mortem) và rà soát sau dự án.
exceptions:
- Sơ suất lặp lại sau khi đã được kèm cặp và ghi nhận bằng tài liệu.
applications:
  post-mortem-policy:
  - Quy định ghi chú post-mortem không được dùng làm căn cứ tính thưởng.
risks:
- Không xử lý tình trạng năng lực cá nhân yếu lặp lại.
evidence:
  level: supported
  references:
  - EV-REQ-0018-01
relations:
  supports: []
  conflicts_with: []
  depends_on:
  - NT-LAW-0070
  applies_to: []
tags:
- learning
- post-mortem
- blame
- psychological-safety
- incident-review
- no-blame-culture
created_at: '2026-07-22'
updated_at: '2026-09-14'
mechanism:
- Tách buổi rà soát sự cố khỏi các buổi đánh giá hiệu suất cá nhân.
- Quy định mục tiêu duy nhất của rà soát sự cố là tìm nguyên nhân gốc.
- Miễn trừ kết luận rà soát khỏi hồ sơ đánh giá cá nhân trong đa số trường hợp.
- Ghi nhận và khen thưởng việc chủ động báo cáo chi tiết.
- Theo dõi tỷ lệ sự cố được báo cáo để đánh giá hiệu quả của cơ chế.
