id: NT-PHENOMENON-3307
type: phenomenon
title: Ỷ lại xã hội (Hiệu ứng Ringelmann)
summary: Hiện tượng một người nỗ lực ít hơn để đạt được mục tiêu khi làm việc trong nhóm so với khi làm việc một mình.
primary_domain: tri-nhan
domain_area: NT-DA-0029
definition: Sự sụt giảm nỗ lực và động lực của từng cá nhân xảy ra khi con người làm việc theo nhóm so với khi làm việc độc lập, tỉ lệ thuận với quy mô của nhóm.
mechanism:
- Đóng góp của từng cá nhân cho kết quả của nhóm khó được đo lường hoặc nhận diện.
- Cá nhân nhận ra rằng sự thiếu nỗ lực của mình sẽ không bị chú ý.
- Động lực suy giảm, và họ "thảnh thơi" dựa vào công sức của người khác.
conditions:
- Các nhiệm vụ cộng gộp (nơi kết quả là tổng của mọi nỗ lực) mà không có theo dõi hiệu suất từng cá nhân.
exceptions:
- Khi nhiệm vụ hấp dẫn, ý nghĩa ở mức cao hoặc khi kết quả của từng cá nhân được công khai.
applications:
  team_structure:
  - 'Giữ các nhóm dự án nhỏ (ví dụ: "Nhóm hai chiếc bánh pizza") để duy trì khả năng quan sát cao đối với đóng góp của từng cá nhân.'
risks:
- Các nhóm phình to đạt tổng sản lượng thấp hơn so với các nhóm nhỏ, gọn gàng hơn.
evidence:
  level: strong
  references:
  - Ringelmann, M. (1913). 'Recherches sur les moteurs animés'.
  - 'Latané, B., Williams, K., & Harkins, S. (1979). ''Many hands make light the work: The causes and consequences of social loafing''.'
