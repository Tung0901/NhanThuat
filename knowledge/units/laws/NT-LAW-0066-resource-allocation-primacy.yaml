id: NT-LAW-0066
type: law
status: frozen
version: 0.1.0
title: Tính tối thượng của phân bổ nguồn lực
summary: Một chiến lược thực sự không tồn tại cho đến khi các nguồn lực khan hiếm được phân bổ lại để hỗ trợ cho các lựa chọn của chiến lược đó.
primary_domain: thanh-su
secondary_domains:
- dung-nhan
definition: Chiến lược được định nghĩa bằng các cam kết về nguồn lực (vốn, thời gian kỹ thuật, nhân tài), chứ không phải bằng các tuyên bố sứ mệnh.
conditions:
- Hoạch định chiến lược và chu kỳ ngân sách hàng năm.
exceptions:
- Các thử nghiệm thăm dò với lượng phân bổ nguồn lực ban đầu rất nhỏ.
applications:
  strategic_audit:
  - Đo lường sự dịch chuyển nhân tài và ngân sách giữa các sáng kiến.
risks:
- Tuyên bố chuyển dịch chiến lược nhưng không thay đổi việc phân bổ ngân sách.
evidence:
