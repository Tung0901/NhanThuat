id: NT-LAW-0018
type: law
status: frozen
version: 1.0.0
title: "Quy luật vị trí vai trò định hình lăng kính nhận thức"
summary: "Con người không nhìn thấy thực tại khách quan nguyên bản; họ luôn sàng lọc và diễn giải mọi sự kiện thông qua trách nhiệm, áp lực KPI, quyền lợi và điểm mù gắn liền với chiếc ghế chức vụ mà họ đang ngồi."
primary_domain: dung-nhan
secondary_domains:
- tri-nhan
- hop-chung
definition: "Trong xã hội học tổ chức và tâm lý học nhận thức (Định luật Miles: 'Where you stand depends on where you sit'), vị trí chức năng của một cá nhân hoạt động như một thấu kính lọc màu tự động. Khi một người ngồi vào chiếc ghế Tài chính, Pháp chế, Kinh doanh hay Kỹ thuật, hệ thống trách nhiệm và rủi ro đặc thù của vai trò đó sẽ quyết định thông tin nào họ thấy là sống còn, thông tin nào họ coi là thứ yếu, dẫn đến việc cùng một sự kiện nhưng mỗi phòng ban lại nhìn thấy một 'sự thật' hoàn toàn trái ngược nhau."
mechanism:
- "Tiếp nhận khuôn mẫu vai trò (Role Internalization): Cá nhân bước vào vị trí chức vụ cùng với bản mô tả công việc, chỉ tiêu đánh giá và các rủi ro bị quy trách nhiệm đặc thù."
- "Lọc chú ý theo chức năng (Functional Selective Attention): Não bộ tự động phóng đại những tín hiệu đe dọa đến KPI của vai trò mình và làm mờ đi những yếu tố thuộc trách nhiệm của bộ phận khác."
- "Biến đổi tâm thế khi đổi ghế: Cùng một con người, hôm qua ngồi ghế Trưởng phòng Bán hàng thì quyết liệt đòi nới lỏng tín dụng công nợ; hôm nay được điều chuyển sang ngồi ghế Giám đốc Quản trị Rủi ro liền lập tức trở thành người siết nợ khắt khe nhất."
- "Xung đột điểm mù vai trò (Role-Induced Blindspot Clash): Các bộ phận quy kết sự khác biệt góc nhìn của nhau là do 'thiếu hiểu biết' hoặc 'cố tình gây khó dễ'."
- "Tích hợp đa lăng kính: Thiết kế cơ chế luân chuyển vai trò (Job Rotation) và ma trận thẩm định đa diện để ghép các mảnh sự thật cục bộ thành bức tranh toàn cảnh."
conditions:
- "Tổ chức được chuyên môn hóa thành các phòng ban chức năng riêng biệt với các thước đo hiệu suất khác nhau."
- "Vai trò đi kèm với các kỳ vọng xã hội, quyền hạn và hệ quả thưởng phạt rõ rệt."
- "Cá nhân gắn bó đủ lâu hoặc phụ thuộc chặt chẽ vào vị trí chức vụ hiện tại."
exceptions:
- "Những nhà lãnh đạo cấp cao đã trải qua luân chuyển đa chức năng (Cross-functional Leaders) có khả năng tự thoát khỏi chiếc ghế cục bộ để nhìn từ góc độ toàn doanh nghiệp."
- "Các nhóm đặc nhiệm liên chức năng (Cross-functional Squads) cùng chia sẻ chung một mục tiêu đầu ra duy nhất."
applications:
  management:
  - "Khi nghe báo cáo hoặc lời khuyên từ một chuyên gia hay trưởng bộ phận, luôn tự hỏi: 'Chiếc ghế của người này đang buộc họ phải phóng đại rủi ro nào và che khuất cơ hội nào?'."
  - "Áp dụng kỹ thuật 'Hoán đổi chiếc ghế' (Role Reversal Exercise) trong các cuộc họp chiến lược: Bắt Giám đốc Kinh doanh trình bày phương án bảo vệ dòng tiền của Kế toán, và bắt Kế toán trình bày phương án giữ chân khách hàng của Kinh doanh."
  collaboration:
  - "Thực hiện chương trình Luân chuyển Cán bộ Nguồn (Executive Rotation) qua tối thiểu 2 khối chức năng đối lập (ví dụ: Tiền tuyến Kinh doanh và Hậu phương Vận hành) trước khi bổ nhiệm lên vị trí Phó Tổng Giám đốc."
risks:
- "Ngây thơ tin rằng ý kiến của một bộ phận chuyên môn là chân lý toàn diện của cả công ty."
- "Quy kết góc nhìn thận trọng của bộ phận Kiểm soát/Pháp chế là 'tư duy bàn lùi, phá hoại', hoặc quy kết sự nóng vội của bộ phận Kinh doanh là 'vô kỷ luật'."
- "Thiết kế một vai trò vừa đá bóng vừa thổi còi (xung đột lợi ích ngay trong cùng một chiếc ghế)."
evidence:
  level: strong
  references:
  - "Hàn Phi Tử - Thiên Bát Thuyết & Nạn Nhất (Phân tích sâu sắc cách vị trí của người giữ kho, người cầm quân và người làm mưu sĩ định hình lời tấu trình của họ lên nhà vua)"
  - "Rufus E. Miles Jr. - The Origin and Meaning of Miles' Law (Public Administration Review, 1978: 'Where you stand depends on where you sit' — Lập trường của bạn phụ thuộc vào chiếc ghế bạn đang ngồi)"
  - "Dearborn & Simon - Selective Perception: A Note on the Departmental Identification of Executives (Nghiên cứu kinh điển của Herbert Simon: Khi đọc cùng một hồ sơ tình huống doanh nghiệp, 83% Giám đốc Sales chỉ nhìn thấy vấn đề bán hàng, 80% Giám đốc Tài chính chỉ nhìn thấy vấn đề tài chính)"
  - "Philip Zimbardo - The Lucifer Effect (Sức mạnh của Vai trò và Ngữ cảnh thể chế trong việc tái định hình hoàn toàn nhận thức và hành vi của cá nhân)"
