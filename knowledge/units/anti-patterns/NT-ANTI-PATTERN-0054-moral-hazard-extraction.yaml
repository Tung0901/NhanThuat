id: NT-ANTI-PATTERN-0054
type: anti-pattern
status: frozen
version: 0.1.0
title: Trục lợi từ rủi ro đạo đức
summary: Thiết kế các mô hình kinh doanh hoặc sản phẩm tài chính nhằm thu lợi nhuận tức thì trong khi đẩy các rủi ro đuôi dài hạn sang cho những khách hàng không hề hay biết.
primary_domain: tu-than
secondary_domains:
- hop-chung
definition: Sự trục lợi từ rủi ro đạo đức xảy ra khi các nhà lãnh đạo kiếm lợi bằng cách chấp nhận những rủi ro cực đoan và bị che giấu.
mechanism:
- Cấp quản lý tạo ra sản phẩm chứa rủi ro đuôi (tail risk).
- Cấp quản lý nhận các khoản tiền thưởng.
- Rủi ro đuôi xảy ra.
- Cấp quản lý vẫn giữ lại các khoản tiền thưởng.
conditions:
- Thị trường tài chính và cho vay thiếu sự kiểm soát hoặc bị nới lỏng quy chế.
exceptions:
- Các khoản đầu tư mạo hiểm mang tính đầu cơ đã được công bố thông tin đầy đủ.
applications:
  product_governance:
  - Kiểm toán các sản phẩm tài chính và phần mềm để phát hiện các cấu trúc rủi ro đạo đức tiềm ẩn.
risks:
- Hạn chế các hoạt động đổi mới sáng tạo tài chính hợp pháp.
evidence:
  level: supported
  references:
  - EV-REQ-0020-01
