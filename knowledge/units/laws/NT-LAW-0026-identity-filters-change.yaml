id: NT-LAW-0026
type: law
status: frozen
version: 0.1.0
title: Bản sắc định hình sự thay đổi
summary: Mọi người đánh giá sự thay đổi một phần dựa trên việc liệu nó đe dọa hay bảo vệ bản sắc cá nhân và vị trí thuộc về của họ.
primary_domain: tri-nhan
secondary_domains:
- tu-than
- hop-chung
definition: Sự thay đổi sẽ dễ được đón nhận hơn khi nó có thể hòa nhập vào bản sắc, vai trò và cảm giác thuộc về của một người, thay vì bị xem như sự xóa bỏ chính mình.
mechanism:
- So sánh sự thay đổi với hình ảnh bản thân
- Bảo vệ cảm giác thuộc về
- Chấp nhận hoặc từ chối cách diễn giải.
conditions:
- Một yêu cầu tác động đến vai trò
- địa vị
- các giá trị
- năng lực
- hoặc tư cách thành viên nhóm.
exceptions:
- Áp lực sinh tồn khẩn cấp có thể vượt qua những bận tâm về bản sắc
- Sự tự chiêm nghiệm chín chắn có thể nới lỏng cơ chế phòng vệ bản sắc.
applications:
  change:
  - Định hình sự thay đổi như một sự tiếp nối các giá trị cốt lõi khi có cơ sở thực tế.
  coaching:
  - Bảo vệ lòng tự trọng trong khi khuyến khích hành vi mới.
risks:
- Thao túng bản sắc cá nhân
- Duy trì những quan niệm sai lệch hoặc có hại về bản thân.
