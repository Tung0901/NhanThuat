id: NT-PRINCIPLE-0017
type: principle
status: frozen
version: 0.1.0
title: Xây dựng niềm tin bằng những cam kết nhỏ
summary: Dùng các cam kết được thực hiện rõ ràng, lặp lại và giữ trọn để xây dựng hoặc tái dựng niềm tin trước khi dựa vào sự phụ thuộc lớn hơn.
primary_domain: hop-chung
secondary_domains:
- dung-nhan
- thanh-su
definition: Cam kết nhỏ tạo ra bằng chứng về độ tin cậy có thể nâng đỡ sự hợp tác lớn hơn sau này.
mechanism:
- Đưa ra một cam kết cụ thể.
- Thực hiện cam kết một cách rõ ràng.
- Để niềm tin tích lũy dần.
conditions:
- Con người sẽ tương tác lại với nhau.
- Độ tin cậy đang không chắc chắn hoặc bị tổn hại.
exceptions:
- Một số mối quan hệ đòi hỏi niềm tin rủi ro cao tức thời.
- Vi phạm nghiêm trọng có thể cần sửa chữa vượt quá những lời hứa nhỏ.
applications:
  teamwork:
  - Bắt đầu tái dựng độ tin cậy bằng các cam kết chu kỳ ngắn.
  leadership:
  - Làm cho các cam kết có thể theo dõi được.
risks:
- Dùng lời hứa nhỏ để che giấu sự thiếu tin cậy lớn.
- Hứa quá nhiều để trông đáng tin.
