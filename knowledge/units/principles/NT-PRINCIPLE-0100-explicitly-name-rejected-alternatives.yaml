created_at: '2026-07-22'
updated_at: '2026-09-14'
mechanism:
- Trong hồ sơ quyết định chiến lược, liệt kê các phương án khả thi đã xem xét.
- Ghi rõ lý do từ chối từng phương án kèm giả định và dữ liệu.
- Công bố danh sách phương án bị bác bỏ cho các bên liên quan chủ chốt.
- Dùng danh sách này làm mốc kiểm tra khi bối cảnh thay đổi.
- Rà soát định kỳ xem các phương án bị bác bỏ có cần được xem xét lại.
