id: NT-LAW-0031
type: law
status: frozen
version: 0.1.0
title: Fear drives short-term urgency over long-term commitment
summary: Threat and fear evoke rapid compliance and narrow focus, but erode long-term initiative, creative risk-taking, and durable organizational engagement.
primary_domain: tu-than
secondary_domains: [tri-nhan, hop-chung]
definition: Perceived threat triggers defensive urgency that mobilizes immediate avoidance or compliance, but suppresses high-judgment exploration and long-term loyalty.
mechanism: [Perceive threat, Mobilize defensive urgency, Narrow cognitive field, Erode long-term commitment.]
conditions: [High pressure, threat of punishment, or social insecurity is present.]
exceptions: [Immediate physical hazard defense requires short-term emergency threat signals.]
applications: {leadership: [Avoid using fear to drive complex or innovation-heavy initiatives.], risk-management: [Separate safety urgency from daily motivational culture.]}
risks: [Mistaking short-term compliance for long-term motivation, inducing chronic anxiety.]
evidence: {level: provisional, references: []}
relations: {supports: [NT-PRINCIPLE-0054, NT-PRINCIPLE-0059, NT-ANTI-PATTERN-0006], conflicts_with: [], depends_on: [NT-LAW-0025], applies_to: []}
tags: [motivation, fear, urgency, commitment]
