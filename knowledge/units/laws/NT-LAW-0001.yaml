id: NT-LAW-0001
type: law
status: draft
version: 0.1.0
title: Quy luật lợi ích chi phối hành vi
summary: Con người có xu hướng chọn hành vi mà họ nhận thức là bảo vệ hoặc gia tăng lợi ích của mình.
primary_domain: tri-nhan
secondary_domains: [dung-nhan, thanh-su]
definition: Lợi ích được chủ thể cảm nhận thường tác động đến việc đánh giá và lựa chọn giữa các phương án hành động.
mechanism:
  - Nhận thức một nhu cầu hoặc nguy cơ.
  - Đánh giá lợi ích và chi phí của các phương án.
  - Chọn phương án được cảm nhận là có lợi hơn.
conditions:
  - Chủ thể có khả năng lựa chọn.
  - Chủ thể nhận thức được ít nhất hai phương án.
exceptions:
  - Hành vi do cưỡng ép hoặc phản xạ.
  - Nhận thức bị chi phối bởi thông tin sai lệch nghiêm trọng.
applications:
  management: [Làm rõ lợi ích mà mỗi bên thực sự nhận thức trước khi thiết kế động lực.]
  negotiation: [Khám phá lợi ích phía sau vị thế được tuyên bố.]
risks:
  - Đồng nhất lợi ích với tiền bạc.
  - Giả định con người luôn hành động hoàn toàn lý trí.
