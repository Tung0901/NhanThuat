id: NT-PHENOMENON-3203
type: phenomenon
title: Lịch trình phần thưởng biến đổi
summary: Phần thưởng được trao theo lịch trình tỷ lệ biến đổi không thể đoán trước rất hiệu quả trong việc duy trì hành vi liên tục.
primary_domain: tri-nhan
domain_area: NT-DA-0028
definition: Một hiện tượng điều kiện hóa bằng phản xạ, trong đó các hành vi được củng cố một cách không thể đoán trước có khả năng chống lại sự tắt (extinction) cao hơn các hành vi được củng cố mỗi lần.
mechanism:
- Một hành động được thực hiện.
- Phần thưởng chỉ được trao trong một số lần, hoặc độ lớn của phần thưởng biến thiên.
- Sự không chắc chắn kích hoạt sự mong đợi dopamine tăng cao, thúc đẩy sự lặp lại mang tính cưỡng bách.
conditions:
- 'Các hành vi mà người dùng có quyền chủ động kích hoạt lặp lại quy trình (ví dụ: kéo cần máy đánh bạc, kéo xuống để làm mới bảng tin).'
exceptions:
- Việc làm hưởng lương cố định; phần mềm tiện ích có thể dự đoán được.
applications:
  engagement:
  - Đưa sự biến đổi vào nội dung hoặc thời điểm gửi thông báo để tăng mức độ tương tác.
risks:
- Có thể dễ dàng rơi vào thiết kế gây nghiện, phi đạo đức ('sludge').
evidence:
  level: strong
  references:
  - Skinner, B. F. (1953). 'Science and Human Behavior'. Macmillan.
