id: NT-PRINCIPLE-0019
type: principle
status: frozen
version: 0.1.0
title: Nêu tên sự đánh đổi
summary: Trong xung đột dai dẳng, hãy nêu rõ ràng những gì không thể được tối đa hóa cùng lúc trước khi tranh luận về giải pháp.
primary_domain: hop-chung
secondary_domains:
- thanh-su
- tri-nhan
definition: Nêu tên sự đánh đổi biến xung đột từ đối kháng cá nhân thành một quyết định về ưu tiên và chi phí.
mechanism:
- Xác định xung đột tái diễn.
- Nêu tên các lợi ích cạnh tranh.
- Quyết định hoặc tái thiết kế sự đánh đổi.
conditions:
- Xung đột tái diễn.
- Các bên đang bảo vệ những chi phí hoặc giá trị khác nhau.
exceptions:
- Ý định xấu có thể không phản ứng với sự rõ ràng.
- Một số xung đột trước hết là về sự kiện.
applications:
  strategy:
  - Nêu rõ ưu tiên nào thắng thế trong điều kiện ràng buộc.
  mediation:
  - Chuyển từ đổ lỗi sang các lợi ích cạnh tranh.
risks:
- Đơn giản hóa quá mức các vấn đề đạo đức.
- Nêu tên sự đánh đổi mà không quyết định chúng.
