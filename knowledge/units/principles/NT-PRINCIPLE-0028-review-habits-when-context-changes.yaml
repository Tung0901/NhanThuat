id: NT-PRINCIPLE-0028
type: principle
status: frozen
version: 0.1.0
title: Rà soát thói quen khi bối cảnh thay đổi
summary: Khi bối cảnh thay đổi, hãy xem xét các thói quen cũ trước khi giả định chúng vẫn phục vụ mục tiêu.
primary_domain: tu-than
secondary_domains:
- thanh-su
- dung-nhan
definition: Thói quen từng tiết kiệm nỗ lực có thể trở thành gánh nặng vô hình khi bối cảnh xung quanh thay đổi.
mechanism:
- Nhận ra sự dịch chuyển bối cảnh.
- Rà soát hành vi mặc định.
- Giữ, thích ứng hoặc ngừng thói quen.
conditions:
- Một thói quen tồn tại dai dẳng.
- Môi trường hoặc mục tiêu đã thay đổi.
exceptions:
- Các kỷ luật cốt lõi có thể vẫn hữu ích.
- Rà soát quá nhiều có thể làm mất ổn định các thói quen tốt.
applications:
  change:
  - Kiểm toán thói quen sau các thay đổi chiến lược.
  operations:
  - Ngừng các mặc định không còn phù hợp với rủi ro.
risks:
- Thay đổi thói quen vì sự mới lạ.
- Phớt lờ tri thức ngầm gắn trong thói quen.
