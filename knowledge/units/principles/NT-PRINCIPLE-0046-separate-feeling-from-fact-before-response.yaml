id: NT-PRINCIPLE-0046
type: principle
status: frozen
version: 0.1.0
title: Separate feeling from fact before response
summary: When emotion is strong, separate felt meaning from observed fact before choosing a response.
primary_domain: tri-nhan
secondary_domains: [dung-nhan, hop-chung]
definition: Emotion prepares action quickly, so separating feeling, interpretation, and observable fact creates room for judgment without denying emotion.
mechanism: [Name the feeling, Name the interpretation, Identify observable facts, Choose response.]
conditions: [Emotion is shaping attention or action, The situation allows a pause.]
exceptions: [Immediate danger may require action first, over-analysis can suppress useful emotional signals.]
applications: {self-management: [Pause before treating felt meaning as full reality.], leadership: [Help groups distinguish emotional signal from verified fact.]}
risks: [Dismissing emotion, delaying necessary action.]
