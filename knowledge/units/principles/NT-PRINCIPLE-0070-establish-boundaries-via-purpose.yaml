mechanism:
- Xác định mục đích và kết quả mong muốn ở mức kết quả, không phải các bước.
- 'Nêu rõ các ranh giới không được vượt qua: ngân sách, pháp lý, giá trị.'
- Trao quyền tự quyết trong phạm vi ranh giới đã định.
- Đánh giá kết quả theo mục đích và mức tuân thủ ranh giới.
