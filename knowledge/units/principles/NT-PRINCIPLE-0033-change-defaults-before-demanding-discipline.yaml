id: NT-PRINCIPLE-0033
type: principle
status: frozen
version: 0.1.0
title: Thay đổi mặc định trước khi đòi hỏi kỷ luật
summary: Khi một khuôn mẫu xấu lặp lại, hãy thiết kế lại con đường mặc định trước khi dựa vào kỷ luật cá nhân mạnh hơn.
primary_domain: thanh-su
secondary_domains:
- tu-than
- dung-nhan
definition: Mặc định của hệ thống thường lấn át ý định, nên mặc định tốt hơn khiến hành vi mong muốn dễ thực hiện và ít phụ thuộc năng lượng hơn.
mechanism:
- Tìm thất bại lặp lại
- Xác định con đường mặc định
- Thiết kế lại mặc định theo hướng hành vi mong muốn.
conditions:
- Khuôn mẫu lặp lại
- Mặc định có thể được thay đổi.
exceptions:
- Một số vấn đề cần trách nhiệm giải trình trực tiếp
- Thiết kế lại quá mức có thể tránh né việc rèn luyện kỹ năng cần thiết.
applications:
  operations:
  - Làm cho con đường an toàn trở thành con đường dễ dàng.
  management:
  - Khắc phục bẫy quy trình lặp lại trước khi đổ lỗi cho nỗ lực.
risks:
- Loại bỏ trách nhiệm cá nhân
- Tạo ra hệ thống cứng nhắc.
evidence:
