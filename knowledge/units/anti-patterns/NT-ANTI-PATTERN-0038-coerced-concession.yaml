id: NT-ANTI-PATTERN-0038
type: anti-pattern
status: frozen
version: 0.2.0
title: Nhượng bộ Cưỡng ép
summary: Một bên bị ép đưa ra nhượng bộ ngoài ý muốn bằng áp lực thời gian, quyền lực hoặc đe dọa. Thỏa thuận đạt được nhưng không bền vững và phá vỡ quan hệ dài hạn.
primary_domain: thanh-su
secondary_domains:
- dung-nhan
definition: Nhượng bộ cưỡng ép là phản-mẫu đàm phán trong đó sự nhượng bộ được tạo ra bằng áp lực thay vì trao đổi lợi ích thực chất, dẫn đến thỏa thuận thiếu cam kết và hệ quả tiêu cực về sau.
conditions:
- Có bất đối xứng quyền lực hoặc lợi thế thời gian rõ rệt.
- Bên yếu thế không có phương án thay thế tốt.
exceptions:
- Trường hợp bảo vệ lợi ích cộng đồng cần biện pháp cưỡng chế theo luật.
- Đàm phán phân chia tài sản theo phán quyết có thẩm quyền.
applications:
  negotiation:
  - Tránh dùng thời hạn nhân tạo và đe dọa để buộc nhượng bộ.
  - Xây dựng phương án thay thế trước khi bước vào đàm phán quan trọng.
  procurement:
  - Ghi nhận và xử lý các dấu hiệu ép giá bằng áp lực trong chuỗi cung ứng.
  leadership:
  - Không dùng áp lực vị trí để đạt đồng thuận hình thức trong các cuộc đàm phán nội bộ.
risks:
- Thỏa thuận hình thành trên giấy nhưng thất bại trong thực thi.
- Quan hệ đối tác dài hạn bị phá vỡ.
- Xung đột leo thang khi bên bị ép tìm cách phục hồi thế cân bằng.
evidence:
  level: supported
  references:
  - EV-REQ-0001-01
