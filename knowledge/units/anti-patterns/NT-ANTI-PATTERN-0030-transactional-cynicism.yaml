id: NT-ANTI-PATTERN-0030
type: anti-pattern
status: frozen
version: 0.2.0
title: Thái độ hoài nghi mang tính giao dịch
summary: Quan hệ trong tổ chức bị thương mại hóa thuần túy, thiếu niềm tin và cam kết lâu dài. Con người chỉ làm đủ mức để được trả công, không đóng góp thêm cho tổ chức.
primary_domain: hop-chung
secondary_domains:
- tri-nhan
definition: Thái độ hoài nghi mang tính giao dịch là phản-mẫu văn hóa trong đó quan hệ làm việc bị rút gọn thành trao đổi lợi ích thuần túy, triệt tiêu sự tin tưởng, cam kết và lựa chọn vị tha.
conditions:
- Chính sách đãi ngộ và đánh giá chỉ tập trung vào số lượng đầu ra.
- Tổ chức có lịch sử phá vỡ cam kết với nhân sự.
exceptions:
- Một số vai trò thời vụ hợp pháp dựa trên trao đổi giao dịch thuần túy.
- Giai đoạn tái cấu trúc khẩn cấp có thể tạm giảm kỳ vọng cam kết dài hạn.
applications:
  culture:
  - Xây dựng chuẩn mực đối xử tôn trọng và cam kết hai chiều rõ ràng.
  - Ghi nhận đóng góp phi giao dịch như hỗ trợ đồng nghiệp và chia sẻ tri thức.
  management:
  - Bổ sung tiêu chí đánh giá ủng hộ hợp tác dài hạn bên cạnh chỉ số ngắn hạn.
  leadership:
  - Giữ lời và thực hiện đúng cam kết để xây dựng lại niềm tin.
risks:
- Mất lòng trung thành và mức dấn thân tự nguyện của nhân sự.
- Lan truyền thái độ hoài nghi sang người mới.
- Chi phí tuyển dụng và đào tạo tăng do tỷ lệ rời bỏ cao.
evidence:
  level: supported
  references:
  - EV-REQ-0001-01
relations:
