id: NT-LAW-0007
type: law
status: frozen
version: 1.0.0
title: "Quy luật năng lực giới hạn biên độ ủy quyền"
summary: "Sự ủy quyền chỉ thành công trong phạm vi năng lực thực chất, khả năng phán đoán tình huống, thẩm quyền tương xứng và hệ thống hỗ trợ sẵn có dành cho người nhận trọng trách."
primary_domain: dung-nhan
secondary_domains:
- thanh-su
- hop-chung
definition: "Trong nghệ thuật dụng nhân, trách nhiệm không thể được chuyển giao một cách hiệu quả nếu độ phức tạp của nhiệm vụ vượt quá năng lực phán đoán hiện tại và nguồn lực hỗ trợ của người được giao phó. Giao một trọng trách quá sức mà không kèm theo hành lang hướng dẫn hay thẩm quyền thực chất không phải là trao quyền (Empowerment), mà là sự thoái thác trách nhiệm của người lãnh đạo và đẩy thuộc cấp vào chỗ bại vong."
mechanism:
- "Định lượng độ khó nhiệm vụ: Xác định mức độ phức tạp của quyết định, rủi ro tài chính và kỹ năng điều phối mà vai trò đòi hỏi."
- "Thẩm định năng lực thực chiến: Đối chiếu yêu cầu công việc với kinh nghiệm đã được kiểm chứng (Track Record) và độ chín chắn trong phán đoán của nhân sự."
- "Căn chỉnh biên độ thẩm quyền: Cấp phát quyền tự quyết, ngân sách và công cụ kiểm soát tương ứng với mức độ trưởng thành của người nhận việc."
- "Thiết lập lưới an toàn hỗ trợ: Bổ sung cơ chế kèm cặp (Coaching), mốc kiểm tra trung gian (Checkpoints) tại những vùng năng lực nhân sự còn yếu."
- "Co giãn biên độ theo kết quả: Mở rộng dần quyền tự chủ khi nhân sự chứng minh được năng lực hoàn thành xuất sắc, hoặc thu hẹp tức thì khi xuất hiện dấu hiệu quá tải phán đoán."
conditions:
- "Nhiệm vụ đòi hỏi quyền làm chủ thực chất và khả năng tự ra quyết định trước các biến số phát sinh."
- "Sai lầm trong phán đoán của người được ủy quyền có tác động trực tiếp đến thành bại của dự án hoặc uy tín tổ chức."
- "Lãnh đạo có khả năng quan sát và đánh giá khách quan năng lực thực tế của cấp dưới."
exceptions:
- "Các bài toán rèn luyện thử thách (Stretch Assignments) được thiết kế có chủ đích trong môi trường rủi ro được kiểm soát chặt chẽ và có người kèm cặp sát sao."
- "Tình huống nguy cấp trên chiến trường khi tướng chỉ huy buộc phải ủy quyền khẩn cấp cho người tại chỗ dù năng lực chưa hoàn hảo để giữ nhịp phản ứng."
applications:
  management:
  - "Ủy quyền theo bộ tam hoàn chỉnh: Giao Kết quả kỳ vọng (Outcome) phải đi liền với Thẩm quyền quyết định (Authority) và Nguồn lực hỗ trợ (Support)."
  - "Áp dụng Lãnh đạo theo Tình huống (Situational Leadership): Nhân sự mới cần chỉ dẫn chi tiết cầm tay chỉ việc; nhân sự lão luyện cần trao mục tiêu và giải phóng không gian tự chủ."
  hiring:
  - "Kiểm tra năng lực phán đoán dưới áp lực thực tế thông qua bài tập tình huống thay vì chỉ tin vào bằng cấp hay lời tự giới thiệu trong phỏng vấn."
risks:
- "Ủy quyền đổ lỗi (Abdication disguised as Delegation): Quăng việc khó cho cấp dưới tự bơi, khi thất bại thì đem cấp dưới ra làm vật tế thần."
- "Bảo hộ quá mức (Over-protection): Đánh giá thấp tiềm năng trưởng thành của nhân tài, ôm đồm mọi quyết định khiến đội ngũ mãi mãi phụ thuộc."
- "Trao thanh kiếm sắc cho đứa trẻ chưa đủ sức cầm: Trao quyền lực lớn cho người chưa đủ bản lĩnh và đạo đức, dẫn đến lạm quyền và phá vỡ tổ chức."
evidence:
  level: supported
  references:
  - "Tôn Tử Binh Pháp - Thiên Quân Tranh & Cửu Biến (Nguyên tắc 'Tướng năng nhi quân bất ngự giả thắng' — Tướng có đủ năng lực thực chiến thì vua không can thiệp từ xa ắt thắng; nhưng trước đó phải xét kỹ Ngũ Sự: Trí, Tín, Nhân, Dũng, Nghiêm)"
  - "Gia Cát Lượng - Tướng Uyển (Luận về Bát Quan khảo sát năng lực tướng lĩnh và bài học đau đớn khi giao nhầm trọng trách trấn thủ Nhai Đình cho Mã谡 — người giỏi lý thuyết suông nhưng thiếu năng lực thực chiến)"
  - "Elliott Jaques - Requisite Organization (Học thuyết Time-Span of Discretion: Năng lực nhận thức của mỗi cá nhân có một tầm nhìn thời gian giới hạn, giao việc vượt quá tầng nhận thức sẽ gây sụp đổ)"
  - "Paul Hersey & Ken Blanchard - Management of Organizational Behavior (Mô hình Lãnh đạo Tình huống SLII: Căn chỉnh mức độ ủy quyền theo Năng lực và Sự cam kết của nhân viên)"
