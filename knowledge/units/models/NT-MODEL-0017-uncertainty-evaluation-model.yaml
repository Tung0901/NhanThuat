mechanism:
- Xác định các điều đã biết chắc chắn trong tình huống.
- Liệt kê các điều biết là chưa biết và đặt câu hỏi cần trả lời.
- Nhận diện vùng chưa biết là chưa biết cần thăm dò trước khi phân tích.
- Xác định vùng mơ hồ về tiêu chí và cách diễn giải để xử lý riêng.
