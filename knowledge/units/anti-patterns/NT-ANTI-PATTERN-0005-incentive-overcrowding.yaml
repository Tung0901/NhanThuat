id: NT-ANTI-PATTERN-0005
type: anti-pattern
status: frozen
version: 0.1.0
title: Chồng chất thưởng vi mô
summary: Gắn tiền thưởng cứng nhắc hoặc phần thưởng vi mô vào mọi công việc, làm triệt tiêu niềm yêu thích nội tại, khuyến khích hành vi thao túng chỉ số và làm giảm nỗ lực khi tiền thưởng bị ngưng.
primary_domain: tu-than
secondary_domains:
- tri-nhan
- thanh-su
definition: Một thất bại trong quản trị mang tính giao dịch, nơi các động lực ngoại tại thay thế tinh thần làm chủ nội tại, dẫn đến sự tuân thủ thiếu lòng tự hào về chuyên môn.
mechanism:
- Tiền tệ hóa mọi công việc thường nhật
- Làm xói mòn sự hứng thú nội tại
- Khuyến khích hành vi thao túng chỉ số
- Ngừng nỗ lực khi tiền thưởng bị dừng.
conditions:
- Ban quản lý cố gắng thúc đẩy hiệu suất hoàn toàn bằng các khoản thưởng vi mô.
exceptions:
- Công việc khoán đơn giản có tỷ lệ nghỉ việc cao, nơi không yêu cầu cam kết dài hạn với tổ chức.
applications:
  review:
  - Kiểm toán các chương trình thưởng để đảm bảo chúng không phá hủy động lực nội tại với công việc.
  incentive-design:
  - Duy trì mức lương cơ bản công bằng và tách biệt công việc hàng ngày khỏi các khoản thưởng vi mô.
risks:
- Cắt giảm đột ngột tiền thưởng mà không khôi phục lại ý nghĩa và mục đích nội tại.
