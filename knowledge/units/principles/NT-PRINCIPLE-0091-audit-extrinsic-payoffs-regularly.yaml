id: NT-PRINCIPLE-0091
type: principle
status: frozen
version: 0.1.0
title: Kiểm toán định kỳ các khoản khuyến khích ngoại sinh
summary: Liên tục rà soát các chương trình khuyến khích nhằm phát hiện các hành vi lách luật bất ngờ, hệ quả ngoài ý muốn và sự trôi dạt của chỉ số.
primary_domain: tu-than
secondary_domains:
- tri-nhan
definition: Hệ thống khuyến khích chắc chắn sẽ tạo ra những hành vi ở vùng biên mà ta không lường trước được.
conditions:
- Quản lý tích cực các công thức tính lương thưởng và hoa hồng bán hàng.
exceptions:
- Lịch trình trao quyền cổ phần dài hạn cố định theo thỏa thuận pháp lý.
applications:
  governance:
  - Tiến hành kiểm toán khuyến khích theo quý nhằm phân tích các hành vi lách luật ngoài ý muốn.
risks:
- Thay đổi quy tắc khuyến khích quá thường xuyên gây bất ổn cho nhân viên.
