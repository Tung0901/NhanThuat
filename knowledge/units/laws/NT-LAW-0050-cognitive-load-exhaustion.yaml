mechanism:
- Các tác vụ phán đoán và tự điều chỉnh tiêu hao năng lực nhận thức.
- Tải kéo dài không có khoảng phục hồi làm nguồn lực cạn dần.
- Khả năng kiểm soát xung lực và cân nhắc dài hạn suy giảm.
- Hành vi rơi về mặc định quen thuộc, né tránh quyết định hoặc cáu gắt.
