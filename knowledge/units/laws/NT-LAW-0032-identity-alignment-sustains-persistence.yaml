id: NT-LAW-0032
type: law
status: frozen
version: 0.1.0
title: Bản sắc cá nhân duy trì nỗ lực bền bỉ
summary: Nỗ lực trở nên bền bỉ hơn đáng kể khi một hành động được xem là phản ánh bản sắc của một người thay vì chỉ là việc họ bị bắt buộc phải thực hiện.
primary_domain: tu-than
secondary_domains:
- tri-nhan
- dung-nhan
definition: Sự kiên trì bền vững gia tăng khi hành động duy trì liên tục thể hiện, củng cố hoặc hòa nhập vào khái niệm bản thân, giá trị hoặc bản sắc nghề nghiệp của một cá nhân.
mechanism:
- Nhận biết sự tương thích với bản sắc
- Nội hóa tính phù hợp của mục tiêu
- Huy động nỗ lực nhất quán với bản sắc
- Kháng cự lại sự thoái chí từ bên ngoài.
conditions:
- Cá nhân sở hữu nhận thức ổn định về bản thân và các giá trị cá nhân hoặc nghề nghiệp rõ ràng.
exceptions:
- Tình trạng kiệt quệ nguồn lực nghiêm trọng có thể tạm thời làm gián đoạn sự kiên trì do bản sắc thúc đẩy.
applications:
  role-placement:
  - Gắn kết nhiệm vụ được giao với bản sắc chuyên môn cá nhân và các tiêu chuẩn nghề nghiệp.
  culture-building:
  - Xây dựng bản sắc nhóm chung nhằm củng cố các thói quen vận hành cốt lõi.
risks:
- Sự cứng nhắc về mặt bản sắc
- Phản ứng phòng vệ, từ chối những thay đổi cần thiết mang tính thách thức bản sắc.
