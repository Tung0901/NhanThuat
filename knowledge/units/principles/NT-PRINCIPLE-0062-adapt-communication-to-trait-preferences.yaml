id: NT-PRINCIPLE-0062
type: principle
status: frozen
version: 0.1.0
title: Thích ứng cách truyền đạt theo sở thích đặc tính
summary: Điều chỉnh định dạng truyền đạt cho phù hợp với mặc định xử lý nhận thức của người nhận mà không vượt qua ranh giới thành thao túng hành vi.
primary_domain: tri-nhan
secondary_domains:
- tu-than
definition: 'Căn chỉnh định dạng truyền đạt (ví dụ: văn bản so với lời nói, có cấu trúc so với tự phát) với sở thích xử lý nhận thức tương đối ổn định của người nhận để giảm tải xử lý và ngăn ngừa hiểu lầm. Các thích ứng phải minh bạch và mang tính hỗ trợ, không bao giờ thao túng.'
mechanism:
- Xác định các mặc định nhận thức tiềm ẩn và phong cách tương tác của người nhận.
- Định dạng việc truyền đạt (kênh, cấu trúc, nhịp độ) để khớp với các mặc định này.
- Quan sát xem biểu hiện đặc tính có được kích hoạt một cách tích cực, dẫn đến hành vi rõ ràng hay không.
conditions:
- Thông tin nhiệm vụ quan trọng cần được chia sẻ hoặc cần có sự hợp tác liên tục.
exceptions:
- Các tình huống khủng hoảng đòi hỏi định dạng truyền đạt tiêu chuẩn, tức thì bất kể sở thích cá nhân.
applications:
  leadership:
  - Điều chỉnh định dạng phản hồi (tóm tắt văn bản so với thảo luận trực tiếp) cho phù hợp với từng thành viên nhóm.
  delegation:
  - Trình bày hướng dẫn nhiệm vụ theo phong cách có cấu trúc hoặc tự phát dựa trên sở thích của người nhận.
risks:
- Dùng định dạng thích ứng để thao túng hành vi hoặc vượt qua các giới hạn truyền đạt đạo đức.
- Làm phức tạp hóa các truyền đạt chuẩn bằng cách chiều theo những sở thích nhỏ.
evidence:
  level: provisional
  references:
  - Mayer, R. E. (2002). Cognitive Theory of Multimedia Learning.
