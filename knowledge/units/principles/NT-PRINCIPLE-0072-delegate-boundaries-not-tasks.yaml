id: NT-PRINCIPLE-0072
type: principle
status: frozen
version: 0.2.0
title: Ủy quyền ranh giới thay vì nhiệm vụ
summary: Trao quyền quyết định trong ranh giới rõ ràng thay vì giao từng nhiệm vụ cụ thể. Ủy quyền ranh giới phát triển năng lực và giảm phụ thuộc vào người giao việc.
primary_domain: dung-nhan
secondary_domains:
- tri-nhan
definition: 'Ủy quyền ranh giới thay vì nhiệm vụ là nguyên tắc giao quyền theo miền trách nhiệm: xác định phạm vi quyết định, tiêu chuẩn thành công và giới hạn, thay vì liệt kê từng việc cần làm.'
conditions:
- Người nhận có năng lực nền tảng trong miền trách nhiệm.
- Ranh giới có thể xác định rõ ràng và quan sát được.
exceptions:
- Công việc mới hoặc rủi ro cao cần hướng dẫn nhiệm vụ chi tiết giai đoạn đầu.
- Vai trò thực thi quy trình cố định theo quy định bắt buộc.
applications:
  delegation:
  - Giao miền trách nhiệm kèm ngân sách và quyền quyết định rõ ràng.
  - Thống nhất tiêu chí thành công trước khi giao quyền.
  management:
  - Chuyển từ duyệt từng việc sang giám sát kết quả và ranh giới.
  talent-development:
  - Mở rộng dần miền trách nhiệm theo năng lực đã chứng minh.
risks:
- Ranh giới mơ hồ dẫn tới quyết định vượt thẩm quyền.
- Người giao vẫn can thiệp chi tiết bên trong ranh giới đã trao.
- Không có cơ chế leo thang khi vấn đề vượt ranh giới.
evidence:
