id: NT-LAW-0045
type: law
status: frozen
version: 0.1.0
title: Phân nhánh Thoái thác - Kiểm soát Quá mức
summary: Đơn vị tri thức cấu trúc về Sự phân nhánh giữa Thoái thác và Kiểm soát Quá mức.
primary_domain: dung-nhan
secondary_domains:
- tri-nhan
definition: Định nghĩa chính thức về Phân nhánh Thoái thác - Kiểm soát Quá mức trong cấu trúc kiến trúc Nhân Thuật.
conditions:
- Các bối cảnh quản trị và vận hành tổ chức.
exceptions:
- Các trường hợp can thiệp khẩn cấp khi xảy ra khủng hoảng.
applications:
  governance:
  - Áp dụng Phân nhánh Thoái thác - Kiểm soát Quá mức vào các luồng quy trình công việc của tổ chức.
risks:
- Việc áp dụng sai Phân nhánh Thoái thác - Kiểm soát Quá mức dẫn đến hiệu suất vận hành kém tối ưu.
