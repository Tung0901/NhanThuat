id: NT-MODEL-3202
type: model
title: Mô hình hành vi Fogg (B=MAP)
summary: 'Hành vi (B) xảy ra khi ba yếu tố hội tụ cùng một thời điểm: Động lực (M), Khả năng (A) và Lời nhắc (P).'
primary_domain: tri-nhan
domain_area: NT-DA-0028
definition: Khung tham chiếu có hệ thống nhằm thấu hiểu và thiết kế hành vi của con người, khẳng định rằng nếu thiếu hoặc không đủ bất kỳ yếu tố nào trong ba yếu tố trên thì hành vi mục tiêu sẽ không xảy ra.
mechanism:
- Động lực quyết định mức độ mong muốn thực hiện hành vi.
- Khả năng xác định mức độ dễ dàng để thực hiện hành vi đó.
- Lời nhắc đóng vai trò kích hoạt hành vi.
- Nếu động lực thấp, khả năng thực hiện phải cực kỳ cao (dễ làm). Nếu khả năng thực hiện thấp (khó làm), động lực phải cực kỳ cao.
conditions:
- Thiết kế tương tác, sản phẩm hoặc các quy trình vận hành mới trong tổ chức.
exceptions:
- Các phản xạ sinh lý không tự chủ.
applications:
  product_design:
  - Luôn tối ưu hóa Khả năng (làm cho việc thực hiện dễ dàng hơn) trước khi cố gắng gia tăng Động lực một cách gượng ép.
risks:
- Chỉ phụ thuộc vào các bài phát biểu truyền 'Động lực' mà bỏ qua rào cản cản trở hành vi (Khả năng thực hiện).
evidence:
  level: strong
  references:
  - Fogg, B. J. (2009). 'A behavior model for persuasive design'. Persuasive Technology.
