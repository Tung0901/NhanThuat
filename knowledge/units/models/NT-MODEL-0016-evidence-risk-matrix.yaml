id: NT-MODEL-0016
type: model
status: frozen
version: 0.2.0
title: Ma trận Rủi ro Bằng chứng
summary: Ma trận đối chiếu hai chiều mức độ mạnh của bằng chứng và mức độ rủi ro của quyết định. Mỗi vùng ma trận yêu cầu mức xác minh và thẩm quyền phê duyệt khác nhau.
primary_domain: tri-nhan
secondary_domains:
- dung-nhan
definition: 'Ma trận Rủi ro Bằng chứng là khung phân loại quyết định theo chất lượng bằng chứng hiện có và mức tổn thất tiềm ẩn nếu sai, xác định bốn vùng: quyết định nhanh, quyết định cần thêm dữ liệu, quyết định cần thẩm quyền cao, và quyết định cấm cho tới khi có bằng chứng.'
conditions:
- Có thể ước lượng tương đối chất lượng bằng chứng và mức rủi ro.
- Quy trình phê duyệt cho phép áp dụng mức khác nhau theo vùng.
exceptions:
- Tình huống khẩn cấp buộc hành động trước khi đủ bằng chứng.
- Bằng chứng yếu nhưng cơ hội có cửa sổ thời gian ngắn cần quyết định nhanh.
applications:
  governance:
  - Gắn mức thẩm quyền phê duyệt với từng vùng của ma trận.
  - Yêu cầu bổ sung bằng chứng cho các quyết định rủi ro cao.
  risk-management:
  - Phân loại danh mục quyết định theo ma trận để phân bổ nguồn lực xác minh.
  decision-making:
  - Dùng ma trận làm ngôn ngữ chung khi thảo luận mức độ sẵn sàng quyết định.
risks:
- Đánh giá bằng chứng và rủi ro theo cảm tính chủ quan.
- Áp dụng máy móc ma trận cho tình huống đặc thù.
- Trì hoãn vô hạn các quyết định ở vùng cần thêm bằng chứng.
evidence:
