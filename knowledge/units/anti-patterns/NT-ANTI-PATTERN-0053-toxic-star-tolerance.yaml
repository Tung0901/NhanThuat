id: NT-ANTI-PATTERN-0053
type: anti-pattern
status: frozen
version: 0.1.0
title: Dung túng ngôi sao độc hại
summary: Dung túng hành vi lạm dụng hoặc không trung thực từ một nhân sự tạo doanh thu hàng đầu, làm hủy hoại sự an toàn tâm lý của cả đội ngũ.
primary_domain: hop-chung
secondary_domains:
- tri-nhan
definition: Sự dung túng ngôi sao độc hại xảy ra khi ban quản lý bỏ qua hoặc biện hộ cho hành vi lạm dụng của một nhân viên bán hàng xuất sắc hoặc một kỹ sư ngôi sao.
mechanism:
- Nhân sự xuất sắc có hành vi lạm dụng.
- Ban quản lý nhắm mắt làm ngơ.
- Các nhân viên giỏi rời bỏ tổ chức.
- Hiệu suất dài hạn của tổ chức sụt giảm.
conditions:
- Áp lực doanh thu trong ngắn hạn.
exceptions:
- Không có.
applications:
  hr_governance:
  - Áp dụng nghiêm ngặt chính sách sa thải không khoan nhượng đối với các hành vi lạm dụng.
risks:
- Mất đi nguồn doanh thu ngắn hạn khi sa thải một nhân sự xuất sắc nhưng độc hại.
evidence:
  level: supported
  references:
