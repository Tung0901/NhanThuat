mechanism:
- Tiêu chí lựa chọn ngầm ưu tiên một kiểu ứng viên quen thuộc.
- Lựa chọn lặp lại theo tiêu chí đó làm tăng tỷ trọng người tương tự nhau.
- Đồng nhất tăng khiến tiêu chí tiếp tục nghiêng về khuôn mẫu sẵn có.
- Tổ chức mất dần các góc nhìn khác biệt vốn cần cho phát hiện rủi ro.
