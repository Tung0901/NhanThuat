mechanism:
- Một cá nhân gây ấn tượng mạnh về tầm nhìn và sự tự tin.
- Tập thể dần gán mọi phán đoán đúng cho cá nhân đó.
- Phản biện trở nên khó nói vì đối lập với hình ảnh được tôn sùng.
- Hệ thống mất khả năng kiểm chứng độc lập và tích lũy rủi ro ngầm.
