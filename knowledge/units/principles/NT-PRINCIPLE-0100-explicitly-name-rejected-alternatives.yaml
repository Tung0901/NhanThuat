id: NT-PRINCIPLE-0100
type: principle
status: frozen
version: 0.2.0
title: Nêu rõ tên các phương án bị bác bỏ
summary: Buộc quá trình ra quyết định chiến lược ghi lại các phương án khả thi cụ thể sẽ không được theo đuổi.
primary_domain: thanh-su
secondary_domains:
- tri-nhan
definition: Một chiến lược chỉ thực sự có giá trị khi nó nêu rõ những điều tổ chức sẽ chủ động từ chối làm.
conditions:
- Phê duyệt lộ trình chiến lược và lập kế hoạch năm.
exceptions:
- Các bước thực thi nhiệm vụ tầm thường.
applications:
  roadmap-design:
  - Đưa mục Phương án bị bác bỏ (Rejected Options) vào các tài liệu chiến lược.
risks:
- Việc nêu tên các phương án bị bác bỏ gây ra ma sát chính trị.
evidence:
  level: supported
  references:
  - EV-REQ-0016-01
relations:
  supports: []
  conflicts_with: []
  depends_on:
  - NT-LAW-0067
  applies_to: []
tags:
- strategy
- trade-offs
