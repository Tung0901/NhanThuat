id: NT-PHENOMENON-3007
type: phenomenon
status: frozen
version: 0.1.0
title: Ảo tưởng về sự kém cỏi siêu nhận thức
summary: Con người vốn kém chính xác trong việc tự đánh giá sự kém cỏi của bản thân, vì các kỹ năng cần thiết để thực hiện một nhiệm vụ cũng chính là các kỹ năng cần thiết để đánh giá kết quả thực hiện nhiệm vụ đó.
primary_domain: tri-nhan
domain_area: NT-DA-0026
secondary_domains:
- thanh-su
definition: Một giới hạn mang tính cấu trúc khiến những người có năng lực thấp không nhận ra năng lực thấp của chính mình, dẫn đến việc tự đánh giá quá cao bản thân.
mechanism:
- Người thực hiện thử sức với một nhiệm vụ trong lĩnh vực mà họ thiếu chuyên môn.
- Người đó thực hiện kém.
- Vì thiếu chuyên môn, họ không thể nhận ra sự khác biệt giữa kết quả của mình và kết quả của người chuyên nghiệp.
- Họ tự tin kết luận rằng mình đã thực hiện tốt.
conditions:
- Các lĩnh vực đòi hỏi kiến thức chuyên sâu hoặc khả năng phán đoán tinh tế.
exceptions:
- Các nhiệm vụ có phản hồi vật lý tức thì, không thể phủ nhận và mang tính nhị phân.
applications:
  hiring:
  - Sử dụng các bài kiểm tra hành vi có cấu trúc thay vì dựa vào tự đánh giá kỹ năng.
risks:
- Đề cao những người tự tin nhưng kém cỏi trong khi bỏ qua những người cẩn trọng và có năng lực.
evidence:
  level: strong
  references:
  - 'Kruger, J., & Dunning, D. (1999). ''Unskilled and unaware of it: How difficulties in recognizing one''s own incompetence lead to inflated self-assessments''. Journal of Personality and Social Psychology.'
