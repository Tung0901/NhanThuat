title: Institutionalize Norm Safeguards
summary: Build explicit operational checks that catch and correct cultural drift before
  toxic behaviors become normalized.
primary_domain: hop-chung
secondary_domains:
- tri-nhan
definition: Establish anonymous feedback channels, regular culture surveys, and peer
  review mechanisms.
conditions:
- Fast-growing organizations undergoing rapid hiring.
exceptions:
- Small founding teams under 5 people.
applications:
  culture_pulse:
  - Run monthly anonymous culture pulse checks tracking psychological safety.
risks:
- Survey fatigue from over-polling.
