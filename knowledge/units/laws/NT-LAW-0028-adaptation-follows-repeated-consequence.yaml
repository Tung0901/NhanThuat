id: NT-LAW-0028
type: law
status: frozen
version: 0.1.0
title: Sự thích nghi hình thành từ hệ quả lặp lại
summary: Con người thích nghi với những gì được khen thưởng, xử phạt, phớt lờ, tạo điều kiện thuận lợi hoặc gây tốn kém một cách lặp đi lặp lại.
primary_domain: tri-nhan
secondary_domains:
- tu-than
- thanh-su
definition: Các hệ quả lặp lại rèn luyện sự chú ý, thói quen, kỳ vọng và phản ứng cảm xúc ngay cả khi không có ai trực tiếp giảng dạy.
mechanism:
- Trải nghiệm hệ quả
- Cập nhật kỳ vọng
- Lặp lại hành vi
- Ổn định hóa sự thích nghi
conditions:
- Hệ quả diễn ra lặp lại hoặc có tác động cảm xúc mạnh mẽ
- Cá nhân có khả năng nhận biết được quy luật của hệ quả
exceptions:
- Hệ giá trị cá nhân vững chắc có thể kháng cự lại các mô thức hệ quả
- Những hệ quả bị che giấu có thể không mang lại bài học thích nghi
applications:
  culture:
  - Nhận diện những hành vi mà hệ thống đang liên tục tưởng thưởng trong thực tế.
  coaching:
  - Đồng bộ hóa các phản hồi định kỳ với mục tiêu thích nghi mong muốn.
risks:
- Uốn nắn và kiểm soát con người quá mức thông qua áp lực
- Nhầm lẫn giữa sự thích nghi mang tính đối phó với sự đồng thuận thực chất
