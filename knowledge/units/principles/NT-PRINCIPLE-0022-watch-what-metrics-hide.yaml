id: NT-PRINCIPLE-0022
type: principle
status: frozen
version: 0.1.0
title: Theo dõi những gì chỉ số che khuất
summary: Đối với mỗi chỉ số quan trọng, hãy hỏi nó khiến điều gì trở nên vô hình, không khuyến khích điều gì hoặc cám dỗ con người chơi khăm.
primary_domain: thanh-su
secondary_domains:
- tri-nhan
- hop-chung
definition: Chỉ số định hướng sự chú ý bằng cách loại trừ các thực tế khác, nên việc sử dụng có trách nhiệm đòi hỏi rà soát các chi phí ẩn và sự bóp méo.
mechanism:
- Rà soát chỉ số.
- Xác định các giá trị bị bỏ qua và các lối chơi khăm.
- Thêm rào chắn an toàn hoặc tín hiệu cân bằng.
conditions:
- Chỉ số ảnh hưởng đến quyết định.
- Con người có thể tối ưu hóa xoay quanh chỉ số.
exceptions:
- Thước đo đơn giản có thể đủ cho công việc rủi ro thấp.
- Quá nhiều thước đo cân bằng có thể làm rối ưu tiên.
applications:
  governance:
  - Kết hợp chỉ số hiệu suất với kiểm tra chất lượng và đạo đức.
  management:
  - Hỏi xem mọi người có thể chơi khăm mục tiêu như thế nào.
risks:
- Từ chối chỉ số hữu ích vì chúng không hoàn hảo.
- Thêm phức tạp mà không gắn với quyết định.
