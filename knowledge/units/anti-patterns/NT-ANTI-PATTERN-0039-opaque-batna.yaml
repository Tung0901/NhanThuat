id: NT-ANTI-PATTERN-0039
type: anti-pattern
status: frozen
version: 0.1.0
title: BATNA Mù mờ
summary: Đơn vị tri thức cấu trúc về BATNA mù mờ trong đàm phán và quản trị tổ chức.
primary_domain: thanh-su
secondary_domains:
- tri-nhan
definition: Định nghĩa chính thức về BATNA mù mờ (Opaque BATNA) trong kiến trúc Nhân Thuật, chỉ trạng thái không rõ ràng hoặc che giấu phương án thay thế tốt nhất khi thỏa thuận thất bại.
conditions:
- Bối cảnh quản trị vận hành tổ chức.
exceptions:
- Các trường hợp ghi đè trong khủng hoảng khẩn cấp.
applications:
  governance:
  - Ánh xạ và đánh giá hiện tượng BATNA mù mờ trong các quy trình vận hành tổ chức.
risks:
- Nhận diện sai hoặc đánh giá lệch lạc về BATNA mù mờ dẫn đến hiệu suất không đạt mức tối ưu.
