id: NT-LAW-0034
type: law
status: frozen
version: 0.1.0
title: Quy luật về Tính ổn định Tương đối của Nét tính cách
summary: Các nét tính cách đóng vai trò như những khuynh hướng tiềm ẩn tương đối ổn định và hoạt động như thiên hướng mặc định; tuy nhiên chúng mang tính thích ứng chứ không cố định và có khả năng phát triển dần theo thời gian.
primary_domain: tri-nhan
secondary_domains:
- tu-than
definition: Sự khác biệt cá nhân về khí chất, nhận thức và thiên hướng cảm xúc - giác quan thể hiện các xu hướng tiềm ẩn hơn là số phận tất định. Dù thể hiện tính ổn định về thứ bậc theo thời gian, các nét tính cách vẫn mang tính thích ứng, chịu sự biến đổi dần dần và được điều chỉnh theo ngữ cảnh.
mechanism:
- Nét tính cách tiềm ẩn thiết lập các ưu tiên mặc định ban đầu
- Độ mạnh của tình huống và ngữ cảnh điều chỉnh mức độ kích hoạt nét tính cách
- Sự biểu hiện của nét tính cách tương tác với các yếu tố khác để tạo ra hành vi quan sát được
conditions:
- Quan sát thiên hướng hành vi mặc định dài hạn qua nhiều tình huống có tính ràng buộc yếu (weak situations).
exceptions:
- Sang chấn cấp tính, trị liệu phát triển có chủ đích và các bước chuyển giao quan trọng trong vòng đời có thể thúc đẩy nhanh sự biến đổi của nét tính cách.
applications:
  operations:
  - Kỳ vọng sự thích ứng dần dần trong các thiên hướng mặc định thay vì đòi hỏi sự chuyển hóa cá nhân ngay lập tức.
  developmental-coaching:
  - Lập bản đồ các nét tính cách nền tảng để định hướng hình thành thói quen từng bước thay vì mặc định các nét tính cách là bất biến.
risks:
- Gắn mác cá nhân vào các nhóm cố định (rập khuôn theo kiểu MBTI).
- Nhầm lẫn giữa thiên hướng mặc định với giới hạn năng lực tuyệt đối.
evidence:
  level: provisional
  references:
  - Roberts, B. W., et al. (2006). Patterns of Mean-Level Change in Personality Traits Across the Life Course.
