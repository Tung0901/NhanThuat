mechanism:
- Người gửi hoàn thành việc truyền đạt nội dung.
- Người gửi tách biệt cảm giác 'đã nói' khỏi thực tế 'đã được hiểu'.
- 'Thực hiện bước xác nhận riêng: yêu cầu người nhận diễn giải lại hoặc đặt câu hỏi.'
- Điều chỉnh nội dung dựa trên khoảng cách giữa ý định và cách hiểu.
