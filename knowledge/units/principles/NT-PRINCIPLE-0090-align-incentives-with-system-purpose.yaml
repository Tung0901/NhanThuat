id: NT-PRINCIPLE-0090
type: principle
status: frozen
version: 0.1.0
title: Căn chỉnh động lực với mục đích của hệ thống
summary: Thiết kế phần thưởng biến đổi để củng cố các kết quả toàn hệ thống và mục tiêu chung thay vì các bộ phận cô lập.
primary_domain: tu-than
secondary_domains:
- hop-chung
definition: Để ngăn chặn xung đột liên phòng ban, các cấu trúc khuyến khích phải khen thưởng hiệu suất toàn diện của hệ thống.
conditions:
- Thiết kế quỹ thưởng toàn công ty và liên kết chi trả theo OKR.
exceptions:
- Các đơn vị kinh doanh hoàn toàn độc lập hoạt động trong cấu trúc công ty mẹ nắm giữ danh mục.
applications:
  compensation:
  - Gắn thưởng điều hành với giá trị vòng đời khách hàng xuyên phòng ban.
risks:
- Làm mờ trách nhiệm giải trình cá nhân do quá nhấn mạnh vào các chỉ số nhóm.
