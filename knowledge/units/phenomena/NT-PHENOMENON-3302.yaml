id: NT-PHENOMENON-3302
type: phenomenon
title: Hiệu ứng người ngoài cuộc (Phân tán trách nhiệm)
summary: Xác suất một cá nhân can thiệp trong tình huống khẩn cấp hoặc nhận trách nhiệm giải quyết một vấn đề tỉ lệ nghịch với số người có mặt.
primary_domain: tri-nhan
domain_area: NT-DA-0029
definition: Hiện tượng xã hội trong đó sự hiện diện của người khác tạo ra sự phân tán trách nhiệm, khiến các cá nhân cho rằng người khác sẽ hành động.
mechanism:
- Một vấn đề hoặc tình huống khẩn cấp phát sinh.
- Một cá nhân nhận thấy vấn đề nhưng cũng nhận thấy những người khác đang có mặt.
- Cá nhân vô thức chia trách nhiệm của mình cho số lượng người chứng kiến.
- Ngưỡng hành động không được bất kỳ cá nhân nào chạm tới.
conditions:
- Các nhóm phi cấu trúc không có vai trò được xác định rõ hoặc không có người lãnh đạo được chỉ định.
exceptions:
- Khi một cá nhân được chỉ định rõ ràng và giao trách nhiệm ("Anh áo đỏ, gọi 911 ngay!").
applications:
  management:
  - Không bao giờ giao một nhiệm vụ cho "cả nhóm". Luôn giao cho một Cá nhân Chịu trách nhiệm Trực tiếp (DRI) duy nhất.
risks:
- Các sự cố hệ thống nghiêm trọng bị bỏ qua vì "chắc chắn đội devops cũng thấy cảnh báo đó".
evidence:
  level: strong
  references:
  - 'Darley, J. M., & Latané, B. (1968). ''Bystander intervention in emergencies: Diffusion of responsibility''. Journal of Personality and Social Psychology.'
