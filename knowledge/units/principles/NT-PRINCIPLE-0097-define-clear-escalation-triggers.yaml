id: NT-PRINCIPLE-0097
type: principle
status: frozen
version: 0.1.0
title: Xác định rõ các ngưỡng leo thang
summary: Quy định các ngưỡng kích hoạt cụ thể buộc phải leo thang một quyết định lên cấp cao hơn, để các lựa chọn thông thường hoàn toàn tự chủ.
primary_domain: dung-nhan
secondary_domains:
- thanh-su
definition: Để tránh tắc nghẽn, hãy thiết lập các ngưỡng tài chính, rủi ro hoặc chiến lược rõ ràng yêu cầu leo thang lên cấp điều hành.
conditions:
- Các quy trình tài chính và vận hành đã được ủy quyền.
exceptions:
- Các khủng hoảng đạo đức chưa từng có tiền lệ, thiếu ngưỡng xác định trước.
applications:
  workflow:
  - Triển khai quy tắc leo thang chi tiêu tự động trong các chuỗi phê duyệt của BusinessOS.
risks:
- Đặt ngưỡng leo thang quá thấp khiến cấp điều hành bị quá tải.
