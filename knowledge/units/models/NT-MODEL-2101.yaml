title: Tam Giác Ứng Phó Khủng Hoảng
summary: 'Mô hình ba trụ cột cốt lõi để đánh giá và xử lý khủng hoảng một cách toàn diện: Khoanh vùng,
  Truyền thông và Khắc phục.'
primary_domain: thanh-su
domain_area: NT-DA-0021
secondary_domains:
- dung-nhan
definition: Khung tư duy chiến lược giúp đội ngũ lãnh đạo không bỏ sót các khía cạnh quan trọng và nhạy
  cảm khi đối phó với khủng hoảng tổ chức.
mechanism:
- 'Khoanh vùng: Ngăn chặn sự cố lan rộng ra các khu vực khác.'
- 'Truyền thông: Cung cấp thông tin minh bạch và kịp thời cho các bên liên quan.'
- 'Khắc phục: Sửa chữa triệt để nguyên nhân gốc rễ và khôi phục hoạt động.'
conditions:
- Áp dụng hiệu quả cho mọi loại khủng hoảng từ quy mô vừa đến lớn.
exceptions:
- Các sự cố kỹ thuật nhỏ mang tính cá biệt không gây ảnh hưởng dây chuyền.
applications:
  management:
  - Định tuyến và điều phối đội đặc nhiệm xử lý sự cố
risks:
- Quá tập trung vào hành động khắc phục mà bỏ quên công tác truyền thông.
