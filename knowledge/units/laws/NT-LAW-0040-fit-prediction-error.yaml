id: NT-LAW-0040
type: law
status: frozen
version: 0.2.0
title: Sai lệch Dự đoán Mức độ Phù hợp
summary: Dự đoán mức độ phù hợp giữa con người và vai trò có sai số hệ thống. Đánh giá càng dựa vào ấn tượng bề mặt, sai lệch càng lớn và chi phí thích ứng sau đó càng cao.
primary_domain: tri-nhan
secondary_domains:
- dung-nhan
definition: 'Sai lệch dự đoán mức độ phù hợp là quy luật về giới hạn của dự báo con người - vai trò: con người đánh giá quá cao khả năng dự đoán của mình và bỏ qua chi phí thích ứng thực tế.'
conditions:
- Quyết định phân vai dựa trên dự đoán thay vì bằng chứng hành vi thực tế.
- Bối cảnh đánh giá khác biệt với bối cảnh làm việc.
exceptions:
- Mẫu thử việc mô phỏng sát môi trường làm việc thật làm giảm sai lệch đáng kể.
- Vai trò có tiêu chuẩn đầu ra đo lường được ngay từ đầu.
applications:
  hiring:
  - Thiết kế bài đánh giá mô phỏng công việc thực tế thay vì dựa vào ấn tượng phỏng vấn.
  - Đo lường mức phù hợp qua hành vi đã quan sát được, không qua lời tự mô tả.
  management:
  - Xác định ngưỡng thử việc và tiêu chí đánh giá lại trước khi cam kết dài hạn.
  planning:
  - Tính trước chi phí thích ứng khi bố trí nhân sự vào vai trò mới.
risks:
- Bố trí sai người vào vai trò dẫn tới thất bại kép cho cả cá nhân và tổ chức.
- Đánh giá quá tự tin vào khả năng đọc người.
- Bỏ qua chi phí thời gian để một người thích ứng với vai trò.
