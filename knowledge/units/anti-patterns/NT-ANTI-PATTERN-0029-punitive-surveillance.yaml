id: NT-ANTI-PATTERN-0029
type: anti-pattern
status: frozen
version: 0.2.0
title: Giám sát mang tính trừng phạt
summary: Giám sát được thiết kế để bắt lỗi và trừng phạt thay vì hỗ trợ cải thiện. Nhân sự học cách che giấu sai sót và tối ưu hình thức trước mắt thay vì giải quyết vấn đề thật.
primary_domain: dung-nhan
secondary_domains:
- tri-nhan
definition: Giám sát mang tính trừng phạt là phản-mẫu kiểm soát trong đó các cơ chế theo dõi, đánh giá và báo cáo được vận hành chủ yếu để phát hiện và xử phạt sai phạm, tạo ra văn hóa sợ hãi và che giấu.
conditions:
- Văn hóa quản lý thiên về kỷ luật trừng phạt hơn phát triển.
- Áp lực thành tích cao kèm thiếu an toàn tâm lý.
exceptions:
- Trường hợp vi phạm nghiêm trọng có chủ ý vẫn cần xử lý kỷ luật rõ ràng.
- Giám sát bắt buộc theo quy định pháp lý với mục đích bảo vệ an toàn.
applications:
  management:
  - Thiết kế giám sát tập trung vào hỗ trợ cải thiện và phát hiện rào cản hệ thống.
  - Tách dữ liệu giám sát khỏi quyết định kỷ luật trong đa số trường hợp.
  governance:
  - Thiết lập chính sách xử lý sai sót theo mức độ cố ý thay vì mọi lỗi như nhau.
  culture:
  - Công khai ghi nhận việc dám báo cáo sự cố thay vì trừng phạt.
risks:
- Văn hóa che giấu làm sự cố nhỏ tích tụ thành khủng hoảng.
- Nhân sự giỏi rời bỏ môi trường kiểm soát vi mô.
- Dữ liệu giám sát bị bóp méo khiến lãnh đạo ra quyết định sai.
evidence:
