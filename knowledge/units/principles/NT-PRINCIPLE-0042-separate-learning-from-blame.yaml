id: NT-PRINCIPLE-0042
type: principle
status: frozen
version: 0.1.0
title: Tách việc học hỏi khỏi đổ lỗi
summary: Khi cải thiện là mục tiêu, hãy phân biệt điều cần học với người có thể cần trách nhiệm giải trình.
primary_domain: tri-nhan
secondary_domains:
- dung-nhan
- thanh-su
definition: Đổ lỗi thu hẹp sự chú ý về phòng thủ, trong khi học hỏi cần đủ an toàn để phơi bày nguyên nhân, giả định và điều kiện hệ thống.
mechanism:
- Hỏi điều gì đã xảy ra
- Hỏi điều gì đã tạo điều kiện cho nó
- Quyết định riêng rẽ liệu có cần trách nhiệm giải trình.
conditions:
- Một thất bại hoặc bất ngờ xảy ra
- Phòng ngừa tương lai có ý nghĩa.
exceptions:
- Tổn hại cố ý hoặc cẩu thả có thể cần trách nhiệm giải trình ngay lập tức
- Phân tích vô tận có thể trì hoãn việc sửa chữa.
applications:
  retrospectives:
  - Bắt đầu bằng học hỏi nhân quả trước khi giao biện pháp khắc phục.
  governance:
  - Giữ quy trình điều tra và xử lý tách biệt khi có thể.
risks:
- Tránh né trách nhiệm
- Coi mọi thất bại là vấn đề quy trình.
evidence:
  level: provisional
  references: []
relations:
