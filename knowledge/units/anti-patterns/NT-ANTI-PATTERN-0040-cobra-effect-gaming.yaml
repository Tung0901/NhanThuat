id: NT-ANTI-PATTERN-0040
type: anti-pattern
status: frozen
version: 0.1.0
title: Cobra Effect Gaming
summary: Rewarding narrow quantitative metrics without quality safeguards, leading
  actors to actively generate artificial problems.
primary_domain: tu-than
secondary_domains:
- hop-chung
definition: The Cobra Effect occurs when an incentive scheme unintentionally pays
  actors to exacerbate the problem.
mechanism:
- Management sets narrow metric.
- Actors manipulate inputs.
- Metric rises while quality collapses.
conditions:
- High financial rewards tied to simple output counts.
exceptions:
- Fully automated verification systems.
applications:
  metric_governance:
  - Audit software bug-fix bonuses for artificial volume generation.
risks:
- Adding so many compliance checks that execution slows down.
