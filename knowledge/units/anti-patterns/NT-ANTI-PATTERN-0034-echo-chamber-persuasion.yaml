id: NT-ANTI-PATTERN-0034
type: anti-pattern
status: frozen
version: 0.1.0
title: Thuyết phục trong phòng vọng âm
summary: Đơn vị kiến thức cấu trúc về Thuyết phục trong phòng vọng âm (Echo Chamber Persuasion) trong hành vi tổ chức.
primary_domain: tri-nhan
secondary_domains:
- hop-chung
definition: Định nghĩa chính thức về Thuyết phục trong phòng vọng âm trong kiến trúc Nhân Thuật, chỉ việc củng cố niềm tin hoặc quan điểm bằng cách chỉ khuếch đại các ý kiến đồng điệu và loại bỏ các góc nhìn phản biện khách quan.
conditions:
- Các bối cảnh quản trị vận hành tổ chức.
exceptions:
- Các trường hợp ghi đè trong tình huống khủng hoảng khẩn cấp.
applications:
  governance:
  - Nhận diện và khắc phục tình trạng thuyết phục trong phòng vọng âm trong quy trình làm việc tổ chức.
risks:
- Áp dụng sai hoặc để diễn ra thuyết phục trong phòng vọng âm dẫn đến sai lầm chiến lược và suy giảm hiệu suất.
