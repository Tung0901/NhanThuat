id: NT-ANTI-PATTERN-0050
type: anti-pattern
status: frozen
version: 0.1.0
title: Trấn áp bằng văn hóa đổ lỗi
summary: Trừng phạt cá nhân báo tin xấu, khiến nhân viên che giấu sai sót cho đến khi sự cố nghiêm trọng xảy ra.
primary_domain: tri-nhan
secondary_domains:
- hop-chung
definition: Trấn áp bằng văn hóa đổ lỗi xảy ra khi ban lãnh đạo trừng phạt những nhân viên báo cáo lỗi kỹ thuật hoặc sự cố vận hành.
mechanism:
- Một sự cố xảy ra.
- Ban quản lý đổ lỗi cho nhân viên.
- Nhân viên nhận ra sự trung thực là mạo hiểm.
- Các lỗi bị che giấu cho đến khi thảm họa xảy ra.
conditions:
- Môi trường lãnh đạo dựa trên sự sợ hãi.
exceptions:
- Các hành vi vi phạm pháp luật cố ý.
applications:
  culture_audit:
  - Đánh dấu các đội nhóm không bao giờ báo cáo tin xấu.
risks:
- Bỏ qua việc kỷ luật hành vi lơ là nghiêm trọng lặp đi lặp lại.
evidence:
  level: supported
  references:
