id: NT-PRINCIPLE-0081
type: principle
status: frozen
version: 0.2.0
title: Tách niềm tin khỏi cảm xúc
summary: Niềm tin vận hành nên dựa trên độ tin cậy đã kiểm chứng thay vì cảm xúc nhất thời. Tách hai yếu tố giúp niềm tin ổn định dưới áp lực.
primary_domain: hop-chung
secondary_domains:
- tri-nhan
definition: Tách niềm tin khỏi cảm xúc là nguyên tắc xây dựng tin cậy dựa trên tính nhất quán hành vi, năng lực đã chứng minh và cơ chế bảo đảm, thay vì dựa trên thiện cảm hoặc trạng thái cảm xúc nhất thời.
conditions:
- Quan hệ hợp tác kéo dài và ảnh hưởng tới kết quả công việc.
- Có thể quan sát hành vi của đối tác qua thời gian.
exceptions:
- Giai đoạn đầu quan hệ chưa đủ dữ liệu cần dựa vào tham chiếu và bảo đảm.
- Trong quan hệ cá nhân, yếu tố cảm xúc có vai trò riêng ngoài công việc.
applications:
  partnership:
  - Thiết kế cơ chế bảo đảm cho quan hệ mới và quan hệ có rủi ro cao.
  - Đánh giá đối tác định kỳ bằng dữ liệu hành vi, không bằng cảm nhận.
  management:
  - Không giao quyền quan trọng dựa trên thiện cảm cá nhân.
  - Tách đánh giá công việc khỏi quan hệ cảm xúc với nhân sự.
  governance:
  - Duy trì cơ chế xác minh định kỳ cho các quan hệ đối tác trọng yếu.
risks:
- Thiện cảm cá nhân che giấu dấu hiệu thiếu độ tin cậy.
- Nghi ngờ quá mức dựa trên cảm xúc tiêu cực làm xói mòn quan hệ.
- Dùng cơ chế bảo đảm thay thế hoàn toàn cho việc xây dựng tin cậy thực chất.
