mechanism:
- Các bên quan sát hành vi lặp lại của nhau qua nhiều tương tác.
- Sự nhất quán giữa lời nói và hành động tạo ra khả năng dự đoán.
- Kỳ vọng ổn định giảm nhu cầu phòng vệ và kiểm tra.
- Nền tảng niềm tin vận hành được thiết lập, cho phép hợp tác hiệu quả hơn.
