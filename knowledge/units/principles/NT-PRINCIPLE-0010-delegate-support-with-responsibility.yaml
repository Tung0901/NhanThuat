id: NT-PRINCIPLE-0010
type: principle
status: frozen
version: 0.1.0
title: Ủy quyền hỗ trợ cùng với trách nhiệm
summary: Khi giao trách nhiệm, hãy bao gồm quyền hạn, nguồn lực, phản hồi và lộ trình leo thang cần thiết để thực hiện trách nhiệm đó.
primary_domain: dung-nhan
secondary_domains:
- thanh-su
- hop-chung
definition: Việc ủy quyền chỉ trọn vẹn khi người nhận có đủ hỗ trợ và quyền hạn để hành động theo trách nhiệm.
mechanism:
- Xác định trách nhiệm.
- Khớp quyền hạn và nguồn lực.
- Tạo kênh phản hồi và leo thang.
conditions:
- Nhiệm vụ có quyền tự chủ đáng kể.
- Chất lượng kết quả phụ thuộc vào các quyết định.
exceptions:
- Nhiệm vụ đào tạo có thể cố ý hạn chế quyền hạn.
- Công việc bị điều tiết có thể cần kiểm soát chặt chẽ hơn.
applications:
  management:
  - Hỏi xem thiếu sự hỗ trợ nào trước khi phán xét quyền sở hữu.
  execution:
  - Làm rõ quyền leo thang trước khi công việc bắt đầu.
risks:
- Hỗ trợ quá mức và gỡ bỏ quyền tự chủ.
- Giao hỗ trợ mà không có tiêu chuẩn.
evidence:
