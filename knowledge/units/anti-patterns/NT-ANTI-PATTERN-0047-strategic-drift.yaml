id: NT-ANTI-PATTERN-0047
type: anti-pattern
status: frozen
version: 0.1.0
title: Chệch hướng chiến lược
summary: Sự tích tụ dần dần của các xao nhãng tác thuật không được phối hợp, khiến việc thực thi của tổ chức rời xa ý định cốt lõi.
primary_domain: thanh-su
secondary_domains:
- dung-nhan
definition: Chệch hướng chiến lược xảy ra khi các đội ngũ phản ứng với những yêu cầu ngắn hạn mà không đánh giá sự phù hợp với chiến lược tổng thể.
mechanism:
- Chấp nhận các cơ hội tác thuật ngắn hạn.
- Nguồn lực bị phân tán vào các yêu cầu phát sinh đột xuất.
- Chiến lược cốt lõi bị đình trệ.
conditions:
- Quản trị sản phẩm yếu kém.
exceptions:
- Các giai đoạn chuyển hướng (pivot) ban đầu ở startup chưa đạt mức phù hợp sản phẩm - thị trường.
applications:
  roadmap_governance:
  - Kiểm toán các nhiệm vụ thực thi hằng quý so với các chủ đề chiến lược cốt lõi.
risks:
- Từ chối quá mức các phản hồi hợp lý từ phía khách hàng.
evidence:
  level: supported
  references:
  - EV-REQ-0016-01
