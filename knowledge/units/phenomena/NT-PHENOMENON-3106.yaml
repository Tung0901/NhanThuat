id: NT-PHENOMENON-3106
type: phenomenon
title: Thiên kiến hiện trạng
summary: Một sở thích mang tính cảm xúc dành cho trạng thái hiện tại, coi bất kỳ sự thay đổi nào so với nền tảng là một mất mát.
primary_domain: tri-nhan
domain_area: NT-DA-0027
definition: Sở thích phi lý trong việc duy trì trạng thái hiện tại, ngay cả khi chi phí chuyển đổi sang một trạng thái khách quan vượt trội là không đáng kể.
mechanism:
- Trạng thái hiện tại đóng vai trò là điểm tham chiếu.
- Sự thay đổi kéo theo sự không chắc chắn và những mất mát tiềm ẩn.
- Do ác cảm mất mát, những mất mát tiềm ẩn của việc thay đổi lớn hơn những lợi ích tiềm ẩn.
conditions:
- Khi một lựa chọn mặc định được cung cấp tường minh hoặc được thiết lập trong lịch sử.
exceptions:
- Khi hiện trạng được nhìn nhận là nguy hiểm hoặc sắp thất bại.
applications:
  product_design:
  - Tận dụng các lựa chọn mặc định một cách cẩn trọng, vì người dùng hiếm khi thay đổi chúng.
risks:
- Sự trì trệ của tổ chức và không áp dụng được các công cụ vượt trội.
evidence:
  level: strong
  references:
  - Samuelson, W., & Zeckhauser, R. (1988). 'Status quo bias in decision making'. Journal of Risk and Uncertainty.
relations:
