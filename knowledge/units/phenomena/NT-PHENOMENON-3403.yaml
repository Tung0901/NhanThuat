id: NT-PHENOMENON-3403
type: phenomenon
title: Liking Principle
summary: People prefer to say yes to individuals they know and like.
primary_domain: tri-nhan
domain_area: NT-DA-0030
definition: A persuasion mechanism where compliance is drastically increased by physical
  attractiveness, similarity, compliments, and cooperative endeavors.
mechanism:
- A persuader establishes rapport by highlighting similarities, offering genuine praise,
  or simply being physically attractive.
- The target develops a positive affective response (liking).
- The target equates saying 'yes' to the request with maintaining the positive relationship.
conditions:
- Interpersonal sales, negotiations, and leadership.
exceptions:
- Highly transactional, automated, or anonymized environments.
applications:
  negotiation:
  - Spending 5 minutes before a negotiation finding a shared hobby increases the likelihood
    of a cooperative outcome by over 30%.
risks:
- Nepotism and cronyism in corporate hiring and promotion.
evidence:
  level: strong
  references:
  - 'Cialdini, R. B. (1984). ''Influence: The Psychology of Persuasion''.'
