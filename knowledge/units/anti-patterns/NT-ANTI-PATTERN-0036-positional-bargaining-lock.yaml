id: NT-ANTI-PATTERN-0036
type: anti-pattern
status: frozen
version: 0.1.0
title: Bế tắc thương lượng theo vị thế
summary: Đơn vị kiến thức cấu trúc về Bế tắc thương lượng theo vị thế trong đàm phán tổ chức.
primary_domain: thanh-su
secondary_domains:
- tri-nhan
definition: Định nghĩa chính thức về Bế tắc thương lượng theo vị thế trong kiến trúc Nhân Thuật.
conditions:
- Các ngữ cảnh quản trị và vận hành tổ chức.
exceptions:
- Trường hợp đè quyền ưu tiên khi ứng phó với khủng hoảng khẩn cấp.
applications:
  governance:
  - Áp dụng nhận diện Bế tắc thương lượng theo vị thế vào quy trình làm việc của tổ chức.
risks:
- Áp dụng không đúng Bế tắc thương lượng theo vị thế dẫn đến hiệu suất tổ chức không đạt mức tối ưu.
