id: NT-PRINCIPLE-0059
type: principle
status: frozen
version: 0.1.0
title: Distinguish urgency from durable motivation
summary: Avoid confusing short-term crisis-driven bursts of effort with healthy, sustainable motivation when planning organizational commitments.
primary_domain: tu-than
secondary_domains: [tri-nhan, dung-nhan]
definition: Short-term urgency consumes reserves; relying on perpetual crisis mode leads to systemic exhaustion rather than true engagement.
mechanism: [Identify motivation source, Separate crisis spike from baseline drive, Build sustainable cadence, Protect long-term energy.]
conditions: [Teams frequently encounter deadline pressure or emergency escalations.]
exceptions: [Genuine strategic emergencies require short-term urgency mobilization.]
applications: {planning: [Schedule recovery periods after intense deadline sprints.], leadership: [Refuse to operate in permanent emergency mode.]}
risks: [Failing to respond quickly when true emergencies arise.]
evidence: {level: provisional, references: []}
relations: {supports: [], conflicts_with: [], depends_on: [NT-LAW-0031, NT-LAW-0015], applies_to: []}
tags: [motivation, principle, urgency, sustainability]
