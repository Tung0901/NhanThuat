mechanism:
- Người gửi mã hóa thông điệp theo khung nhận thức của mình.
- Người nhận diễn giải thông điệp qua khung đang vận hành sẵn có.
- Khi hai khung tương thích, thông điệp được tiếp nhận và ghi nhớ.
- Khi lệch khung, thông điệp bị đề kháng, hiểu sai hoặc bỏ qua.
