mechanism:
- Nhận diện các loại rủi ro mà người ra quyết định đang đối mặt.
- Phân loại rủi ro vào bốn nhóm bảo vệ của ma trận.
- 'Thiết kế cơ chế bảo vệ tương ứng cho từng nhóm: miễn trừ hợp lý, quy trình phê duyệt, biên bản, tuyên bố lợi ích.'
- Rà soát định kỳ xem cơ chế bảo vệ còn phù hợp với rủi ro mới.
