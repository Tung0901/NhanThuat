id: NT-ANTI-PATTERN-0020
type: anti-pattern
status: frozen
version: 0.2.0
title: Ảo tưởng quyền lực
summary: Đơn vị kiến thức cấu trúc về Ảo tưởng quyền lực (Authority Mirage) trong quản trị tổ chức.
primary_domain: dung-nhan
secondary_domains:
- tri-nhan
definition: Định nghĩa chính thức về Ảo tưởng quyền lực trong kiến trúc Nhân Thuật, mô tả hiện tượng tổ chức tạo ra cảm giác giả tạo về thẩm quyền hoặc năng lực ra quyết định mà không có thực lực thực tế.
conditions:
- Các bối cảnh quản trị vận hành tổ chức.
exceptions:
- Các trường hợp ưu tiên đè thẩm quyền trong khủng hoảng khẩn cấp.
applications:
  governance:
  - Áp dụng nhận diện Ảo tưởng quyền lực vào quy trình làm việc của tổ chức.
risks:
- Áp dụng sai hoặc không nhận diện được Ảo tưởng quyền lực dẫn đến hiệu suất tổ chức không đạt mức tối ưu.
evidence:
  level: supported
  references:
  - EV-REQ-0001-01
relations:
  supports: []
  conflicts_with: []
  depends_on:
  - NT-LAW-0044
  applies_to: []
tags:
- anti-pattern
- dung-nhan
- authority-mirage
- power-illusion
- governance-failure
- organizational-behavior
created_at: '2026-07-22'
updated_at: '2026-09-14'
mechanism:
- Tổ chức tạo ra các vị trí, chức danh hoặc tuyên bố tạo cảm giác thẩm quyền.
- Các quyết định quan trọng được giao cho người thiếu năng lực thực tế.
- Khoảng cách giữa quyền hạn danh nghĩa và năng lực thực tế không được nhận diện.
- Sai lầm tích lũy trong khi hệ thống vẫn tin vào hình thức bên ngoài.
- Khi kết quả không đạt, hệ thống mất niềm tin vào quy trình thay vì vào người.
