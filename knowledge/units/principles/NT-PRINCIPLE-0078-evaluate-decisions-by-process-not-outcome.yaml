mechanism:
- Tái dựng bối cảnh và các lựa chọn tại thời điểm quyết định.
- Đánh giá chất lượng thông tin, giả định và lập luận đã sử dụng.
- Phân tích vai trò của các yếu tố ngoài tầm kiểm soát đối với kết quả.
- Rút ra bài học quy trình thay vì chỉ phán xét kết quả.
