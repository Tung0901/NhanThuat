mechanism:
- Người quản lý có năng lực xử lý và theo dõi hữu hạn.
- Khối lượng công việc ủy quyền tăng làm giảm thời gian kiểm tra từng việc.
- Chất lượng theo dõi suy giảm khi vượt ngưỡng năng lực.
- Trách nhiệm và chất lượng đầu ra suy giảm dù danh nghĩa vẫn được ủy quyền.
