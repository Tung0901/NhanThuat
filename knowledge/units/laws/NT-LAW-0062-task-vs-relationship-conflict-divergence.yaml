id: NT-LAW-0062
type: law
status: frozen
version: 0.1.0
title: Sự phân tách giữa xung đột công việc và xung đột quan hệ
summary: Xung đột công việc giúp cải thiện chất lượng ra quyết định, trong khi xung đột quan hệ làm suy giảm an toàn tâm lý và hiệu suất làm việc.
primary_domain: hop-chung
secondary_domains:
- tri-nhan
definition: Sự bất đồng nhận thức về mặt công việc giúp nâng cao chất lượng lựa chọn bằng cách vạch rõ những giả định sai lầm.
conditions:
- Quá trình ra quyết định nhóm và các cuộc tranh luận chiến lược.
exceptions:
- Môi trường khủng hoảng có mức độ căng thẳng cao.
applications:
  team_governance:
  - Thiết lập các quy tắc cơ bản nhằm tập trung cuộc tranh luận vào dữ liệu và các giả thuyết.
risks:
- Để xung đột quan hệ ngụy trang dưới danh nghĩa tranh luận công việc.
