id: NT-LAW-0047
type: law
status: frozen
version: 0.2.0
title: Bất đối xứng tín hiệu và nhiễu
summary: Khi khối lượng thông tin tăng, nhiễu tăng nhanh hơn tín hiệu có ích. Chi phí lọc thông tin tăng phi tuyến và dần vượt giá trị của phần tín hiệu thu được.
primary_domain: tri-nhan
secondary_domains:
- dung-nhan
definition: 'Bất đối xứng tín hiệu và nhiễu là quy luật về cấu trúc dòng thông tin: tỷ trọng tín hiệu quan trọng trong tổng lượng thông tin giảm khi hệ thống mở rộng nếu không có cơ chế lọc tương ứng.'
conditions:
- Khối lượng thông tin tăng nhanh hơn năng lực lọc.
- Thiếu tiêu chuẩn phân biệt tín hiệu và nhiễu.
exceptions:
- Bộ lọc theo ngưỡng ngoại lệ và tiêu chuẩn tín hiệu rõ giữ được tỷ lệ tín hiệu.
- Tự động hóa lọc sơ bộ giảm chi phí chú ý của người quyết định.
applications:
  operations:
  - Thiết lập ngưỡng báo cáo ngoại lệ thay vì báo cáo toàn bộ.
  - Định kỳ cắt bỏ báo cáo không dẫn tới hành động nào.
  management:
  - Quy định tiêu chuẩn một tín hiệu hữu ích trước khi đưa vào báo cáo.
  data-design:
  - Xây dựng bảng điều khiển tập trung vào chỉ số tín hiệu thay vì số liệu trang trí.
risks:
- Tín hiệu cảnh báo sớm bị chôn trong nhiễu.
- Người ra quyết định quá tải dẫn tới bỏ qua toàn bộ thông tin.
- Tăng thu thập dữ liệu làm vấn đề nhiễu trầm trọng hơn.
evidence:
