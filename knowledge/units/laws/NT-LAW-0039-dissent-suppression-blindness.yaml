mechanism:
- Một quan điểm hoặc người nêu ý kiến trái chiều bị trừng phạt hoặc gạt bỏ.
- Những người quan sát học được rằng lên tiếng là rủi ro.
- Thông tin bất lợi ngừng được truyền lên cấp ra quyết định.
- Hệ thống mất khả năng tự điều chỉnh và tích lũy sai lệch cho đến khi sự cố bộc lộ.
