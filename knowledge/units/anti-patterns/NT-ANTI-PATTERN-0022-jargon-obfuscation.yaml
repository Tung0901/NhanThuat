id: NT-ANTI-PATTERN-0022
type: anti-pattern
status: frozen
version: 0.1.0
title: Làm mờ bằng thuật ngữ
summary: Đơn vị kiến thức cấu trúc về Làm mờ bằng thuật ngữ (Jargon Obfuscation) trong giao tiếp quản trị.
primary_domain: tri-nhan
secondary_domains:
- dung-nhan
definition: Định nghĩa chính thức về Làm mờ bằng thuật ngữ trong kiến trúc Nhân Thuật, mô tả hành vi sử dụng quá mức thuật ngữ chuyên ngành phức tạp để che đậy sự thiếu rõ ràng hoặc né tránh trách nhiệm.
conditions:
- Các bối cảnh quản trị vận hành tổ chức.
exceptions:
- Các trường hợp ưu tiên đè thẩm quyền trong khủng hoảng khẩn cấp.
applications:
  governance:
  - Áp dụng nhận diện Làm mờ bằng thuật ngữ vào quy trình làm việc của tổ chức.
risks:
- Áp dụng sai hoặc không nhận diện được Làm mờ bằng thuật ngữ dẫn đến sai lệch thông tin và hiệu suất không đạt tối ưu.
