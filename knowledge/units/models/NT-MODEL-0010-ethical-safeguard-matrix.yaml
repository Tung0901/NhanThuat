id: NT-MODEL-0010
type: model
status: frozen
version: 0.2.0
title: Ma trận Bảo vệ Lãnh đạo
summary: Ma trận xác định các ranh giới bảo vệ cần thiết cho người ra quyết định trước rủi ro đạo đức, pháp lý và xung đột lợi ích. Bảo vệ lãnh đạo đúng cách giúp quyết định táo bạo hơn trong phạm vi an toàn.
primary_domain: dung-nhan
secondary_domains:
- tu-than
definition: 'Ma trận Bảo vệ Lãnh đạo là khung phân loại các cơ chế bảo vệ người ra quyết định theo bốn nhóm: ranh giới pháp lý, ranh giới đạo đức, ranh giới quy trình và ranh giới quan hệ, mỗi nhóm tương ứng với loại rủi ro cụ thể.'
conditions:
- Người ra quyết định phải đưa ra lựa chọn có rủi ro đáng kể.
- Tổ chức có quy trình quản trị và kiểm soát đủ chín.
exceptions:
- Tình huống vi phạm pháp luật hoặc đạo đức rõ ràng không được bảo vệ.
- Rủi ro cá nhân do hành vi cố ý nằm ngoài phạm vi bảo vệ.
applications:
  governance:
  - Thiết kế cơ chế phê duyệt và biên bản cho các quyết định rủi ro cao.
  - Ban hành chính sách tuyên bố xung đột lợi ích cho các vị trí trọng yếu.
  leadership:
  - Xây dựng môi trường quyết định an toàn để người quản lý không né tránh trách nhiệm.
  risk-management:
  - Phân loại rủi ro quyết định theo ma trận và gán biện pháp bảo vệ tương ứng.
risks:
- Biến cơ chế bảo vệ thành lá chắn né tránh trách nhiệm.
- Quan liêu hóa quy trình phê duyệt làm tê liệt khả năng quyết định.
- Bảo vệ che đậy hành vi sai trái của người có quyền.
evidence:
