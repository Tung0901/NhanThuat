id: NT-PHENOMENON-3206
type: phenomenon
title: Ý định thực hiện (Kế hoạch nếu-thì)
summary: Chiến lược tự điều chỉnh dưới dạng một kế hoạch dạng "nếu-thì" giúp đạt được mục tiêu tốt hơn.
primary_domain: tri-nhan
domain_area: NT-DA-0028
definition: Hiệu ứng tâm lý trong đó việc xác định rõ ràng tín hiệu tình huống và phản ứng đã được lên kế hoạch giúp gia tăng đáng kể xác suất thực hiện một hành vi.
mechanism:
- 'Hình thành một kế hoạch tường minh: "Nếu tình huống X xảy ra, tôi sẽ thực hiện hành vi Y."'
- Tín hiệu tình huống (X) trở nên dễ truy cập về mặt nhận thức.
- Khi X xảy ra, phản ứng (Y) được kích hoạt một cách tự động, bỏ qua sự cân nhắc có ý thức.
conditions:
- Các hành vi cụ thể, khả thi thay vì các kết quả trừu tượng.
exceptions:
- Những tình huống hoàn toàn khó dự đoán hoặc nằm ngoài tầm kiểm soát của cá nhân.
applications:
  goal_setting:
  - Thay câu "Tôi sẽ tập thể dục nhiều hơn" bằng "Nếu lúc 7:00 sáng thứ Ba, tôi sẽ đi giày chạy bộ".
risks:
- Lên kế hoạch quá mức cho các tình huống ngoại lệ, dẫn đến một thói quen giòn dễ vỡ.
evidence:
  level: strong
  references:
  - 'Gollwitzer, P. M. (1999). ''Implementation intentions: Strong effects of simple plans''. American Psychologist.'
