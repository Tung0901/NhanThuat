id: NT-LAW-0008
type: law
status: frozen
version: 0.1.0
title: Phản hồi điều chỉnh hành vi
summary: Mọi người điều chỉnh hành vi một cách đáng tin cậy hơn khi nhận được phản hồi kịp thời, cụ thể, đáng tin cậy và gắn liền với những hệ quả rõ ràng.
primary_domain: dung-nhan
secondary_domains:
- tu-than
- thanh-su
definition: Phản hồi làm thay đổi hành vi khi người nhận có thể hiểu được khoảng cách năng lực, tin tưởng vào tín hiệu phản hồi và thực hiện điều chỉnh trước khi bối cảnh đó qua đi.
mechanism:
- Nhận biết tín hiệu về hiệu suất
- Lý giải khoảng cách năng lực
- Điều chỉnh hành động khi phương án khắc phục có thể áp dụng được.
conditions:
- Người nhận có khả năng thay đổi hành vi
- Phản hồi được đưa ra đủ gần với thời điểm thực hiện hành động.
exceptions:
- Phản hồi mang tính đe dọa có thể kích hoạt cơ chế tự vệ
- Phản hồi mơ hồ có thể không định hướng được sự thay đổi.
applications:
  management:
  - Đưa ra phản hồi ngay sát thời điểm quan sát thấy hành vi.
  learning:
  - Liên kết việc sửa lỗi với nỗ lực cụ thể tiếp theo.
risks:
- Sử dụng phản hồi như một công cụ để trút giận
- Gây quá tải cho nhân sự bằng quá nhiều yêu cầu điều chỉnh.
