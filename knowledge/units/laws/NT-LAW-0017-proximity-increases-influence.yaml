id: NT-LAW-0017
type: law
status: frozen
version: 0.1.0
title: Sự gần gũi làm tăng mức độ ảnh hưởng
summary: Con người dễ bị ảnh hưởng hơn bởi các tín hiệu, con người và hệ quả có sự gần gũi hơn về mặt thời gian, không gian, mối quan hệ hoặc mức độ liên quan được nhận thức.
primary_domain: tri-nhan
secondary_domains:
- hop-chung
- thanh-su
definition: Các tín hiệu gần hơn có xu hướng tạo ra ảnh hưởng mạnh mẽ hơn vì chúng dễ được chú ý, cảm nhận và hành động hơn so với những khái niệm trừu tượng xa xôi.
mechanism:
- Bắt gặp một tín hiệu gần gũi
- Cảm nhận mức độ cấp thiết cao hơn
- Coi trọng nó hơn so với những mối bận tâm xa xôi.
conditions:
- Các tín hiệu cạnh tranh có mức độ cấp thiết khác nhau
- Cá nhân thiếu một hệ thống đối trọng mạnh mẽ.
exceptions:
- Các giá trị hoặc kế hoạch mạnh mẽ có thể nâng cao tầm quan trọng của các mục tiêu xa
- Khủng hoảng có thể sắp xếp lại thứ tự ưu tiên của sự gần gũi.
applications:
  communication:
  - Kết nối các mục tiêu dài hạn với các hệ quả trước mắt.
  management:
  - Đặt các tín hiệu then chốt tại nơi các quyết định thực sự diễn ra.
risks:
- Coi trọng việc khẩn cấp hơn việc quan trọng
- Thao túng tính nổi bật mà không có thực chất.
