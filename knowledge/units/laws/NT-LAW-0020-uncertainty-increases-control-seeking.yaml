id: NT-LAW-0020
type: law
status: frozen
version: 0.1.0
title: Sự bất định làm tăng nhu cầu kiểm soát
summary: Khi sự bất định gia tăng, con người có xu hướng tìm kiếm thêm sự kiểm soát, thông tin, sự trấn an hoặc quyền lực đối với tình huống.
primary_domain: tri-nhan
secondary_domains:
- hop-chung
- thanh-su
definition: Sự bất định làm tăng cảm giác bị tổn thương hoặc rủi ro, và mọi người phản ứng bằng cách cố gắng giảm bớt sự mơ hồ hoặc giành lại quyền chủ động.
mechanism:
- Nhận thức được sự bất định
- Cảm thấy bị ảnh hưởng hoặc gặp rủi ro
- Tìm kiếm thông tin
- Sự kiểm soát
- Sự trấn an
- Hoặc quyền lực.
conditions:
- Kết quả có tầm ảnh hưởng quan trọng
- Cá nhân thiếu tự tin vào những gì sẽ xảy ra.
exceptions:
- Lòng tin cao có thể làm giảm nhu cầu kiểm soát
- Một số người có khả năng chịu đựng sự mơ hồ tốt hơn những người khác.
applications:
  change:
  - Giảm bớt sự bất định bằng cách sắp xếp trình tự trung thực và thiết lập các quy tắc ra quyết định rõ ràng.
  management:
  - Giải thích những gì đã biết
  - Những gì chưa biết
  - Và những gì đang được quyết định.
risks:
- Đưa ra sự chắc chắn giả tạo
- Nhầm lẫn nhu cầu kiểm soát với sự phản kháng.
