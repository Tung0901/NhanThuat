id: NT-PRINCIPLE-0052
type: principle
status: frozen
version: 0.1.0
title: Làm rõ tính khả thi song song với giá trị
summary: Để tạo ra cam kết, hãy làm rõ con đường thực thi khả thi cùng với giá trị của mục tiêu thay vì chỉ dựa vào cảm hứng.
primary_domain: tu-than
secondary_domains:
- tri-nhan
- dung-nhan
definition: Giá trị mục tiêu cao tạo ra khát khao, nhưng tính khả thi rõ ràng tạo ra nỗ lực thực sự; lãnh đạo phải định nghĩa các bước quản lý được bên cạnh tầm nhìn.
mechanism:
- Nêu mục tiêu giá trị cao
- Vẽ bản đồ các bước thực thi cụ thể
- Chứng minh tính khả thi
- Huy động cam kết.
conditions:
- Mục tiêu tham vọng hoặc phức tạp
- thành viên nhóm đối mặt với sự không chắc chắn về thực thi.
exceptions:
- Chuyên gia có quyền tự chủ cao có thể thích tự định nghĩa con đường thực thi khi giá trị mục tiêu đã được xác lập.
applications:
  leadership:
  - Đi kèm công bố tầm nhìn với sự rõ ràng thực thi 30 ngày ngay lập tức.
  management:
  - Cung cấp nguồn lực và hỗ trợ kỹ năng khớp với kỳ vọng công việc.
risks:
- Vi quản lý việc thực thi kỹ thuật dưới vỏ bọc làm rõ tính khả thi.
evidence:
