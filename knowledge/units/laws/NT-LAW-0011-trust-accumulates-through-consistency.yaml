id: NT-LAW-0011
type: law
status: frozen
version: 0.1.0
title: Niềm tin tích lũy qua sự nhất quán
summary: Niềm tin sẽ tăng lên khi lời nói, quyết định và hành động thực hiện luôn nhất quán qua những thời điểm quan trọng được lặp đi lặp lại.
primary_domain: hop-chung
secondary_domains:
- dung-nhan
- thanh-su
definition: Mọi người cập nhật mức độ tin cậy bằng cách so sánh giữa lời hứa, hành vi, năng lực và sự công bằng qua các tương tác lặp đi lặp lại.
mechanism:
- Quan sát cam kết
- Quan sát quá trình thực hiện
- Cập nhật mức độ tin tưởng vào hành vi trong tương lai.
conditions:
- Các tương tác được lặp lại
- Hành vi đủ rõ ràng để có thể đánh giá.
exceptions:
- Một lần vi phạm nghiêm trọng có thể xóa bỏ nhiều điểm tích cực nhỏ
- Sự thay đổi bối cảnh có thể thiết lập lại các kỳ vọng.
applications:
  leadership:
  - Đưa ra ít lời hứa hơn và thực hiện chúng một cách rõ ràng.
  teamwork:
  - Sử dụng các cam kết nhỏ để xây dựng lại sự tin cậy.
risks:
- Kỳ vọng có được niềm tin mà không có bằng chứng từ hành vi
- Nhầm lẫn giữa sức hút cá nhân và sự đáng tin cậy.
