id: NT-PRINCIPLE-0038
type: principle
status: frozen
version: 0.1.0
title: Làm cho sự tham gia thực chất hoặc đừng sử dụng nó
summary: Đừng yêu cầu mọi người tham gia trừ khi góp ý của họ thực sự có thể ảnh hưởng đến hiểu biết, thiết kế hoặc thực thi.
primary_domain: dung-nhan
secondary_domains:
- hop-chung
- tri-nhan
definition: Tham gia chỉ tạo ra cam kết khi nó thực chất; tham gia tượng trưng làm tổn hại niềm tin và dạy mọi người rằng góp ý chỉ là diễn.
mechanism:
- Làm rõ điều gì còn mở
- Làm rõ điều gì đã cố định
- Báo cáo ảnh hưởng của sự tham gia.
conditions:
- Sự tham gia đang được yêu cầu
- Ranh giới quyết định có thể được nêu rõ.
exceptions:
- Thu thập thông tin có thể hợp lệ mà không cần chia sẻ quyền quyết định nếu được dán nhãn trung thực
- Ràng buộc pháp lý hoặc an toàn có thể giới hạn ảnh hưởng.
applications:
  leadership:
  - Tách bạch tham vấn khỏi đồng thuận.
  governance:
  - Công bố phạm vi quyết định trước các chu kỳ xem xét.
risks:
- Thao túng
- Mệt mỏi vì tham vấn.
