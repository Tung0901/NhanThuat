id: NT-ANTI-PATTERN-0002
type: anti-pattern
status: frozen
version: 0.1.0
title: Load-blind moralizing
summary: A harmful pattern where degraded behavior under overload is immediately treated as laziness, disloyalty, or weak character.
primary_domain: tri-nhan
secondary_domains: [tu-than, dung-nhan]
definition: Load-blind moralizing skips diagnosis of capacity and system pressure, making repair and learning harder.
mechanism: [Observe failure, Ignore load, Assign moral blame, Increase pressure.]
conditions: [People are overloaded, leaders lack visibility into work or emotional demand.]
exceptions: [Clear misconduct may require immediate accountability, repeated failure after load repair may reveal another issue.]
applications: {management: [Check workload and decision pressure before moral conclusions.], coaching: [Separate load, skill, will, and values.]}
risks: [Excusing harmful conduct, over-correcting into low standards.]
evidence: {level: provisional, references: []}
relations: {supports: [], conflicts_with: [], depends_on: [NT-LAW-0027], applies_to: []}
tags: [anti-pattern, load, blame]
