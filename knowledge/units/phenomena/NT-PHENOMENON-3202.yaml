id: NT-PHENOMENON-3202
type: phenomenon
title: Hiệu ứng Zeigarnik
summary: Con người nhớ những nhiệm vụ chưa hoàn thành hoặc bị gián đoạn tốt hơn những nhiệm vụ đã hoàn thành.
primary_domain: tri-nhan
domain_area: NT-DA-0028
definition: Một hiện tượng nhận thức, trong đó các nhiệm vụ chưa hoàn thành tạo ra một sức căng đặc thù khiến nhiệm vụ vẫn hoạt động trong bộ nhớ làm việc cho đến khi được giải quyết.
mechanism:
- Bắt đầu một nhiệm vụ tạo ra một sức căng tâm lý.
- Việc gián đoạn nhiệm vụ ngăn cản sức căng được giải tỏa.
- Sức căng chưa được giải quyết giữ ký ức về nhiệm vụ ở trạng thái dễ truy xuất cao.
conditions:
- Các nhiệm vụ mà cá nhân thực sự có ý định hoàn thành.
exceptions:
- Các nhiệm vụ bị gián đoạn do thất bại hoàn toàn hoặc bị chủ động từ bỏ.
applications:
  marketing:
  - Sử dụng các tình tiết hồi hộp hoặc thanh tiến trình để tạo sức căng hoàn thành.
risks:
- Kiệt sức do để lại quá nhiều 'vòng lặp mở' vào cuối ngày làm việc.
evidence:
  level: strong
  references:
  - Zeigarnik, B. (1927). 'On finished and unfinished tasks'. Psychological Research.
relations:
