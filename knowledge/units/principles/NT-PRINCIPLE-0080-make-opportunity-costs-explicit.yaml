mechanism:
- Liệt kê các phương án thay thế thực sự khả dụng.
- Xác định giá trị kỳ vọng của phương án bị từ bỏ tốt nhất.
- Đưa chi phí cơ hội vào tiêu chí so sánh quyết định.
- Tái đánh giá khi xuất hiện phương án thay thế mới tốt hơn.
