id: NT-PRINCIPLE-3402
type: principle
title: Xu hướng tôn trọng lý do (Heuristic "Bởi vì")
summary: Mọi người rất có khả năng tuân thủ một yêu cầu nếu có lý do được đưa ra, ngay cả khi lý do đó hoàn toàn vô nghĩa.
primary_domain: tri-nhan
domain_area: NT-DA-0030
definition: Một nguyên tắc ảnh hưởng tự động trong đó sự hiện diện về mặt cấu trúc của từ "bởi vì" đóng vai trò là đặc điểm kích hoạt, gây ra sự tuân thủ vô thức cho các yêu cầu nhỏ đến trung bình.
mechanism:
- Một yêu cầu được đưa ra.
- Từ "bởi vì" được thêm vào, theo sau là một mệnh đề.
- Đối với các yêu cầu nhỏ, quá trình xử lý tự động của não (Hệ thống 1) nhận diện cú pháp của một yêu cầu có lý do và tuân thủ mà không thực sự đánh giá logic của mệnh đề.
conditions:
- Các yêu cầu nhỏ, rủi ro thấp, nơi sự suy luận nhận thức ở mức thấp.
exceptions:
- 'Các yêu cầu có giá trị lớn (ví dụ: xin 10.000 USD). Trong những trường hợp này, não chuyển sang Tuyến trung tâm (ELM) và đánh giá chất lượng thực sự của lý do.'
applications:
  communication:
  - '"Xin lỗi, tôi có 5 trang. Tôi dùng máy Xerox được không vì tôi cần sao vài bản?" (Kết quả là 93% tuân thủ dù lý do là sáo rỗng).'
risks:
- Nghe có vẻ xúc phạm hoặc thao túng nếu dùng lặp đi lặp lại trong khoảng thời gian gần nhau.
evidence:
  level: strong
  references:
  - 'Langer, E. J., Blank, A., & Chanowitz, B. (1978). ''The mindlessness of ostensibly thoughtful action: The role of ''placebic'' information in interpersonal interaction''. Journal of Personality and Social Psychology.'
