id: NT-PRINCIPLE-0015
type: principle
status: frozen
version: 0.1.0
title: Khớp trách nhiệm giải trình với quyền hành động
summary: Yêu cầu con người chịu trách nhiệm về kết quả chỉ ở mức độ họ có quyền hạn, thông tin và nguồn lực để tác động đến kết quả đó.
primary_domain: dung-nhan
secondary_domains:
- thanh-su
- hop-chung
definition: Trách nhiệm giải trình đáng tin cậy khi nó đi kèm với quyền hành động thực tế đối với các lựa chọn định hình nên kết quả.
mechanism:
- Xác định kết quả.
- Xác định mức ảnh hưởng lên các quyết định.
- Căn chỉnh trách nhiệm giải trình với quyền hành động thực tế.
conditions:
- Kết quả phụ thuộc vào các quyết định có thể kiểm soát.
- Ranh giới quyền hạn có thể được biết rõ.
exceptions:
- Kết quả chung đòi hỏi trách nhiệm giải trình chung.
- Quản trị có thể bao gồm việc nêu lên các ràng buộc.
applications:
  management:
  - Hỏi xem người đó thực sự có thể quyết định điều gì.
  governance:
  - Tránh quy lỗi ngoài phạm vi quyền ra quyết định.
risks:
- Trốn tránh trách nhiệm giải trình bằng cách viện dẫn kiểm soát thấp.
- Phớt lờ ảnh hưởng của người không có quyền hạn chính thức.
