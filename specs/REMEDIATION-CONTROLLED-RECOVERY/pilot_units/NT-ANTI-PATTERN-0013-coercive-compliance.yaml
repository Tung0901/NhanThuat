proposed_unit:
  id: NT-ANTI-PATTERN-0013
  type: anti-pattern
  status: frozen
  version: 1.0.0
  title: Sự tuân thủ cưỡng ép
  summary: Quản lý bằng đe dọa và trừng phạt tạo ra sự phục tùng bề mặt nhưng triệt
    tiêu động lực nội tại và sự trung thực của thông tin.
  primary_domain: dung-nhan
  domain_area: NT-DA-0011
  secondary_domains:
  - tu-than
  definition: Hành vi lãnh đạo dựa trên quyền lực cưỡng chế khiến cấp dưới hành động
    chỉ để tránh né hình phạt thay vì hướng đến mục tiêu chung.
  mechanism:
  - Quản lý áp đặt mệnh lệnh kèm chế tài trừng phạt nặng nề.
  - Cấp dưới chỉ làm vừa đủ để không bị phạt và che giấu mọi sai sót phát sinh.
  - Mất dần tính chủ động và sáng tạo trong công việc.
  - Thông tin trung thực bị chặn lại ở các cấp dưới do tâm lý sợ hãi.
  - Hiệu suất tổng thể giảm sút dù bề ngoài vẫn duy trì kỷ luật nghiêm ngặt.
  conditions:
  - Công việc đòi hỏi sự chủ động giải quyết vấn đề, chất lượng dịch vụ tinh tế hoặc
    chia sẻ thông tin trung thực.
  - Chi phí giám sát toàn diện hành vi là bất khả thi hoặc quá tốn kém.
  exceptions:
  - Quy tắc an toàn lao động tối thiểu, bảo mật cốt lõi hoặc tuân thủ pháp luật bắt
    buộc.
  - Tình huống khẩn cấp ngắn hạn cần lập lại trật tự tức thời trước khi giải thích
    nguyên nhân.
  applications:
    management:
    - Chuyển dịch cơ chế quản lý từ phạt vi phạm sang thưởng đóng góp và đối thoại
      cởi mở
  risks:
  - Xóa bỏ ranh giới kỷ luật và tiêu chuẩn đầu ra dưới danh nghĩa tránh cưỡng ép.
  - Mất khả năng xử lý dứt điểm các hành vi cố tình vi phạm chuẩn mực đạo đức.
  evidence:
    level: supported
    references:
