services:
  - type: web
    name: nhan-thuat-web
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: PYTHONPATH=src python -m backend.app.main
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: PORT
        value: "8000"
      - key: GEMINI_API_KEY
        sync: false
      - key: NT_ADMIN_PASSWORD
        sync: false
      - key: NT_EXECUTIVE_PASSWORD
        sync: false
      - key: NT_ADVISOR_PASSWORD
        sync: false
      - key: NT_GUEST_PASSWORD
        sync: false
      - key: NT_SESSION_TTL_SECONDS
        value: "28800"
