id: NT-PHENOMENON-3108
type: phenomenon
title: Ngụy biện chi phí chìm
summary: Tiếp tục một nỗ lực vì các nguồn lực đã đầu tư trước đó (thời gian, tiền bạc hoặc công sức), bất chấp bằng chứng cho thấy nó không còn mang lại lợi ích.
primary_domain: tri-nhan
domain_area: NT-DA-0027
definition: Việc đưa các chi phí quá khứ không thể thu hồi vào quyết định tương lai một cách phi lý, được thúc đẩy bởi mong muốn không bị coi là hoang phí hoặc không muốn thừa nhận thất bại.
mechanism:
- Các nguồn lực được đầu tư vào một hướng hành động đang thất bại.
- Từ bỏ hướng đi đó buộc phải hiện thực hóa một mất mát.
- Để tránh nỗi đau tâm lý từ mất mát này, người ta đầu tư thêm nguồn lực để 'xoay chuyển tình thế'.
conditions:
- Trách nhiệm cá nhân cao đối với khoản đầu tư ban đầu.
exceptions:
- Khi quyết định được chuyển giao cho một nhà quản lý hoàn toàn mới không có ràng buộc với quá khứ.
applications:
  project_management:
  - Thiết lập các tiêu chí dừng dựa trên mốc quan trọng nghiêm ngặt trước khi dự án bắt đầu.
risks:
- Đổ tiền bạc vào chỗ mất (đầu tư thêm vào thua lỗ) trong các cuộc viết lại kỹ thuật vô vọng.
evidence:
  level: strong
  references:
  - Arkes, H. R., & Blumer, C. (1985). 'The psychology of sunk cost'. Organizational Behavior and Human Decision Processes.
