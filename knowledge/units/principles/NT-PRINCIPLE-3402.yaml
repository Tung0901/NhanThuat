id: NT-PRINCIPLE-3402
type: principle
title: Reason-Respecting Tendency ('Because' Heuristic)
summary: People are highly likely to comply with a request if a reason is provided,
  even if that reason is completely meaningless.
primary_domain: tri-nhan
domain_area: NT-DA-0030
definition: A principle of automatic influence where the structural presence of the
  word 'because' acts as a trigger feature, causing mindless compliance for small
  to moderate requests.
mechanism:
- A request is made.
- The word 'because' is appended, followed by a clause.
- For small requests, the brain's automatic processing (System 1) recognizes the syntax
  of a justified request and complies without actually evaluating the logic of the
  clause.
conditions:
- Small, low-stakes requests where cognitive elaboration is low.
exceptions:
- High-stakes requests (e.g., asking for $10,000). In these cases, the brain shifts
  to the Central Route (ELM) and evaluates the actual quality of the reason.
applications:
  communication:
  - '''Excuse me, I have 5 pages. May I use the Xerox machine because I have to make
    some copies?'' (Resulted in 93% compliance despite the reason being tautological).'
risks:
- Sounding insulting or manipulative if used repeatedly in close proximity.
evidence:
  level: strong
  references:
  - 'Langer, E. J., Blank, A., & Chanowitz, B. (1978). ''The mindlessness of ostensibly
    thoughtful action: The role of ''placebic'' information in interpersonal interaction''.
    Journal of Personality and Social Psychology.'
