id: NT-LAW-0036
type: law
status: frozen
version: 0.1.0
title: Quy Luật Biểu Hiện Mặc Định Xác Suất Dưới Tải Trọng
summary: Dưới áp lực nhận thức, cảm xúc hoặc thể chất kéo dài, xác suất biểu hiện các mẫu hành vi mặc định ít tốn công sức hơn sẽ tăng lên do sự kiểm soát điều hành bị căng thẳng.
primary_domain: tri-nhan
secondary_domains:
- tu-than
definition: Tải trọng nhận thức, cảm xúc hoặc thể chất kéo dài làm căng thẳng khả năng kiểm soát điều hành. Mà không giả định một cơ chế cạn kiệt tài nguyên theo nghĩa đen, áp lực này làm tăng xác suất thống kê rằng sự biểu hiện đặc điểm và hành vi quan sát được của một cá nhân sẽ rơi trở lại các hành vi mặc định tiềm ẩn thay vì các sự thích ứng có chủ ý.
mechanism:
- Tải trọng kéo dài làm tăng các yêu cầu về nhận thức
- Năng lực kiểm soát điều hành được ưu tiên động cho các nhiệm vụ trước mắt
- Sự biểu hiện đặc điểm dịch chuyển theo xác suất hướng tới các mặc định ít tốn công sức
conditions:
- Tải trọng nhận thức, cảm xúc hoặc thể chất cao và kéo dài đang hiện diện.
exceptions:
- Các thói quen được tự động hóa cao hoặc sức mạnh tình huống bên ngoài lớn có thể kìm hãm các hành vi mặc định ngay cả khi chịu tải.
applications:
  task-design:
  - Giảm thiểu tải trọng nhận thức trong các hoạt động rủi ro cao để đảm bảo tuân thủ các hành vi quan trọng.
  leadership:
  - Dự đoán và lên kế hoạch cho sự biểu hiện mặc định dướiσ áp lực vận hành cao thay vì kỳ vọng sự che giấu liên tục.
risks:
- Biện minh cho hành vi xấu hoặc sai lầm đạo đức là sự biểu hiện mặc định không thể tránh khỏi.
- Dựa vào các lý thuyết cạn kiệt cái tôi lỗi thời để lập kế hoạch tài nguyên nhận thức.
evidence:
  level: provisional
  references:
  - Inzlicht, M., & Schmeichel, B. J. (2012). What is Ego Depletion? Toward a Motivation-Control Model of Self-Control.
