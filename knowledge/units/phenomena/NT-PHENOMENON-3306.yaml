id: NT-PHENOMENON-3306
type: phenomenon
title: Reciprocity Norm
summary: The powerful social rule that we should try to repay, in kind, what another
  person has provided us.
primary_domain: tri-nhan
domain_area: NT-DA-0029
definition: A fundamental sociological and psychological mechanism where receiving
  a favor, gift, or concession creates a strong sense of indebtedness that demands
  repayment.
mechanism:
- Person A provides value, assistance, or a concession to Person B.
- Person B experiences psychological discomfort (indebtedness).
- Person B actively seeks to provide value back to Person A to resolve the tension.
conditions:
- The initial favor must be perceived as genuine, unprompted, or personalized.
exceptions:
- When the 'favor' is explicitly recognized as a manipulative sales tactic.
applications:
  negotiation:
  - Making an intentional, visible concession early in a negotiation to trigger a
    reciprocal concession from the counterpart.
risks:
- Bribery or conflict of interest where small gifts influence massive corporate purchasing
  decisions.
evidence:
  level: strong
  references:
  - 'Gouldner, A. W. (1960). ''The norm of reciprocity: A preliminary statement''.
    American Sociological Review.'
  - Cialdini, R. B. (1984). 'Influence'.
