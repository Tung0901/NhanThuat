id: NT-MODEL-0005
type: model
status: frozen
version: 0.1.0
title: Hiệu ứng lấn át do biện minh quá mức
summary: Mô hình cấu trúc chỉ ra cách việc áp dụng các phần thưởng bên ngoài quá lớn hoặc giám sát chặt chẽ vào các hoạt động vốn có động lực nội tại sẽ chuyển trọng tâm sang sự tuân thủ và làm giảm nỗ lực tự nguyện khi phần thưởng chấm dứt.
primary_domain: tu-than
secondary_domains:
- tri-nhan
- thanh-su
definition: Phần thưởng bên ngoài quá lớn làm suy yếu điểm kiểm soát nội tại, khiến các cá nhân quy kết nỗ lực của họ hoàn toàn là do phần thưởng bên ngoài đó.
mechanism:
- Quan sát sự hứng thú nội tại đối với nhiệm vụ
- Đưa vào phần thưởng ngoại tại quá lớn
- Tái quy kết động cơ sang các yếu tố bên ngoài
- Làm xói mòn động lực tự nguyện khi phần thưởng bị loại bỏ.
conditions:
- Hoạt động ban đầu phải có mức độ hứng thú nội tại cơ bản.
exceptions:
- Các nhiệm vụ thuần túy cơ học hoặc gây khó chịu mà sự hứng thú nội tại vốn dĩ bằng không.
applications:
  compensation-design:
  - Tách biệt việc giải quyết vấn đề sáng tạo khỏi các cơ chế thưởng nhỏ.
  management:
  - Duy trì niềm tự hào nghề nghiệp nội tại bên cạnh mức lương cơ bản công bằng.
risks:
- Vô tình hủy hoại nhiệt huyết của tổ chức thông qua các khuyến khích mang tính giao dịch quá mức.
