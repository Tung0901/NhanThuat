proposed_unit:
  id: NT-LAW-2101
  type: law
  status: frozen
  version: 1.1.0
  title: Định luật Entropy trong Khủng hoảng
  summary: Trong các hệ thống tổ chức liên kết chặt, khoảng trống thông tin và độ
    trễ phản ứng thường làm gia tăng độ hỗn loạn nhanh chóng nếu thiếu các ranh giới
    ngăn cách.
  primary_domain: thanh-su
  domain_area: NT-DA-0021
  secondary_domains:
  - dung-nhan
  definition: Khủng hoảng không duy trì trạng thái tĩnh; nếu không được khoanh vùng
    và xử lý chủ động, mức độ hỗn loạn (entropy) của hệ thống có xu hướng tăng dần
    theo thời gian.
  mechanism:
  - Sự cố khởi phát tạo ra nhiễu loạn cục bộ.
  - Thiếu kiểm soát khiến nhiễu loạn lan truyền sang các bộ phận liên đới.
  - Mức độ hỗn loạn tăng dần làm suy giảm năng lực tự điều chỉnh.
  - Hệ thống mất trật tự và khả năng điều hành bình thường.
  - Cần can thiệp phân lập và tái thiết lập trật tự từ bên ngoài.
  conditions:
  - Các sự cố vận hành, kỹ thuật hoặc truyền thông có tốc độ lan truyền nhanh và liên
    quan đến các bên phụ thuộc lẫn nhau.
  - Kênh thông tin chính thức bị gián đoạn khiến các bộ phận cơ sở hành động theo
    giả định cục bộ.
  exceptions:
  - Các hệ thống có cơ chế phân lập tự động (circuit breaker) hoặc phân rã module
    độc lập.
  - Biến cố diễn tiến chậm, nơi việc quan sát thêm mang lại dữ liệu giá trị hơn là
    phản ứng hấp tấp.
  applications:
    management:
    - Thiết lập quy trình khoanh vùng sự cố tức thì trong 60 phút đầu
  risks:
  - Can thiệp vội vã thiếu dữ liệu làm phá vỡ thêm cấu trúc hệ thống.
  - Phóng đại sự cố nhỏ thành khủng hoảng toàn diện gây hoang mang nội bộ.
  evidence:
    level: supported
    references:
    - '[Empirical Study] Weick, K. E. (1993). The collapse of sensemaking in organizations:
      The Mann Gulch disaster. Administrative Science Quarterly, 38(4), 628-652 (Nghiên
      cứu thực địa về sự đứt gãy nhận thức trong thảm họa Mann Gulch).'
    - '[Academic Monograph] Perrow, C. (1984). Normal Accidents: Living with High-Risk
      Technologies. Basic Books (Cơ chế khuếch đại sự cố trong hệ thống liên kết chặt).'
    - '[Classical Analogy] Tôn Vũ — Tôn Tử Binh Pháp, thiên Binh Thế & Cửu Biến (Quản
      trị nhịp độ và ngăn chặn phản ứng dây chuyền khi biến cố phát sinh).'
    - '[Editorial Inference] Quy trình phân lập sự cố và thiết lập nhịp thông tin
      trong vận hành doanh nghiệp.'
