id: NT-PRINCIPLE-0029
type: principle
status: frozen
version: 0.1.0
title: Đưa mục tiêu xa đến gần
summary: Chuyển các mục tiêu dài hạn thành tín hiệu, thói quen và hệ quả gần để con người có thể nhận ra trong các quyết định hằng ngày.
primary_domain: thanh-su
secondary_domains:
- tri-nhan
- tu-than
definition: Mục tiêu xa có sức ảnh hưởng khi chúng được làm cho hiện hữu và khả thi trong môi trường tức thời.
mechanism:
- Nêu tên mục tiêu dài hạn.
- Tạo tín hiệu và điểm chốt gần.
- Kết nối hành động hằng ngày với hệ quả tương lai.
conditions:
- Mục tiêu quan trọng nhưng trừu tượng.
- Hành vi hằng ngày ảnh hưởng đến nó.
exceptions:
- Rút ngắn quá mức có thể bóp méo chiến lược.
- Một số kết quả đòi hỏi kiên nhẫn mà không có tín hiệu thường xuyên.
applications:
  strategy:
  - Tạo chỉ số tuần cho các mục tiêu năm.
  communication:
  - Kết nối mục đích với sự đánh đổi hôm nay.
risks:
- Quy giản tầm nhìn thành nhiệm vụ.
- Tạo ra tính khẩn trương giả.
