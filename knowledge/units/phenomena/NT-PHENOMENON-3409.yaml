id: NT-PHENOMENON-3409
type: phenomenon
title: Hiệu ứng nạn nhân dễ nhận diện
summary: Con người sẵn sàng giúp đỡ một cá nhân cụ thể, có thể nhận diện được đang gặp khó khăn hơn nhiều so với một nhóm lớn, mơ hồ với cùng nhu cầu đó.
primary_domain: tri-nhan
domain_area: NT-DA-0030
definition: Một thiên kiến nhận thức trong quyên góp từ thiện và phân bổ nguồn lực, trong đó sự đồng cảm cảm xúc (Hệ thống 1) bị kích hoạt mạnh mẽ bởi một khuôn mặt và câu chuyện đơn lẻ, nhưng lại bị dập tắt bởi số liệu thống kê và quy mô.
mechanism:
- Câu chuyện về một cá nhân đơn lẻ, được nêu tên được trình bày.
- Cảm xúc dâng trào và sự đồng cảm được kích hoạt mạnh.
- Hành động (quyên góp/giúp đỡ) diễn ra ngay lập tức.
- Ngược lại, trình bày số liệu thống kê về hàng triệu người chết kích hoạt quá trình xử lý trừu tượng, vô cảm, dẫn đến không hành động.
conditions:
- Gây quỹ, các chiến dịch từ thiện và các diễn ngôn chính trị.
exceptions:
- Khi 'nạn nhân dễ nhận diện' bị nhận định là rất đáng trách vì hoàn cảnh của chính họ.
applications:
  communication:
  - Không bao giờ dùng số liệu thống kê để mở đầu bài thuyết trình. Hãy mở đầu bằng câu chuyện của một khách hàng cụ thể có cuộc đời bị hủy hoại bởi vấn đề mà bạn giải quyết.
risks:
- Phân bổ nguồn lực sai lệch mang tính hệ thống, khi số tiền khổng lồ được chi để cứu một người trong khi hàng nghìn người khác chết thầm lặng ở nơi khác.
evidence:
  level: strong
  references:
  - 'Small, D. A., Loewenstein, G., & Slovic, P. (2007). ''Sympathy and callousness: The impact of deliberative thought on donations to identifiable and statistical victims''.'
