id: NT-ANTI-PATTERN-0021
type: anti-pattern
status: frozen
version: 0.1.0
title: Ảo tưởng truyền phát
summary: Đơn vị kiến thức cấu trúc về Ảo tưởng truyền phát (Broadcast Illusion) trong truyền thông tổ chức.
primary_domain: tri-nhan
secondary_domains:
- hop-chung
definition: Định nghĩa chính thức về Ảo tưởng truyền phát trong kiến trúc Nhân Thuật, chỉ hiện tượng nhầm tưởng rằng việc phát đi thông điệp đồng nghĩa với việc thông điệp đó đã được thấu hiểu và tiếp nhận hiệu quả.
conditions:
- Các bối cảnh quản trị vận hành tổ chức.
exceptions:
- Các trường hợp ưu tiên đè thẩm quyền trong khủng hoảng khẩn cấp.
applications:
  governance:
  - Áp dụng nhận diện Ảo tưởng truyền phát vào quy trình làm việc của tổ chức.
risks:
- Áp dụng sai hoặc không nhận diện được Ảo tưởng truyền phát dẫn đến hiệu suất giao tiếp và vận hành không đạt tối ưu.
