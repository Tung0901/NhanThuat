id: NT-PRINCIPLE-0038
type: principle
status: frozen
version: 0.1.0
title: Make participation real or do not use it
summary: Do not ask people to participate unless their input can genuinely affect
  understanding, design, or execution.
primary_domain: dung-nhan
secondary_domains:
- hop-chung
- tri-nhan
definition: Participation creates commitment only when it is real; symbolic participation
  damages trust and teaches people that input is performative.
mechanism:
- Clarify what is open
- Clarify what is fixed
- Report the effect of participation.
conditions:
- Participation is being requested
- Decision boundaries can be stated.
exceptions:
- Information gathering may be valid without shared authority if labeled honestly
- Legal or safety constraints may limit influence.
applications:
  leadership:
  - Separate consultation from consent.
  governance:
  - Publish the decision space before review cycles.
risks:
- Manipulation
- Consultation fatigue.
evidence:
  level: provisional
  references: []
relations:
  supports: []
  conflicts_with: []
  depends_on:
  - NT-LAW-0021
  - NT-LAW-0011
  applies_to: []
tags:
- participation
- trust
- commitment
