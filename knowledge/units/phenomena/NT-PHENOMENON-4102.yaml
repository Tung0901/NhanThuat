id: NT-PHENOMENON-4102
type: phenomenon
status: draft
version: 1.0.0
title: Hiệu ứng Chim mồi (Decoy Effect)
summary: Khách hàng sẽ thay đổi ưu tiên giữa hai lựa chọn khi xuất hiện một lựa chọn thứ ba hoàn toàn
  bất đối xứng.
primary_domain: dung-nhan
domain_area: NT-DA-0027
secondary_domains:
- thanh-su
definition: Lựa chọn mồi nhử không được thiết kế để bán, mà được thiết kế để làm cho một trong các lựa
  chọn khác trở nên hấp dẫn hơn hẳn.
conditions:
- Lựa chọn chim mồi phải rõ ràng kém hơn lựa chọn mục tiêu trên một khía cạnh, nhưng giá tương đương.
exceptions:
- Khách hàng đã am hiểu và có sẵn tiêu chuẩn chính xác tuyệt đối.
applications:
  general:
  - Áp dụng trong quản trị và kinh doanh.
risks:
- Nếu khách hàng nhận ra thủ thuật, sẽ dẫn đến sự phẫn nộ và mất uy tín.
evidence:
  level: strong
  references:
  - '[Nghiên cứu thực nghiệm] Huber, J., Payne, J. W., & Puto, C. (1982). Adding asymmetrically dominated
    alternatives: Violations of regularity and the similarity hypothesis. Journal of Consumer Research,
    9(1), 90-98 (Nghiên cứu gốc về hiệu ứng ưu thế bất đối xứng).'
  - '[Nghiên cứu thực nghiệm] Frederick, S., Lee, L., & Baskin, E. (2014). The limits of attraction. Journal
    of Marketing Research, 51(4), 487-507 (Điều kiện giới hạn của hiệu ứng chim mồi đối với trải nghiệm
    phi định lượng).'
  - '[Sách phổ thông] Ariely, D. (2008). Predictably Irrational: The Hidden Forces That Shape Our Decisions.
    HarperCollins.'
  - '[Suy luận biên tập] Quy tắc đạo đức và giới hạn áp dụng kiến trúc lựa chọn trong định giá.'
