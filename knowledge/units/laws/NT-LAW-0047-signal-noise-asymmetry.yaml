mechanism:
- Hệ thống tạo ra ngày càng nhiều thông tin vận hành.
- Phần lớn thông tin gia tăng là nhiễu lặp lại hoặc không hành động được.
- Tín hiệu quan trọng bị pha loãng trong tổng khối lượng.
- Chi phí chú ý và lọc tăng nhanh hơn lợi ích thu được từ tín hiệu.
