created_at: '2026-08-24'
updated_at: '2026-09-14'
mechanism:
- Cấp dưới thể hiện năng lực hoặc thành tích vượt trội trước người có quyền.
- Người nắm quyền cảm nhận mối đe dọa với vị thế và sự tôn nghiêm.
- Cảm giác bất an kích hoạt hành vi kìm hãm hoặc loại bỏ ngầm.
- Cấp dưới học cách giảm sự tỏa sáng để tự bảo vệ.
- Tổ chức mất nhân tài và năng lực thực thi khi cấu trúc quyền lực không được quản trị.
