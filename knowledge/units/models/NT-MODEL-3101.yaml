id: NT-MODEL-3101
type: model
title: Khung Lý thuyết Triển vọng
summary: Mô hình mô tả chuẩn tắc về quá trình ra quyết định dưới điều kiện rủi ro, chứng minh rằng con người định giá các khoản lãi và lỗ khác nhau, đánh giá kết quả so với một điểm tham chiếu thay vì trạng thái tài sản cuối cùng.
primary_domain: tri-nhan
domain_area: NT-DA-0027
definition: Mô hình kinh tế học hành vi thay thế cho Lý thuyết Hữu dụng Kỳ vọng. Mô hình này tích hợp hàm giá trị bất đối xứng (độ dốc của tổn thất lớn hơn lợi nhuận) và hàm trọng số xác suất phi tuyến (đánh giá quá cao các xác suất nhỏ).
mechanism:
- 'Giai đoạn hiệu chỉnh: Các phương án quyết định được đóng khung và đơn giản hóa tương đối so với một điểm tham chiếu trung lập.'
- 'Giai đoạn đánh giá: Giá trị được xác định dựa trên những biến đổi tiềm năng so với điểm tham chiếu.'
- 'Tâm lý sợ tổn thất: Nỗi đau khi mất 100 đô la có tác động tâm lý mạnh hơn niềm vui khi nhận được 100 đô la.'
- 'Trọng số xác suất: Các xác suất rất thấp bị phóng đại quá mức; các xác suất trung bình và cao bị đánh giá thấp hơn thực tế.'
conditions:
- Các quyết định liên quan đến rủi ro rõ ràng, xác suất cụ thể và các khoản lãi hoặc lỗ tiềm năng tách biệt.
exceptions:
- Các quyết định mà rủi ro hoặc lợi ích mang lại cực kỳ nhỏ hoặc mang tính thói quen thường nhật.
applications:
  risk_communication:
  - Đóng khung xác suất bằng các con số tuyệt đối thay vì tỷ lệ phần trăm để giảm thiểu sự sai lệch do trọng số xác suất.
risks:
- Mặc định sự tối đa hóa hữu dụng kỳ vọng duy lý trong các mô hình tài chính hoặc hoạch định chiến lược.
evidence:
  level: strong
  references:
  - 'Kahneman, D., & Tversky, A. (1979). ''Prospect Theory: An Analysis of Decision under Risk''. Econometrica.'
