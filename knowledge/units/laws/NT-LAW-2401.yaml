id: NT-LAW-2401
type: law
status: frozen
version: 1.0.0
title: Quy luật Dư thừa Hệ thống
summary: Sự bền bỉ và khả năng chống chịu của hệ thống đòi hỏi một mức độ dư thừa có tính toán thay vì tối ưu hóa hiệu suất một cách cực đoan.
primary_domain: hop-chung
domain_area: NT-DA-0024
secondary_domains:
- thanh-su
definition: Biên độ an toàn và các nguồn lực dự phòng đóng vai trò như một tấm đệm giảm chấn giúp hấp thụ các cú sốc và biến động ngoài dự kiến.
mechanism:
- Xác định các chức năng và điểm nghẽn trọng yếu trong hệ thống.
- Xây dựng các phương án và nguồn lực dự phòng tương ứng.
conditions:
- Môi trường vĩ mô và thị trường có mức độ biến động và rủi ro cao.
exceptions:
- Các doanh nghiệp khởi nghiệp trong giai đoạn sinh tồn cần tối ưu chi phí tối đa.
applications:
  management:
  - Quản trị rủi ro chuỗi cung ứng và vận hành doanh nghiệp
risks:
- Sự dư thừa không hợp lý dẫn đến lãng phí nguồn lực và giảm năng lực cạnh tranh
