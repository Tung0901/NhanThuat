id: NT-LAW-2301
type: law
status: frozen
version: 1.0.0
title: Quy luật Mỏ neo
summary: Con người có xu hướng phụ thuộc quá mức vào thông tin đầu tiên nhận được khi đưa ra quyết định.
primary_domain: tri-nhan
domain_area: NT-DA-0023
secondary_domains:
- thanh-su
definition: Não bộ sử dụng thông tin ban đầu làm điểm tham chiếu để so sánh và điều chỉnh các ước tính tiếp theo, dẫn đến các quyết định bị thiên lệch.
mechanism:
- Nhận diện thông tin mang tính chất mỏ neo.
- Thiết lập một mỏ neo có lợi cho vị thế của mình.
conditions:
- Các tình huống đàm phán, định giá và dự báo.
exceptions:
- Những chuyên gia có kinh nghiệm sâu sắc và thông tin đầy đủ.
applications:
  negotiation:
  - Chủ động đưa ra con số đầu tiên để thiết lập mỏ neo
risks:
- Bị thao túng và giới hạn quyết định bởi mỏ neo do đối phương thiết lập
