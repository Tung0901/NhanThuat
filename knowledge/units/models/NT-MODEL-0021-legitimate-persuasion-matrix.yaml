id: NT-MODEL-0021
type: model
status: frozen
version: 0.2.0
title: Ma Trận Thuyết Phục Chính Danh
summary: Ma trận phân loại các phương thức thuyết phục theo mức độ minh bạch của ý định và mức độ tự nguyện của người bị thuyết phục. Mô hình giúp phân biệt thuyết phục chính danh với thao túng.
primary_domain: tri-nhan
secondary_domains:
- hop-chung
definition: 'Ma trận Thuyết Phục Chính Danh là khung đánh giá các kỹ thuật gây ảnh hưởng theo hai chiều: mức độ minh bạch về ý định của người thuyết phục và mức độ tự nguyện thực sự của người tiếp nhận.'
conditions:
- Cần đánh giá đạo đức của hoạt động gây ảnh hưởng.
- Người tiếp nhận có quyền lựa chọn trong tình huống.
exceptions:
- Tình huống bảo vệ an toàn cộng đồng có thể cần mức áp đặt cao hơn bình thường.
- Giao tiếp quảng cáo theo quy định pháp luật có khuôn khổ riêng.
applications:
  leadership:
  - Kiểm tra các kỹ thuật vận động có nằm trong vùng chính danh không.
  - Minh bạch ý định khi đề xuất thay đổi lớn.
  negotiation:
  - Phân biệt thuyết phục dựa trên lợi ích với thao túng thông tin.
  sales:
  - Thiết kế hoạt động bán hàng minh bạch về giá trị và điều kiện.
risks:
- Ngụy biện cho thao túng bằng danh nghĩa thuyết phục.
- Đánh giá thấp áp lực ngầm từ bất đối xứng quyền lực.
- Minh bạch hình thức nhưng vẫn giới hạn lựa chọn thực chất.
evidence:
  level: supported
  references:
