id: NT-PHENOMENON-3401
type: phenomenon
title: Nguyên tắc khan hiếm
summary: Các cơ hội dường như trở nên giá trị hơn với chúng ta khi khả năng tiếp cận bị giới hạn.
primary_domain: tri-nhan
domain_area: NT-DA-0030
definition: Một lối tư duy theo thói quen tiến hóa, khiến con người nhận định những nguồn lực hiếm hoi, thoáng qua hoặc bị giới hạn là vượt trội hơn những nguồn lực dồi dào, từ đó thúc đẩy hành vi thu nhận khẩn cấp.
mechanism:
- Một vật phẩm hoặc cơ hội được trình bày với giới hạn về thời gian (hạn chót) hoặc số lượng.
- Điều này đe dọa quyền tự do lựa chọn của cá nhân (phản kháng tâm lý).
- Để khôi phục quyền tự do và tránh bỏ lỡ, cá nhân nhanh chóng thu nhận vật phẩm, bỏ qua việc định giá trị một cách logic.
conditions:
- Khi sự khan hiếm được nhận thức là thật và vật phẩm có giá trị sử dụng cơ bản.
exceptions:
- Khi sự khan hiếm rõ ràng bị nhận diện là chiêu trò tiếp thị giả tạo, mang tính thao túng (dẫn đến phản ứng ngược).
applications:
  sales:
  - '''Chỉ còn 2 chỗ trống với mức giá này'' vượt trội đáng kể so với ''Mua một chỗ ngồi với mức giá này''.'
risks:
- 'Tạo ra môi trường mua sắm hoảng loạn làm hủy hoại niềm tin của khách hàng (ví dụ: các thuật toán đầu cơ vé).'
evidence:
  level: strong
  references:
  - 'Cialdini, R. B. (1984). ''Influence: The Psychology of Persuasion''.'
