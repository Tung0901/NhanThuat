id: NT-PRINCIPLE-0016
type: principle
status: frozen
version: 0.1.0
title: Leo thang các ràng buộc, không chỉ thất bại
summary: Leo thang sớm khi các ràng buộc về quyền hạn, nguồn lực, thông tin hoặc năng lực khiến một kết quả trở nên bất khả thi.
primary_domain: thanh-su
secondary_domains:
- dung-nhan
- hop-chung
definition: Việc leo thang ràng buộc sớm bảo vệ quyền sở hữu bằng cách hé lộ điều phải thay đổi trước khi thất bại trở nên không thể tránh khỏi.
mechanism:
- Phát hiện một ràng buộc.
- Nêu rõ tác động.
- Leo thang quyết định hoặc sự hỗ trợ cần thiết.
conditions:
- Ràng buộc đe dọa kết quả.
- Người khác kiểm soát thay đổi cần thiết.
exceptions:
- Ràng buộc nhỏ có thể được giải quyết tại chỗ.
- Leo thang quá mức làm chậm công việc.
applications:
  execution:
  - Báo cáo các quyết định bị chặn trước khi hạn chót sụp đổ.
  management:
  - Khen thưởng việc phơi bày ràng buộc sớm.
risks:
- Leo thang để đẩy trách nhiệm đi nơi khác.
- Tạo ra ồn ào mà không kèm phương án đề xuất.
