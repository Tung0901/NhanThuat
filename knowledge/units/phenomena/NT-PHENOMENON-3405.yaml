id: NT-PHENOMENON-3405
type: phenomenon
title: Nguyên tắc đồng nhất
summary: Chúng ta bị ảnh hưởng mạnh mẽ bởi những người chia sẻ bản sắc nền tảng với mình—mối liên kết 'Chúng ta'.
primary_domain: tri-nhan
domain_area: NT-DA-0030
definition: Nguyên tắc ảnh hưởng thứ 7, khác biệt với 'Thiện cảm', đại diện cho một bản sắc chung (huyết thống, quốc tịch, văn hóa tổ chức sâu sắc) làm hòa trộn bản thân với người khác.
mechanism:
- Một bản sắc chung, không thể thay đổi hoặc ăn sâu được khơi gợi.
- Ranh giới giữa 'bản thân' và 'người khác' bị xóa nhòa.
- Đối tượng hành động vì lợi ích của người thuyết phục như thể họ đang hành động vì lợi ích của chính mình.
conditions:
- Khi kêu gọi đến gia đình, các liên kết bộ tộc sâu sắc, hoặc những cuộc đấu tranh sinh tồn chung.
exceptions:
- Những điểm tương đồng bề nổi (chúng chỉ kích hoạt Thiện cảm, chứ không phải Đồng nhất).
applications:
  marketing:
  - Khơi gợi một bản sắc chung ('Là những kỹ sư đồng nghiệp, chúng ta biết rằng...') vượt qua thái độ hoài nghi phòng vệ thông thường.
risks:
- Có thể bị lợi dụng để tạo ra sự phục tùng nguy hiểm mang tính giáo phái.
evidence:
  level: strong
  references:
  - 'Cialdini, R. B. (2016). ''Pre-Suasion: A Revolutionary Way to Influence and Persuade''.'
