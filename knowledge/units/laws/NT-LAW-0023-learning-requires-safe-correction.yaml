id: NT-LAW-0023
type: law
status: frozen
version: 0.1.0
title: Học hỏi đòi hỏi sự sửa sai an toàn
summary: Mọi người học hỏi nhanh hơn khi các sai lầm được xem xét một cách trung thực mà không phải đối mặt với sự xấu hổ, hình phạt quá mức hoặc sự đe dọa về lòng tự trọng.
primary_domain: tu-than
secondary_domains:
- dung-nhan
- hop-chung
definition: Việc học hỏi đòi hỏi phải có sự sửa sai, nhưng việc sửa sai thường bị né tránh hoặc bóp méo khi cái giá về mặt xã hội cho việc thừa nhận sai lầm là quá lớn.
mechanism:
- Phát sinh sai sót
- Đối mặt với rủi ro khi sửa sai
- Lựa chọn phân tích sai sót hoặc tự vệ để né tránh.
conditions:
- Cá nhân nhận được thông tin phản hồi về khoảng cách năng lực
- Môi trường xung quanh ảnh hưởng đến cái giá của việc thừa nhận sai sót.
exceptions:
- Sự cẩu thả nghiêm trọng vẫn đòi hỏi phải có biện pháp xử lý
- Một số người học vẫn chủ động tìm kiếm sự sửa sai bất chấp rủi ro.
applications:
  learning:
  - Tách biệt việc phân tích sai sót khỏi sự hạ thấp danh dự.
  management:
  - Bảo vệ sự thẳng thắn trong khi vẫn duy trì các tiêu chuẩn công việc.
risks:
- Xóa bỏ trách nhiệm giải trình dưới danh nghĩa tạo sự an toàn
- Sử dụng sự xấu hổ như một công cụ để dạy dỗ.
