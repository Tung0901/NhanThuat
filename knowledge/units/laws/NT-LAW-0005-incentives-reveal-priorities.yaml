id: NT-LAW-0005
type: law
status: frozen
version: 0.1.0
title: Cơ chế khuyến khích bộc lộ mức độ ưu tiên
summary: Hành vi lặp đi lặp lại thường tuân theo các phần thưởng, hình phạt, tín hiệu vị thế và các con đường né tránh mà một hệ thống tạo ra trên thực tế.
primary_domain: thanh-su
secondary_domains:
- dung-nhan
- hop-chung
definition: Cấu trúc khuyến khích của một môi trường bộc lộ những gì mọi người thực sự được khuyến khích ưu tiên, ngay cả khi các giá trị được tuyên bố có sự khác biệt.
mechanism:
- Quan sát các phần thưởng và hình phạt hiện có
- Nhận biết những gì được củng cố
- Lặp lại hành vi giúp bảo vệ giá trị hoặc giảm thiểu chi phí.
conditions:
- Hành vi được lặp lại bên trong một hệ thống ổn định
- Sự củng cố có thể nhìn thấy được hoặc đã được trải nghiệm.
exceptions:
- Đạo đức vững vàng có thể kháng cự lại các cơ chế khuyến khích
- Các ràng buộc bên ngoài có thể lấn át các phần thưởng nội bộ.
applications:
  management:
  - Kiểm toán những gì hệ thống đang khen thưởng trước khi điều chỉnh hành vi.
  strategy:
  - Đồng bộ hóa các thước đo và sự ghi nhận với các ưu tiên thực tế.
risks:
- Giả định rằng mọi động lực đều đến từ bên ngoài
- Thiết kế các cơ chế khuyến khích dẫn đến hành vi đối phó.
