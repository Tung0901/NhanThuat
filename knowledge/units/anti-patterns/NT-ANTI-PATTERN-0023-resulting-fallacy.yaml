id: NT-ANTI-PATTERN-0023
type: anti-pattern
status: frozen
version: 0.1.0
title: Ngụy biện Dựa trên Kết quả
summary: Đơn vị kiến thức cấu trúc về Ngụy biện Dựa trên Kết quả (Resulting Fallacy) trong đánh giá quyết định.
primary_domain: tri-nhan
secondary_domains:
- dung-nhan
definition: Định nghĩa chính thức về Ngụy biện Dựa trên Kết quả trong kiến trúc Nhân Thuật, chỉ xu hướng đánh giá chất lượng của một quyết định dựa hoàn toàn vào kết quả đầu ra thay vì phân tích tính đúng đắn của quá trình ra quyết định tại thời điểm đó.
conditions:
- Trong các bối cảnh quản trị vận hành tổ chức.
exceptions:
- Các trường hợp ghi đè trong tình huống khủng hoảng khẩn cấp.
applications:
  governance:
  - Nhận diện và khắc phục Ngụy biện Dựa trên Kết quả trong quy trình làm việc của tổ chức.
risks:
- Áp dụng sai hoặc không kiểm soát được Ngụy biện Dựa trên Kết quả dẫn đến đánh giá hiệu suất kém tối ưu.
