id: NT-PHENOMENON-3308
type: phenomenon
title: Lời tiên tri tự ứng nghiệm (Hiệu ứng Pygmalion)
summary: Kỳ vọng cao hơn dẫn đến hiệu suất tăng, trong khi kỳ vọng thấp hơn dẫn đến hiệu suất giảm.
primary_domain: tri-nhan
domain_area: NT-DA-0029
definition: Hiện tượng tâm lý xã hội trong đó kỳ vọng của nhà lãnh đạo hoặc người quản lý đối với cấp dưới vô thức thay đổi hành vi của họ đối với cấp dưới, từ đó khiến cấp dưới thực hiện đúng những kỳ vọng đó.
mechanism:
- Nhà lãnh đạo hình thành một kỳ vọng (tích cực hoặc tiêu cực) về một cá nhân.
- Nhà lãnh đạo vô thức thay đổi cách huấn luyện, phản hồi và ngôn ngữ cơ thể dựa trên kỳ vọng này.
- Cá nhân nội hóa những tín hiệu này, thay đổi hiệu quả tự nhận thức và nỗ lực của chính mình, hoàn thành kỳ vọng ban đầu.
conditions:
- Động lực quyền lực mạnh mẽ (thầy/trò, quản lý/nhân viên) khi cấp dưới trông chờ sự thừa nhận từ người có thẩm quyền.
exceptions:
- Khi cấp dưới có một nguồn giá trị bản thân độc lập, không thể lung lay.
applications:
  leadership:
  - Áp dụng lập trường mặc định là kỳ vọng cao và tin vào năng lực cho mọi nhân viên mới để nâng hiệu suất của họ một cách có hệ thống.
risks:
- Gắn mác một nhân viên là "người hiệu suất thấp" ngay từ đầu, gần như đảm bảo họ sẽ thất bại do thiếu sự hỗ trợ (Hiệu ứng Golem).
evidence:
  level: strong
  references:
  - Rosenthal, R., & Jacobson, L. (1968). 'Pygmalion in the classroom'. The Urban Review.
