id: NT-MODEL-0011
type: model
status: frozen
version: 0.1.0
title: Mô hình Dự báo Hành vi theo Bối cảnh
summary: Đơn vị tri thức cấu trúc về Mô hình Dự báo Hành vi theo Bối cảnh trong phân tích nhân sự.
primary_domain: tri-nhan
secondary_domains:
- dung-nhan
definition: Định nghĩa chính thức về Mô hình Dự báo Hành vi theo Bối cảnh trong cấu trúc Nhân Thuật, giúp dự đoán phản ứng và xu hướng hành vi của cá nhân dựa trên môi trường xung quanh.
conditions:
- Áp dụng trong các bối cảnh quản trị vận hành và đánh giá nhân sự định kỳ.
exceptions:
- Các tình huống khủng hoảng bất ngờ hoặc hành vi bất thường vượt ngoài các kịch bản dự báo thông thường.
applications:
  governance:
  - Áp dụng Mô hình Dự báo Hành vi theo Bối cảnh vào quy trình làm việc, tuyển dụng và quản trị nhân sự của tổ chức.
risks:
- Việc áp dụng sai lệch Mô hình Dự báo Hành vi theo Bối cảnh có thể dẫn đến các quyết định nhân sự thiếu chính xác và làm giảm hiệu suất chung.
evidence:
  level: supported
  references:
