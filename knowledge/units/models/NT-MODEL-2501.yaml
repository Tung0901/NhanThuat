id: NT-MODEL-2501
type: model
status: frozen
version: 1.0.0
title: Mô hình Ba Chân trời Tăng trưởng
summary: 'Quy hoạch và phân bổ đổi mới qua ba đường chân trời: Cốt lõi, Liền kề và Chuyển dịch đột phá.'
primary_domain: tu-than
domain_area: NT-DA-0025
secondary_domains:
- thanh-su
definition: Khung chiến lược phân bổ nguồn lực và tư duy qua ba đường chân trời thời gian nhằm đảm bảo tăng trưởng bền vững.
mechanism:
- 'Chân trời 1 (H1): Duy trì và mở rộng hoạt động kinh doanh cốt lõi hiện tại.'
- 'Chân trời 2 (H2): Nuôi dưỡng các cơ hội kinh doanh mới nổi và thị trường liền kề.'
- 'Chân trời 3 (H3): Tạo dựng các phương án đột phá định hình tương lai dài hạn.'
conditions:
- Áp dụng trong quy hoạch chiến lược và quản trị danh mục đổi mới dài hạn.
exceptions:
- Doanh nghiệp đang trong giai đoạn khủng hoảng hoặc phải ưu tiên sinh tồn ngắn hạn.
applications:
  management:
  - Xây dựng và cân đối danh mục đầu tư đổi mới sáng tạo toàn diện.
risks:
- Dồn toàn bộ 100% nguồn lực vào H1 khiến tổ chức mất khả năng thích ứng trong tương lai.
