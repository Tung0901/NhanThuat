id: NT-MODEL-0017
type: model
status: frozen
version: 0.2.0
title: Mô hình Đánh giá Độ bất định
summary: 'Mô hình phân loại độ bất định theo bốn mức: đã biết, biết là chưa biết, không biết là chưa biết, và bất định do mơ hồ. Mỗi mức cần cách tiếp cận riêng.'
primary_domain: tri-nhan
secondary_domains:
- thanh-su
definition: 'Mô hình Đánh giá Độ bất định là khung phân loại tình huống theo bốn mức bất định tăng dần, giúp chọn phương pháp xử lý phù hợp: dữ liệu, thực nghiệm, thăm dò, hoặc thích ứng linh hoạt.'
conditions:
- Tình huống ra quyết định có mức bất định cao hoặc hỗn hợp.
- Có nguồn lực để thực hiện bước thăm dò và thực nghiệm.
exceptions:
- Tình huống khẩn cấp không cho phép thăm dò đầy đủ, phải hành động và điều chỉnh.
- Vấn đề đã được nghiên cứu kỹ, bất định nằm trong phạm vi ước lượng được.
applications:
  planning:
  - Phân loại từng vùng của kế hoạch theo bốn mức bất định.
  - 'Gán phương pháp xử lý tương ứng: phân tích, thực nghiệm, thăm dò hoặc thích ứng.'
  risk-management:
  - Thiết kế phương án thích ứng cho các vùng bất định cao.
  decision-making:
  - Điều chỉnh mức độ chi tiết kế hoạch theo mức bất định thực tế.
risks:
- Đối xử với mọi bất định như nhau dẫn tới lãng phí hoặc liều lĩnh.
- Bỏ qua vùng mơ hồ khiến các bên hiểu khác nhau về cùng mục tiêu.
- Phân tích quá mức các vấn đề chỉ có thể thăm dò.
evidence:
