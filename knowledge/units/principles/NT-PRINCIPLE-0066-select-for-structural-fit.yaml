mechanism:
- 'Phân tích cấu trúc công việc: mức tự chủ, nhịp phối hợp, độ bất định, tiêu chuẩn đầu ra.'
- Chuyển các đặc điểm cấu trúc thành tiêu chí đánh giá quan sát được.
- Đánh giá ứng viên dựa trên hành vi trong tình huống tương tự công việc.
- So khớp mức phù hợp và xác định chi phí thích ứng cần thiết.
