id: NT-PHENOMENON-3003
type: phenomenon
status: frozen
version: 0.1.0
title: Availability Heuristic Fallacy
summary: Estimating the frequency or probability of an event based on how easily examples come to mind, leading to massive risk miscalculation.
primary_domain: tri-nhan
domain_area: NT-DA-0026
secondary_domains: [thanh-su]
definition: A cognitive shortcut where the brain substitutes "ease of recall" for "statistical frequency," causing vivid, emotional, or recent events to be perceived as much more common than they actually are.
mechanism:
  - A question of frequency or risk arises.
  - The brain searches memory for examples.
  - Vivid, recent, or highly publicized examples are retrieved instantly.
  - The brain concludes the event is highly probable.
conditions:
  - Time pressure or lack of immediate access to statistical base rates.
exceptions:
  - Domains where the actor has internalized accurate base rates through long experience.
  - "Consequences: Over-allocating resources to defend against dramatic but rare risks; Under-allocating resources for boring, common risks."
  - "Recognition Signal: Policy changes driven entirely by a single recent, vivid failure rather than trend data."
applications:
  management:
    - Force the use of base rates (historical averages) when evaluating the likelihood of an outcome.
risks:
  - Paralysis by ignoring valid intuitive warnings in favor of flawed datasets.
evidence:
  level: strong
  references:
    - "Tversky, A., & Kahneman, D. (1973). 'Availability: A heuristic for judging frequency and probability'. Cognitive Psychology."
