title: Incentive Alignment Matrix
summary: A 2x2 framework mapping Metric Congruence against Intrinsic Alignment to
  categorize organizational reward health.
primary_domain: tu-than
secondary_domains:
- hop-chung
definition: The Incentive Alignment Matrix plots reward structures across Metric Congruence
  and Intrinsic Alignment.
mechanism:
- Assess Metric Congruence.
- Assess Intrinsic Alignment.
- Categorize Quadrant.
- Shift toward High/High quadrant.
conditions:
- Compensation redesign, sales commission planning, or OKR evaluation.
exceptions:
- Non-work voluntary charitable endeavors.
applications:
  compensation_audit:
  - Evaluate commission plans to eliminate Toxic Gaming risk.
risks:
- Misdiagnosing low employee capability as an incentive matrix flaw.
