id: NT-PHENOMENON-3406
type: phenomenon
title: Kỹ thuật đóng sầm cửa trước mặt
summary: Đưa ra một yêu cầu cực đoan chắc chắn sẽ bị từ chối, ngay sau đó là một yêu cầu nhỏ hơn, hợp lý hơn.
primary_domain: tri-nhan
domain_area: NT-DA-0030
definition: Một chiến lược tuân phục theo trình tự tận dụng sự tương phản về nhận thức và quy chuẩn tương hỗ để tăng tỷ lệ chấp nhận một yêu cầu mục tiêu.
mechanism:
- Người thuyết phục đưa ra một yêu cầu khổng lồ.
- Đối tượng từ chối.
- Người thuyết phục 'nhượng bộ' bằng cách lùi về một yêu cầu nhỏ hơn.
- Đối tượng cảm thấy áp lực tâm lý (tương hỗ) phải nhượng bộ đáp lại, và đồng ý với yêu cầu nhỏ hơn.
conditions:
- Yêu cầu thứ hai phải được cùng một người đưa ra ngay lập tức, và yêu cầu thứ nhất không được phi lý đến mức làm mất uy tín.
exceptions:
- Khi đối tượng nhận ra chuỗi yêu cầu này là một chiến thuật đàm phán thù địch.
applications:
  sales:
  - Hãy đề nghị khách hàng mua gói cao cấp 10.000 đô la. Khi họ từ chối, hãy đề nghị mua gói tiêu chuẩn 2.000 đô la (vốn là mục tiêu thực sự).
risks:
- Làm tổn hại niềm tin nếu điểm neo ban đầu mang tính xúc phạm hoặc hoàn toàn thao túng.
evidence:
  level: strong
  references:
  - 'Cialdini, R. B., et al. (1975). ''Reciprocal concessions procedure for inducing compliance: The door-in-the-face technique''. Journal of Personality and Social Psychology.'
