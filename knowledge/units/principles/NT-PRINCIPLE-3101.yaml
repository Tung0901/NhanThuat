id: NT-PRINCIPLE-3101
type: principle
title: Thiết kế kiến trúc lựa chọn
summary: Chủ động cấu trúc môi trường nơi diễn ra các quyết định nhằm dẫn dắt hành vi hướng tới kết quả tối ưu mà không hạn chế quyền tự do lựa chọn.
primary_domain: tri-nhan
domain_area: NT-DA-0027
definition: Việc thiết kế có chủ đích các cách trình bày lựa chọn khác nhau cho người ra quyết định, thừa nhận rằng không tồn tại kiến trúc trung lập.
mechanism:
- Xác định kết quả hành vi mong muốn.
- Lập bản đồ các thiên kiến nhận thức đang ảnh hưởng đến quyết định hiện tại.
- Thiết kế lại môi trường vật lý, kỹ thuật số hoặc quy trình để lựa chọn mong muốn trở thành con đường ít trở ngại nhất.
conditions:
- Khi người dùng dễ gặp quá tải nhận thức, thiên kiến hiện tại hoặc thiên kiến hiện trạng.
exceptions:
- Khi việc áp đặt các ràng buộc cứng hoặc chính sách bảo mật là bắt buộc nghiêm ngặt (không dùng cú huých cho mục đích tuân thủ).
applications:
  system_design:
  - Sắp xếp các menu phức tạp sao cho các tính năng được sử dụng nhiều nhất hoặc an toàn nhất nổi bật về mặt thị giác.
risks:
- '"Bùn lầy" — sử dụng kiến trúc lựa chọn để cố ý gây hiểu lầm hoặc khai thác giá trị từ người dùng (các mẫu thiết kế đen tối).'
evidence:
  level: strong
  references:
  - 'Thaler, R. H., & Sunstein, C. R. (2008). ''Nudge: Improving Decisions about Health, Wealth, and Happiness''. Yale University Press.'
