id: NT-PRINCIPLE-0055
type: principle
status: frozen
version: 0.1.0
title: Connect tasks to identity and purpose
summary: Frame responsibilities so individuals understand how their work reflects their professional standards, personal values, and contribution to a larger purpose.
primary_domain: tu-than
secondary_domains: [tri-nhan, dung-nhan]
definition: People sustain effort through difficult challenges when they perceive their work as meaningful expression of their identity and commitments.
mechanism: [Identify core identity and values, Frame task relevance, Reinforce alignment, Sustain durable effort.]
conditions: [Tasks are repetitive, demanding, or require long-term persistence.]
exceptions: [Purely transactional temporary engagements may not require deep identity alignment.]
applications: {onboarding: [Help new hires connect role expectations to personal professional growth.], communication: [Highlight the human impact of organizational outcomes.]}
risks: [Artificial or manipulative purpose statements that lack operational reality.]
evidence: {level: provisional, references: []}
relations: {supports: [], conflicts_with: [], depends_on: [NT-LAW-0032], applies_to: []}
