id: NT-ANTI-PATTERN-0013
type: anti-pattern
status: frozen
version: 0.2.0
title: Sự tuân thủ cưỡng ép
summary: Tổ chức đạt được sự tuân thủ bề mặt bằng áp lực và chế tài thay vì đồng thuận thực chất. Con
  người làm theo để tránh hậu quả, không phải vì hiểu và tin vào mục tiêu.
primary_domain: dung-nhan
secondary_domains:
- tri-nhan
definition: Sự tuân thủ cưỡng ép là phản-mẫu quản trị trong đó hành vi tuân thủ được tạo ra chủ yếu bằng
  đe dọa, trừng phạt hoặc áp lực quyền lực, dẫn đến tuân thủ hình thức và phản kháng ngầm.
conditions:
- Quan hệ quyền lực bất đối xứng rõ rệt.
- Mục tiêu thay đổi đòi hỏi mức tự nguyện nhất định để duy trì.
exceptions:
- Trong tình huống an toàn nghiêm trọng, cưỡng chế ngắn hạn cần thiết để ngăn thiệt hại tức thời.
- Quy định pháp lý bắt buộc có thể yêu cầu biện pháp chế tài kèm theo.
applications:
  leadership:
  - Thay thế đe dọa bằng giải thích lợi ích chung và động lực nội tại.
  - Đo lường mức đồng thuận thực chất bên cạnh mức tuân thủ hình thức.
  management:
  - Xây dựng cơ chế đối thoại trước khi áp dụng chế tài.
  - Ghi nhận và xử lý các rào cản khiến nhân sự không thể tuân thủ tự nguyện.
  culture:
  - Theo dõi dấu hiệu tuân thủ hình thức và phản kháng ngầm trong khảo sát nội bộ.
risks:
- Tuân thủ giả và báo cáo sai lệch để đối phó.
- Phản kháng ngầm tích tụ dẫn tới khủng hoảng khi bùng phát.
- Mất nhân tài vì môi trường áp lực không tạo được cam kết.
evidence:
  level: supported
  references:
  - '[Nghiên cứu thực nghiệm] Kelman, H. C. (1958). Compliance, identification, and internalization: Three
    processes of attitude change. Journal of Conflict Resolution, 2(1), 51-60 (Phân biệt tuân thủ bề mặt
    do chế tài với đồng nhất hóa và nội tâm hóa).'
  - '[Nghiên cứu thực nghiệm] Deci, E. L., Koestner, R., & Ryan, R. M. (1999). A meta-analytic review
    of experiments examining the effects of extrinsic rewards on intrinsic motivation. Psychological Bulletin,
    125(6), 627-668.'
  - '[Nguồn cổ điển] Luận Ngữ — Vi Chính (Khổng Tử phân biệt hiệu quả của ''Đạo chi dĩ chính, tề chi dĩ
    hình'' với ''Đạo chi dĩ đức, tề chi dĩ lễ'').'
  - '[Suy luận biên tập] Chỉ số nhận diện tuân thủ đối phó và cơ chế chuyển dịch sang cam kết.'
relations:
  supports: []
  conflicts_with: []
  depends_on:
