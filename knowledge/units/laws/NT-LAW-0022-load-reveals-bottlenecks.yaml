id: NT-LAW-0022
type: law
status: frozen
version: 0.1.0
title: Áp lực công việc bộc lộ điểm nghẽn
summary: Khi nhu cầu tăng cao, các hạn chế tiềm ẩn về con người, quy trình, thẩm quyền hoặc thông tin sẽ lộ rõ thông qua sự chậm trễ và thất bại.
primary_domain: thanh-su
secondary_domains:
- dung-nhan
- hop-chung
definition: Tải lượng công việc làm lộ ra điểm hạn chế hẹp nhất trong hệ thống vì công việc sẽ tích tụ tại nơi mà năng lực, thẩm quyền hoặc thông tin không đủ đáp ứng.
mechanism:
- Nhu cầu tăng cao
- Công việc chạm tới giới hạn hạn chế
- Sự chậm trễ xảy ra
- Phải làm lại công việc
- Hoặc sự thất bại làm lộ rõ điểm nghẽn.
conditions:
- Nhu cầu vượt quá mức dự phòng thông thường
- Hệ thống có các bước phụ thuộc lẫn nhau.
exceptions:
- Sự dư thừa nguồn lực quá mức có thể che giấu các điểm nghẽn
- Các sự cố xảy ra một lần có thể không phản ánh đúng một hạn chế mang tính hệ thống.
applications:
  operations:
  - Theo dõi nơi công việc bị trì hoãn
  - Chứ không chỉ nơi mọi người đang bận rộn.
  management:
  - Coi tình trạng quá tải như dữ liệu chẩn đoán hệ thống.
risks:
- Đổ lỗi cho cá nhân ở vị trí điểm nghẽn dễ thấy
- Tăng thêm năng lực trước khi hiểu rõ bản chất của hạn chế.
