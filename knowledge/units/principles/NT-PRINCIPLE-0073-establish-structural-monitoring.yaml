id: NT-PRINCIPLE-0073
type: principle
status: frozen
version: 0.2.0
title: Thiết lập giám sát cấu trúc
summary: Giám sát dựa trên cấu trúc, dữ liệu và chỉ số thay vì dựa trên nghi ngờ cá nhân. Giám sát cấu trúc giảm xung đột quan hệ và tăng khả năng phát hiện sớm.
primary_domain: dung-nhan
secondary_domains:
- thanh-su
definition: Thiết lập giám sát cấu trúc là nguyên tắc xây dựng cơ chế theo dõi dựa trên luồng dữ liệu và điểm kiểm tra được thiết kế sẵn, không phụ thuộc vào việc quan sát hoặc nghi ngờ từng cá nhân.
conditions:
- Quy trình có thể quan sát qua dữ liệu hoặc chỉ số.
- Rủi ro đủ lớn để cần theo dõi thường xuyên.
exceptions:
- Công việc sáng tạo khó đo lường cần cơ chế đánh giá định tính thay vì chỉ số.
- Nhóm nhỏ có độ tin cậy cao có thể giám sát theo kết quả cuối.
applications:
  operations:
  - Thiết kế điểm kiểm tra và ngưỡng cảnh báo trong quy trình vận hành.
  - Tự động hóa thu thập chỉ số để giảm công sức báo cáo thủ công.
  governance:
  - Duy trì lịch rà soát định kỳ đối với các cơ chế giám sát trọng yếu.
  management:
  - Chuyển từ kiểm tra đột xuất sang theo dõi cấu trúc thường xuyên.
risks:
- Lạm dụng giám sát cấu trúc để kiểm soát vi mô.
- Chỉ số giám sát bị tối ưu hình thức thay vì phản ánh thực chất.
- Cảnh báo quá nhiều làm mất độ nhạy của cơ chế.
evidence:
  level: supported
  references:
  - EV-REQ-0001-01
relations:
  supports: []
  conflicts_with: []
  depends_on:
