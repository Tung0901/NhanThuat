id: NT-ANTI-PATTERN-0052
type: anti-pattern
status: frozen
version: 0.1.0
title: Khoảng cách giữa lời nói và hành động
summary: Truyền thông rầm rộ về các giá trị cốt lõi của doanh nghiệp nhưng lãnh đạo lại thường xuyên vi phạm trong các quyết định vận hành hàng ngày.
primary_domain: hop-chung
secondary_domains:
- tu-than
definition: Khoảng cách giữa lời nói và hành động xuất hiện khi ban lãnh đạo tuyên truyền các giá trị đạo đức trên áp phích nhưng lại hành xử vị kỷ trong các quyết định nội bộ.
mechanism:
- Ban quản lý công bố các giá trị doanh nghiệp.
- Ban quản lý hành động trái ngược hoàn toàn.
- Nhân viên mất đi niềm tin.
- Văn hóa tổ chức bị xói mòn.
conditions:
- Hoạt động truyền thông doanh nghiệp chạy theo quảng bá mà thiếu sự đồng bộ nội bộ.
exceptions:
- Không có.
applications:
  culture_audit:
  - Xác định sự lệch pha giữa phản hồi từ khảo sát nhân viên và các tuyên bố truyền thông của ban điều hành.
risks:
- Làm nhân viên nản lòng khi chỉ ra sự mâu thuẫn kéo dài không thể khắc phục của ban điều hành.
evidence:
