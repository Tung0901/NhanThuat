id: NT-PRINCIPLE-0093
type: principle
status: frozen
version: 0.1.0
title: Phi cá nhân hóa bất đồng về nhiệm vụ
summary: Đóng khung mọi bất đồng trong công việc dựa trên dữ liệu khách quan, giả thuyết và mục tiêu, nhờ đó tránh để bất đồng chạm tới danh tính cá nhân.
primary_domain: hop-chung
secondary_domains:
- tri-nhan
definition: Để duy trì tốc độ thực thi, lãnh đạo phải tách bạch con người khỏi đề xuất được đưa ra.
conditions:
- Các buổi rà soát chiến lược, tranh luận sản phẩm và họp sau sự cố.
exceptions:
- Các buổi đánh giá hiệu suất chuyên đánh giá hành vi ứng xử của từng cá nhân.
applications:
  meeting_design:
  - Yêu cầu người phản biện trình bày ý kiến phản đối dưới dạng các giả thuyết cạnh tranh.
risks:
- Làm sạch tranh luận quá mức đến mức phản hồi trở nên chung chung.
