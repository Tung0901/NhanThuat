title: Lower threat before seeking truth
summary: Reduce unnecessary threat before asking people to disclose mistakes, disagreement, risk, or uncertainty.
primary_domain: tri-nhan
secondary_domains: [hop-chung, dung-nhan]
definition: Candor becomes more likely when people can tell the truth without expecting avoidable humiliation, punishment, or exclusion.
mechanism: [Name the purpose, Protect dignity, Ask for truth, Respond consistently.]
conditions: [Truth is needed, People may feel exposed.]
