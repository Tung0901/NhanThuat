id: NT-PRINCIPLE-0078
type: principle
status: frozen
version: 0.1.0
title: Đánh giá quyết định theo quy trình, không theo kết quả
summary: Đánh giá quyết định theo quy trình, không theo kết quả là một đơn vị tri thức cấu trúc trong kho tri thức Nhân Thuật.
primary_domain: tri-nhan
secondary_domains:
- dung-nhan
definition: Định nghĩa chính thức của Nguyên tắc Đánh giá quyết định theo quy trình, không theo kết quả trong kiến trúc Nhân Thuật.
conditions:
- Các bối cảnh quản trị vận hành.
exceptions:
- Các tình huống khẩn cấp yêu cầu vượt quyền ưu tiên.
applications:
  governance:
  - Áp dụng Nguyên tắc Đánh giá quyết định theo quy trình, không theo kết quả vào các quy trình vận hành của tổ chức.
risks:
- Áp dụng sai Nguyên tắc Đánh giá quyết định theo quy trình, không theo kết quả dẫn đến hiệu suất dưới mức tối ưu.
