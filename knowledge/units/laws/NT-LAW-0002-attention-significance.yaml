id: NT-LAW-0002
type: law
status: frozen
version: 0.1.0
title: Sự chú ý hướng theo tầm quan trọng được nhận thức
summary: Mọi người có xu hướng dành sự chú ý cho các tín hiệu mà họ nhận thức là có ý nghĩa, khẩn cấp, tốn kém hoặc có liên quan trực tiếp đến cá nhân họ.
primary_domain: tri-nhan
secondary_domains:
- dung-nhan
- hop-chung
- thanh-su
definition: Sự chú ý được phân bổ cho các manh mối mà một người diễn giải là quan trọng đối với sự an toàn, danh tính, phần thưởng, mất mát, nghĩa vụ hoặc cơ hội trong tương lai.
mechanism:
- Một manh mối được chú ý trong môi trường hoặc bối cảnh xã hội.
- Cá nhân đó đánh giá mức độ liên quan, tính khẩn cấp, chi phí hoặc cơ hội.
- Sự chú ý chuyển dịch về phía manh mối được đánh giá là quan trọng nhất.
conditions:
- Cá nhân có đủ khả năng để chuyển hướng sự chú ý.
- Manh mối được chính cá nhân đó nhận thức là có liên quan, chứ không chỉ bởi một người quan sát bên ngoài.
exceptions:
- Thói quen, sự mệt mỏi, quá tải hoặc xao nhãng có thể cản trở sự chú ý.
- Một manh mối có thể bị bỏ qua khi nó xung đột với danh tính hoặc cam kết trước đó.
applications:
  management:
  - Định hình các ưu tiên bằng cách làm rõ hậu quả, trách nhiệm sở hữu và thời gian thực hiện.
  communication:
  - Bắt đầu bằng lý do tại sao thông điệp đó lại quan trọng đối với người nghe.
risks:
- Nhầm lẫn giữa sự ồn ào bề nổi với tầm quan trọng thực sự.
- Giả định rằng người khác cũng chú ý đến những gì người nói cho là quan trọng.
