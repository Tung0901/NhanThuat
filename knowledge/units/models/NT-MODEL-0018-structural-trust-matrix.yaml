mechanism:
- Xác định loại niềm tin đang cần cho từng quan hệ công việc.
- 'Phân loại cơ sở hình thành: năng lực đã chứng minh, tính nhất quán, quan hệ, thể chế.'
- Đánh giá mức độ niềm tin đang dựa vào cá nhân hay vào cấu trúc.
- Thiết kế cơ chế duy trì phù hợp với từng ô của ma trận.
