id: NT-PRINCIPLE-0060
type: principle
status: frozen
version: 0.1.0
title: Đánh giá mặc định tính cách trước khi phân vai
summary: Lập bản đồ các mặc định tính cách tương đối ổn định của cá nhân để hiểu chi phí thích nghi tiềm năng thay vì dùng tính cách để dự đoán hiệu suất hoặc lọc tuyển dụng.
primary_domain: tri-nhan
secondary_domains:
- tu-than
- thanh-su
definition: Chủ động lập bản đồ các mặc định tính cách tiềm ẩn để chẩn đoán mức độ phù hợp và ước lượng chi phí thích nghi của một vai trò, thay vì dự đoán hiệu suất hoặc dùng mức phù hợp như bộ lọc năng lực, tiêu chí loại trừ hay cổng tuyển dụng. Mức phù hợp chỉ mang tính chẩn đoán và tạo giả thuyết.
mechanism:
- Đánh giá các mặc định nhận thức, cảm giác-cảm xúc và hành vi tiềm ẩn.
- So sánh các mặc định với kỳ vọng hành vi mà bối cảnh vai trò đòi hỏi.
- Xác định các khu vực khả dĩ có chi phí thích nghi cao và lập kế hoạch chiến lược bù trừ.
conditions:
- Việc phân vai đòi hỏi sai lệch mặc định hành vi cụ thể, lặp lại.
exceptions:
- Vai trò tạm thời hoặc ngắn hạn nơi việc che đậy có thể được hấp thụ dễ dàng mà không có ma sát dài hạn.
applications:
  management:
  - Lập bản đồ hồ sơ tính cách của nhóm để hiểu sự đa dạng nhận thức và các điểm nghẽn giao tiếp tiềm năng.
  role-design:
  - Đánh giá sự đồng nhất mặc định để thiết kế các yếu tố môi trường hỗ trợ giảm tải tự điều chỉnh.
risks:
- Dùng đánh giá mức phù hợp chẩn đoán làm bộ lọc nghiêm ngặt để loại ứng viên.
- Nhầm lẫn mặc định tính cách tiềm ẩn với năng lực, đạo đức hoặc giới hạn tuyệt đối.
evidence:
  level: provisional
  references:
  - 'Kristof-Brown, A. L., et al. (2005). Consequences of Individuals'' Fit at Work: A Meta-Analysis.'
