id: NT-PRINCIPLE-0004
type: principle
status: frozen
version: 0.1.0
title: Lập bản đồ bối cảnh trước khi đánh giá hành vi
summary: Trước khi đánh giá lựa chọn của một người, hãy xác định các ràng buộc, động lực, áp lực, mối quan hệ và thời điểm đã định hình nên lựa chọn đó.
primary_domain: tri-nhan
secondary_domains:
- tu-than
- dung-nhan
definition: Đánh giá công bằng bắt đầu bằng việc lập bản đồ bối cảnh khiến một hành động trở nên hợp lý, tốn kém, khẩn cấp hoặc cần thiết trong mắt chủ thể hành động.
mechanism:
- Nêu rõ bối cảnh ra quyết định.
- Xác định các ràng buộc và mức độ hệ trọng.
- Đánh giá hành vi sau khi bối cảnh đã rõ ràng.
conditions:
- Hành vi có hệ quả đáng kể.
- Bối cảnh có thể được tái dựng một cách có trách nhiệm.
exceptions:
- Rủi ro an toàn tức thời có thể đòi hỏi hành động trước khi phân tích.
- Bối cảnh không xóa bỏ trách nhiệm giải trình.
applications:
  management:
  - Hỏi điều gì trong tình huống đã tạo ra hành vi trước khi sửa chữa nó.
  coaching:
  - Tách biệt lời giải thích khỏi lời biện minh.
risks:
- Biện minh cho hành vi có hại.
- Bỏ qua các khuôn mẫu ổn định.
