id: NT-LAW-0074
type: law
status: frozen
version: 0.1.0
title: Bất đối xứng rủi ro đạo đức
summary: Những người ra quyết định được hưởng lợi ích gia tăng trong khi chuyển giao rủi ro tổn thất cho các bên bên ngoài sẽ có xu hướng chấp nhận những rủi ro mang tính thảm họa.
primary_domain: tu-than
secondary_domains:
- hop-chung
definition: 'Nguyên lý gắn liền quyền lợi với trách nhiệm (skin in the game): khi một tác nhân được hưởng lợi từ kết quả tích cực nhưng lại được bảo vệ khỏi thất bại tiêu cực, họ sẽ chấp nhận những rủi ro cực đoan.'
conditions:
- Giao dịch tài chính, chế độ đãi ngộ cho ban điều hành và quản trị rủi ro.
exceptions:
- Cứu trợ nhân đạo phi lợi nhuận.
applications:
  risk_governance:
  - Bắt buộc những người ra quyết định phải cùng chịu trách nhiệm thực tế (skin in the game) đối với các liên doanh có rủi ro cao.
risks:
- Yêu cầu nhân viên không có quyền ra quyết định phải cùng chịu trách nhiệm thực tế.
