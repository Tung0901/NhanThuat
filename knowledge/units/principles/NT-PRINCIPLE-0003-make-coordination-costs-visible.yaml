id: NT-PRINCIPLE-0003
type: principle
status: frozen
version: 0.1.0
title: Làm lộ chi phí phối hợp
summary: Khi hợp tác chậm lại, hãy phơi bày các chi phí ẩn như quyền sở hữu mơ hồ, thiếu niềm tin, ưu tiên cạnh tranh và việc bàn giao lặp đi lặp lại.
primary_domain: hop-chung
secondary_domains:
- dung-nhan
- thanh-su
definition: Phối hợp cải thiện khi những trở ngại vô hình được nêu tên, vì khi đó con người có thể tái thiết kế quyền sở hữu, giao tiếp, xây dựng niềm tin hoặc quyền ra quyết định.
mechanism:
- Quan sát sự chậm trễ, các lần làm rõ lặp lại, làm lại việc hoặc kiểm tra phòng thủ.
- Xác định chi phí ẩn đang tạo ra trở ngại.
- Tái thiết kế mô hình phối hợp để giảm chi phí đó.
conditions:
- Nhiều người hoặc vai trò phụ thuộc lẫn nhau.
- Trở ngại phối hợp có thể được thảo luận mà không đổ lỗi quá mức.
exceptions:
- Một số dự phòng là cần thiết trong công việc rủi ro cao.
- Trở ngại tạm thời có thể chấp nhận được trong giai đoạn học tập hoặc chuyển đổi.
applications:
  teamwork:
  - Rà soát điểm bàn giao và nút thắt quyết định sau nhiều lần chậm trễ.
  management:
  - Giảm tải giám sát bằng cách cải thiện niềm tin và quyền sở hữu rõ ràng.
risks:
- Gỡ bỏ các rào cản an toàn hữu ích nhân danh tốc độ.
- Coi mọi trở ngại là vấn đề quy trình trong khi bỏ qua xung đột hoặc thiếu niềm tin.
