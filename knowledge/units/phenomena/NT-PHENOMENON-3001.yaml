id: NT-PHENOMENON-3001
type: phenomenon
status: frozen
version: 0.1.0
title: Ảo tưởng về mức độ thấu hiểu
summary: Niềm tin sai lầm rằng bản thân hiểu sâu sắc một hệ thống phức tạp, và ảo tưởng này chỉ sụp đổ khi bắt buộc phải giải thích cơ chế từng bước một.
primary_domain: tri-nhan
domain_area: NT-DA-0026
secondary_domains:
- tu-than
definition: Một mẫu hình sai lầm trong đó cá nhân đánh giá quá cao mức độ hiểu biết của mình về tính nhân quả, nhầm lẫn sự quen thuộc với một khái niệm với việc nắm vững thực sự cơ chế hoạt động của nó.
mechanism:
- Một cá nhân đã quen thuộc với một hệ thống hoặc một khái niệm cụ thể.
- Họ cảm thấy mức độ tự tin rất cao đối với sự hiểu biết của chính mình.
- Khi được yêu cầu giải thích chi tiết cơ chế nhân quả, họ không thể thực hiện được.
- Chỉ khi đó, mức độ tự tin của họ mới giảm xuống để phù hợp với kiến thức thực tế.
conditions:
- Các hệ thống hoặc hiện tượng phức tạp có chứa các cơ chế ẩn giấu bên trong.
exceptions:
- Các chuyên gia thực thụ trong lĩnh vực, những người đã trực tiếp xây dựng và gỡ lỗi hệ thống.
- 'Hậu quả: Ra quyết định sai lầm và quá tự tin dựa trên sự hiểu biết hời hợt; Bác bỏ ý kiến của các chuyên gia thực sự.'
- 'Dấu hiệu nhận biết: Độ tự tin cao khi đề xuất giải pháp cho các vấn đề phức tạp, nhưng lại không thể phác thảo sơ đồ khối về cách thức hoạt động của giải pháp đó.'
applications:
  management:
  - Yêu cầu giải thích cơ chế từng bước một trước khi phê duyệt một kế hoạch mang tính rủi ro cao.
risks:
- Sử dụng hiện tượng này để hạ nhục đồng nghiệp thay vì dùng để hiệu chuẩn mức độ tự tin.
evidence:
  level: strong
  references:
  - 'Rozenblit, L., & Keil, F. (2002). ''The misunderstood limits of folk science: an illusion of explanatory depth''. Cognitive Science.'
