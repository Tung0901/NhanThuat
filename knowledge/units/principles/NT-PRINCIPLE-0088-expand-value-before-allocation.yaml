id: NT-PRINCIPLE-0088
type: principle
status: frozen
version: 0.2.0
title: Mở rộng giá trị trước khi phân bổ
summary: Tìm cách mở rộng tổng giá trị trước khi bàn chia phần, để cả hai bên cùng có lợi hơn. Mở rộng giá trị biến đàm phán phân chia thành hợp tác kiến tạo.
primary_domain: thanh-su
secondary_domains:
- hop-chung
definition: 'Mở rộng giá trị trước khi phân bổ là nguyên tắc đàm phán tích hợp: trước khi phân chia lợi ích, các bên phối hợp tìm kiếm phương án làm tăng tổng giá trị dựa trên khác biệt về ưu tiên, nguồn lực và năng lực.'
conditions:
- Các bên có ưu tiên hoặc nguồn lực khác nhau có thể bổ trợ.
- Có đủ tin cậy để chia sẻ thông tin ưu tiên.
exceptions:
- Khi nguồn lực cố định và ưu tiên trùng nhau, đàm phán mang tính phân chia.
- Đối tác vi phạm cam kết thì ưu tiên bảo vệ lợi ích trước khi mở rộng.
applications:
  negotiation:
  - Tách giai đoạn mở rộng giá trị khỏi giai đoạn phân chia trong tiến trình.
  - Trao đổi các nhượng bộ ở điểm ít quan trọng với mình nhưng quan trọng với đối phương.
  partnership:
  - Kết hợp năng lực bổ trợ để tạo sản phẩm hoặc thị trường mới.
  - Thiết kế cơ chế chia sẻ giá trị tạo ra theo tỷ lệ đóng góp.
  conflict-resolution:
  - Tìm vấn đề chung có thể cùng giải để mở rộng chiếc bánh trước khi chia.
risks:
- Chia sẻ thông tin ưu tiên trong quan hệ thiếu tin cậy.
- Mở rộng giá trị nhưng phân bổ bất công gây xói mòn quan hệ.
- Tối ưu tổng giá trị làm phức tạp thỏa thuận khó thực thi.
evidence:
