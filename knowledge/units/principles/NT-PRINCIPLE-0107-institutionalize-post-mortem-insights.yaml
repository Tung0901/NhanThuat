id: NT-PRINCIPLE-0107
type: principle
status: frozen
version: 0.1.0
title: Institutionalize Post-Mortem Insights
summary: Convert every major operational failure into explicit updates to system architecture,
  guardrails, or checklists.
primary_domain: tri-nhan
secondary_domains:
- dung-nhan
definition: Learning has not occurred until system rules or automated checks change.
conditions:
- Post-incident remediation.
exceptions:
- One-off un-repeatable external anomalies.
applications:
  architecture_updates:
  - Require every high-severity incident post-mortem to yield at least one automated
    validator check.
risks:
- Accumulating overly restrictive checklists that choke execution velocity.
evidence:
  level: supported
  references:
  - EV-REQ-0018-01
relations:
  supports: []
  conflicts_with: []
  depends_on:
  - NT-LAW-0070
  applies_to: []
tags:
- learning
- post-mortem
- guardrails
