id: NT-PRINCIPLE-0040
type: principle
status: frozen
version: 0.1.0
title: Coi quá tải là dữ liệu hệ thống
summary: Đọc quá tải như bằng chứng về năng lực, ràng buộc, ưu tiên và thiết kế thay vì chỉ là vấn đề sức chịu đựng cá nhân.
primary_domain: thanh-su
secondary_domains:
- tu-than
- hop-chung
definition: Quá tải cho thấy nơi nhu cầu vượt quá năng lực hoặc độ rõ ràng, nên nó phải kích hoạt chẩn đoán hệ thống trước khi phán xét đạo đức.
mechanism:
- Xác định nguồn nhu cầu
- So sánh nhu cầu với năng lực
- Quyết định nên dừng
- trì hoãn
- ủy quyền
- hay thiết kế lại.
conditions:
- Mọi người bị quá tải dai dẳng
- Lỗi hoặc trễ hẹn đang gia tăng.
exceptions:
- Khoảng trống kỹ năng cá nhân vẫn có thể quan trọng
- Khủng hoảng ngắn hạn có thể cần vượt sức tạm thời.
applications:
  management:
  - Rà soát công việc đang tiến hành và tải trọng ra quyết định.
  operations:
  - Dùng tín hiệu quá tải để tái cân bằng luồng công việc.
risks:
- Bào chữa cho kết quả kém có thể tránh được
- Bình thường hóa quá tải kinh niên.
evidence:
