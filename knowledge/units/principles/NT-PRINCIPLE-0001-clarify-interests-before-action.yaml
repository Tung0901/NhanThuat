id: NT-PRINCIPLE-0001
type: principle
status: frozen
version: 1.0.0
title: "Làm rõ lợi ích trước khi thiết kế hành động"
summary: "Trước khi lựa chọn động lực, xây dựng lập luận đàm phán hoặc can thiệp quản trị, hãy giải mã chính xác những lợi ích mà đối phương tin rằng họ đang bảo vệ hoặc gia tăng."
primary_domain: tri-nhan
domain_area: NT-DA-0002
secondary_domains:
- dung-nhan
- thanh-su
- hop-chung
definition: "Nguyên tắc chỉ đạo hành động căn bản trong Tri Nhân và Thành Sự: Mọi nỗ lực can thiệp hành vi hay thuyết phục người khác sẽ thất bại nếu nhà lãnh đạo chỉ dựa vào chức danh, mệnh lệnh áp đặt hoặc giả định chủ quan. Thiết kế hành động hiệu quả đòi hỏi phải giải mã được hệ thống lợi ích ngầm mà chủ thể đang bám giữ, bao gồm cả lợi ích hữu hình lẫn lợi ích vô hình (thể diện, sự an toàn, tự chủ, giảm thiểu rủi ro cá nhân)."
mechanism:
- "Nhận diện chủ thể then chốt: Xác định chính xác ai là người có quyền phủ quyết (Veto player) hoặc người thực thi nắm quyền làm chậm trễ tiến độ."
- "Tách rời Lập trường và Lợi ích: Lắng nghe yêu cầu bề nổi (Position) nhưng truy vấn động cơ sâu kín (Underlying Interests) phía sau."
- "Lập bản đồ động lực 4 trục: Khảo sát Lợi ích kinh tế, An toàn vị thế, Danh dự/Thể diện, và Trách nhiệm giải trình rủi ro."
- "Kiểm thử giả thuyết lợi ích: Đưa ra các câu hỏi tình huống hoặc tín hiệu thăm dò nhỏ để xác nhận xem đối phương thực sự sợ điều gì nhất và thèm muốn điều gì nhất."
- "Thiết kế giải pháp đôi bên cùng có lợi (Integrative Architecture): Tạo lập cấu trúc hành động trong đó việc hoàn thành mục tiêu chung là con đường ngắn nhất để đối phương thỏa mãn lợi ích riêng của họ."
conditions:
- "Chủ thể có quyền lựa chọn thực tế trong việc thực thi, trì hoãn hoặc từ chối hành động."
- "Người thiết kế hành động có đủ kênh thông tin để thu thập bối cảnh và thấu hiểu áp lực thực tế của đối phương."
exceptions:
- "Tình huống khủng hoảng sinh tử hoặc mệnh lệnh chiến trường đòi hỏi kỷ luật sắt phải được thực thi ngay lập tức trước khi phân tích lợi ích."
- "Đối tượng hành động bị thao túng tâm lý cực đoan hoặc mất năng lực nhận thức hành vi duy lý."
applications:
  leadership:
    - "Giao phó trọng trách mới: Luôn trả lời cho nhân sự câu hỏi 'Tại sao nhiệm vụ này là bệ phóng cho sự nghiệp của bạn?' trước khi giao chỉ tiêu định lượng."
    - "Thuyết phục nhân sự kiêu ngạo: Tìm ra điểm yếu về nhu cầu được khẳng định vị thế chuyên môn để gắn họ vào bài toán khó nhất của công ty."
  negotiation:
    - "Phá vỡ thế bế tắc về đơn giá: Khi đối tác kiên quyết không giảm giá, hãy khám phá xem họ đang chịu áp lực gì từ nội bộ (áp lực biên lợi nhuận, chi phí dòng tiền hay giữ thể diện trước đối thủ) để đề xuất các nhượng bộ phi tiền tệ."
    - "Đàm phán hợp đồng cung ứng: Bù đắp việc giảm đơn giá bằng cam kết khối lượng dài hạn hoặc điều khoản thanh toán nhanh trong 7 ngày."
  crisis_containment:
    - "Hòa giải xung đột phòng ban: Tìm điểm giao thoa lợi ích giữa hai trưởng bộ phận thù địch thay vì tổ chức đối chất đúng sai thuần túy."
risks:
- "Gán ghép lợi ích chủ quan của bản thân lên người khác, ngộ nhận rằng điều mình thích thì người khác cũng coi trọng."
- "Đánh giá thấp nhu cầu bảo vệ thể diện và lòng tự tôn, chỉ chăm chăm dùng tiền bạc để giải quyết vấn đề."
- "Bị đối phương phát hiện ý đồ thăm dò quá lộ liễu, gây cảm giác thao túng tâm lý và mất lòng tin."
evidence:
  level: strong
  references:
  - "Roger Fisher, William Ury & Bruce Patton - Getting to Yes: Negotiating Agreement Without Giving In (Phương pháp đàm phán Harvard - Phân biệt Position vs Interest)"
  - "Quỷ Cốc Tử - Thiên Mưu Thiên & Thấu Thiên (Thuật dò xét tâm can, xét lợi hại để định kế sách dùng người)"
  - "Chris Voss - Never Split the Difference (Chiến thuật Tactical Empathy và săn tìm Black Swans trong đàm phán con tin)"
