id: NT-ANTI-PATTERN-0008
type: anti-pattern
status: frozen
version: 0.1.0
title: Đòi hỏi ý chí thay vì tái thiết kế hệ thống
summary: Đổ lỗi cho cá nhân thiếu động lực khi ma sát hệ thống, mục tiêu mơ hồ và quá tải nhận thức khiến việc thực thi trở nên khó khăn không cần thiết.
primary_domain: tu-than
secondary_domains:
- tri-nhan
- thanh-su
definition: Biến các thất bại vận hành thành sự phán xét về phẩm chất cá nhân thay vì chẩn đoán và loại bỏ lực ma sát trong hệ thống.
mechanism:
- Gặp thất bại trong thực thi
- Quy thất bại cho thái độ kém của nhân viên
- Đòi hỏi nỗ lực ý chí cao hơn
- Bỏ qua lực ma sát cốt lõi trong quy trình làm việc
conditions:
- Hệ thống làm việc kém hiệu quả
- Mục tiêu mơ hồ
- Hoặc bị quá tải
exceptions:
- Trường hợp cá nhân thực sự từ chối nỗ lực hợp lý dù môi trường làm việc đã tối ưu và không có ma sát.
applications:
  root-cause-analysis:
  - Điều tra ma sát quy trình trước khi lên lớp đội ngũ về sự cam kết.
  process-design:
  - Loại bỏ các rào cản kỹ thuật và hành chính.
risks:
- Bào chữa cho sự cẩu thả thực sự của cá nhân bằng cách luôn đổ lỗi cho ma sát hệ thống.
