title: Mở rộng giá trị trước khi phân bổ
summary: Mở rộng giá trị trước khi phân bổ là một đơn vị tri thức cấu trúc trong kho tri thức Nhân Thuật.
primary_domain: thanh-su
secondary_domains:
- hop-chung
definition: Định nghĩa chính thức của Nguyên tắc Mở rộng giá trị trước khi phân bổ trong kiến trúc Nhân Thuật.
conditions:
- Các bối cảnh quản trị vận hành.
exceptions:
- Các tình huống khẩn cấp yêu cầu vượt quyền ưu tiên.
applications:
  governance:
  - Áp dụng Nguyên tắc Mở rộng giá trị trước khi phân bổ vào các quy trình vận hành của tổ chức.
risks:
- Áp dụng sai Nguyên tắc Mở rộng giá trị trước khi phân bổ dẫn đến hiệu suất dưới mức tối ưu.
