mechanism:
- Nhận diện các biến số không chắc chắn trong kế hoạch.
- Khoanh vùng phạm vi biến động hợp lý cho từng biến.
- Gán xác suất hoặc kịch bản cho các khả năng chính.
- Đưa chi phí của bất định vào cấu trúc quyết định, ngân sách dự phòng và điều khoản.
