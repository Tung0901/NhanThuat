id: NT-LAW-0044
type: law
status: frozen
version: 0.2.0
title: Ranh giới Năng lực Ủy quyền
summary: Năng lực ủy quyền có giới hạn và giới hạn đó phụ thuộc vào số lượng, chất lượng và mức độ phức tạp của công việc được giao. Vượt ngưỡng, chất lượng giám sát và trách nhiệm suy giảm.
primary_domain: dung-nhan
secondary_domains:
- tri-nhan
definition: 'Ranh giới năng lực ủy quyền là quy luật về giới hạn hữu hạn của năng lực giao việc: mỗi chủ thể chỉ có thể ủy quyền hiệu quả trong một dải khối lượng và độ phức tạp nhất định.'
conditions:
- Một chủ thể đang quản lý nhiều công việc được giao đồng thời.
- Năng lực theo dõi và hỗ trợ có giới hạn thực tế.
exceptions:
- Chia nhỏ theo tầng ủy quyền với cơ chế báo cáo gọn có thể mở rộng giới hạn.
- Công việc được chuẩn hóa cao giảm nhu cầu theo dõi từng việc.
applications:
  management:
  - Đếm và giới hạn số lượng đầu việc ủy quyền trực tiếp cho một người.
  - Xây dựng cơ chế báo cáo theo ngoại lệ để giảm tải theo dõi.
  governance:
  - Định kỳ rà soát ma trận ủy quyền so với năng lực thực tế của từng cấp.
  organization-design:
  - Đặt ngưỡng span of control dựa trên độ phức tạp công việc, không theo con số cứng.
risks:
- Ủy quyền hình thức trong khi kiểm soát thực tế buộc quay lại người giao.
- Bỏ sót công việc quan trọng khi danh sách ủy quyền vượt năng lực theo dõi.
- Quá tải ngầm dẫn tới kiệt sức ở cả người giao lẫn người nhận.
