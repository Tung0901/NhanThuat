id: NT-PHENOMENON-3107
type: phenomenon
title: Kế toán tinh thần
summary: Xu hướng phân loại và đối xử với tiền một cách khác nhau tùy theo nguồn gốc hoặc mục đích sử dụng dự kiến, thay vì coi tiền là hoàn toàn có thể thay thế được.
primary_domain: tri-nhan
domain_area: NT-DA-0027
definition: Một hệ thống theo dõi mang tính nhận thức, trong đó cá nhân gán giá trị chủ quan cho các nguồn lực dựa trên các 'hộp' tinh thần tùy ý, vi phạm nguyên tắc kinh tế về tính khả hoán.
mechanism:
- 'Tiền được xếp vào một ''tài khoản'' cụ thể (ví dụ: giải trí, lương, thưởng).'
- Các khoản chi bị giới hạn bởi số dư của tài khoản cụ thể đó, chứ không phải tổng tài sản.
- Khoản tiền bất ngờ được tiêu xài phung phí hơn tiền lương kiếm được.
conditions:
- Khi các nguồn lực được dán nhãn tường minh hoặc nhận về theo từng khoản rời rạc.
exceptions:
- Các quỹ doanh nghiệp có tính thanh khoản cao với các kiểm soát tài chính nghiêm ngặt.
applications:
  budgeting:
  - Tách ngân sách đào tạo khỏi ngân sách vận hành để đảm bảo khoản đầu tư kỹ năng không bị ăn mòn.
risks:
- Phung phí 'tiền nhặt được' hoặc tiếp tục các dự án không sinh lời vì ngân sách đã được phân bổ.
evidence:
  level: strong
  references:
  - Thaler, R. (1985). 'Mental accounting and consumer choice'. Marketing Science.
