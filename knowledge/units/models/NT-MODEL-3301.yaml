id: NT-MODEL-3301
type: model
title: Social Identity Theory
summary: A person's sense of who they are is based on their group membership(s), driving
  ingroup favoritism and intergroup discrimination.
primary_domain: tri-nhan
domain_area: NT-DA-0029
definition: A foundational framework in social psychology explaining how the cognitive
  process of self-categorization leads to the emotional necessity of elevating one's
  group over others.
mechanism:
- 'Categorization: We categorize objects and people to understand them.'
- 'Social Identification: We adopt the identity of the group we have categorized ourselves
  as belonging to.'
- 'Social Comparison: We compare our group with other groups to maintain self-esteem.'
conditions:
- Any environment containing multiple distinct sub-groups (e.g., Engineering vs Sales).
exceptions:
- Individuals with extremely high trait individualism who resist all group categorization.
applications:
  organizational_design:
  - Rotate employees through different departments to broaden their social identity
    to the entire company, reducing inter-departmental conflict.
risks:
- Creating 'us vs them' dynamics that spiral into toxic tribalism.
evidence:
  level: strong
  references:
  - Tajfel, H., & Turner, J. C. (1979). 'An integrative theory of intergroup conflict'.
    The social psychology of intergroup relations.
