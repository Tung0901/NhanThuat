id: NT-MODEL-0008
type: model
status: frozen
version: 0.1.0
title: Mô hình biểu hiện mặc định khi quá tải
summary: Một mô hình chẩn đoán ánh xạ tải lượng nhận thức, cảm xúc và thể chất để dự báo xác suất thống kê của việc các hành vi mặc định ghi đè lên các thích ứng có chủ ý.
primary_domain: tri-nhan
secondary_domains:
- tu-than
definition: Giải thích cách thức tải lượng kéo dài gây áp lực lên các nguồn lực nhận thức (kiểm soát điều hành), dẫn đến xác suất cao hơn là hành vi quan sát được sẽ quay trở lại các thói quen mặc định tiềm ẩn ổn định.
mechanism:
- Đo lường các yêu cầu kéo dài về nhận thức, cảm xúc hoặc thể chất.
- Giám sát việc phân bổ và ưu tiên nguồn lực kiểm soát điều hành.
- Quan sát sự suy giảm sau đó trong khả năng tự điều chỉnh thích ứng có chủ ý.
- Ghi nhận sự chuyển dịch mang tính xác suất của biểu hiện hành vi hướng về các mặc định tiềm ẩn tự động.
conditions:
- Các cá nhân hoạt động dưới mức độ căng thẳng, mệt mỏi, xao nhãng hoặc tải lượng nhận thức cao.
exceptions:
- Các thói quen tự động hóa cao hoặc các tín hiệu bối cảnh bên ngoài mạnh mẽ có thể tạm thời chế ngự các hành vi mặc định ngay cả khi đang quá tải.
applications:
  diagnosis:
  - Xác định xem sự sụt giảm hiệu suất hoặc vi phạm quy trình dưới áp lực là do quá tải nhận thức kích hoạt các hành vi mặc định hay không.
  design:
  - Giảm tải lượng nhiệm vụ hoặc đưa vào các công cụ hỗ trợ nhận thức trong các hoạt động căng thẳng cao để bảo vệ các hành vi thích ứng quan trọng.
risks:
- Việc ngụy biện cho các hành vi sai trái cố ý, sự cẩu thả hoặc các thất bại đạo đức như là biểu hiện mặc định không thể tránh khỏi.
