id: NT-PRINCIPLE-0030
type: principle
status: frozen
version: 0.1.0
title: Đặt tín hiệu nơi quyết định xảy ra
summary: Đặt những tín hiệu, tiêu chuẩn và ràng buộc quan trọng nhất tại điểm con người thực sự lựa chọn.
primary_domain: thanh-su
secondary_domains:
- dung-nhan
- tri-nhan
definition: Sự dẫn dắt hoạt động tốt hơn khi nó hiện diện ngay khoảnh khắc ra quyết định thay vì được cất ở nơi xa hành động.
mechanism:
- Xác định điểm ra quyết định.
- Xác định tín hiệu cần thiết.
- Đặt tín hiệu hoặc tiêu chuẩn tại đó.
conditions:
- Quyết định lặp lại.
- Con người có thể quên hoặc bỏ qua sự dẫn dắt ở xa.
exceptions:
- Quyết định nhạy cảm có thể cần chuẩn bị riêng tư.
- Quá nhiều tín hiệu có thể tạo ra tiếng ồn.
applications:
  operations:
  - Đặt kiểm tra chất lượng tại các điểm bàn giao.
  management:
  - Làm cho tiêu chuẩn hiện hữu trong quy trình làm việc.
risks:
- Làm bừa bộn công việc với các lời nhắc.
- Coi biển báo là đào tạo.
