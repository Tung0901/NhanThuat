mechanism:
- Nhận diện khác biệt về ưu tiên và chi phí của từng bên.
- Thiết kế các trao đổi bù trừ khai thác khác biệt đó.
- Kết hợp nguồn lực và năng lực bổ trợ để tạo giá trị mới.
- Sau khi mở rộng tổng giá trị, tiến hành phân bổ theo đóng góp và thỏa thuận.
