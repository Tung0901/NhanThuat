id: NT-PHENOMENON-3404
type: phenomenon
title: Cam kết và nhất quán
summary: Một khi chúng ta đưa ra lựa chọn hoặc đứng về một phía, chúng ta phải đối mặt với áp lực cá nhân và xã hội để cư xử nhất quán với cam kết đó.
primary_domain: tri-nhan
domain_area: NT-DA-0030
definition: Động lực tâm lý thúc đẩy hành vi tương lai khớp với những tuyên bố hoặc hành động trong quá khứ nhằm duy trì hình ảnh bản thân là người lý trí và đáng tin cậy.
mechanism:
- Một cá nhân được khuyến khích thực hiện một cam kết nhỏ, tự nguyện và công khai.
- Hình ảnh bản thân của cá nhân dịch chuyển nhẹ để khớp với cam kết này.
- Khi một yêu cầu lớn hơn, có liên quan được đưa ra sau đó, cá nhân tuân theo để duy trì sự nhất quán với hình ảnh bản thân mới.
conditions:
- Cam kết ban đầu phải mang tính chủ động, công khai và có vẻ tự nguyện (không bị ép buộc).
exceptions:
- Khi cam kết ban đầu bị ép buộc dưới sức ép nghiêm trọng hoặc thao túng rõ ràng.
applications:
  management:
  - Để nhân viên tự viết ra mục tiêu của họ thay vì áp đặt sẽ giúp tăng đáng kể tỷ lệ thực hiện.
risks:
- 'Ngụy biện chi phí chìm: tiếp tục một chiến lược thất bại chỉ để giữ sự nhất quán với những tuyên bố công khai trong quá khứ.'
evidence:
  level: strong
  references:
  - Festinger, L. (1957). 'A Theory of Cognitive Dissonance'.
  - Cialdini, R. B. (1984). 'Influence'.
