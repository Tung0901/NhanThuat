id: NT-ANTI-PATTERN-0006
type: anti-pattern
status: frozen
version: 0.1.0
title: Management by fear
summary: Relying on threats, humiliation, or insecurity to force performance, creating short-term compliance while causing long-term burnout, secrecy, and loss of talent.
primary_domain: tu-than
secondary_domains: [tri-nhan, hop-chung]
definition: Over-using threat signals as a primary management lever, suppressing truth-telling, creativity, and authentic commitment.
mechanism: [Issue threat signals, Trigger defensive compliance, Hide operational flaws, Erode long-term retention and trust.]
conditions: [Leaders use punitive authority to drive daily productivity.]
exceptions: [Enforcing mandatory ethical, safety, or legal boundaries requiring firm consequence warnings.]
applications: {leadership-review: [Identify fear-based leadership behaviors and replace them with high standards and support.], culture-audit: [Measure whether team members feel safe reporting bad news.]}
risks: [Confusing necessary accountability with fear-based management.]
evidence: {level: provisional, references: []}
relations: {supports: [], conflicts_with: [], depends_on: [NT-LAW-0031, NT-LAW-0025, NT-PRINCIPLE-0054], applies_to: []}
