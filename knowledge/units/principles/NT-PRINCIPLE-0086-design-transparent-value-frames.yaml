mechanism:
- 'Liệt kê các chiều giá trị liên quan: tài chính, thời gian, rủi ro, quan hệ, cơ hội.'
- Nêu rõ giả định và cách tính cho các đề xuất quan trọng.
- Trình bày điều được đề nghị và điều được mong đợi đối ứng.
- Đối chiếu khung giá trị giữa các bên để phát hiện lệch kỳ vọng.
