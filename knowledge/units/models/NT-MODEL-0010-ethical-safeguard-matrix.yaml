id: NT-MODEL-0010
type: model
status: frozen
version: 0.1.0
title: Ma trận Bảo vệ Lãnh đạo
summary: Đơn vị tri thức cấu trúc về Ma trận Bảo vệ Lãnh đạo trong quản trị tổ chức.
primary_domain: dung-nhan
secondary_domains:
- tu-than
definition: Định nghĩa chính thức về Ma trận Bảo vệ Lãnh đạo trong cấu trúc Nhân Thuật, thiết lập các ranh giới bảo vệ quyền lực, uy tín và sự an toàn của cấp quản lý.
conditions:
- Áp dụng trong các bối cảnh quản trị vận hành tiêu chuẩn của tổ chức.
exceptions:
- Các trường hợp khủng hoảng khẩn cấp yêu cầu quyền can thiệp đặc biệt vượt quyền hạn thông thường.
applications:
  governance:
  - Áp dụng Ma trận Bảo vệ Lãnh đạo vào quy trình làm việc và phân cấp quyết định của tổ chức.
risks:
- Việc áp dụng sai lệch Ma trận Bảo vệ Lãnh đạo có thể dẫn đến sự quan liêu, hiệu suất kém tối ưu và gây tắc nghẽn quyết định.
evidence:
  level: supported
  references:
  - EV-REQ-0001-01
relations:
  supports: []
  conflicts_with: []
  depends_on:
  - NT-LAW-0038
  applies_to: []
