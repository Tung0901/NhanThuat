id: NT-MODEL-3401
type: model
title: Mô hình Khả năng Xử lý Kỹ lưỡng (ELM)
summary: 'Lý thuyết quá trình kép mô tả sự thay đổi thái độ, xác định hai con đường thuyết phục riêng biệt: trung tâm (dựa trên logic) và ngoại vi (dựa trên bề nổi).'
primary_domain: tri-nhan
domain_area: NT-DA-0030
definition: Khung lý thuyết toàn diện giúp hiểu mức độ người tiếp nhận có khả năng suy ngẫm sâu về một thông điệp thuyết phục, từ đó dự đoán kỹ thuật thuyết phục nào sẽ đạt hiệu quả cao nhất.
mechanism:
- 'Con đường trung tâm: Người tiếp nhận có động lực và khả năng xử lý thông tin cao. Quá trình thuyết phục đòi hỏi lập luận logic vững chắc cùng dữ liệu xác thực, tạo ra sự thay đổi thái độ bền vững.'
- 'Con đường ngoại vi: Người tiếp nhận có động lực hoặc khả năng xử lý thấp. Quá trình thuyết phục diễn ra thông qua các tín hiệu bề nổi (sự hấp dẫn, uy quyền, lối tắt tư duy), tạo ra sự thay đổi thái độ tạm thời.'
- Người thuyết phục cần đánh giá chính xác trạng thái tâm lý của đối tượng để lựa chọn con đường tiếp cận tương ứng.
conditions:
- Áp dụng trong mọi bối cảnh giao tiếp thuyết phục, chiến dịch quảng cáo hoặc tranh luận.
exceptions:
- Những cá nhân hành động hoàn toàn theo phản xạ tự động mà không trải qua bất kỳ quá trình xử lý nhận thức nào.
applications:
  marketing:
  - Sử dụng bảng thông số kỹ thuật chi tiết (con đường trung tâm) cho phần mềm doanh nghiệp B2B; sử dụng hình ảnh người nổi tiếng (con đường ngoại vi) cho sản phẩm nước tăng lực đại trà.
risks:
- Cố gắng dùng dữ liệu phức tạp để thuyết phục một nhóm đối tượng đang mệt mỏi, phân tâm (dẫn đến việc họ lập tức ngắt kết nối và bỏ qua thông điệp).
evidence:
  level: strong
  references:
  - Petty, R. E., & Cacioppo, J. T. (1986). 'The elaboration likelihood model of persuasion'. Advances in experimental social psychology.
