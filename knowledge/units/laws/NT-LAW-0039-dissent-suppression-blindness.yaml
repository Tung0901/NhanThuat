id: NT-LAW-0039
type: law
status: frozen
version: 0.1.0
title: Điểm mù do triệt tiêu phản biện
summary: Đơn vị tri thức cấu trúc về điểm mù nhận thức sinh ra do dập tắt ý kiến trái chiều.
primary_domain: tri-nhan
secondary_domains:
- hop-chung
definition: Định nghĩa chuẩn tắc về điểm mù do đàn áp phản biện trong kiến trúc Nhân Thuật.
conditions:
- Bối cảnh quản trị vận hành của tổ chức.
exceptions:
- Trường hợp can thiệp ưu tiên trong tình huống khủng hoảng khẩn cấp.
applications:
  governance:
  - Nhận diện và phòng ngừa điểm mù do triệt tiêu phản biện trong quy trình vận hành tổ chức.
risks:
- Áp dụng sai cách thức xử lý ý kiến bất đồng dẫn đến suy giảm chất lượng ra quyết định và hiệu suất.
