mechanism:
- Một chủ thể đưa ra chỉ thị hoặc yêu cầu.
- 'Người thi hành đối chiếu nguồn gốc chỉ thị với bốn nguồn hợp pháp: vị trí chính thức, chuyên môn, quy trình đã thống nhất, sự chấp thuận của tập thể.'
- Khi tính hợp pháp được công nhận, tuân thủ diễn ra tự nguyện và bền vững.
- Khi tính hợp pháp mỏng, tuân thủ chuyển thành hình thức, cưỡng chế làm chi phí thi hành tăng cao.
