id: NT-PRINCIPLE-3002
type: principle
status: frozen
version: 0.1.0
title: Mô hình hóa tinh thần tường minh
summary: Yêu cầu cá nhân và đội ngũ làm rõ các giả định và mô hình tinh thần nền tảng của họ trước khi đưa ra quyết định chiến lược hoặc giải quyết xung đột.
primary_domain: tri-nhan
domain_area: NT-DA-0026
secondary_domains:
- hop-chung
- thanh-su
definition: Việc đưa ra bề mặt các khuôn khổ vô hình mà con người dùng để diễn giải thực tại, đảm bảo các bất đồng được tranh luận trên các mô hình thực tế thay vì trên các kết luận bề nổi.
mechanism:
- Một bất đồng hoặc quyết định phức tạp nảy sinh.
- Người tham gia tạm dừng tranh luận về kết luận.
- Mỗi người tham gia trình bày bản đồ nhân quả (nếu X thì Y) chi phối quan điểm của mình.
- Nhóm so sánh các mô hình để tìm ra điểm phân kỳ thực sự.
conditions:
- Các quyết định rủi ro cao hoặc các xung đột mãn tính chưa được giải quyết.
exceptions:
- Các nhiệm vụ vận hành thông thường, rủi ro thấp khi các mô hình tinh thần chung đã được thiết lập.
applications:
  strategy:
  - Phác họa bức tranh cạnh tranh bằng hình ảnh để bộc lộ các giả định khác nhau.
  team-building:
  - Đào tạo thành viên mới bằng cách giảng dạy tường minh các mô hình tinh thần vận hành của đội ngũ.
risks:
- Trí thức hóa quá mức các vấn đề thực thi đơn giản.
evidence:
  level: supported
  references:
  - Craik, K. J. W. (1943). 'The Nature of Explanation'. Cambridge University Press.
  - Johnson-Laird, P. N. (1983). 'Mental Models'.
