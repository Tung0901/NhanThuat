mechanism:
- Thông tin gốc được mã hóa bởi người gửi với một số chi tiết bị lược bỏ.
- Mỗi lớp trung gian tái diễn giải theo góc nhìn và lợi ích của mình.
- Khoảng cách quyền lực khuyến khích làm mềm tin xấu trước khi chuyển tiếp.
- Người nhận cuối cùng ra quyết định trên phiên bản đã sai lệch nhiều chặng.
