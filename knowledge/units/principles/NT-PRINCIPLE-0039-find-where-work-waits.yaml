id: NT-PRINCIPLE-0039
type: principle
status: frozen
version: 0.1.0
title: Tìm nơi công việc chờ đợi
summary: Xác định nơi công việc tích tụ, chờ đợi hoặc quay lại, vì tải trọng bộc lộ nút thắt thực sự.
primary_domain: thanh-su
secondary_domains:
- hop-chung
- tri-nhan
definition: Nút thắt trở nên nhìn thấy dưới tải trọng qua hàng đợi, làm lại, chờ đợi, leo thang và sự phụ thuộc lặp lại vào cùng một nguồn lực khan hiếm.
mechanism:
- Theo dõi các điểm chờ đợi
- Đếm các vòng lặp làm lại
- Xác định vai trò hoặc quyết định bị ràng buộc.
conditions:
- Việc thực thi đang chậm lại
- Thêm nỗ lực không cải thiện thông lượng.
exceptions:
- Sự dâng cao tạm thời có thể không biểu thị nút thắt cấu trúc
- Một số chờ đợi là kiểm soát chất lượng có chủ đích.
applications:
  operations:
  - Vẽ bản đồ hàng đợi trước khi bổ sung thêm việc.
  management:
  - Bảo vệ chuyên gia bị ràng buộc khỏi gián đoạn giá trị thấp.
risks:
- Đổ lỗi cho người sở hữu nút thắt
- Tối ưu một điểm trong khi dịch chuyển nút thắt sang nơi khác.
evidence:
