id: NT-PRINCIPLE-0032
type: principle
status: frozen
version: 0.1.0
title: Thiết kế vai trò để giảm điểm mù
summary: Thiết kế vai trò sao cho thông tin quan trọng, hệ quả và bàn giao đều nhìn thấy được với những người ra quyết định ảnh hưởng đến chúng.
primary_domain: dung-nhan
secondary_domains:
- hop-chung
- thanh-su
definition: Thiết kế vai trò nên phơi bày các tín hiệu cần thiết cho phán đoán tốt thay vì cô lập con người trong những góc nhìn phiến diện.
mechanism:
- Xác định nhu cầu ra quyết định
- Xác định điểm mù của vai trò
- Bổ sung khả năng tiếp cận
- phản hồi
- hoặc đánh giá chung.
conditions:
- Quyết định của vai trò ảnh hưởng đến người khác
- Thiếu tầm nhìn gây ra sai lầm lặp lại.
exceptions:
- Tính bảo mật có thể hạn chế khả năng tiếp cận
- Quá nhiều tầm nhìn có thể gây quá tải cho con người.
applications:
  organization:
  - Trao cho người ra quyết định phản hồi từ người dùng hạ nguồn.
  management:
  - Luân chuyển quan sát giữa các vai trò liên kết.
risks:
- Gây quá tải thông tin cho vai trò
- Làm suy yếu sự chuyên môn hóa.
evidence:
  level: provisional
  references: []
