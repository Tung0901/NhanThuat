id: NT-LAW-0019
type: law
status: frozen
version: 0.1.0
title: Hệ thống bảo toàn các thiết lập mặc định
summary: Một hệ thống có xu hướng tái tạo các quy tắc, động lực, thói quen và rào cản mặc định của nó cho đến khi có một sự can thiệp làm thay đổi chúng.
primary_domain: thanh-su
secondary_domains:
- hop-chung
- dung-nhan
definition: Các kết quả lặp đi lặp lại thường tồn tại dai dẳng vì các thiết lập mặc định cốt lõi vẫn tiếp tục định hướng hành vi ngay cả khi mọi người yêu cầu kết quả khác đi.
mechanism:
- Các quy tắc mặc định định hình hành vi
- Hành vi tái tạo các kết quả
- Các kết quả tiếp tục duy trì cho đến khi các thiết lập mặc định thay đổi.
conditions:
- Các khuôn mẫu lặp lại ở nhiều người hoặc qua thời gian
- Các quy tắc cốt lõi bên dưới vẫn giữ nguyên sự ổn định.
exceptions:
- Nỗ lực phi thường có thể tạm thời vượt qua các thiết lập mặc định
- Một cú sốc từ bên ngoài có thể tái thiết lập hệ thống.
applications:
  operations:
  - Thay đổi lộ trình mặc định
  - chứ không chỉ thay đổi hướng dẫn.
  leadership:
  - Tìm kiếm quy tắc liên tục tái tạo ra vấn đề đó.
risks:
- Đổ lỗi cho các cá nhân về những lỗi mặc định mang tính hệ thống
- Phức tạp hóa quá mức các vấn đề hành vi đơn giản.
