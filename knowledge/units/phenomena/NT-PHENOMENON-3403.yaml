id: NT-PHENOMENON-3403
type: phenomenon
title: Nguyên tắc thiện cảm
summary: Con người có xu hướng đồng ý với những cá nhân mà họ quen biết và yêu mến.
primary_domain: tri-nhan
domain_area: NT-DA-0030
definition: Một cơ chế thuyết phục trong đó khả năng tuân theo tăng mạnh nhờ ngoại hình hấp dẫn, sự tương đồng, lời khen ngợi và những nỗ lực hợp tác chung.
mechanism:
- Người thuyết phục thiết lập sự thân thiết bằng cách nhấn mạnh những điểm tương đồng, dành những lời khen chân thành, hoặc đơn giản là có ngoại hình hấp dẫn.
- Đối tượng nảy sinh phản ứng cảm xúc tích cực (thiện cảm).
- Đối tượng đồng nhất việc nói 'đồng ý' với yêu cầu và việc duy trì mối quan hệ tích cực.
conditions:
- Bán hàng giữa các cá nhân, đàm phán và lãnh đạo.
exceptions:
- Các môi trường mang tính giao dịch cao, tự động hóa hoặc ẩn danh.
applications:
  negotiation:
  - Dành 5 phút trước một cuộc đàm phán để tìm ra sở thích chung làm tăng khả năng đạt kết quả hợp tác lên hơn 30%.
risks:
- Chủ nghĩa gia đình trị và chủ nghĩa thân hữu trong tuyển dụng và thăng tiến nội bộ doanh nghiệp.
evidence:
  level: strong
  references:
  - 'Cialdini, R. B. (1984). ''Influence: The Psychology of Persuasion''.'
