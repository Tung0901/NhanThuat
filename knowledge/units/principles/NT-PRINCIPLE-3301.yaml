id: NT-PRINCIPLE-3301
type: principle
title: Thiết kế an toàn tâm lý
summary: Loại bỏ một cách có hệ thống các rủi ro liên cá nhân khi lên tiếng để ngăn chặn sự thiếu hiểu biết lan truyền và tư duy bầy đàn.
primary_domain: tri-nhan
domain_area: NT-DA-0029
definition: Yêu cầu mang tính kiến trúc nhằm xây dựng môi trường đội ngũ nơi các thành viên cảm thấy an toàn để chấp nhận rủi ro, nêu ý kiến bất đồng và thừa nhận sai lầm mà không sợ bị trừng phạt.
mechanism:
- Nhà lãnh đạo làm mẫu một cách tường minh về sự dễ tổn thương và thừa nhận sai lầm của chính họ.
- Những thất bại được đóng khung là cơ hội học tập mang tính hệ thống thay vì sự kém năng lực của cá nhân.
- Cái giá xã hội của việc bất đồng được hạ xuống một cách giả tạo.
conditions:
- Các môi trường công việc tri thức và giải quyết vấn đề phức tạp, nơi sự đổi mới và phát hiện lỗi là yếu tố quyết định.
exceptions:
- 'Các môi trường thực thi nghiêm ngặt, nơi đòi hỏi tuân thủ tuyệt đối một quy trình an toàn đã biết (ví dụ: danh sách kiểm tra phẫu thuật).'
applications:
  culture:
  - Triển khai các cuộc họp rút kinh nghiệm không đổ lỗi (blameless post-mortems) cho các sự cố hệ thống nghiêm trọng.
risks:
- Nhầm lẫn an toàn tâm lý với "tử tế" hoặc hạ thấp tiêu chuẩn hiệu suất.
evidence:
  level: strong
  references:
  - Edmondson, A. (1999). 'Psychological Safety and Learning Behavior in Work Teams'. Administrative Science Quarterly.
