id: NT-PRINCIPLE-0036
type: principle
status: frozen
version: 0.1.0
title: Tách biệt điều đã biết, chưa biết và quyết định
summary: Phân biệt sự kiện, điểm không chắc chắn và lựa chọn để sự mơ hồ không biến thành bối rối hay hành vi kiểm soát không cần thiết.
primary_domain: tri-nhan
secondary_domains:
- thanh-su
- hop-chung
definition: Tách bạch rõ ràng giữa điều đã biết, điều chưa biết và điều phải quyết định giúp giảm áp lực tâm lý của sự không chắc chắn.
mechanism:
- Liệt kê sự kiện đã biết
- Gọi tên các điểm không chắc chắn còn mở
- Xác định quyết định còn lại.
conditions:
- Nhóm bối rối hoặc lo lắng
- Nhiều cách diễn giải đang cạnh tranh nhau.
exceptions:
- Tình huống rất khẩn cấp có thể cần hành động trực tiếp trước
- Phân loại quá mức có thể trì hoãn các động thái rõ ràng.
applications:
  planning:
  - Dùng ba cột cho sự kiện
  - điểm chưa biết
  - và quyết định.
  communication:
  - Đừng trình bày sự không chắc chắn là thất bại khi nó bình thường.
risks:
- Tạo ra độ chính xác giả tạo
- Tránh cam kết bằng cách tinh chỉnh điểm chưa biết vô tận.
evidence:
