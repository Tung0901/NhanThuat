id: NT-PRINCIPLE-0014
type: principle
status: frozen
version: 0.1.0
title: Coi sự im lặng là dữ liệu
summary: Khi thông tin quan trọng không được đưa lên, hãy coi sự im lặng là tín hiệu về an toàn, động lực, sự rõ ràng hoặc niềm tin.
primary_domain: hop-chung
secondary_domains:
- tri-nhan
- thanh-su
definition: Sự im lặng có thể biểu thị sự đồng thuận, nhưng cũng có thể hé lộ nỗi sợ, sự bối rối, mệt mỏi hoặc cảm giác vô ích.
mechanism:
- Nhận ra tín hiệu bị thiếu.
- Hỏi điều gì khiến việc lên tiếng trở nên tốn kém.
- Thay đổi điều kiện đang chặn sự thật.
conditions:
- Thông tin lẽ ra phải tồn tại nhưng không xuất hiện.
- Con người có lý do để lọc giao tiếp.
exceptions:
- Sự im lặng có thể nghĩa là đồng thuận thực sự.
- Một số chủ đề cần sự riêng tư.
applications:
  leadership:
  - Điều tra sự im lặng lặp lại quanh các rủi ro đã biết.
  teamwork:
  - Hỏi điều gì khó nói trước khi kết luận về sự đồng thuận.
risks:
- Tra hỏi con người vì họ im lặng.
- Giả định có bất đồng ẩn giấu trong mỗi khoảng lặng.
