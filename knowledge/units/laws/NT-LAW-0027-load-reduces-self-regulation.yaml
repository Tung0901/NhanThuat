id: NT-LAW-0027
type: law
status: frozen
version: 0.1.0
title: Load reduces self-regulation
summary: As cognitive, emotional, or physical load rises, people have less capacity for patience, judgment, learning, and deliberate choice.
primary_domain: tri-nhan
secondary_domains: [tu-than, thanh-su]
definition: Human self-regulation depends on available capacity, so overload makes reactive behavior more likely even when intentions remain good.
mechanism: [Accumulate load, Reduce capacity, Simplify choices, React or conserve.]
conditions: [Demands exceed available attention, energy, or emotional bandwidth.]
exceptions: [Simple habits can hold under load, short-term surges can be absorbed with recovery.]
applications: {operations: [Reduce load before expecting better judgment.], learning: [Teach under manageable conditions before raising pressure.]}
risks: [Excusing avoidable harm, Ignoring skill or character issues.]
evidence: {level: provisional, references: []}
relations: {supports: [NT-PRINCIPLE-0049, NT-PRINCIPLE-0050, NT-ANTI-PATTERN-0002], conflicts_with: [], depends_on: [NT-LAW-0015, NT-LAW-0022], applies_to: []}
tags: [load, self-regulation, capacity]
