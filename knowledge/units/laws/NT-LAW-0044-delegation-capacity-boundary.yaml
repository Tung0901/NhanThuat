id: NT-LAW-0044
type: law
status: frozen
version: 0.1.0
title: Ranh giới Năng lực Ủy quyền
summary: Đơn vị tri thức cấu trúc về Ranh giới Năng lực Ủy quyền trong quản trị tổ chức.
primary_domain: dung-nhan
secondary_domains:
- tri-nhan
definition: Định nghĩa chính thức về Ranh giới Năng lực Ủy quyền trong cấu trúc kiến trúc Nhân Thuật.
conditions:
- Các bối cảnh quản trị và vận hành tổ chức.
exceptions:
- Các trường hợp can thiệp khẩn cấp khi xảy ra khủng hoảng.
applications:
  governance:
  - Áp dụng Ranh giới Năng lực Ủy quyền vào các luồng quy trình công việc của tổ chức.
risks:
- Việc áp dụng sai Ranh giới Năng lực Ủy quyền dẫn đến hiệu suất vận hành kém tối ưu.
