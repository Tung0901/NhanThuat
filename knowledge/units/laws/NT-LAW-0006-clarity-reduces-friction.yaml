id: NT-LAW-0006
type: law
status: review
version: 0.1.0
title: Clarity reduces friction
summary: Shared clarity about purpose, ownership, standards, and next steps reduces coordination cost and avoidable conflict.
primary_domain: hop-chung
secondary_domains: [dung-nhan, thanh-su]
definition: When people understand what matters, who owns what, and how decisions are made, they spend less effort guessing, checking, and repairing misunderstandings.
mechanism: [Define intent and ownership, Reduce ambiguity, Lower the need for repeated clarification.]
conditions: [People need to coordinate, The work has dependencies or handoffs.]
exceptions: [Ambiguity may be useful during exploration, Excessive detail can slow action.]
applications:
  teamwork: [Clarify owner, standard, and next step at every handoff.]
  execution: [Turn recurring confusion into explicit operating rules.]
risks: [Mistaking documentation for understanding, Over-controlling creative work.]
evidence: {level: provisional, references: []}
