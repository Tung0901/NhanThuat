id: NT-PHENOMENON-3312
type: phenomenon
title: Bất hòa nhận thức
summary: Sự khó chịu về tinh thần trải nghiệm bởi người đang giữ hai hoặc nhiều niềm tin, ý tưởng hoặc giá trị mâu thuẫn nhau, đặc biệt khi hành vi của họ xung đột với niềm tin của họ.
primary_domain: tri-nhan
domain_area: NT-DA-0029
definition: Một trạng thái căng thẳng tâm lý thúc đẩy cá nhân giải quyết các mâu thuẫn, thường bằng cách hợp lý hóa niềm tin thay vì thay đổi hành vi trong quá khứ.
mechanism:
- 'Một xung đột nảy sinh giữa một niềm tin và một hành động (ví dụ: "Tôi là một người quản lý thông minh" so với "Tôi đã tuyển một nhân viên tệ hại").'
- Điều này tạo ra một căng thẳng tâm lý khó chịu.
- 'Để giải tỏa căng thẳng, cá nhân thay đổi niềm tin (ví dụ: "Nhân viên này không tệ, họ chỉ cần thêm thời gian") để biện minh cho hành động.'
conditions:
- Khi khái niệm bản thân hoặc cái tôi của cá nhân gắn chặt với hành vi mâu thuẫn.
exceptions:
- Khi cá nhân có mức độ tự nhận thức cao và được rèn luyện trong khả năng phản tư siêu nhận thức.
applications:
  persuasion:
  - Để một người đưa ra một cam kết công khai nhỏ buộc họ điều chỉnh niềm tin nội bộ để biện minh cho hành động của mình (hiệu ứng Ben Franklin).
risks:
- Càng đầu tư vào những chiến lược kinh doanh thảm khốc để tránh thừa nhận thất bại.
evidence:
  level: strong
  references:
  - Festinger, L. (1957). 'A Theory of Cognitive Dissonance'. Stanford University Press.
