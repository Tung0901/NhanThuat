id: NT-MODEL-0003
type: model
status: frozen
version: 0.1.0
title: Chu kỳ thích ứng
summary: Mô hình khuôn mẫu thể hiện cách thức bối cảnh, hành vi, hệ quả và kỳ vọng lặp đi lặp lại tạo nên sự thích ứng ổn định.
primary_domain: tri-nhan
secondary_domains:
- tu-than
- thanh-su
definition: Sự thích ứng trở nên ổn định khi bối cảnh kích hoạt hành vi, hành vi nhận lại hệ quả, và hệ quả cập nhật kỳ vọng cho bối cảnh tiếp theo.
mechanism:
- Tín hiệu bối cảnh
- Hành vi
- Hệ quả
- Kỳ vọng
- Sự lặp lại.
conditions:
- Một khuôn mẫu lặp lại
- các hệ quả được nhận thức rõ
- các phương án thay thế có sẵn hoặc bị hạn chế.
exceptions:
- Các hệ quả tiềm ẩn có thể không định hình được hành vi
- các giá trị cốt lõi mạnh mẽ có thể chống lại áp lực lặp đi lặp lại.
applications:
  culture:
  - Phác thảo những gì môi trường liên tục dạy cho cá nhân.
  learning:
  - Sử dụng việc sửa sai an toàn lặp đi lặp lại để xây dựng các kỳ vọng mới.
risks:
- Tạo phản xạ có điều kiện mà không có sự đồng thuận
- nhầm lẫn sự thích ứng với sự đồng thuận.
