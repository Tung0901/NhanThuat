id: NT-PRINCIPLE-0104
type: principle
status: frozen
version: 0.1.0
title: Làm cho nút thắt hiển thị tức thì
summary: Hiển thị ngay các điểm tắc nghẽn thực thi và hàng đợi dồn ứ trên các bảng giám sát trực quan dùng chung.
primary_domain: dung-nhan
secondary_domains:
- tri-nhan
definition: Các nút thắt không được nhìn thấy sẽ âm thầm tích tụ. Hệ thống nên làm nổi bật trực quan các nhiệm vụ đang bị chặn.
conditions:
- Quản lý các đường ống bàn giao (delivery pipelines).
exceptions:
- Quy trình khắc phục lỗ hổng bảo mật thuộc diện tuyệt mật.
applications:
  telemetry:
  - Tự động làm nổi bật các nhiệm vụ bị chặn bằng màu đỏ trên bảng điều khiển của đội ngũ.
risks:
- Dùng giám sát trực quan để công khai chỉ trích những nhân viên làm việc chậm.
