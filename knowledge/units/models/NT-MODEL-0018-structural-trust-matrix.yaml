id: NT-MODEL-0018
type: model
status: frozen
version: 0.2.0
title: Ma trận niềm tin cấu trúc
summary: 'Ma trận phân loại niềm tin theo hai chiều: cơ sở hình thành và mức độ lệ thuộc vào quan hệ. Mỗi loại niềm tin cần cơ chế duy trì và kiểm chứng khác nhau.'
primary_domain: hop-chung
secondary_domains:
- dung-nhan
definition: Ma trận niềm tin cấu trúc là khung phân loại các dạng niềm tin trong tổ chức theo cơ sở hình thành (năng lực, tính chính trực, quan hệ, thể chế) và theo mức độ phụ thuộc vào cá nhân hay cấu trúc.
conditions:
- Tổ chức có nhiều loại quan hệ công việc khác nhau.
- Cần phân biệt đánh giá con người với đánh giá thể chế.
exceptions:
- Quan hệ mới chưa đủ dữ liệu để phân loại niềm tin.
- Niềm tin cá nhân mạnh có thể tạm thay thế thể chế trong giai đoạn ngắn.
applications:
  governance:
  - Xây dựng thể chế để niềm tin không phụ thuộc hoàn toàn vào cá nhân cụ thể.
  - Thiết kế cơ chế kế nhiệm cho các vị trí có niềm tin cá nhân tập trung.
  team-management:
  - Đánh giá loại niềm tin cần thiết cho từng cộng tác và cách xây dựng tương ứng.
  partnership:
  - Phân biệt niềm tin dựa trên quan hệ với niềm tin dựa trên năng lực trong hợp tác.
risks:
- Niềm tin cá nhân hóa quá mức tạo điểm phụ thuộc đơn nhất.
- Nhầm niềm tin quan hệ với niềm tin năng lực dẫn tới giao sai việc.
- Dùng ma trận để dán nhãn quan hệ thay vì cải thiện cấu trúc.
evidence:
