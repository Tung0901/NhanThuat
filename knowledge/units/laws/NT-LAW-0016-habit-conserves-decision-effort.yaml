id: NT-LAW-0016
type: law
status: frozen
version: 0.1.0
title: Thói quen tiết kiệm nỗ lực ra quyết định
summary: Các thói quen lặp đi lặp lại giúp giảm bớt nỗ lực ra quyết định bằng cách biến những lựa chọn thường xuyên thành hành vi mặc định.
primary_domain: tu-than
secondary_domains:
- dung-nhan
- thanh-su
definition: Thói quen giúp bảo tồn sự chú ý và ý chí bằng cách tự động hóa các hành động lặp lại, nhưng chúng cũng có thể duy trì các khuôn mẫu đã lỗi thời.
mechanism:
- Lặp lại một mô hình gợi ý - hành động
- Giảm bớt sự lựa chọn có ý thức
- Thực thi hành vi mặc định khi tín hiệu gợi ý xuất hiện trở lại.
conditions:
- Tình huống có tính lặp đi lặp lại
- Hành động có một tác nhân kích hoạt ổn định.
exceptions:
- Bối cảnh mới lạ có thể phá vỡ thói quen
- Sự gián đoạn mạnh mẽ có thể buộc phải cân nhắc kỹ lưỡng.
applications:
  self-management:
  - Thiết kế các thiết lập mặc định cho những hành vi lặp lại quan trọng.
  operations:
  - Biến các thực hành tốt mang tính định kỳ thành các thói quen.
risks:
- Tự động hóa sai hành vi
- Bỏ qua những thay đổi của bối cảnh.
