id: NT-PRINCIPLE-3205
type: principle
title: Mồi hành động (Tác nhân kích hoạt theo bối cảnh)
summary: Gắn một thói quen mới vào một thói quen hiện có, đáng tin cậy thay vì dựa vào thời gian hoặc trí nhớ.
primary_domain: tri-nhan
domain_area: NT-DA-0028
definition: Sự vận dụng thực tiễn của giai đoạn tín hiệu trong vòng lặp thói quen, tận dụng các hành vi tự động hiện có làm bàn đạp cho các hành vi mới.
mechanism:
- 'Xác định một thói quen diễn ra đáng tin cậy mỗi ngày không trượt (ví dụ: đánh răng).'
- Gắn "thói quen nhỏ" mới ngay sau thói quen hiện có.
- Việc hoàn thành thói quen cũ đóng vai trò là tín hiệu tự động cho thói quen mới.
conditions:
- Thói quen neo phải thực sự đáng tin cậy và khớp với tần suất mong muốn cho thói quen mới.
exceptions:
- Khi thói quen neo dễ bị gián đoạn bởi việc đi lại hoặc lịch trình cuối tuần.
applications:
  habit_stacking:
  - '"Sau khi tôi rót cà phê buổi sáng, tôi sẽ viết một dòng mã."'
risks:
- Xếp chồng quá nhiều thói quen mới lên một thói quen neo, khiến toàn bộ chuỗi sụp đổ.
evidence:
  level: strong
  references:
  - Fogg, B. J. (2019). 'Tiny Habits'.
relations:
  supports: []
  conflicts_with: []
  depends_on:
