id: NT-PHENOMENON-3305
type: phenomenon
title: Thiên kiến nội nhóm
summary: Xu hướng ưu ái nhóm của mình hơn các thành viên ngoài nhóm.
primary_domain: tri-nhan
domain_area: NT-DA-0029
definition: Một khuôn mẫu ưu ái các thành viên của nhóm nội bộ hơn các thành viên ngoài nhóm, biểu hiện trong đánh giá, phân bổ nguồn lực và nhận thức về năng lực.
mechanism:
- Cá nhân phân loại chính mình và người khác vào các nhóm.
- Lòng tự trọng gắn liền với vị thế của nhóm nội bộ (Lý thuyết Bản sắc Xã hội).
- Để nâng cao lòng tự trọng, cá nhân đề cao nhóm nội bộ và hạ thấp nhóm ngoài.
conditions:
- 'Ngay cả những nhóm phân chia tối thiểu, tùy ý (ví dụ: tung đồng xu để chia đội) cũng có thể kích hoạt thiên kiến này.'
exceptions:
- Khi một mục tiêu cấp trên đòi hỏi sự hợp tác chặt chẽ của cả hai nhóm để cùng tồn tại.
applications:
  team_building:
  - Tạo dựng một bản sắc nhóm chung, mạnh mẽ để nuôi dưỡng lòng trung thành và sự hợp tác nội bộ.
risks:
- Tâm lý bè phái, sự xung khắc giữa các phòng ban và thất bại trong việc chia sẻ nguồn lực trong toàn tổ chức.
evidence:
  level: strong
  references:
  - Tajfel, H. (1970). 'Experiments in Intergroup Discrimination'. Scientific American.
