id: NT-LAW-0057
type: law
status: frozen
version: 0.2.0
title: Sự tách rời vị thế và lợi ích
summary: Vị thế đàm phán và lợi ích thực là hai lớp khác nhau. Nhầm lẫn giữa chúng dẫn tới bế tắc và phương án tổng bằng không giả tạo.
primary_domain: thanh-su
secondary_domains:
- hop-chung
definition: 'Sự tách rời vị thế và lợi ích là quy luật về cấu trúc hai lớp của đàm phán: điều các bên tuyên bố đòi hỏi và điều các bên thực sự cần là hai lớp có thể tách rời và cần được xử lý riêng.'
conditions:
- Các bên có khác biệt lợi ích nhưng cũng có vùng lợi ích có thể dung hòa.
- Vị thế được công bố chưa đại diện đầy đủ cho lợi ích thực.
exceptions:
- Lợi ích là sống còn và không thể thương lượng, đàm phán chỉ xoay quanh hình thức thực hiện.
- Một bên chủ động che giấu lợi ích thật để giành lợi thế.
applications:
  negotiation:
  - Khai vấn nhu cầu, ưu tiên và lo ngại trước khi đề xuất phương án.
  - Tách con người và vị thế ra khỏi vấn đề lợi ích cần giải quyết.
  conflict-resolution:
  - Chuyển tranh luận từ ai đúng sang nhu cầu nào chưa được đáp ứng.
  sales:
  - Tìm hiểu lợi ích thật sau yêu cầu giá để thiết kế gói phù hợp.
risks:
- Đàm phán theo vị thế dẫn tới bế tắc hoặc nhượng bộ không cần thiết.
- Suy đoán sai lợi ích thật dẫn tới đề xuất lệch hướng.
- Khai mở lợi ích nhưng bị đối phương khai thác đơn phương.
