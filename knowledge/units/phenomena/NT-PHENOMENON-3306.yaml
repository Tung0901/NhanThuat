id: NT-PHENOMENON-3306
type: phenomenon
title: Quy tắc tương hỗ
summary: Quy tắc xã hội mạnh mẽ rằng chúng ta nên cố gắng đền đáp, một cách tương xứng, những gì người khác đã mang lại cho mình.
primary_domain: tri-nhan
domain_area: NT-DA-0029
definition: Một cơ chế xã hội học và tâm lý học nền tảng trong đó việc nhận một sự giúp đỡ, món quà hoặc nhượng bộ tạo ra cảm giác mắc nợ mạnh mẽ, đòi hỏi phải được đền đáp.
mechanism:
- Người A mang lại giá trị, sự hỗ trợ hoặc một nhượng bộ cho người B.
- Người B trải qua sự khó chịu về tâm lý (cảm giác mắc nợ).
- Người B chủ động tìm cách mang lại giá trị cho người A để giải tỏa sự căng thẳng này.
conditions:
- Sự giúp đỡ ban đầu phải được nhận thức là chân thành, không vụ lợi hoặc mang tính cá nhân hóa.
exceptions:
- Khi "sự giúp đỡ" được nhận ra rõ ràng là một chiêu thức bán hàng thao túng.
applications:
  negotiation:
  - Thực hiện một nhượng bộ có chủ đích, dễ thấy ở giai đoạn đầu của cuộc đàm phán để kích hoạt một nhượng bộ có tính tương hỗ từ phía đối tác.
risks:
- Hối lộ hoặc xung đột lợi ích khi những món quà nhỏ chi phối những quyết định mua sắm doanh nghiệp khổng lồ.
evidence:
  level: strong
  references:
  - 'Gouldner, A. W. (1960). ''The norm of reciprocity: A preliminary statement''. American Sociological Review.'
  - Cialdini, R. B. (1984). 'Influence'.
