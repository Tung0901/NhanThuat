id: NT-PRINCIPLE-0064
type: principle
status: frozen
version: 0.2.0
title: Yêu cầu quyền bất đồng được bảo vệ
summary: Thiết lập cơ chế bắt buộc có tiếng nói phản biện được bảo vệ trong các quyết định quan trọng. Bất đồng có kênh chính thức sẽ thay thế bất đồng ngầm và giảm điểm mù tập thể.
primary_domain: tri-nhan
secondary_domains:
- hop-chung
definition: Yêu cầu quyền bất đồng được bảo vệ là nguyên tắc đảm bảo mọi quyết định trọng yếu đều có ít nhất một kênh phản biện chính thức, an toàn và không thể bị trù dập.
conditions:
- Quyết định có ảnh hưởng lớn và khó đảo ngược.
- Tồn tại khoảng cách quyền lực có thể khiến bất đồng bị nén lại.
exceptions:
- Quyết định khẩn cấp trong thời gian cực ngắn có thể phản biện sau khi xử lý tình huống.
- Quyết định đã được kiểm định qua kênh độc lập trước đó.
applications:
  governance:
  - Quy định bước phản biện bắt buộc trong quy trình ra quyết định trọng yếu.
  - Thiết lập kênh phản biện ẩn danh cho các vấn đề nhạy cảm.
  leadership:
  - Chủ động mời và cảm ơn người phản biện trước tập thể để tạo chuẩn mực.
  team-management:
  - Luân phiên vai trò phản biện để tránh cá nhân hóa xung đột.
risks:
- Cơ chế bị hình thức hóa, phản biện chỉ để đủ thủ tục.
- Người phản biện bị cô lập ngầm dù không có hình thức trừng phạt.
- Phản biện vô trách nhiệm làm chậm mọi quyết định.
evidence:
  level: supported
  references:
  - EV-REQ-0001-01
