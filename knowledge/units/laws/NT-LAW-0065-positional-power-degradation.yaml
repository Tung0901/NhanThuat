id: NT-LAW-0065
type: law
status: frozen
version: 0.1.0
title: Sự Suy giảm Quyền lực Vị trí
summary: Việc quá phụ thuộc vào quyền lực chính thức để ép buộc thực thi sẽ làm suy giảm lòng tin, khả năng đổi mới sáng tạo và sự cam kết tự nguyện.
primary_domain: dung-nhan
secondary_domains:
- tri-nhan
definition: Quyền lực chính thức có thể ép buộc sự tuân thủ về mặt hành vi, nhưng không thể bắt buộc nỗ lực sáng tạo hay sự cam kết tự thân.
conditions:
- Môi trường làm việc tri thức đòi hỏi nỗ lực tự nguyện cao.
exceptions:
- Chỉ huy quân sự hoặc ứng phó khủng hoảng khẩn cấp.
applications:
  leadership:
  - Đào tạo các nhà quản lý chỉ sử dụng mệnh lệnh hành chính trong những trường hợp hiếm hoi để giải quyết bế tắc.
risks:
- Không sử dụng quyền lực khi sự tuân thủ được yêu cầu về mặt pháp lý.
evidence:
  level: supported
