id: NT-LAW-0001
type: law
status: frozen
version: 1.0.0
title: "Quy luật lợi ích chi phối hành vi"
summary: "Con người có xu hướng lựa chọn và kiên trì với những hành vi mà họ nhận thức là trực tiếp bảo vệ, gia tăng hoặc tối ưu hóa lợi ích và vị thế của chính mình."
primary_domain: tri-nhan
secondary_domains:
- dung-nhan
- hop-chung
- thanh-su
definition: "Trong mọi tương tác xã hội và tổ chức, hành vi của con người không vận hành ngẫu nhiên mà chịu sự chi phối có tính quy luật của hệ thống lợi ích được chủ thể cảm nhận. Khi đối mặt với các lựa chọn, chủ thể luôn ưu tiên phương án bảo toàn sự an toàn sinh tồn, địa vị xã hội, tài nguyên kinh tế hoặc bản sắc cá nhân, ngay cả khi biểu hiện bề ngoài mang vỏ bọc đạo đức hay phục tùng mệnh lệnh."
mechanism:
- "Kích hoạt nhận thức: Chủ thể tiếp nhận tín hiệu từ môi trường về sự thay đổi hoàn cảnh, áp lực mệnh lệnh hoặc cơ hội vị thế."
- "Tính toán vị thế ngầm: Hệ thống tâm lý vô thức đo lường cán cân giữa cái được (an toàn, danh tiếng, tiền bạc, sự tự chủ) và cái mất (năng lượng, rủi ro trừng phạt, tổn thương lòng tự trọng)."
- "Hợp thức hóa duy lý: Chủ thể đưa ra lựa chọn bảo vệ lợi ích tối ưu nhất cho mình, sau đó sử dụng các lập luận đạo đức, quy chế hoặc logic khách quan để giải thích cho hành động."
- "Bộc lộ hành vi: Năng lượng hành động được giải phóng mạnh mẽ và bền bỉ khi lợi ích cá nhân đồng thuận với mục tiêu; ngược lại sẽ xuất hiện sự kháng cự thụ động hoặc thoái thác ngầm nếu quyền lợi bị đe dọa."
- "Củng cố phản xạ: Kết quả nhận được từ hành vi sẽ cập nhật lại bản đồ niềm tin, thiết lập tiền lệ cho các quyết định tương lai."
conditions:
- "Chủ thể có quyền lựa chọn thực tế giữa tối thiểu hai phương án hành động khả thi."
- "Chủ thể nhận thức được tương đối rõ ràng mối liên hệ nhân quả giữa hành vi của mình và hệ quả nhận được."
- "Môi trường tổ chức có độ tự do nhất định để chủ thể thể hiện thái độ hoặc điều chỉnh nhịp độ hành động."
exceptions:
- "Hành vi bị cưỡng chế cực đoan bởi bạo lực trực tiếp, đe dọa tính mạng trước mắt hoặc hoảng loạn sinh tồn."
- "Hành vi xả thân mang tính biểu tượng tôn giáo, lý tưởng thiêng liêng hoặc tình mẫu tử khi bản sắc tinh thần vượt lên trên lợi ích sinh học cá nhân."
- "Tình trạng sai lệch nhận thức nghiêm trọng do bị thao túng thông tin tinh vi hoặc rối loạn tâm lý."
applications:
  leadership:
    - "Nhận diện chân thực động cơ của thuộc cấp: Tuyệt đối không đòi hỏi nhân sự hy sinh vô điều kiện mà không thiết kế cơ chế bảo vệ quyền lợi và lộ trình tiến thân tương xứng."
    - "Quy tụ nhân tâm bằng sự liên kết lợi ích: Muốn dẫn dắt đội ngũ, phải khéo léo gắn liền sự thành bại của đại nghiệp với vinh nhục và sự sung túc của từng tướng sĩ."
  management:
    - "Kiểm toán xung đột lợi ích quy trình: Khi hai phòng ban thường xuyên cãi vã (ví dụ Sales vs Kỹ thuật/Kiểm soát chất lượng), hãy sửa lại cơ chế tính thưởng và trách nhiệm thay vì tổ chức các buổi học về tinh thần đồng đội suông."
    - "Nguyên tắc thưởng phạt phân minh: Tưởng thưởng ngay những hành vi tạo giá trị thực và triệt tiêu mọi kẽ hở tạo ra lợi ích từ sự gian dối hoặc trốn tránh trách nhiệm."
  negotiation:
    - "Bóc tách lập trường để tìm lợi ích nền tảng: Không tranh cãi về mức giá hay điều khoản bề mặt, mà tập trung khai thác nỗi sợ mất thị phần, áp lực báo cáo cấp trên hoặc chỉ tiêu quý của đối phương."
    - "Mở rộng miếng bánh trước khi phân chia: Đưa thêm các giá trị phi tài chính (thời hạn thanh toán, độc quyền phân phối, quan hệ công chúng) để thỏa mãn lợi ích đa chiều của cả hai bên."
  crisis_containment:
    - "Khoanh vùng nhóm bị tổn thương đầu tiên: Khi biến cố xảy ra, người có nguy cơ mất nhiều lợi ích nhất sẽ là ngòi nổ phản kháng dữ dội nhất; cần chủ động đối thoại và bảo đảm quyền lợi cốt lõi cho họ trước."
risks:
- "Đồng nhất thiển cận lợi ích với tiền bạc hoặc vật chất, bỏ quên các lợi ích tinh thần tối quan trọng như sự tôn trọng, quyền tự chủ, thể diện và sự an toàn tâm lý."
- "Rơi vào cái bẫy cay độc (cynicism): Nhìn đâu cũng thấy toan tính đê hèn, biến mọi mối quan hệ thành giao dịch sòng phẳng lạnh lùng, hủy hoại lòng trung thành và đức hy sinh trong tổ chức."
- "Áp đặt hệ giá trị bản thân lên người khác: Tự suy đoán điều mình coi là có lợi cũng là điều đối phương khao khát."
evidence:
  level: provisional
  references:
  - "Hàn Phi Tử - Thiên Bát Gian & Gian Kiếp Thí Thần (Bàn về gốc rễ dùng người: 'Thiện hành giả dĩ lợi dụ chi, dĩ hình uy chi')"
  - "Tư Mã Thiên - Sử Ký (Hóa Thực Liệt Truyện: 'Thiên hạ hi hi giai vi lợi lai, thiên hạ nhương nhương giai vi lợi vãng')"
  - "Adam Smith - The Wealth of Nations (1776 - Luận về động lực tự lợi thúc đẩy trật tự kinh tế xã hội)"
  - "Daniel Kahneman & Amos Tversky - Prospect Theory (1979 - Sự bất đối xứng trong tâm lý được - mất của con người)"
