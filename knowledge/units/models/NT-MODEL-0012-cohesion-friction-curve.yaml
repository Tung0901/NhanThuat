id: NT-MODEL-0012
type: model
status: frozen
version: 0.2.0
title: Đường cong Ma sát Sự gắn kết
summary: 'Đường cong mô tả quan hệ phi tuyến giữa mức gắn kết và ma sát trong nhóm: hiệu suất cao nhất ở vùng cân bằng, sụt giảm ở cả hai cực. Mô hình giúp chuẩn đoán sức khỏe nhóm.'
primary_domain: hop-chung
secondary_domains:
- tri-nhan
definition: Đường cong Ma sát Sự gắn kết là mô hình biểu diễn quan hệ giữa mức gắn kết nội bộ và mức ma sát chức năng của nhóm, trong đó vùng hiệu suất tối ưu nằm giữa hai thái cực đồng thuận quá mức và xung đột quá mức.
conditions:
- Nhóm làm việc phụ thuộc lẫn nhau và kéo dài.
- Có thể quan sát được cả gắn kết lẫn bất đồng.
exceptions:
- Nhóm khủng hoảng ngắn hạn có thể chấp nhận đồng thuận cao hơn bình thường.
- Nhóm mới thành lập cần ưu tiên gắn kết trước khi tăng ma sát.
applications:
  team-management:
  - Dùng đường cong để đánh giá định kỳ sức khỏe nhóm.
  - Thiết kế nghi thức phản biện khi nhóm trượt về phía đồng thuận quá mức.
  facilitation:
  - Điều tiết mức bất đồng trong các phiên họp quan trọng.
  leadership:
  - Nhận diện dấu hiệu nhóm đang ở vùng nguy hiểm của đường cong.
risks:
- Đo lường hình thức gắn kết và ma sát không phản ánh thực chất.
- Tăng ma sát quá mức làm xói mòn lòng tin.
- Duy trì đồng thuận quá lâu tạo suy giảm chất lượng quyết định.
evidence:
  level: supported
