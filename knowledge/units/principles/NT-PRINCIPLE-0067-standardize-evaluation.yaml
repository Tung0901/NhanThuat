title: Chuẩn hóa đánh giá
summary: Chuẩn hóa đánh giá là một đơn vị tri thức cấu trúc trong kho tri thức Nhân Thuật.
primary_domain: tri-nhan
secondary_domains:
- dung-nhan
definition: Định nghĩa chính thức của Nguyên tắc Chuẩn hóa đánh giá trong kiến trúc Nhân Thuật.
conditions:
- Các bối cảnh quản trị vận hành.
exceptions:
- Các tình huống khẩn cấp yêu cầu vượt quyền ưu tiên.
applications:
  governance:
  - Áp dụng Nguyên tắc Chuẩn hóa đánh giá vào các quy trình vận hành của tổ chức.
risks:
- Áp dụng sai Nguyên tắc Chuẩn hóa đánh giá dẫn đến hiệu suất dưới mức tối ưu.
