mechanism:
- Một nhiệm vụ hoặc mục tiêu được diễn giải theo một khung ý nghĩa nhất định.
- Khung diễn giải xác định giá trị cảm nhận và mức ưu tiên.
- Khung mới tái định nghĩa ý nghĩa, lợi ích hoặc bản sắc gắn với nhiệm vụ.
- Mức cam kết và nỗ lực của chủ thể dịch chuyển theo khung mới.
