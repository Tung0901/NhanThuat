mechanism:
- Các bên trình bày vị thế (điều họ đòi hỏi) trong đàm phán.
- Vị thế là kết quả nén của lợi ích, ưu tiên và lo ngại bên dưới.
- Đàm phán trên vị thế tạo đối đầu và giới hạn không gian phương án.
- Khai mở lợi ích bên dưới cho phép thiết kế phương án đáp ứng cả hai phía.
