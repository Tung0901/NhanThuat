mechanism:
- Xác định kỹ thuật gây ảnh hưởng đang được xem xét.
- Đánh giá mức độ người tiếp nhận biết rõ ý định của người thuyết phục.
- Đánh giá mức độ lựa chọn của người tiếp nhận có thực sự tự nguyện.
- Phân loại và điều chỉnh về vùng thuyết phục chính danh.
