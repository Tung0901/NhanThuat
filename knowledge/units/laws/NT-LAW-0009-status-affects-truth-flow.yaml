id: NT-LAW-0009
type: law
status: frozen
version: 0.1.0
title: Địa vị ảnh hưởng đến dòng chảy thông tin
summary: Mọi người thường chọn lọc những gì họ nói lên trên, xuống dưới và sang ngang dựa trên nhận thức về quyền lực, sự an toàn, địa vị và hệ quả đi kèm.
primary_domain: hop-chung
secondary_domains:
- tri-nhan
- thanh-su
definition: Dòng chảy thông tin được định hình bởi rủi ro xã hội; mọi người tiết lộ hoặc che giấu sự thật dựa trên những gì họ dự đoán sẽ xảy ra sau khi lên tiếng.
mechanism:
- Đánh giá đối tượng người nghe và quyền lực
- Ước tính hệ quả
- Chia sẻ
- giảm nhẹ
- trì hoãn
- hoặc che giấu thông tin.
conditions:
- Thông tin có sức ảnh hưởng đến xã hội hoặc lợi ích vật chất
- Mọi người quan tâm đến vị thế tương lai của mình.
exceptions:
- Sự tin tưởng cao có thể thúc đẩy sự thẳng thắn
- Các cơ chế bảo vệ chính thức có thể làm giảm nỗi sợ hãi.
applications:
  leadership:
  - Thiết kế các kênh thông tin giúp tin xấu có thể được báo cáo một cách an toàn.
  governance:
  - Coi sự im lặng là một tín hiệu rủi ro tiềm ẩn.
risks:
- Trừng phạt sự thật trong khi vẫn yêu cầu sự minh bạch
- Nhầm lẫn giữa sự lịch thiệp xã giao với sự đồng thuận thực chất.
