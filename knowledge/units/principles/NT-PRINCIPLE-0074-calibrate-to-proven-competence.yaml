mechanism:
- Xác định các mốc năng lực có thể chứng minh bằng kết quả.
- Bắt đầu với phạm vi quyền hạn tương xứng năng lực hiện có.
- Ghi nhận kết quả thực tế qua nhiều tình huống đa dạng.
- Mở rộng hoặc thu hẹp quyền hạn theo bằng chứng thu được.
