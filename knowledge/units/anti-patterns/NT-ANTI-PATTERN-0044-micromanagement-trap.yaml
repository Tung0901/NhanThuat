id: NT-ANTI-PATTERN-0044
type: anti-pattern
status: frozen
version: 0.1.0
title: Bẫy quản lý vi mô
summary: Duy trì quyền kiểm soát phê duyệt vi mô đối với các công việc đã ủy quyền, làm triệt tiêu tốc độ, lòng tin và sự chủ động của nhân viên.
primary_domain: dung-nhan
secondary_domains:
- tri-nhan
definition: Bẫy quản lý vi mô xảy ra khi cấp quản lý giao việc trên danh nghĩa nhưng lại liên tục yêu cầu phê duyệt từng chi tiết nhỏ.
mechanism:
- Cấp quản lý giao việc.
- Cấp quản lý yêu cầu phê duyệt từng chi tiết nhỏ.
- Nhân viên ngừng đưa ra phán đoán độc lập.
- Tốc độ thực thi sụt giảm nghiêm trọng.
conditions:
- Các quản lý thiếu tự tin làm việc trong môi trường áp lực cao.
exceptions:
- Đào tạo nhân sự mới trong giai đoạn hòa nhập ban đầu.
applications:
  coaching:
  - Cảnh báo những quản lý có tỷ lệ yêu cầu phê duyệt vi mô quá cao.
risks:
- Nhầm lẫn giữa kiểm tra chất lượng cần thiết và quản lý vi mô.
evidence:
  level: supported
  references:
  - EV-REQ-0013-01
relations:
