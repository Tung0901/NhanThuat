id: NT-ANTI-PATTERN-0051
type: anti-pattern
status: frozen
version: 0.1.0
title: Bỏ qua thu thập dữ liệu vận hành
summary: Phát hành sản phẩm hoặc thực thi chiến lược mà không ghi lại dữ liệu kết quả, khiến tổ chức không thể học hỏi và cải tiến.
primary_domain: tri-nhan
secondary_domains:
- thanh-su
definition: Tình trạng bỏ qua thu thập dữ liệu vận hành xảy ra khi các đội nhóm ra mắt tính năng mà không cài đặt công cụ đo lường hoặc nhật ký hiệu suất.
mechanism:
- Đội nhóm triển khai một sáng kiến lớn.
- Không cấu hình ghi dữ liệu đo lường vận hành.
- Không thể đánh giá được kết quả thực tế.
- Các sai lầm tiếp tục bị lặp lại.
conditions:
- Tiến độ bàn giao gấp giáp dẫn đến việc bỏ qua hạ tầng ghi dữ liệu.
exceptions:
- Các buổi thảo luận ý tưởng trực tiếp không mang tính kỹ thuật.
applications:
  launch_checklist:
  - Yêu cầu kiểm tra việc ghi dữ liệu vận hành trước khi phê duyệt bất kỳ bản phát hành nào.
risks:
- Thu thập vô số dữ liệu đo lường vô giá trị.
evidence:
  level: supported
  references:
  - EV-REQ-0018-01
relations:
