id: NT-LAW-0006
type: law
status: frozen
version: 0.1.0
title: Sự rõ ràng giảm thiểu ma sát
summary: Sự rõ ràng chung về mục tiêu, quyền sở hữu, tiêu chuẩn và các bước tiếp theo giúp giảm chi phí phối hợp và các xung đột có thể tránh được.
primary_domain: hop-chung
secondary_domains:
- dung-nhan
- thanh-su
definition: Khi mọi người hiểu rõ điều gì là quan trọng, ai chịu trách nhiệm cho việc gì và các quyết định được đưa ra như thế nào, họ sẽ tốn ít công sức hơn cho việc phỏng đoán, kiểm tra và khắc phục những hiểu lầm.
mechanism:
- Xác định rõ ý định và quyền sở hữu
- Giảm thiểu sự mơ hồ
- Giảm nhu cầu phải làm rõ lại nhiều lần.
conditions:
- Mọi người cần phải phối hợp với nhau
- Công việc có các mối quan hệ phụ thuộc hoặc bàn giao.
exceptions:
- Sự mơ hồ có thể hữu ích trong giai đoạn khám phá
- Chi tiết quá mức có thể làm chậm hành động.
applications:
  teamwork:
  - Làm rõ người chịu trách nhiệm
  - tiêu chuẩn
  - và bước tiếp theo tại mỗi điểm bàn giao.
  execution:
  - Chuyển những bối rối lặp đi lặp lại thành các quy tắc vận hành rõ ràng.
risks:
- Nhầm lẫn giữa việc có tài liệu với việc thực sự thấu hiểu
- Kiểm soát quá mức công việc sáng tạo.
