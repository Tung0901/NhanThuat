id: NT-PHENOMENON-3201
type: phenomenon
title: Hiệu ứng độ dốc mục tiêu
summary: Khi con người tiến gần đến mục tiêu, nỗ lực của họ gia tăng.
primary_domain: tri-nhan
domain_area: NT-DA-0028
definition: Một hiện tượng động lực, trong đó khoảng cách vật lý hoặc tâm lý đến phần thưởng làm tăng cường độ của hành vi cần thiết để đạt được nó.
mechanism:
- Một mục tiêu được thiết lập.
- Khi có tiến triển, khoảng cách cảm nhận đến mục tiêu giảm xuống.
- Động lực tỷ lệ nghịch với khoảng cách còn lại mà người ta cảm nhận.
conditions:
- Các mục tiêu rõ ràng, đo lường được với một vạch đích xác định.
exceptions:
- 'Các mục tiêu vô hạn hoặc mơ hồ (ví dụ: ''khỏe mạnh'').'
applications:
  gamification:
  - 'Cung cấp tiến triển ban đầu giả định (ví dụ: thẻ tích điểm cà phê có 2 dấu miễn phí trong số 12 dấu) để rút ngắn một cách giả tạo khoảng cách khởi đầu được cảm nhận.'
risks:
- '''Trầm cảm hậu mục tiêu'': động lực sụt giảm ngay lập tức sau khi mục tiêu đạt được.'
evidence:
  level: strong
  references:
  - Hull, C. L. (1932). 'The goal-gradient hypothesis and maze learning'. Psychological Review.
relations:
  supports: []
  conflicts_with: []
  depends_on: []
  applies_to: []
