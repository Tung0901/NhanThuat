id: NT-PRINCIPLE-0112
type: principle
status: frozen
version: 0.1.0
title: Thực thi bảo vệ rủi ro bất đối xứng
summary: Bảo vệ các bên liên quan dễ bị tổn thương, những người gánh chịu rủi ro chiều giảm bất đối xứng từ các quyết định của cấp điều hành.
primary_domain: tu-than
secondary_domains:
- hop-chung
definition: Quản trị có đạo đức đòi hỏi chủ động bảo vệ những bên thiếu quyền lực cấu trúc hoặc thiếu cân bằng thông tin.
conditions:
- Điều khoản khách hàng, an toàn nhân viên và tác động môi trường.
exceptions:
- Các đối tác tổ chức tinh vi hoạt động với mức cân bằng thông tin ngang nhau.
applications:
  consumer_protection:
  - Rà soát các điều khoản hợp đồng để đảm bảo có cơ chế hoàn tiền và bảo vệ an toàn rõ ràng.
risks:
- Bảo vệ khách hàng quá mức đến mức khiến công ty phải đối mặt với lạm dụng hoàn tiền gian lận.
