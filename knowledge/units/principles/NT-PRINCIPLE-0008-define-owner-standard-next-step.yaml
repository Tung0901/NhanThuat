id: NT-PRINCIPLE-0008
type: principle
status: review
version: 0.1.0
title: Define owner, standard, and next step
summary: For every important handoff, make the owner, expected standard, and next visible step explicit.
primary_domain: hop-chung
secondary_domains: [dung-nhan, thanh-su]
definition: Coordination improves when people know who owns the outcome, what good means, and what happens next.
mechanism: [Assign owner, Define standard, Confirm next step and timing.]
conditions: [Work crosses people or roles, Misalignment would create rework or delay.]
exceptions: [Exploratory work may need looser ownership, Over-specific standards may reduce adaptability.]
applications: {teamwork: [End meetings with owner and next action.], operations: [Use handoff checklists for recurring work.]} 
risks: [Creating bureaucracy, Assigning ownership without authority.]
evidence: {level: provisional, references: []}
relations: {supports: [], conflicts_with: [], depends_on: [NT-LAW-0006, NT-LAW-0010], applies_to: []}
tags: [ownership, clarity, handoffs]
