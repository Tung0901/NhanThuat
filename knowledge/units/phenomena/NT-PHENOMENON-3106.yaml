id: NT-PHENOMENON-3106
type: phenomenon
title: Status Quo Bias
summary: An emotional preference for the current state of affairs, taking any change
  from the baseline as a loss.
primary_domain: tri-nhan
domain_area: NT-DA-0027
definition: The irrational preference to maintain the current state, even when the
  transition costs to a objectively superior state are negligible.
mechanism:
- The current state serves as the reference point.
- Change involves uncertainty and potential losses.
- Due to loss aversion, the potential losses of changing outweigh the potential gains.
conditions:
- When a default option is explicitly provided or historically established.
exceptions:
- When the status quo is perceived as imminently dangerous or failing.
applications:
  product_design:
  - Leverage defaults carefully, as users will rarely change them.
risks:
- Organizational stagnation and failure to adopt superior tooling.
evidence:
  level: strong
  references:
  - Samuelson, W., & Zeckhauser, R. (1988). 'Status quo bias in decision making'.
    Journal of Risk and Uncertainty.
