id: NT-LAW-0073
type: law
status: frozen
version: 0.1.0
title: Củng cố bằng tạo tác văn hóa
summary: Các nghi thức, câu chuyện chung và các tạo tác vật lý hoặc kỹ thuật số tại nơi làm việc liên tục củng cố và định hình các chuẩn mực văn hóa.
primary_domain: hop-chung
secondary_domains:
- dung-nhan
definition: Văn hóa cần có các tạo tác vật lý hoặc kỹ thuật số (hoạt động kỷ niệm, câu chuyện thăng tiến, báo cáo rút kinh nghiệm) để định hình bản sắc chung.
conditions:
- Quá trình hội nhập nhân sự mới và sự gắn kết của các đội ngũ làm việc từ xa.
exceptions:
- Các lực lượng đặc nhiệm tạm thời hoạt động trong thời gian cực kỳ ngắn hạn.
applications:
  onboarding:
  - Tích hợp các câu chuyện rút kinh nghiệm lịch sử và các nghi thức chiến thắng vào tài liệu hội nhập nhân sự mới.
risks:
- Duy trì các nghi thức sáo rỗng đã mất đi ý nghĩa thực tế.
evidence:
  level: supported
  references:
  - EV-REQ-0019-01
