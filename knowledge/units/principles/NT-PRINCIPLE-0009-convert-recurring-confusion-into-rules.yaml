id: NT-PRINCIPLE-0009
type: principle
status: frozen
version: 0.1.0
title: Convert recurring confusion into rules
summary: When the same confusion repeats, create a simple rule, standard, or decision
  path rather than relying on repeated explanation.
primary_domain: hop-chung
secondary_domains:
- thanh-su
- dung-nhan
definition: Recurring ambiguity should become an operating rule so people do not keep
  spending attention on the same coordination question.
mechanism:
- Notice repeated confusion
- Identify the missing rule
- Publish a simple default.
conditions:
- The confusion repeats
- A stable default would help.
exceptions:
- Novel work may need judgment more than rules
- Too many rules can hide priorities.
applications:
  operations:
  - Turn repeated questions into playbook entries.
  management:
  - Clarify decision paths after repeated escalations.
risks:
- Over-standardizing complex judgment
- Ignoring training needs.
evidence:
  level: provisional
  references: []
