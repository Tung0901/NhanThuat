mechanism:
- Các thành viên tiếp cận vấn đề bằng mô hình tư duy khác nhau.
- Khác biệt tạo ra nhiều giả thuyết và phương án độc lập.
- Tranh luận có cấu trúc sàng lọc giả thuyết và giảm thiên kiến tập thể.
- Kết quả quyết định phức tạp được cải thiện khi các góc nhìn được tích hợp.
