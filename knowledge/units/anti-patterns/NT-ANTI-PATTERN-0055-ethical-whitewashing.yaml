id: NT-ANTI-PATTERN-0055
type: anti-pattern
status: frozen
version: 0.1.0
title: Tẩy trắng đạo đức
summary: Sử dụng các chiến dịch PR tốn kém và các khẩu hiệu phô trương đạo đức để che đậy các hoạt động vận hành mang tính bóc lột.
primary_domain: tu-than
secondary_domains:
- tri-nhan
definition: Tẩy trắng đạo đức xảy ra khi một doanh nghiệp chi hàng triệu đô la để quảng cáo các giá trị đạo đức trong khi vẫn ngược đãi nhân viên của mình.
mechanism:
- Doanh nghiệp thực hiện các hành vi mang tính bóc lột.
- Bộ phận PR tung ra chiến dịch phô trương đạo đức.
- Công chúng bị đánh lạc hướng.
- Các hành vi sai trái vẫn tiếp tục diễn ra.
conditions:
- Ngân sách tiếp thị PR của doanh nghiệp lớn đi kèm với hệ thống quản trị nội bộ yếu kém.
exceptions:
- Không có.
applications:
  audit:
  - Đối chiếu các tuyên bố đạo đức tiếp thị với dữ liệu kiểm toán nội bộ.
risks:
- Làm giảm động lực của các sáng kiến phát triển bền vững thực chất.
evidence:
  level: supported
  references:
  - EV-REQ-0020-01
