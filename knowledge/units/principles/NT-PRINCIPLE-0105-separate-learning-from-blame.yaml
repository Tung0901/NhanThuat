id: NT-PRINCIPLE-0105
type: principle
status: frozen
version: 0.1.0
title: Tách biệt học hỏi khỏi quy trách nhiệm
summary: Tách bạch rõ ràng các buổi rà soát sự cố tìm nguyên nhân gốc rễ khỏi các buổi đánh giá quản lý hiệu suất cá nhân.
primary_domain: tri-nhan
secondary_domains:
- hop-chung
definition: Nếu nhân viên lo sợ buổi rà soát sự cố sẽ ảnh hưởng đến xếp hạng hiệu suất của họ, họ sẽ giấu đi các chi tiết quan trọng.
conditions:
- Họp sau sự cố (post-mortem) và rà soát sau dự án.
exceptions:
- Sơ suất lặp lại sau khi đã được kèm cặp và ghi nhận bằng tài liệu.
applications:
  post_mortem_policy:
  - Quy định ghi chú post-mortem không được dùng làm căn cứ tính thưởng.
risks:
- Không xử lý tình trạng năng lực cá nhân yếu lặp lại.
