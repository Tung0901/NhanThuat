id: NT-ANTI-PATTERN-2201
type: anti-pattern
status: frozen
version: 1.0.0
title: Tích trữ thông tin
summary: Hành vi cố tình che giấu hoặc hạn chế chia sẻ thông tin nhằm duy trì vị thế độc quyền và quyền lực cá nhân trong tổ chức.
primary_domain: dung-nhan
domain_area: NT-DA-0022
secondary_domains:
- hop-chung
definition: Việc cố ý tạo ra các điểm nghẽn tri thức nhân tạo nhằm khiến tổ chức bị phụ thuộc vào một cá nhân duy nhất.
mechanism:
- Cố tình không viết tài liệu hướng dẫn hoặc quy trình bàn giao công việc.
- Hạn chế chia sẻ các đầu mối liên hệ và mối quan hệ đối tác quan trọng.
conditions:
- Môi trường làm việc thiếu cơ chế chia sẻ tri thức và hệ thống khen thưởng chỉ tập trung vào thành tích cá nhân.
exceptions:
- Yêu cầu bảo mật thông tin hợp pháp theo quy định pháp luật hoặc thỏa thuận bảo mật (NDA).
applications:
  management:
  - Tích hợp tiêu chí chia sẻ tri thức và tài liệu hóa quy trình vào hệ thống đánh giá hiệu suất (KPI/OKR).
risks:
- Tạo ra điểm nghẽn đơn lẻ (Single Point of Failure), gây rủi ro gián đoạn vận hành nghiêm trọng khi nhân sự nghỉ việc.
