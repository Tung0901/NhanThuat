id: NT-PRINCIPLE-0008
type: principle
status: frozen
version: 0.1.0
title: Xác định chủ sở hữu, tiêu chuẩn và bước tiếp theo
summary: Đối với mọi lần bàn giao quan trọng, hãy làm rõ chủ sở hữu, tiêu chuẩn kỳ vọng và bước tiếp theo có thể thấy được.
primary_domain: hop-chung
secondary_domains:
- dung-nhan
- thanh-su
definition: Phối hợp cải thiện khi con người biết ai sở hữu kết quả, thế nào là tốt và điều gì xảy ra tiếp theo.
mechanism:
- Chỉ định chủ sở hữu.
- Xác định tiêu chuẩn.
- Xác nhận bước tiếp theo và thời điểm.
conditions:
- Công việc đi qua nhiều người hoặc nhiều vai trò.
- Sự lệch nhịp sẽ tạo ra làm lại việc hoặc chậm trễ.
exceptions:
- Công việc thăm dò có thể cần quyền sở hữu lỏng hơn.
- Tiêu chuẩn quá cụ thể có thể giảm khả năng thích ứng.
applications:
  teamwork:
  - Kết thúc cuộc họp bằng chủ sở hữu và hành động tiếp theo.
  operations:
  - Dùng bảng kiểm bàn giao cho công việc lặp lại.
risks:
- Tạo ra thủ tục hành chính cồng kềnh.
- Chỉ định quyền sở hữu mà không có quyền hạn.
