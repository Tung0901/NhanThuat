id: NT-LAW-0055
type: law
status: frozen
version: 0.2.0
title: Chuyển hóa cam kết tái định khung
summary: Tái định khung vấn đề dịch chuyển cam kết mà không cần thay đổi lợi ích vật chất. Cách một việc được diễn giải quyết định mức nỗ lực con người dành cho nó.
primary_domain: tri-nhan
secondary_domains:
- hop-chung
definition: 'Chuyển hóa cam kết tái định khung là quy luật về quan hệ giữa cách diễn giải và mức độ cam kết: thay đổi khung ý nghĩa làm thay đổi lựa chọn nỗ lực dù điều kiện vật chất giữ nguyên.'
conditions:
- Chủ thể đang nắm giữ một cách diễn giải có thể thay thế được.
- Có không gian để tái định nghĩa ý nghĩa mà không thay đổi ràng buộc vật chất.
exceptions:
- Cam kết dựa trên hợp đồng hoặc nghĩa vụ pháp lý không dịch chuyển theo khung.
- Khung mới không có cơ sở thực tế sẽ bị nhận diện là thao túng.
applications:
  change-management:
  - Tái định khung mục tiêu thay vì yêu cầu tăng nỗ lực thuần túy.
  - Kết nối thay đổi với câu chuyện nghề nghiệp của nhân sự.
  negotiation:
  - Giúp đối phương nhìn vấn đề từ khung khác để mở thêm phương án.
  - Chuyển từ tranh luận vị thế sang cùng giải quyết vấn đề chung.
  leadership:
  - Diễn giải lại công việc lặp lại bằng ý nghĩa đóng góp thay vì nghĩa vụ.
risks:
- Tái định khung bị dùng để thao túng lựa chọn của người khác.
- Thay khung liên tục làm xói mòn ổn định ưu tiên.
- Khung mới không được củng cố bằng hành động thực tế sẽ mất hiệu lực.
