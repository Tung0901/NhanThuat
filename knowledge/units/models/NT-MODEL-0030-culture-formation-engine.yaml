id: NT-MODEL-0030
type: model
status: frozen
version: 0.1.0
title: Động cơ Hình thành Văn hóa
summary: Vòng lặp 4 thành phần mô tả tiến trình từ Hành vi Lãnh đạo -> Hệ thống Đãi ngộ -> Biểu trưng Xã hội -> Chuẩn mực Định hình.
primary_domain: hop-chung
secondary_domains:
- tu-than
definition: 'Động cơ Hình thành Văn hóa giải thích cách thức văn hóa được củng cố vững chắc: Hành vi Lãnh đạo, Hệ thống Đãi ngộ, Biểu trưng Xã hội, Chuẩn mực Định hình.'
mechanism:
- Lãnh đạo làm gương bằng hành vi chuẩn mực.
- Hệ thống đãi ngộ gắn kết và điều chỉnh phần thưởng.
- Các biểu trưng văn hóa khắc sâu những câu chuyện cốt lõi.
- Các chuẩn mực dần trở thành phản xạ hành vi tự nhiên.
conditions:
- Thiết kế và chuyển đổi văn hóa tổ chức.
exceptions:
- Không có.
applications:
  culture_transformation:
  - Định hướng cho đội ngũ lãnh đạo trong việc thực thi các sáng kiến chuyển đổi văn hóa.
risks:
- Chỉ tập trung vào Biểu trưng mà phớt lờ vai trò Hành vi của Lãnh đạo.
evidence:
  level: supported
  references:
  - EV-REQ-0019-01
