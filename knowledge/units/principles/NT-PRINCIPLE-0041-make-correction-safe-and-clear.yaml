id: NT-PRINCIPLE-0041
type: principle
status: frozen
version: 0.1.0
title: Làm cho việc sửa chữa an toàn và rõ ràng
summary: Nêu việc sửa chữa theo cách bảo vệ phẩm giá đồng thời không để mơ hồ về chuẩn mực hoặc hành động tiếp theo.
primary_domain: dung-nhan
secondary_domains:
- tri-nhan
- thanh-su
definition: Học hỏi cần việc sửa chữa đủ an toàn để nghe và đủ rõ ràng để hành động.
mechanism:
- Gọi tên khoảng cách quan sát được
- Giữ gìn phẩm giá
- Nêu chuẩn mực kỳ vọng và bước tiếp theo.
conditions:
- Một chuẩn mực bị bỏ lỡ
- Việc tiếp tục học hỏi có ý nghĩa.
exceptions:
- Hành vi sai trái nghiêm trọng có thể cần trách nhiệm giải trình chính thức
- Sự mềm mỏng quá mức có thể che giấu chuẩn mực.
applications:
  coaching:
  - Tách con người khỏi việc sửa chữa đồng thời làm cho việc sửa chữa cụ thể.
  leadership:
  - Xây dựng văn hóa nơi vấn đề có thể được nêu sớm.
risks:
- Mơ hồ
- Tránh né hậu quả khi chúng cần thiết.
evidence:
  level: provisional
