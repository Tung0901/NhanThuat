id: NT-ANTI-PATTERN-0004
type: anti-pattern
status: frozen
version: 0.1.0
title: Human nature excuse
summary: A harmful pattern where claims about human nature are used to excuse coercion, cynicism, low standards, or avoidable harm.
primary_domain: tri-nhan
secondary_domains: [tu-than, hop-chung]
definition: Human Nature knowledge becomes harmful when tendencies are treated as destiny or as permission to manipulate people.
mechanism: [Name a tendency, Treat it as fixed, Justify control, Avoid responsibility.]
conditions: [A person uses behavioral generalization to remove agency, dignity, or ethical constraint.]
exceptions: [Real constraints should still inform design, compassion may require adapting expectations.]
applications: {ethics: [Ask whether a human tendency is being respected or exploited.], leadership: [Use Human Nature to design better conditions, not to excuse harm.]}
risks: [Fatalism, manipulation, learned helplessness.]
