mechanism:
- Liệt kê các yếu tố giá trị trong thương lượng.
- 'Phân loại mức độ chia sẻ: chung, khác biệt bổ trợ, riêng, xung đột.'
- 'Thiết kế chiến lược cho từng vùng: mở rộng, trao đổi, bảo toàn, dàn xếp.'
- Phân bổ giá trị đã tạo theo đóng góp và thỏa thuận.
