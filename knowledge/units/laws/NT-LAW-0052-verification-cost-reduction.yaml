mechanism:
- Mỗi hoạt động hợp tác đòi hỏi một mức xác minh để giảm rủi ro.
- Xác minh toàn bộ ở mọi giao dịch tạo chi phí lớn và làm chậm vận hành.
- Cơ chế bảo đảm đáng tin thay thế một phần nhu cầu xác minh.
- Chi phí phối hợp giảm khi mức bảo đảm được duy trì ổn định.
