content: "### 1. Cấu trúc Ba Trụ cột Điều phối Sự cố\n**Tam Giác Ứng Phó Khủng Hoảng** (`NT-MODEL-2101`)\
  \ cung cấp mô hình phân bổ nguồn lực song song trên ba mặt trận khi xảy ra biến cố tổ chức: (1) *Khoanh\
  \ vùng kỹ thuật/vận hành* để chặn đà lan rộng của thiệt hại, (2) *Truyền thông có kiểm chứng* để duy\
  \ trì sự tin cậy với các bên liên quan, và (3) *Khắc phục căn nguyên* để phục hồi hoạt động bền vững.\n\
  \n### 2. Điều kiện áp dụng & Ngoại lệ\n- **Điều kiện áp dụng:**\n  - Sự cố vận hành, gián đoạn dịch\
  \ vụ, khủng hoảng uy tín hoặc vi phạm tuân thủ có tác động đồng thời lên cả hệ thống nội bộ lẫn khách\
  \ hàng/đối tác bên ngoài.\n  - Tổ chức có khả năng phân tách vai trò giữa nhóm xử lý kỹ thuật trực tiếp\
  \ và nhóm điều phối thông tin.\n- **Ngoại lệ:**\n  - Các lỗi kỹ thuật nội bộ nhỏ được xử lý tự động\
  \ trước khi ảnh hưởng đến người dùng cuối; việc kích hoạt truyền thông diện rộng trong trường hợp này\
  \ là không cần thiết.\n  - Các cuộc điều tra pháp lý hoặc an ninh mạng đang trong giai đoạn bảo mật\
  \ theo yêu cầu của cơ quan chức năng (cần giới hạn phạm vi công bố thông tin).\n\n### 3. Mức bất định\
  \ & Rủi ro diễn giải sai\n- **Mức bất định:** Trung bình. Trong giai đoạn đầu của sự cố, dữ liệu nguyên\
  \ nhân gốc rễ thường chưa đầy đủ; do đó trụ cột truyền thông phải nêu rõ những gì đã xác minh và những\
  \ gì đang tiếp tục kiểm tra thay vì cam kết tuyệt đối quá sớm.\n- **Rủi ro diễn giải sai:**\n  - Xem\
  \ truyền thông khủng hoảng là việc che giấu sự cố hoặc hứa hẹn vượt khả năng khắc phục thực tế, dẫn\
  \ đến mất uy tín kép khi sự thật được phơi bày.\n  - Dồn toàn bộ nhân sự kỹ thuật sang trả lời báo cáo\
  \ khiến tiến độ khoanh vùng và sửa lỗi bị đình trệ.\n\n### 4. Nguồn truy nguyên & Đối chiếu Đông - Tây\n\
  - **Nguồn truy nguyên:** Tổng hợp nghiên cứu quản trị khủng hoảng của Bundy et al. (2017) và Lý thuyết\
  \ Truyền thông Khủng hoảng theo Tình huống (SCCT) của W. Timothy Coombs (2014).\n- **Đối chiếu cổ điển\
  \ `[Nguồn cổ điển]`:** Tôn Tử Binh Pháp và tư tưởng trị thủy cổ đại đều nhấn mạnh nguyên tắc vừa đắp\
  \ đê ngăn dòng chảy tràn lan (khoanh vùng), vừa ổn định lòng người (truyền thông), vừa khơi thông dòng\
  \ chính (khắc phục gốc rễ).\n"
