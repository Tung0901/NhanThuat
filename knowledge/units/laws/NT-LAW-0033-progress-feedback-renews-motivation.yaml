id: NT-LAW-0033
type: law
status: frozen
version: 0.1.0
title: Phản hồi về tiến độ tái tạo động lực
summary: Bằng chứng rõ ràng về sự tiến bộ có ý nghĩa sẽ tiếp thêm năng lượng cho nỗ lực không ngừng, trong khi công việc không được đo lường hoặc không được ghi nhận sẽ đẩy nhanh sự mất động lực và kiệt sức.
primary_domain: tu-than
secondary_domains:
- thanh-su
- tri-nhan
definition: Sự tiến triển cảm nhận được hướng tới một cột mốc giá trị đóng vai trò như chất xúc tác tâm lý, tái tạo năng lượng và củng cố sự gắn kết với nhiệm vụ.
mechanism:
- Quan sát thành quả
- Cảm nhận tính hiệu quả
- Tái tạo năng lượng
- Tái cam kết nỗ lực.
conditions:
- Công việc được cấu trúc thành các bước có ý nghĩa với chu trình phản hồi rõ ràng.
exceptions:
- Các chỉ số tiến độ sai lệch hoặc giả tạo sẽ tạo ra sự hoài nghi thay vì động lực thực sự.
applications:
  project-management:
  - Chia nhỏ các sáng kiến dài hạn thành những cột mốc định kỳ có thể quan sát được.
  execution:
  - Làm cho mức độ hoàn thành công việc hiển thị rõ ràng đối với các đội ngũ vận hành.
risks:
- Tôn vinh hoạt động bề nổi thay vì tiến độ thực chất
- Thao túng số liệu đo lường.
