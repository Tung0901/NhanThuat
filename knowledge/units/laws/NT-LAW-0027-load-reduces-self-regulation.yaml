id: NT-LAW-0027
type: law
status: frozen
version: 0.1.0
title: Quá tải làm suy giảm khả năng tự điều chỉnh
summary: Khi tải trọng nhận thức, cảm xúc hoặc thể chất gia tăng, con người sẽ giảm bớt khả năng kiên nhẫn, phán đoán, học hỏi và đưa ra lựa chọn có chủ đích.
primary_domain: tri-nhan
secondary_domains:
- tu-than
- thanh-su
definition: Khả năng tự điều chỉnh của con người phụ thuộc vào dung lượng sẵn có, vì vậy sự quá tải khiến hành vi phản ứng mang tính bộc phát dễ xảy ra hơn ngay cả khi có ý định tốt.
mechanism:
- Tích lũy tải trọng
- Suy giảm dung lượng
- Đơn giản hóa các lựa chọn
- Phản ứng mang tính bộc phát hoặc bảo toàn năng lượng.
conditions:
- Các nhu cầu vượt quá khả năng chú ý sẵn có
- năng lượng
- hoặc dung lượng xử lý cảm xúc.
exceptions:
- Các thói quen đơn giản vẫn có thể duy trì dưới áp lực tải trọng
- các giai đoạn tăng tải ngắn hạn có thể hấp thụ được nếu có thời gian phục hồi.
applications:
  operations:
  - Giảm bớt tải trọng công việc trước khi kỳ vọng khả năng phán đoán tốt hơn.
  learning:
  - Đào tạo trong các điều kiện kiểm soát được trước khi gia tăng áp lực.
risks:
- Bao biện cho những tổn hại có thể phòng tránh được
- Bỏ qua các thiếu sót về kỹ năng hoặc phẩm chất.
