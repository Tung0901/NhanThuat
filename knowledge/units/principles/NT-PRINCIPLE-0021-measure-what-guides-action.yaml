id: NT-PRINCIPLE-0021
type: principle
status: frozen
version: 0.1.0
title: Đo lường những gì dẫn dắt hành động
summary: Chọn thước đo giúp con người quyết định làm gì tiếp theo, không chỉ những thước đo mô tả những gì đã xảy ra.
primary_domain: thanh-su
secondary_domains:
- dung-nhan
- hop-chung
definition: Thước đo hữu ích định hướng sự chú ý đến các quyết định vẫn có thể thay đổi kết quả.
mechanism:
- Xác định nhu cầu ra quyết định.
- Chọn thước đo dẫn dắt hoặc chẩn đoán.
- Rà soát nó tại nơi có thể hành động.
conditions:
- Con người có thể hành động theo thước đo.
- Thước đo đủ đáng tin cậy để định hướng sự chú ý.
exceptions:
- Thước đo kết quả vẫn cần thiết cho trách nhiệm giải trình.
- Một số công việc cần rà soát định tính.
applications:
  operations:
  - Theo dõi các điểm nghẽn luồng trước khi lỡ hạn cuối.
  management:
  - Dùng thước đo để dẫn dắt kèm cặp, không chỉ chấm điểm.
risks:
- Tạo ra chỉ số trang trí.
- Phớt lờ phán đoán không được đo lường.
