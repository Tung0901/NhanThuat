id: NT-PRINCIPLE-0002
type: principle
status: frozen
version: 0.1.0
title: Khớp vai trò, năng lực và quyền hạn
summary: Giao việc cho người chỉ khi kết quả kỳ vọng, năng lực cần thiết và quyền ra quyết định được căn chỉnh với nhau.
primary_domain: dung-nhan
secondary_domains:
- hop-chung
- thanh-su
definition: Một vai trò trở nên khả thi khi người đảm nhiệm có đủ năng lực để thực hiện và đủ quyền hạn để đưa ra các quyết định mà vai trò đòi hỏi.
mechanism:
- Xác định kết quả cần đạt từ vai trò.
- Xác định năng lực và khả năng phán đoán cần thiết.
- Trao quyền hạn và nguồn lực tương xứng với trách nhiệm kỳ vọng.
conditions:
- Vai trò có kết quả được định nghĩa rõ.
- Năng lực và quyền hạn có thể được đánh giá trước hoặc trong khi giao việc.
exceptions:
- Nhiệm vụ phát triển có thể cố ý kéo dãn năng lực kèm hỗ trợ.
- Ràng buộc tuân thủ hoặc an toàn có thể hạn chế quyền hạn dù có năng lực.
applications:
  management:
  - Kiểm tra độ phù hợp của vai trò trước khi đổ lỗi cho lỗi thực thi.
  hiring:
  - Đánh giá liệu ứng viên có thể hành động với quyền tự chủ mà vai trò yêu cầu hay không.
risks:
- Trao trách nhiệm mà không có quyền hạn.
- Trao quyền hạn cho người thiếu năng lực hoặc thiếu hỗ trợ.
