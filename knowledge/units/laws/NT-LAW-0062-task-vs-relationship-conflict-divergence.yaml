id: NT-LAW-0062
type: law
status: frozen
version: 0.1.0
title: Task vs Relationship Conflict Divergence
summary: Task conflict improves decision quality, whereas relationship conflict degrades
  psychological safety and performance.
primary_domain: hop-chung
secondary_domains:
- tri-nhan
definition: Cognitive task disagreement improves choice quality by exposing flawed
  assumptions.
conditions:
- Team decision-making and strategic debates.
exceptions:
- High-stress crisis environments.
applications:
  team_governance:
  - Establish ground rules that focus debate on data and hypotheses.
risks:
- Allowing relationship conflict to masquerade as task debate.
evidence:
  level: supported
  references:
  - EV-REQ-0011-01
