id: NT-MODEL-0020
type: model
status: frozen
version: 0.2.0
title: Tuyến Cầu Nối Sức Ảnh Hưởng
summary: 'Mô hình thiết kế tuyến đường ảnh hưởng qua các trạm trung gian: từ người khởi xướng đến người ra quyết định cuối. Tuyến cầu nối giúp chọn đúng người cần thuyết phục ở từng chặng.'
primary_domain: tri-nhan
secondary_domains:
- dung-nhan
definition: Tuyến Cầu Nối Sức Ảnh Hưởng là khung phân tích mạng lưới ảnh hưởng trong tổ chức thành chuỗi các trạm trung gian có vai trò khác nhau, từ người đề xuất, người gây ảnh hưởng, người phê duyệt đến người thực thi.
conditions:
- Tổ chức có cấu trúc quyết định qua nhiều tầng.
- Thông tin và đề xuất không thể đi thẳng tới người quyết định.
exceptions:
- Tổ chức phẳng cho phép tiếp cận trực tiếp người ra quyết định.
- Vấn đề khẩn cấp cần leo thang tắt qua các tầng.
applications:
  influence:
  - Xác định toàn bộ tuyến cần đi qua trước khi vận động một đề xuất lớn.
  - Chuẩn bị thông tin phù hợp cho mối quan tâm của từng trạm.
  leadership:
  - Duy trì quan hệ với các trạm ảnh hưởng quan trọng trước khi cần đến.
  sales:
  - Phân tích chuỗi quyết định mua hàng và xây dựng chiến lược cho từng vai trò.
risks:
- Bỏ qua trạm trung gian quan trọng khiến đề xuất bị chặn muộn.
- Lệch hướng thành vận động hành lang thiếu minh bạch.
- Chỉ tập trung vào người quyết định mà bỏ qua người thực thi.
