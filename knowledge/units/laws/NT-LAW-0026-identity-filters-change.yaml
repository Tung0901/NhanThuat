id: NT-LAW-0026
type: law
status: frozen
version: 0.1.0
title: Identity filters change
summary: People judge change partly by whether it threatens or preserves who they believe they are and where they belong.
primary_domain: tri-nhan
secondary_domains: [tu-than, hop-chung]
definition: Change is easier to consider when it can be integrated into a person's identity, role, and belonging rather than experienced as self-erasure.
mechanism: [Compare change to self-image, Protect belonging, Accept or reject interpretation.]
conditions: [A request affects role, status, values, competence, or group membership.]
exceptions: [Urgent survival pressure may override identity concerns, Mature reflection can loosen identity defense.]
applications: {change: [Frame change as continuity with values where truthful.], coaching: [Protect dignity while inviting a new behavior.]}
risks: [Manipulating identity, Preserving harmful self-concepts.]
evidence: {level: provisional, references: []}
relations: {supports: [NT-PRINCIPLE-0047, NT-PRINCIPLE-0048, NT-MODEL-0002], conflicts_with: [], depends_on: [NT-LAW-0014], applies_to: []}
tags: [identity, change, belonging]
