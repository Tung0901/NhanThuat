id: NT-LAW-0058
type: law
status: frozen
version: 0.2.0
title: Kiến tạo Giá trị Tích hợp
summary: Giá trị có thể được mở rộng trước khi chia. Khai thác khác biệt về ưu tiên và nguồn lực tạo ra miếng bánh lớn hơn cho cả hai bên.
primary_domain: thanh-su
secondary_domains:
- tri-nhan
definition: 'Kiến tạo giá trị tích hợp là quy luật về khả năng mở rộng tổng giá trị trong đàm phán: khác biệt giữa các bên là nguyên liệu để tạo phương án cùng có lợi trước khi phân chia.'
conditions:
- Các bên có ưu tiên hoặc nguồn lực khác nhau.
- Có đủ tin cậy để chia sẻ thông tin về lợi ích và ưu tiên.
exceptions:
- Khi nguồn lực cố định và ưu tiên đồng nhất, thương lượng mang tính phân chia.
- Một bên cố tình phá giá trị chung để giành phần lớn hơn.
applications:
  negotiation:
  - Thiết kế gói phương án đa tiêu chí để khai thác khác biệt ưu tiên.
  - Tách vấn đề phân chia khỏi vấn đề tạo giá trị trong tiến trình đàm phán.
  partnership:
  - Xây quan hệ đối tác dựa trên bổ trợ thay vì cạnh tranh đơn thuần.
  conflict-resolution:
  - Tìm vùng lợi ích chung trước khi giải quyết các điểm chia rẽ.
risks:
- Chia sẻ thông tin lợi ích trong quan hệ thiếu tin cậy.
- Tối ưu tổng giá trị nhưng phân bổ bất công gây xói mòn quan hệ.
- Nhầm nhượng bộ một chiều là kiến tạo giá trị.
evidence:
