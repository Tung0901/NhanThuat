id: NT-PRINCIPLE-0011
type: principle
status: frozen
version: 0.1.0
title: Đưa phản hồi sát với hành vi
summary: Truyền đạt phản hồi đủ gần với hành vi quan sát được để người nhận có thể nhớ, hiểu và áp dụng nó.
primary_domain: dung-nhan
secondary_domains:
- tu-than
- thanh-su
definition: Phản hồi trở nên hữu dụng hơn khi nó đến trong lúc hành động, bối cảnh và cơ hội cải thiện tiếp theo vẫn còn gần.
mechanism:
- Quan sát hành vi.
- Nêu khoảng cách sai lệch một cách kịp thời.
- Kết nối việc sửa chữa với hành động tiếp theo.
conditions:
- Người nhận có thể hành động theo phản hồi.
- Phản hồi có thể được đưa ra một cách tôn trọng.
exceptions:
- Cảm xúc nóng nảy có thể đòi hỏi tạm dừng.
- Vấn đề phức tạp có thể cần rà soát sâu hơn.
applications:
  coaching:
  - Sửa chữa lần lặp tiếp theo, không chỉ lỗi trong quá khứ.
  management:
  - Dùng quan sát kịp thời thay vì bản tổng kết năm mơ hồ.
risks:
- Phản ứng bốc đồng.
- Đưa phản hồi mà không có bối cảnh.
