id: NT-PRINCIPLE-0056
type: principle
status: frozen
version: 0.1.0
title: Make progress visible early and often
summary: Structure long initiatives into observable intermediate milestones so teams experience frequent, tangible confirmation of achievement.
primary_domain: tu-than
secondary_domains: [thanh-su, tri-nhan]
definition: Regular visibility into incremental progress maintains momentum and prevents the demotivation caused by long periods of unacknowledged effort.
mechanism: [Decompose long goal, Create short-horizon feedback, Celebrate milestone completion, Renew effort energy.]
conditions: [Projects span extended time horizons or contain high ambiguity.]
exceptions: [Over-frequent reporting overhead can consume more energy than it generates.]
applications: {project-design: [Design bi-weekly incremental deliverables.], management: [Acknowledge operational wins promptly.]}
risks: [Tracking activity volume rather than genuine progress.]
evidence: {level: provisional, references: []}
relations: {supports: [], conflicts_with: [], depends_on: [NT-LAW-0033], applies_to: []}
tags: [motivation, principle, progress, momentum]
