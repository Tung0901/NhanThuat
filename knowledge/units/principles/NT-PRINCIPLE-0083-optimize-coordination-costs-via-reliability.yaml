mechanism:
- Nhận diện các điểm phối hợp tốn kém do phải kiểm tra hoặc xử lý sai sót.
- Đo lường chi phí thực tế của các điểm thiếu tin cậy.
- 'Đầu tư vào cải thiện độ ổn định: tiêu chuẩn, tự động hóa, đào tạo, giao diện rõ ràng.'
- Theo dõi mức giảm chi phí phối hợp sau đầu tư.
