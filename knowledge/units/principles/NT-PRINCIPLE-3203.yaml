id: NT-PRINCIPLE-3203
type: principle
title: Thiết kế môi trường cho việc hình thành thói quen
summary: Điều chỉnh không gian vật lý hoặc kỹ thuật số để khiến hành vi tốt trở nên rõ ràng và dễ thực hiện, còn hành vi xấu trở nên vô hình và khó thực hiện.
primary_domain: tri-nhan
domain_area: NT-DA-0028
definition: Cách tiếp cận kiến trúc đối với việc hình thành thói quen, dựa vào việc thay đổi bối cảnh bên ngoài thay vì dựa vào ý chí bên trong.
mechanism:
- Phân tích bố cục vật lý/kỹ thuật số.
- Giảm ma sát (khoảng cách, số bước, khả năng nhìn thấy) cho các thói quen mong muốn.
- Tăng ma sát cho các thói quen không mong muốn.
- Ý chí được bảo toàn vì con đường mặc định dẫn tới hành vi đúng.
conditions:
- Các không gian nằm trong tầm kiểm soát trực tiếp của người dùng hoặc người thiết kế.
exceptions:
- Các bối cảnh du cư hoặc biến động cao, nơi môi trường không thể ổn định được.
applications:
  office_design:
  - Đặt đồ ăn vặt lành mạnh ngang tầm mắt và giấu đồ ăn không lành mạnh trong hộp đục ở phòng nghỉ.
risks:
- Tối ưu hóa quá mức một không gian cho một quy trình cụ thể, khiến nó trở nên khó khăn cho sự cộng tác hoặc thay đổi.
evidence:
  level: strong
  references:
  - Clear, J. (2018). 'Atomic Habits'. Avery.
