mechanism:
- Xác định miền trách nhiệm và các loại quyết định thuộc miền đó.
- Nêu rõ tiêu chuẩn thành công và giới hạn không được vượt.
- Trao quyền quyết định trong miền kèm nguồn lực tương ứng.
- Đánh giá theo kết quả miền trách nhiệm, can thiệp khi vượt ranh giới.
