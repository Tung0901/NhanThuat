mechanism:
- Phân tích yêu cầu nhận thức của vấn đề cần giải quyết.
- Xác định các kiểu tư duy cần có trong nhóm.
- Chọn và bố trí thành viên theo phổ nhận thức mục tiêu.
- Thiết lập cơ chế tranh luận có cấu trúc để tích hợp khác biệt.
