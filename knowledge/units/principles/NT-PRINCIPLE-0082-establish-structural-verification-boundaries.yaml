created_at: '2026-07-22'
updated_at: '2026-09-14'
mechanism:
- Phân loại công việc theo mức rủi ro và mức độ khó đảo ngược.
- 'Gán mức xác minh tương ứng cho từng loại: tự kiểm, kiểm chéo, kiểm độc lập.'
- Xác định vai trò chịu trách nhiệm cho từng cấp xác minh.
- Rà soát định kỳ xem mức xác minh còn tương xứng với rủi ro hiện tại.
