id: NT-MODEL-0003
type: model
status: frozen
version: 0.1.0
title: Adaptation cycle
summary: A pattern model showing how repeated context, behavior, consequence, and expectation form stable adaptation.
primary_domain: tri-nhan
secondary_domains: [tu-than, thanh-su]
definition: Adaptation stabilizes when context cues behavior, behavior receives consequence, and consequence updates expectation for the next context.
mechanism: [Context cue, Behavior, Consequence, Expectation, Repetition.]
conditions: [A pattern repeats, consequences are noticed, alternatives are available or constrained.]
exceptions: [Hidden consequences may not train behavior, strong values can resist repeated pressure.]
applications: {culture: [Map what the environment repeatedly teaches.], learning: [Use repeated safe correction to build new expectations.]}
risks: [Conditioning without consent, mistaking adaptation for agreement.]
