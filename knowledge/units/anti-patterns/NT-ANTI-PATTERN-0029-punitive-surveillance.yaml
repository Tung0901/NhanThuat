id: NT-ANTI-PATTERN-0029
type: anti-pattern
status: frozen
version: 0.1.0
title: Giám sát mang tính trừng phạt
summary: Đơn vị tri thức cấu trúc về Giám sát mang tính trừng phạt trong quản trị tổ chức.
primary_domain: dung-nhan
secondary_domains:
- tri-nhan
definition: Định nghĩa chính thức về Giám sát mang tính trừng phạt (Punitive Surveillance) trong kiến trúc Nhân Thuật, phản ánh mô hình quản lý theo dõi chặt chẽ nhằm mục đích bắt lỗi và trừng phạt thay vì hỗ trợ phát triển.
conditions:
- Bối cảnh quản trị vận hành tổ chức.
exceptions:
- Trường hợp ghi đè trong khủng hoảng khẩn cấp.
applications:
  governance:
  - Áp dụng nhận diện Giám sát mang tính trừng phạt vào quy trình làm việc của tổ chức.
risks:
- Áp dụng sai hoặc không kiểm soát được Giám sát mang tính trừng phạt dẫn đến hiệu suất kém và triệt tiêu động lực làm việc.
