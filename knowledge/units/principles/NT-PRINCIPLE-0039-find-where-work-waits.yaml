id: NT-PRINCIPLE-0039
type: principle
status: frozen
version: 0.1.0
title: Find where work waits
summary: Locate the place where work accumulates, waits, or returns, because load
  reveals the real bottleneck.
primary_domain: thanh-su
secondary_domains:
- hop-chung
- tri-nhan
definition: Bottlenecks become visible under load through queues, rework, waiting,
  escalation, and repeated dependency on the same scarce resource.
mechanism:
- Trace waiting points
- Count rework loops
- Identify the constrained role or decision.
conditions:
- Execution is slowing
- More effort is not improving throughput.
exceptions:
- Temporary surges may not indicate structural bottlenecks
- Some waiting is intentional quality control.
applications:
  operations:
  - Map queues before adding more work.
  management:
  - Protect constrained specialists from low-value interruptions.
risks:
- Blaming the bottleneck owner
- Optimizing one point while moving the bottleneck elsewhere.
evidence:
  level: provisional
  references: []
relations:
  supports: []
  conflicts_with: []
  depends_on:
  - NT-LAW-0022
  applies_to: []
tags:
- bottlenecks
- load
- execution
