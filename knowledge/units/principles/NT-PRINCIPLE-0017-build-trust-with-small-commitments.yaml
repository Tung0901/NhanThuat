id: NT-PRINCIPLE-0017
type: principle
status: frozen
version: 0.1.0
title: Build trust with small commitments
summary: Use visible, repeated, kept commitments to build or rebuild trust before
  relying on larger dependency.
primary_domain: hop-chung
secondary_domains:
- dung-nhan
- thanh-su
definition: Small commitments create evidence of reliability that can support larger
  cooperation later.
mechanism:
- Make a specific commitment
- Follow through visibly
- Let confidence accumulate.
conditions:
- People will interact again
- Reliability is uncertain or damaged.
exceptions:
- Some relationships require immediate high-stakes trust
- Severe breaches may need repair beyond small promises.
applications:
  teamwork:
  - Start rebuilding reliability with short-cycle commitments.
  leadership:
  - Make commitments trackable.
risks:
- Using small promises to hide large unreliability
- Over-promising to look trustworthy.
evidence:
  level: provisional
  references: []
relations:
  supports: []
  conflicts_with: []
  depends_on:
  - NT-LAW-0011
  applies_to: []
tags:
