mechanism:
- Nhận diện các điểm quyết định đang bị chi phối bởi thứ bậc phát biểu.
- Thiết kế trình tự và phương thức thảo luận giảm áp lực chức danh.
- Đánh giá đóng góp theo chất lượng luận cứ và kết quả.
- Ghi nhận công khai đóng góp giá trị không phân biệt cấp bậc.
