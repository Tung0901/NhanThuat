title: Giảm thiểu quyền lực vai trò
summary: Giảm thiểu quyền lực vai trò là một đơn vị tri thức cấu trúc trong kho tri thức Nhân Thuật.
primary_domain: dung-nhan
secondary_domains:
- tri-nhan
definition: Định nghĩa chính thức của Nguyên tắc Giảm thiểu quyền lực vai trò trong kiến trúc Nhân Thuật.
conditions:
- Các bối cảnh quản trị vận hành.
exceptions:
- Các tình huống khẩn cấp yêu cầu vượt quyền ưu tiên.
applications:
  governance:
  - Áp dụng Nguyên tắc Giảm thiểu quyền lực vai trò vào các quy trình vận hành của tổ chức.
risks:
- Áp dụng sai Nguyên tắc Giảm thiểu quyền lực vai trò dẫn đến hiệu suất dưới mức tối ưu.
