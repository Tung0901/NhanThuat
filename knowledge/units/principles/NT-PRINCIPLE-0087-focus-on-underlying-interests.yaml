id: NT-PRINCIPLE-0087
type: principle
status: frozen
version: 0.2.0
title: Tập trung vào lợi ích nền tảng
summary: Tập trung vào nhu cầu thật đằng sau lập trường thay vì tranh luận trên yêu cầu bề mặt. Lợi ích nền tảng mở ra không gian cho phương án sáng tạo.
primary_domain: thanh-su
secondary_domains:
- tri-nhan
definition: 'Tập trung vào lợi ích nền tảng là nguyên tắc đàm phán và giải quyết xung đột: khai vấn các nhu cầu, mối quan tâm và lo ngại thật sự phía sau lập trường được tuyên bố để thiết kế phương án đáp ứng cả hai bên.'
conditions:
- Các bên sẵn sàng chia sẻ thông tin về nhu cầu thật.
- Tồn tại khoảng trống giữa lập trường và lợi ích.
exceptions:
- Lợi ích cốt lõi không thể thương lượng thì đàm phán chỉ xoay quanh hình thức thực hiện.
- Đối phương chủ động che giấu lợi ích thật để giành lợi thế chiến lược.
applications:
  negotiation:
  - Bắt đầu bằng khai vấn nhu cầu thay vì phản bác yêu cầu.
  - Tách người và vấn đề khi thảo luận các điểm gai góc.
  conflict-resolution:
  - Chuyển câu hỏi từ ai đúng sang nhu cầu nào chưa được đáp ứng.
  - Tìm lợi ích chung trước khi xử lý các điểm chia rẽ.
  sales:
  - Tìm hiểu mục tiêu kinh doanh thật của khách hàng thay vì đối đáp từng yêu cầu kỹ thuật.
risks:
- Suy đoán sai lợi ích thật dẫn tới đề xuất lệch hướng.
- Khai vấn nhưng không lắng nghe thực chất.
- Bị đối phương khai thác thông tin lợi ích để gây sức ép.
evidence:
  level: supported
  references:
  - EV-REQ-0001-01
