id: NT-PRINCIPLE-0027
type: principle
status: frozen
version: 0.1.0
title: Biến các quyết định lặp lại thành mặc định
summary: Nếu một quyết định tốt lặp lại thường xuyên, hãy biến nó thành lộ trình mặc định để sự chú ý có thể chuyển sang phán đoán giá trị cao hơn.
primary_domain: tu-than
secondary_domains:
- thanh-su
- dung-nhan
definition: Mặc định tiết kiệm nỗ lực ra quyết định bằng cách làm cho hành vi tốt lặp lại trở nên dễ thực hiện hơn.
mechanism:
- Tìm quyết định lặp lại.
- Xác định mặc định ưa thích.
- Rà soát các trường hợp ngoại lệ thay vì từng lần xảy ra.
conditions:
- Quyết định lặp lại.
- Tồn tại một mặc định an toàn.
exceptions:
- Tình huống mới đòi hỏi phán đoán mới mẻ.
- Mặc định xấu có thể khuếch đại tác hại.
applications:
  operations:
  - Tạo mặc định cho các phê duyệt thông thường.
  self-management:
  - Cam kết trước các thói quen cho hành vi quan trọng.
risks:
- Tự động hóa các giả định lỗi thời.
- Gỡ bỏ sự cân nhắc quyết đoán cần thiết.
