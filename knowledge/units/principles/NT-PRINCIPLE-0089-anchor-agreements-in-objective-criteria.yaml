mechanism:
- Xác định các tiêu chí khách quan liên quan tới vấn đề đàm phán.
- Thống nhất trước về bộ tiêu chí và cách áp dụng.
- Đưa đề xuất gắn với tiêu chí thay vì chỉ nêu mong muốn.
- Xử lý bất đồng bằng lập luận trên tiêu chí, không bằng sức ép.
