title: Hiệu chỉnh theo năng lực đã chứng minh
summary: Hiệu chỉnh theo năng lực đã chứng minh là một đơn vị tri thức cấu trúc trong kho tri thức Nhân Thuật.
primary_domain: dung-nhan
secondary_domains:
- tri-nhan
definition: Định nghĩa chính thức của Nguyên tắc Hiệu chỉnh theo năng lực đã chứng minh trong kiến trúc Nhân Thuật.
conditions:
- Các bối cảnh quản trị vận hành.
exceptions:
- Các tình huống khẩn cấp yêu cầu vượt quyền ưu tiên.
applications:
  governance:
  - Áp dụng Nguyên tắc Hiệu chỉnh theo năng lực đã chứng minh vào các quy trình vận hành của tổ chức.
risks:
- Áp dụng sai Nguyên tắc Hiệu chỉnh theo năng lực đã chứng minh dẫn đến hiệu suất dưới mức tối ưu.
