id: NT-ANTI-PATTERN-0016
type: anti-pattern
status: frozen
version: 0.1.0
title: Ngụy biện Trực giác
summary: Đơn vị kiến thức cấu trúc về Ngụy biện Trực giác (Intuition Fallacy) trong ra quyết định quản trị.
primary_domain: tri-nhan
secondary_domains:
- dung-nhan
definition: Định nghĩa chính thức về Ngụy biện Trực giác trong kiến trúc Nhân Thuật, chỉ hiện tượng phụ thuộc quá mức vào cảm tính cá nhân thay vì dựa trên dữ liệu, bằng chứng và phân tích hệ thống.
conditions:
- Bối cảnh quản trị vận hành tổ chức.
exceptions:
- Trường hợp ghi đè trong khủng hoảng khẩn cấp.
applications:
  governance:
  - Áp dụng nhận diện Ngụy biện Trực giác vào quy trình làm việc tổ chức.
risks:
- Áp dụng sai Ngụy biện Trực giác dẫn đến hiệu suất không đạt tối ưu.
