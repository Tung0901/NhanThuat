id: NT-PRINCIPLE-0102
type: principle
status: frozen
version: 0.2.0
title: Giới hạn khối lượng công việc đang triển khai
summary: Áp đặt giới hạn cứng về số dự án đang hoạt động của mỗi đội ngũ để tối đa hóa tốc độ hoàn thành.
primary_domain: dung-nhan
secondary_domains:
- thanh-su
definition: Ngừng bắt đầu việc mới, hãy hoàn thành việc đã bắt đầu. Áp đặt giới hạn cứng về số nhiệm vụ đang xử lý của mỗi cá nhân và đội ngũ.
conditions:
- Quản lý dự án vận hành.
exceptions:
- Các giai đoạn nghiên cứu thăm dò.
applications:
  kanban:
  - Đặt giới hạn WIP tối đa là 2 ticket đang xử lý cho mỗi lập trình viên.
risks:
- Chặn công việc một cách giả tạo khi các phụ thuộc đang bị đình trệ.
evidence:
  level: supported
  references:
  - EV-REQ-0017-01
