id: NT-ANTI-PATTERN-0006
type: anti-pattern
status: frozen
version: 0.1.0
title: Quản trị bằng sự sợ hãi
summary: Lạm dụng sự đe dọa, hạ thấp danh dự hoặc tạo tâm lý bất an để ép buộc hiệu suất, tạo ra sự tuân thủ ngắn hạn nhưng gây ra kiệt sức, giấu giếm thông tin và thất thoát nhân tài về lâu dài.
primary_domain: tu-than
secondary_domains:
- tri-nhan
- hop-chung
definition: Sử dụng quá mức các tín hiệu đe dọa làm đòn bẩy quản lý chính, làm triệt tiêu sự trung thực, tính sáng tạo và cam kết đích thực.
mechanism:
- Phát ra các tín hiệu đe dọa
- Kích hoạt sự tuân thủ mang tính phòng thủ
- Che giấu các khuyết điểm trong vận hành
- Làm xói mòn niềm tin và tỷ lệ giữ chân nhân sự dài hạn.
conditions:
- Lãnh đạo sử dụng quyền lực trừng phạt để thúc đẩy năng suất hàng ngày.
exceptions:
- Thực thi các ranh giới bắt buộc về đạo đức,
- an toàn,
- hoặc pháp lý yêu cầu phải có cảnh báo hậu quả nghiêm khắc.
applications:
  leadership-review:
  - Nhận diện các hành vi lãnh đạo dựa trên sự sợ hãi và thay thế bằng tiêu chuẩn cao đi kèm sự hỗ trợ.
  culture-audit:
  - Đo lường xem các thành viên trong đội ngũ có cảm thấy an toàn khi báo cáo tin xấu hay không.
risks:
- Nhầm lẫn giữa trách nhiệm giải trình cần thiết với phong cách quản trị bằng sự sợ hãi.
