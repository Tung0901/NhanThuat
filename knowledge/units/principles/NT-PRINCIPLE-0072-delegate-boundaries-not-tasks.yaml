id: NT-PRINCIPLE-0072
type: principle
status: frozen
version: 0.1.0
title: Ủy quyền ranh giới thay vì nhiệm vụ
summary: Ủy quyền ranh giới thay vì nhiệm vụ là một đơn vị tri thức cấu trúc trong kho tri thức Nhân Thuật.
primary_domain: dung-nhan
secondary_domains:
- tri-nhan
definition: Định nghĩa chính thức của Nguyên tắc Ủy quyền ranh giới thay vì nhiệm vụ trong kiến trúc Nhân Thuật.
conditions:
- Các bối cảnh quản trị vận hành.
exceptions:
- Các tình huống khẩn cấp yêu cầu vượt quyền ưu tiên.
applications:
  governance:
  - Áp dụng Nguyên tắc Ủy quyền ranh giới thay vì nhiệm vụ vào các quy trình vận hành của tổ chức.
risks:
- Áp dụng sai Nguyên tắc Ủy quyền ranh giới thay vì nhiệm vụ dẫn đến hiệu suất dưới mức tối ưu.
