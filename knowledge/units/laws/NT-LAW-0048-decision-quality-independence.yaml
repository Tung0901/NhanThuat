mechanism:
- Quyết định được đưa ra trong điều kiện bất định với thông tin hữu hạn.
- Kết quả phụ thuộc vào cả quy trình quyết định lẫn các yếu tố ngẫu nhiên ngoài tầm kiểm soát.
- Đánh giá theo kết quả đơn thuần trộn lẫn chất lượng quy trình với may mắn.
- Tổ chức học sai bài học và lặp lại lỗi khi chỉ nhìn kết quả.
