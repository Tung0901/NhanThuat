id: NT-PRINCIPLE-0054
type: principle
status: frozen
version: 0.1.0
title: Avoid using threat for creative work
summary: Do not rely on fear, pressure, or insecurity to motivate tasks that require innovation, problem solving, or open collaboration.
primary_domain: tu-than
secondary_domains: [tri-nhan, hop-chung]
definition: Threat narrows cognitive focus to self-defense, blocking the cognitive flexibility necessary for creative problem solving.
mechanism: [Remove threat signals, Establish safety for experimentation, Enable exploratory focus, Generate innovative solutions.]
conditions: [Work involves complex problem-solving, novel design, or systemic risk analysis.]
exceptions: [Enforcing ethical boundaries or zero-tolerance safety rules may require firm consequence warnings.]
applications: {leadership: [Distinguish high standards from fear-inducing pressure.], culture: [Protect psychological safety during exploratory phases.]}
risks: [Lowering performance standards under the pretense of removing pressure.]
evidence: {level: provisional, references: []}
relations: {supports: [], conflicts_with: [], depends_on: [NT-LAW-0031, NT-LAW-0025], applies_to: []}
tags: [motivation, principle, threat, creativity, safety]
