id: NT-LAW-0067
type: law
status: frozen
version: 0.2.0
title: Tính tất yếu của sự đánh đổi chiến lược
summary: Để đạt được hiệu suất vượt trội ở một khía cạnh đòi hỏi phải chấp nhận sự kém hiệu quả một cách có chủ đích ở một khía cạnh khác.
primary_domain: thanh-su
secondary_domains:
- tri-nhan
definition: Sự đánh đổi là cốt lõi của chiến lược. Định vị chiến lược vượt trội đòi hỏi phải quyết định rõ ràng những gì không cần tối ưu hóa.
conditions:
- Định vị cạnh tranh và các lựa chọn chiến lược sản phẩm.
exceptions:
- Loại bỏ lãng phí vận hành trước khi đạt đến giới hạn hiệu quả.
applications:
  positioning:
  - Xác định rõ ràng các mục tiêu không ưu tiên (non-goals) cho các đợt phát hành sản phẩm.
risks:
- Cố gắng trở thành mọi thứ đối với mọi khách hàng.
evidence:
  level: supported
  references:
  - EV-REQ-0016-01
relations:
  supports: []
  conflicts_with: []
  depends_on:
  - NT-LAW-0048
  applies_to: []
tags:
- strategy
- trade-offs
- positioning
- strategic-tradeoffs
- competitive-positioning
- opportunity-cost
- product-strategy
created_at: '2026-07-22'
updated_at: '2026-09-14'
mechanism:
- Tổ chức tìm cách tối ưu đồng thời nhiều khía cạnh cạnh tranh nhau.
- Nguồn lực khan hiếm buộc phải lựa chọn giữa các ưu tiên.
- Nỗ lực dàn trải khiến không khía cạnh nào đạt mức xuất sắc.
- Định vị chiến lược mờ nhạt và khó tạo khác biệt.
- Kết quả kém hơn cả các lựa chọn tập trung đánh đổi rõ ràng.
