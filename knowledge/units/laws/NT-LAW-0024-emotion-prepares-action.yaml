id: NT-LAW-0024
type: law
status: frozen
version: 0.1.0
title: Cảm xúc chuẩn bị cho hành động
summary: Cảm xúc chuẩn bị cho con người hành động bằng cách ưu tiên các yếu tố đe dọa, phần thưởng, sự gắn bó, mất mát hoặc cơ hội trước khi có sự suy xét thấu đáo.
primary_domain: tri-nhan
secondary_domains:
- tu-than
- hop-chung
definition: Cảm xúc của con người không đơn thuần là cảm giác xảy ra sau sự việc; nó tổ chức sự chú ý, sự sẵn sàng của cơ thể, cách diễn giải và phản ứng có khả năng xảy ra.
mechanism:
- Phát hiện tầm quan trọng
- Tạo ra cảm xúc
- Chuẩn bị cơ thể và sự chú ý
- Định hướng hành động.
conditions:
- Tình huống chứa đựng mối đe dọa được nhận thức
- phần thưởng
- mất mát
- sự gắn bó
- hoặc sự không chắc chắn.
exceptions:
- Việc đào tạo và phản tỉnh có thể tái định hình phản ứng cảm xúc
- một số quyết định ít nổi bật vẫn mang tính quy trình là chủ yếu.
applications:
  communication:
  - Nhận biết sự sẵn sàng về mặt cảm xúc trước khi kỳ vọng vào lập luận khách quan.
  leadership:
  - Coi cảm xúc mạnh mẽ là sự chuẩn bị cho hành động cần được diễn giải
  - chứ không phải để bác bỏ ngay lập tức.
risks:
- Coi cảm xúc là luôn đúng
- bác bỏ lý trí chỉ vì có sự hiện diện của cảm xúc.
