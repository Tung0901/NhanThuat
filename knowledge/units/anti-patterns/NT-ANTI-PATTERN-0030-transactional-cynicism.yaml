id: NT-ANTI-PATTERN-0030
type: anti-pattern
status: frozen
version: 0.1.0
title: Thái độ hoài nghi mang tính giao dịch
summary: Đơn vị tri thức cấu trúc về Thái độ hoài nghi mang tính giao dịch trong quản trị hành vi.
primary_domain: hop-chung
secondary_domains:
- tri-nhan
definition: Định nghĩa chính thức về Thái độ hoài nghi mang tính giao dịch (Transactional Cynicism) trong kiến trúc Nhân Thuật, chỉ trạng thái các mối quan hệ trong tổ chức bị thương mại hóa thuần túy, thiếu vắng lòng tin và sự cam kết lâu dài.
conditions:
- Bối cảnh quản trị vận hành tổ chức.
exceptions:
- Trường hợp ghi đè trong khủng hoảng khẩn cấp.
applications:
  governance:
  - Áp dụng phân tích Thái độ hoài nghi mang tính giao dịch vào quy trình làm việc tổ chức.
risks:
- Sự xuất hiện hoặc áp dụng sai Thái độ hoài nghi mang tính giao dịch dẫn đến làm suy yếu văn hóa tổ chức và giảm hiệu suất.
