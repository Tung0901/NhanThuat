id: NT-LAW-0050
type: law
status: frozen
version: 0.2.0
title: Kiệt quệ do quá tải nhận thức
summary: Năng lực ra quyết định tiêu hao theo thời gian chịu tải và cạn dần nếu không được phục hồi. Khi cạn, hành vi rơi về mặc định, phản xạ và né tránh.
primary_domain: tu-than
secondary_domains:
- tri-nhan
definition: 'Kiệt quệ do quá tải nhận thức là quy luật về giới hạn tiêu hao của năng lực nhận thức: chất lượng phán đoán suy giảm có hệ thống khi tải kéo dài vượt khả năng phục hồi.'
conditions:
- Khối lượng công việc đòi hỏi phán đoán liên tục trong thời gian dài.
- Thiếu cơ chế giảm tải hoặc phục hồi.
exceptions:
- Công việc quen thuộc được tự động hóa không tiêu hao năng lực phán đoán đáng kể.
- Nghỉ ngắn có chủ đích giữa các tác vụ nặng giảm tốc độ kiệt quệ.
applications:
  operations:
  - Giới hạn số quyết định quan trọng trong một ngày và bảo vệ khoảng nghỉ giữa các phiên.
  - Đưa quyết định quan trọng vào khung giờ năng lượng cao nhất.
  management:
  - Theo dõi dấu hiệu kiệt quệ qua chất lượng quyết định cuối ngày.
  - Thiết kế ca làm việc có điểm phục hồi thay vì tải liên tục.
  workflow-design:
  - Giảm số lựa chọn không cần thiết bằng mặc định hợp lý.
risks:
- Quyết định quan trọng bị đưa ra trong trạng thái cạn năng lượng.
- Xung đột quan hệ gia tăng do kiệt sức.
- Mặc định kém được duy trì vì không còn năng lực đánh giá lại.
evidence:
