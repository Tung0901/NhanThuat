created_at: '2026-07-22'
updated_at: '2026-09-14'
mechanism:
- Các cá nhân hành động theo quy tắc cục bộ của mình trong từng tương tác.
- Tương tác lặp lại tạo ra các mẫu phối hợp hoặc xung đột ổn định.
- Các mẫu cục bộ lan truyền và cộng hưởng thành hành vi cấp nhóm.
- Hành vi tập thể phát sinh trở thành môi trường mới cho các tương tác tiếp theo.
