id: NT-PRINCIPLE-0090
type: principle
status: frozen
version: 0.1.0
title: Align Incentives with System Purpose
summary: Structure variable rewards to reinforce systemic outcomes and shared goals
  rather than isolated departmental siloes.
primary_domain: tu-than
secondary_domains:
- hop-chung
definition: To prevent cross-functional warfare, incentive structures must reward
  holistic system performance.
conditions:
- Designing company-wide bonus pools and OKR payoff links.
exceptions:
- Completely independent business units operating under portfolio holding structures.
applications:
  compensation:
  - Tie executive bonuses to cross-departmental customer lifetime value.
risks:
- Diffusing individual accountability by over-indexing on group metrics.
evidence:
  level: supported
  references:
  - EV-REQ-0009-01
relations:
  supports: []
  conflicts_with: []
  depends_on:
  - NT-LAW-0060
  applies_to: []
tags:
- incentives
