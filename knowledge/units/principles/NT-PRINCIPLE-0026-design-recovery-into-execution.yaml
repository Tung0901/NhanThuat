id: NT-PRINCIPLE-0026
type: principle
status: frozen
version: 0.1.0
title: Thiết kế sự phục hồi vào trong quá trình thực thi
summary: Coi việc phục hồi, dư địa và các khoảnh khắc khởi động lại là một phần của năng lực thực thi, không phải sự tiện nghi tùy chọn.
primary_domain: thanh-su
secondary_domains:
- tu-than
- dung-nhan
definition: Thực thi bền vững đòi hỏi sự phục hồi được hoạch định để chất lượng không phụ thuộc vào việc gắng sức liên tục.
mechanism:
- Ước tính tải.
- Thêm phục hồi và dư địa.
- Bảo vệ chất lượng qua nhiều chu kỳ lặp lại.
conditions:
- Công việc kéo dài hoặc lặp lại.
- Quá tải sẽ làm suy giảm phán đoán hoặc độ tin cậy.
exceptions:
- Tình huống khẩn cấp ngắn có thể tiêu thụ dự trữ.
- Quá nhiều dư địa có thể làm giảm tính khẩn trương.
applications:
  operations:
  - Hoạch định năng lực với bộ đệm phục hồi.
  leadership:
  - Tránh biến sự anh hùng thành mô hình vận hành thường nhật.
risks:
- Dùng ngôn ngữ phục hồi để né tránh việc chăm chỉ.
- Phớt lờ các ràng buộc khẩn cấp.
