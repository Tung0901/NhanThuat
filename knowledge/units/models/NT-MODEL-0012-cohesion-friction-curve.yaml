mechanism:
- Đo mức gắn kết quan hệ giữa các thành viên nhóm.
- Đo mức ma sát chức năng qua tần suất và chất lượng bất đồng.
- Định vị nhóm trên đường cong để nhận diện vùng hiện tại.
- Điều chỉnh nghi thức nhóm để dịch chuyển về vùng cân bằng.
