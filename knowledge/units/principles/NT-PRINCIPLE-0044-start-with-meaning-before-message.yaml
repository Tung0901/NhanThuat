id: NT-PRINCIPLE-0044
type: principle
status: frozen
version: 0.1.0
title: Bắt đầu từ ý nghĩa trước thông điệp
summary: Trước khi yêu cầu sự chú ý, hãy kết nối thông điệp với điều người nghe có thể nhận ra là có ý nghĩa, liên quan hoặc hệ quả.
primary_domain: tri-nhan
secondary_domains:
- hop-chung
- tu-than
definition: Thông điệp dễ được lắng nghe hơn khi người nghe thấy được vì sao nó quan trọng trước khi được yêu cầu xử lý chi tiết.
mechanism:
- Xác định mối quan tâm của người nghe
- Nêu tính liên quan
- Sau đó cung cấp chi tiết.
conditions:
- Sự chú ý có hạn
- Chủ đề cạnh tranh với các ưu tiên khác.
exceptions:
- Mệnh lệnh khẩn cấp có thể cần trước phần giải thích
- Tính liên quan giả tạo làm tổn hại niềm tin.
applications:
  communication:
  - Mở đầu bằng vì sao chủ đề quan trọng với người nghe.
  leadership:
  - Gắn các ưu tiên với mục đích chung hoặc rủi ro cụ thể.
risks:
- Đóng khung quá mức
- Thao túng cảm nhận về tầm quan trọng.
