id: NT-LAW-0041
type: law
status: frozen
version: 0.2.0
title: Tính Đồng nhất do Thiên kiến Lựa chọn
summary: Cơ chế tuyển chọn thiên lệch tự củng cố và dẫn tới đội ngũ đồng nhất về kiểu tư duy, nền tảng và cách ra quyết định. Đồng nhất quá mức làm suy giảm năng lực phát hiện rủi ro.
primary_domain: tri-nhan
secondary_domains:
- hop-chung
definition: 'Tính đồng nhất do thiên kiến lựa chọn là quy luật về hệ quả tích lũy của tiêu chí chọn lọc thiên lệch: càng chọn theo một khuôn mẫu, tổ chức càng mất đa dạng nhận thức.'
conditions:
- Tiêu chí lựa chọn không được chuẩn hóa hoặc không được kiểm tra định kỳ.
- Quyết định chọn lọc dựa nhiều vào quen thuộc và cảm nhận chủ quan.
exceptions:
- Quy trình chuẩn hóa tiêu chí kèm kiểm tra thiên kiến định kỳ duy trì được đa dạng.
- Vai trò yêu cầu chuẩn hóa cực cao có thể cần khuôn mẫu hẹp có chủ đích.
applications:
  hiring:
  - Chuẩn hóa bộ tiêu chí đánh giá và kiểm tra phân bố ứng viên được chọn theo thời gian.
  - Luân phiên người tham gia hội đồng tuyển chọn để giảm khuôn mẫu cá nhân.
  governance:
  - Theo dõi chỉ số đa dạng nhận thức của các nhóm ra quyết định quan trọng.
  team-design:
  - Chủ động bổ sung góc nhìn khác biệt cho các vị trí phân tích và phản biện.
risks:
- Tư duy tập thể và điểm mù hệ thống do quá đồng nhất.
- Tự củng cố văn hóa độc canh, khó thích ứng khi môi trường thay đổi.
- Bỏ lỡ nhân tài khác khuôn mẫu nhưng phù hợp công việc.
