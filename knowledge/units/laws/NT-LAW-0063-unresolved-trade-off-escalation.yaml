id: NT-LAW-0063
type: law
status: frozen
version: 0.2.0
title: Sự leo thang từ các đánh đổi chưa được giải quyết
summary: Những đánh đổi mang tính cấu trúc bị kìm nén chắc chắn sẽ leo thang thành những xích mích cá nhân theo thời gian.
primary_domain: hop-chung
secondary_domains:
- thanh-su
definition: Khi một tổ chức không giải quyết được các đánh đổi mang tính cấu trúc, sự căng thẳng sẽ biểu hiện dưới dạng xung đột giữa các cá nhân.
conditions:
- Việc thực thi của nhóm liên chức năng dưới các ưu tiên mơ hồ.
exceptions:
- Các nhóm hoàn toàn tự chủ và không có sự chồng chéo về nhu cầu tài nguyên.
applications:
  conflict-resolution:
  - Giải quyết các đánh đổi tài nguyên cốt lõi ở cấp lãnh đạo.
risks:
- Coi các xung đột tài nguyên mang tính cấu trúc như những bất đồng về tính cách cá nhân.
evidence:
  level: supported
  references:
  - EV-REQ-0011-01
relations:
  supports: []
  conflicts_with: []
  depends_on:
  - NT-LAW-0012
  applies_to: []
tags:
- conflict
