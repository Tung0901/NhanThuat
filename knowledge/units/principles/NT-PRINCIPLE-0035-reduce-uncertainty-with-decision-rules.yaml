id: NT-PRINCIPLE-0035
type: principle
status: frozen
version: 0.1.0
title: Giảm sự không chắc chắn bằng quy tắc ra quyết định
summary: Dùng quy tắc ra quyết định đơn giản để giảm lo lắng, giảm nhu cầu kiểm soát và giúp hành động khả thi khi thông tin không đầy đủ.
primary_domain: thanh-su
secondary_domains:
- tu-than
- hop-chung
definition: Khi sự không chắc chắn tăng lên, con người tìm cách kiểm soát; quy tắc ra quyết định rõ ràng cung cấp đủ cấu trúc để di chuyển có trách nhiệm.
mechanism:
- Nêu rõ ngưỡng ra quyết định
- Xác định ai quyết định
- Xác định thời điểm xem xét lại quy tắc.
conditions:
- Thông tin không đầy đủ
- Chờ đợi có chi phí.
exceptions:
- Rủi ro mới có thể cần phân tích sâu hơn
- Quy tắc cứng nhắc có thể thất bại khi bối cảnh thay đổi.
applications:
  operations:
  - Đặt ngưỡng cho việc leo thang
  - thử lại
  - tạm dừng
  - hoặc tiếp tục.
  leadership:
  - Thay lời trấn an mơ hồ bằng ràng buộc ra quyết định dùng được.
risks:
- Quá tự tin
- Coi quy tắc là sự thay thế cho phán đoán.
evidence:
