id: NT-LAW-0054
type: law
status: frozen
version: 0.2.0
title: Tiếp nhận đồng bộ khung nhận thức
summary: Thông điệp được tiếp nhận khi khung nhận thức của người nhận được khớp trước. Khác khung tạo đề kháng, hiểu sai hoặc im lặng.
primary_domain: tri-nhan
secondary_domains:
- dung-nhan
definition: 'Tiếp nhận đồng bộ khung nhận thức là quy luật về điều kiện tiếp nhận thông điệp: hiệu quả truyền đạt phụ thuộc vào mức độ tương thích giữa khung của người gửi và khung đang vận hành ở người nhận.'
conditions:
- Người nhận đã có khung nhận thức ổn định về chủ đề.
- Thông điệp cần được tiếp nhận để tạo hành động.
exceptions:
- Bằng chứng mới đủ mạnh có thể tái định hình khung nhận thức hiện có.
- Trong tình huống khẩn cấp, mệnh lệnh trực tiếp có thể vượt qua nhu cầu khớp khung.
applications:
  communication:
  - Xác định khung nhận thức của người nhận trước khi thiết kế thông điệp quan trọng.
  - Dùng ví dụ và ngôn ngữ quen thuộc với người nhận thay vì thuật ngữ của người gửi.
  negotiation:
  - Liên kết đề xuất với giá trị và mối quan tâm đã được người đối diện công nhận.
  change-management:
  - Kể câu chuyện thay đổi dựa trên trải nghiệm hiện có của nhân sự.
risks:
- Thông điệp đúng nhưng bị từ chối vì lệch khung người nhận.
- Điều chỉnh khung thiếu nguyên tắc dẫn tới thao túng nhận thức.
- Hiểu sai im lặng là đồng thuận trong khi thực tế là đề kháng ngầm.
