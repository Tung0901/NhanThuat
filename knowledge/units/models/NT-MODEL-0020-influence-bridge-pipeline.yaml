mechanism:
- Xác định mục tiêu ảnh hưởng và người ra quyết định cuối cùng.
- Vẽ tuyến các trạm trung gian giữa người đề xuất và người quyết định.
- Xác định vai trò và mối quan tâm của từng trạm trên tuyến.
- 'Thiết kế cách tiếp cận phù hợp cho từng chặng: cung cấp thông tin, xử lý lo ngại, tạo đồng thuận.'
