id: NT-LAW-0003
type: law
status: frozen
version: 0.1.0
title: Niềm tin làm giảm chi phí phối hợp
summary: Khi mọi người tin tưởng vào ý định, năng lực và sự nhất quán trong hành động của nhau, họ sẽ cần ít sự giám sát, thương lượng và kiểm tra phòng vệ hơn để phối hợp.
primary_domain: hop-chung
secondary_domains:
- dung-nhan
- thanh-su
definition: Niềm tin làm giảm chi phí nhận thức của hành động chung bằng cách giảm bớt sự không chắc chắn về việc liệu những người khác có hành động một cách có năng lực, trung thực và nhất quán hay không.
mechanism:
- Một cá nhân đánh giá ý định, năng lực và độ tin cậy của bên kia.
- Niềm tin cao hơn làm giảm nhu cầu kiểm soát và xác minh trong nhận thức.
- Chi phí phối hợp thấp hơn giúp việc hợp tác dễ dàng bắt đầu và duy trì hơn.
conditions:
- Các bên có các tín hiệu lặp đi lặp lại hoặc thông tin đáng tin cậy về nhau.
- Nhiệm vụ đòi hỏi sự phụ thuộc lẫn nhau nhất định giữa mọi người.
exceptions:
- Những tình huống có rủi ro cao vẫn có thể yêu cầu kiểm tra rõ ràng ngay cả khi niềm tin ở mức cao.
- Niềm tin vào ý định không thể thay thế cho năng lực hoặc khả năng thực tế.
applications:
  management:
  - Xây dựng niềm tin bằng cách làm cho các cam kết trở nên rõ ràng và thực hiện chúng một cách nhất quán.
  teamwork:
  - Giảm bớt sự kiểm soát không cần thiết ở những nơi mà độ tin cậy đã được chứng minh.
risks:
- Coi niềm tin là sự tin tưởng mù quáng thay vì sự tự tin có cơ sở và được hiệu chuẩn.
- Bỏ qua nhu cầu xác minh trong các bối cảnh có rủi ro cao.
