<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0a0a0c">
    <title>Nhân Thuật | Ngoại tuyến</title>
    <style>
        :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0a0a0c; color: #f5f5f4; }
        main { width: min(32rem, calc(100% - 3rem)); border-top: 1px solid #c7a84a; padding-top: 1.5rem; }
        h1 { margin: 0 0 0.75rem; font-family: Georgia, serif; font-size: clamp(2rem, 8vw, 3.5rem); font-weight: 500; }
        p { margin: 0; color: #a8a29e; line-height: 1.65; }
        button { margin-top: 1.5rem; border: 1px solid #c7a84a; background: transparent; color: #f5f5f4; padding: 0.75rem 1rem; cursor: pointer; }
    </style>
</head>
<body>
    <main>
        <h1>Đang ngoại tuyến</h1>
        <p>Kết nối mạng để mở không gian làm việc và dữ liệu phiên mới nhất.</p>
        <button type="button" onclick="location.reload()">Thử kết nối lại</button>
    </main>
</body>
</html>
