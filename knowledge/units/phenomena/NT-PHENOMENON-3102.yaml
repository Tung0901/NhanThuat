id: NT-PHENOMENON-3102
type: phenomenon
title: Loss Aversion
summary: The psychological impact of losing something is roughly twice as powerful
  as the impact of gaining the equivalent thing.
primary_domain: tri-nhan
domain_area: NT-DA-0027
definition: A robust cognitive phenomenon where individuals prefer avoiding losses
  over acquiring equivalent gains, driving risk-seeking behavior in loss domains and
  risk-averse behavior in gain domains.
mechanism:
- An outcome is framed as a loss.
- The amygdala and insula trigger strong negative emotional responses.
- The individual exhibits disproportionate effort to avoid realizing the loss.
conditions:
- Clear visibility of what might be lost.
exceptions:
- When trading routine commodities (e.g., spending money to buy coffee).
applications:
  change_management:
  - Frame the cost of not changing (losses) rather than just the benefits of changing
    (gains).
risks:
- Refusal to cut losses on failing projects (escalation of commitment).
evidence:
  level: strong
  references:
  - 'Kahneman, D., & Tversky, A. (1979). ''Prospect Theory: An Analysis of Decision
    under Risk''.'
relations:
