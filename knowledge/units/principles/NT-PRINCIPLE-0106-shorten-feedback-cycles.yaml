title: Shorten Feedback Cycles
summary: Break down complex initiatives to receive rapid telemetry from real-world
  execution as early as possible.
primary_domain: tri-nhan
secondary_domains:
- thanh-su
definition: Build small probes and early releases to gather real customer telemetry
  before committing massive resources.
conditions:
- Product development and strategy testing.
exceptions:
- Monolithic capital construction projects.
applications:
  mvp_testing:
  - Release minimal prototype features to test core customer assumptions.
risks:
- Releasing unpolished prototypes that damage brand reputation.
