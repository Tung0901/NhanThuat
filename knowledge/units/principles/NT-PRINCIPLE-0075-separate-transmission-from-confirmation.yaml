id: NT-PRINCIPLE-0075
type: principle
status: frozen
version: 0.2.0
title: Tách biệt truyền tải khỏi xác nhận
summary: Truyền đạt không đồng nghĩa với được hiểu. Cần xác nhận riêng để đảm bảo thông điệp đã đến đúng và đủ.
primary_domain: tri-nhan
secondary_domains:
- hop-chung
definition: Tách biệt truyền tải khỏi xác nhận là nguyên tắc giao tiếp yêu cầu phân biệt rõ hành vi gửi thông tin với hành vi kiểm tra mức độ tiếp nhận thực tế của người nhận.
conditions:
- Thông điệp quan trọng hoặc phức tạp.
- Kênh truyền đạt không có phản hồi trực tiếp tức thì.
exceptions:
- Thông điệp đơn giản, quy ước rõ ràng không cần xác nhận riêng.
- Kênh có cơ chế xác nhận tự động như biên bản ký nhận.
applications:
  communication:
  - Kết thúc trao đổi quan trọng bằng yêu cầu người nhận tóm tắt lại nội dung.
  - Phân biệt thông báo một chiều với trao đổi cần xác nhận hai chiều.
  management:
  - Kiểm tra mức độ hiểu của nhân sự sau khi giao việc bằng câu hỏi mở.
  meeting-design:
  - Dành phần cuối cuộc họp để xác nhận các điểm hành động đã được hiểu thống nhất.
risks:
- Tưởng rằng đã giao việc trong khi nhân sự hiểu khác.
- Xác nhận hình thức 'anh hiểu chưa' tạo câu trả lời máy móc.
- Bỏ qua xác nhận trong giao tiếp bằng văn bản quan trọng.
evidence:
  level: supported
  references:
  - EV-REQ-0001-01
