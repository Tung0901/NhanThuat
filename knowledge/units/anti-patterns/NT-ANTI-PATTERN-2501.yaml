id: NT-ANTI-PATTERN-2501
type: anti-pattern
status: frozen
version: 1.0.0
title: Đổi mới mang tính trình diễn
summary: Các hoạt động đổi mới sáng tạo chỉ mang tính hình thức, nhằm mục đích quảng bá mà không có cam kết thực hiện hay ứng dụng thực tế.
primary_domain: tu-than
domain_area: NT-DA-0025
secondary_domains:
- thanh-su
definition: Hiện tượng tổ chức tạo ra vỏ bọc đổi mới sáng tạo để phục vụ quan hệ công chúng (PR) nhưng lại thiếu hụt nghiêm trọng cơ chế hỗ trợ và nguồn lực thực tế.
mechanism:
- Tổ chức các cuộc thi ý tưởng rầm rộ nhưng không cấp ngân sách hoặc lộ trình triển khai thực tế.
- Thành lập các bộ phận nghiên cứu và phát triển (R&D) hoặc phòng lab nhưng không trao quyền quyết định và nguồn lực.
conditions:
- Các tập đoàn hoặc tổ chức truyền thống đang chịu áp lực phải chuyển đổi số nhưng ngại thay đổi cốt lõi.
exceptions:
- Các dự án thử nghiệm (pilot) được cấp ngân sách độc lập và có cơ chế bảo vệ để phát triển thành sản phẩm thực tế.
applications:
  management:
  - Đánh giá hiệu quả thực tế của các phòng nghiên cứu (Lab) dựa trên tỷ lệ thương mại hóa sản phẩm.
risks:
- Lãng phí nguồn lực tài chính và bào mòn lòng tin cũng như nhiệt huyết của các nhân sự tài năng.
