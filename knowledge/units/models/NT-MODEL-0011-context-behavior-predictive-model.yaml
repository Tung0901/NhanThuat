id: NT-MODEL-0011
type: model
status: frozen
version: 0.2.0
title: Mô hình Dự báo Hành vi theo Bối cảnh
summary: Mô hình dự báo hành vi cá nhân dựa trên tương tác giữa đặc điểm ổn định và bối cảnh tình huống. Hành vi là hàm của con người nhân với môi trường, không phải chỉ một trong hai.
primary_domain: tri-nhan
secondary_domains:
- dung-nhan
definition: 'Mô hình Dự báo Hành vi theo Bối cảnh là khung phân tích hành vi dựa trên ba lớp biến số: đặc tính nền của cá nhân, đặc điểm tình huống hiện tại, và mức độ mạnh của tình huống quyết định mức ảnh hưởng tương đối của hai lớp trước.'
conditions:
- Có thông tin về đặc tính cá nhân và bối cảnh vận hành.
- Hành vi quan tâm có tính lặp lại tương đối.
exceptions:
- Hành vi bất thường do biến cố cá nhân không dự báo được từ mô hình.
- Môi trường thay đổi đột ngột làm dữ liệu lịch sử mất giá trị.
applications:
  management:
  - Thiết kế môi trường phù hợp với hành vi mục tiêu thay vì chỉ kỳ vọng vào tính cách.
  - Điều chỉnh cường độ tình huống để tăng hoặc giảm mức ảnh hưởng của đặc tính.
  hiring:
  - Đánh giá mức phù hợp bối cảnh công việc bên cạnh đặc tính cá nhân.
  team-design:
  - Bố trí con người vào môi trường làm phát huy điểm mạnh và giảm điểm yếu.
risks:
- Dán nhãn cá nhân cố định từ dự báo hành vi.
- Bỏ qua biến động tình huống khiến dự báo sai lệch.
- Dùng mô hình để ngụy biện cho việc ép con người vào môi trường xấu.
evidence:
  level: supported
  references:
