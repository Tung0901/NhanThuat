id: CASE-OPS-001
type: case
status: frozen
version: 1.0.0
title: Nhà cung cấp vật tư giao trễ 48h tại công trình Nhà Bè
summary: Vật tư bê tông và cốt thép giao trễ 48h làm ngưng trệ toàn bộ tổ đội công nhân; nhà cung cấp nại lý do tắc biên và khan hiếm nguyên liệu, buộc phải xử lý theo hợp đồng và chế tài.
primary_domain: thanh-su
secondary_domains:
- dung-nhan
domain_area: NT-DA-0021
context: >-
  Vật tư bê tông và cốt thép giao trễ 48 giờ làm ngưng trệ 100% tổ đội công nhân
  hiện trường tại công trình Nhà Bè. Nhà cung cấp nại lý do tắc biên và khan hiếm
  nguồn nguyên liệu. Tiến độ dự án đang ở giai đoạn nước rút.
decision_script:
  position_analysis: >-
    Áp dụng lăng kính Pháp Gia ("Hình Danh Tương Phù") kết hợp chế tài Nhị Bỉnh:
    không nhượng bộ cảm tính, kích hoạt biên bản vi phạm và phạt 0.5%/ngày theo
    điều khoản hợp đồng.
  steps:
  - Bước 1: Thiết lập vị thế và đối chiếu điều khoản hợp đồng bằng văn bản.
  - Bước 2: Ấn định thời hạn tối hậu 24h giao bù 100% khối lượng.
  - Bước 3: Kích hoạt đơn vị cung ứng dự phòng Plan B và cấn trừ thiệt hại vào
    đợt thanh toán.
lessons_learned:
- Quy luật NT-LAW-0005: Động lực và chế tài quyết định thứ tự ưu tiên của nhà cung cấp.
- Nguyên tắc NT-PRINCIPLE-0064: Luôn chuẩn bị sẵn đơn vị cung ứng dự phòng Plan B
  trước khi khởi công.
- Quy luật NT-LAW-0059: Bên có phương án thay thế tốt hơn chịu ít tổn thất khi
  thỏa thuận đổ vỡ; Plan B chính là cân bằng lại bất đối xứng này.
