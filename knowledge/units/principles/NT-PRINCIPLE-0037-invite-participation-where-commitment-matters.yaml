id: NT-PRINCIPLE-0037
type: principle
status: frozen
version: 0.1.0
title: Mời tham gia nơi cam kết có ý nghĩa
summary: Yêu cầu tham gia thực sự khi con người phải gánh chịu hệ quả của một quyết định theo thời gian.
primary_domain: hop-chung
secondary_domains:
- dung-nhan
- thanh-su
definition: Cam kết lớn lên khi con người tham gia một cách ý nghĩa vào các quyết định ảnh hưởng đến công việc, rủi ro, bản sắc hoặc chuẩn mực của họ.
mechanism:
- Xác định ai phải duy trì quyết định
- Mời góp ý trước khi chốt phương án
- Cho thấy góp ý đã định hình kết quả ra sao.
conditions:
- Cam kết cần thiết sau quyết định
- Các bên liên quan nắm giữ kiến thức địa phương hữu ích.
exceptions:
- Hành động khẩn cấp có thể cần ra lệnh trước
- Không nên sắp đặt sự tham gia khi quyết định đã cố định.
applications:
  governance:
  - Tổ chức tham vấn trước các thay đổi quy tắc bền vững.
  management:
  - Gồm cả người thực thi trước khi chốt các cam kết vận hành.
risks:
- Tham gia mang tính tượng trưng
- Làm chậm quyết định khẩn cấp không cần thiết.
