id: NT-PRINCIPLE-0029
type: principle
status: frozen
version: 0.1.0
title: Bring distant goals near
summary: Translate long-term goals into near signals, routines, and consequences that
  people can notice during daily decisions.
primary_domain: thanh-su
secondary_domains:
- tri-nhan
- tu-than
definition: Distant goals gain influence when they are made visible and actionable
  in the immediate environment.
mechanism:
- Name long-term goal
- Create near cues and checkpoints
- Link daily action to future consequence.
conditions:
- The goal is important but abstract
- Daily behavior affects it.
exceptions:
- Over-shortening can distort strategy
- Some outcomes require patience without frequent signal.
applications:
  strategy:
  - Create weekly indicators for annual goals.
  communication:
  - Connect purpose to today's tradeoff.
risks:
- Reducing vision to tasks
- Creating false urgency.
evidence:
  level: provisional
