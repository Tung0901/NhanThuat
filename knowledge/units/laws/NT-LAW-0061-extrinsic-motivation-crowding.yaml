id: NT-LAW-0061
type: law
status: frozen
version: 0.1.0
title: Sự lấn át động lực nội tại
summary: Việc áp dụng các phần thưởng tài chính cho những công việc phức tạp vốn có động lực nội tại sẽ làm giảm cam kết bên trong và chất lượng sáng tạo.
primary_domain: tu-than
secondary_domains:
- tri-nhan
definition: 'Hiệu ứng biện minh quá mức (Over-justification effect): việc gắn các khoản tiền thưởng mang tính giao dịch sẽ thay thế động lực nội tại bằng sự tính toán kinh tế bên ngoài.'
conditions:
- Các công việc đòi hỏi giải quyết vấn đề sáng tạo, nỗ lực tự nguyện hoặc đánh giá đạo đức.
exceptions:
- Các công việc chân tay lặp đi lặp lại, mang tính rập khuôn và thiếu đi sức hút nội tại.
applications:
  compensation_design:
  - Sử dụng mức lương cơ bản hậu hĩnh thay vì cơ chế hoa hồng chia nhỏ cho các đội ngũ kỹ sư nghiên cứu và phát triển (R&D).
risks:
- Phá hủy tinh thần làm việc nhóm tự nguyện và sự an toàn tâm lý bằng các cấu trúc tiền thưởng cạnh tranh cực đoan.
