id: NT-LAW-0004
type: law
status: frozen
version: 0.1.0
title: Bối cảnh định hình phán đoán
summary: Con người đánh giá các lựa chọn thông qua tình huống, các ràng buộc, động lực thúc đẩy, các mối quan hệ và thời điểm mà họ nhận thức được xung quanh quyết định đó.
primary_domain: tri-nhan
secondary_domains:
- tu-than
- dung-nhan
- thanh-su
definition: Phán đoán bị ảnh hưởng bởi bối cảnh được nhận thức xung quanh một quyết định, chứ không chỉ bởi sở thích ổn định hay logic trừu tượng.
mechanism:
- Nhận thức tình huống
- Diễn giải các ràng buộc và lợi ích liên quan
- So sánh các lựa chọn thông qua khung nhận thức đó.
conditions:
- Cá nhân có thông tin không đầy đủ
- Bối cảnh đủ nổi bật để ảnh hưởng đến cách diễn giải.
exceptions:
- Chuyên môn sâu có thể làm giảm sự bóp méo do bối cảnh
- Các tiêu chí rõ ràng có thể giúp ổn định phán đoán.
applications:
  management:
  - Tìm hiểu bối cảnh nào khiến một lựa chọn trở nên hợp lý trước khi đánh giá cá nhân đó.
  negotiation:
  - Thay đổi khung nhận thức trước khi tranh luận về các lập trường.
risks:
- Đổ lỗi cho tính cách thay vì áp lực từ bối cảnh
- Bỏ qua các giá trị bền vững và năng lực thực tế.
