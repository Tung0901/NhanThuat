mechanism:
- Xác định các đặc tính nền quan trọng của cá nhân liên quan tới hành vi cần dự báo.
- Phân tích các đặc điểm bối cảnh đang tác động lên cá nhân.
- Đánh giá cường độ tình huống để biết đặc tính hay bối cảnh chi phối mạnh hơn.
- Tổng hợp thành các kịch bản hành vi có khả năng xảy ra và điều kiện kích hoạt.
