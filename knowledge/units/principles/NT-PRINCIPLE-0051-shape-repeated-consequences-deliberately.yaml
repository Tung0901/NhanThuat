id: NT-PRINCIPLE-0051
type: principle
status: frozen
version: 0.1.0
title: Định hình hậu quả lặp lại một cách có chủ đích
summary: Chọn phần thưởng, chi phí, mặc định và phản hồi lặp lại một cách có chủ ý vì con người thích nghi với khuôn mẫu họ trải nghiệm.
primary_domain: tri-nhan
secondary_domains:
- thanh-su
- hop-chung
definition: Văn hóa và hành vi được định hình bởi hậu quả lặp lại, nên lãnh đạo và hệ thống nên căn chỉnh hậu quả với sự thích nghi mong muốn.
mechanism:
- Xác định hậu quả lặp lại
- So sánh với sự thích nghi mong muốn
- Điều chỉnh phần thưởng, chi phí, mặc định hoặc phản hồi.
conditions:
- Một khuôn mẫu hành vi đang hình thành
- Hệ thống có thể ảnh hưởng đến hậu quả.
exceptions:
- Một số sự thích nghi gây hại dù hiệu quả
- mọi người có thể kháng cự sự thao túng bị nhận thức.
applications:
  culture:
  - Khen thưởng sự thật và việc sửa chữa lặp lại, không chỉ các giá trị được tuyên bố.
  operations:
  - Làm cho hành vi mong muốn đáng tin cậy dễ dàng hơn hoặc được trân trọng hơn.
risks:
- Thao túng
- làm giảm động lực nội tại.
