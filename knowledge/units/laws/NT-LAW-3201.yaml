id: NT-LAW-3201
type: law
status: draft
version: 1.0.0
title: Quy luật Giá trị Cảm nhận
summary: Người mua thường đánh giá sản phẩm qua giá trị cảm nhận và bối cảnh giao dịch bên cạnh các yếu tố công năng thuần túy.
primary_domain: thanh-su
domain_area: NT-DA-0031
secondary_domains:
- tri-nhan
definition: Định giá của nhận thức con người chịu ảnh hưởng mạnh của bối cảnh so sánh, tín hiệu uy tín và kỳ vọng tâm lý bên cạnh chi phí sản xuất hữu hình.
conditions:
- Khi thông tin về giá trị thực tế bị thiếu hoặc khó đánh giá.
- Khi sản phẩm gắn liền với nhu cầu thể hiện bản thân hoặc giảm thiểu rủi ro tâm lý.
exceptions:
- Thị trường hàng hóa thiết yếu (commodity) cạnh tranh hoàn hảo về giá.
applications:
  general:
  - Áp dụng trong quản trị và kinh doanh.
risks:
- Thổi phồng giá trị cảm nhận quá mức dẫn đến khủng hoảng niềm tin khi trải nghiệm thực tế kém.
evidence:
  level: supported
  references:
  - '[Empirical Study] Plassmann, H., O''Doherty, J., Shiv, B., & Rangel, A. (2008). Marketing
    actions can modulate neural representations of experienced pleasantness. PNAS, 105(3), 1050-1054 (Thực
    nghiệm fMRI về định giá và cảm nhận).'
  - '[Theoretical Model] Thaler, R. H. (1985). Mental accounting and consumer choice. Marketing Science,
    4(3), 199-214 (Mô hình lý thuyết kế toán tâm lý, lợi ích giao dịch và giá tham chiếu).'
  - '[Popular Synthesis] Sutherland, R. (2019). Alchemy: The Dark Art and Curious Science of Creating Magic
    in Brands, Business, and Life. William Morrow.'
  - '[Classical Analogy] Chiến Quốc Sách — Tần Sách & Sở Sách (Điển tích Sở vương hiếu tế yêu và Bá Nhạc xem ngựa về bối cảnh chi phối giá trị trao đổi).'
  - '[Editorial Inference] Phân tích biên giới giữa định vị giá trị cảm nhận và rủi ro đứt gãy kỳ vọng sau
    mua trong thương mại B2B/B2C.'
