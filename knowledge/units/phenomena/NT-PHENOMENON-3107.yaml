id: NT-PHENOMENON-3107
type: phenomenon
title: Mental Accounting
summary: The tendency to categorize and treat money differently depending on its origin
  or intended use, rather than treating it as fully fungible.
primary_domain: tri-nhan
domain_area: NT-DA-0027
definition: A cognitive tracking system where individuals assign subjective value
  to resources based on arbitrary mental buckets, violating the economic principle
  of fungibility.
mechanism:
- Money is assigned to a specific 'account' (e.g., entertainment, salary, bonus).
- Expenditures are constrained by the balance of that specific account, not total
  wealth.
- Windfall gains are spent more frivolously than earned salary.
conditions:
- When resources are explicitly labeled or received in discrete chunks.
exceptions:
- Highly liquid corporate treasuries with strict financial controls.
applications:
  budgeting:
  - Separate training budgets from operational budgets to ensure skill investment
    isn't cannibalized.
risks:
- Wasting 'found money' or continuing unprofitable projects because the budget is
  already allocated.
evidence:
  level: strong
  references:
  - Thaler, R. (1985). 'Mental accounting and consumer choice'. Marketing Science.
