id: NT-PRINCIPLE-0048
type: principle
status: frozen
version: 0.1.0
title: Đừng tấn công sự thuộc về để thay đổi hành vi
summary: Tránh dùng lời đe dọa loại trừ làm công cụ mặc định để thay đổi hành vi vì chúng kích hoạt phòng thủ và bóp méo sự thật.
primary_domain: tri-nhan
secondary_domains:
- hop-chung
- dung-nhan
definition: Sự thuộc về là mối quan tâm sâu sắc của con người, nên những lời đe dọa bâng quơ đến sự thuộc về thường tạo ra tuân phục, che giấu hoặc oán giận thay vì học hỏi.
mechanism:
- Tách hành vi khỏi sự thuộc về
- Nêu ranh giới
- Dùng hậu quả tương xứng.
conditions:
- Mối quan hệ nhóm có ý nghĩa
- Việc thay đổi hành vi đang được yêu cầu.
exceptions:
- Một số hành vi hợp pháp kết thúc tư cách thành viên
- an toàn nhóm có thể cần loại trừ.
applications:
  culture:
  - Điều chỉnh chuẩn mực mà không biến mọi sai lầm thành tín hiệu loại trừ.
  leadership:
  - Dành lời đe dọa loại bỏ cho các vi phạm ranh giới thực sự.
risks:
- Chấp nhận hành vi gây hại
- tránh né việc loại trừ cần thiết.
evidence:
  level: provisional
  references: []
