id: NT-MODEL-0002
type: model
status: frozen
version: 0.1.0
title: Identity-threat response
summary: A pattern model for diagnosing when resistance is driven by perceived threat to identity, dignity, status, or belonging.
primary_domain: tri-nhan
secondary_domains: [tu-than, hop-chung]
definition: Resistance may reflect protection of identity rather than rejection of the request, especially when change implies shame, loss, or exclusion.
mechanism: [Perceive identity threat, Defend self-image, Narrow interpretation, Resist or conceal.]
conditions: [Feedback, change, or evaluation touches status, competence, values, or belonging.]
exceptions: [Resistance may also reflect poor design or genuine disagreement.]
applications: {coaching: [Diagnose what identity is being protected.], change: [Separate the requested behavior from personal worth.]}
risks: [Over-psychologizing disagreement, avoiding hard standards.]
evidence: {level: provisional, references: []}
relations: {supports: [NT-PRINCIPLE-0047, NT-PRINCIPLE-0048], conflicts_with: [], depends_on: [NT-LAW-0025, NT-LAW-0026], applies_to: []}
tags: [pattern, identity, threat]
