id: NT-ANTI-PATTERN-0010
type: anti-pattern
status: frozen
version: 0.1.0
title: Sự độc tài của hệ phân loại đơn giản hóa
summary: Sử dụng các hồ sơ tính cách nhị nguyên thương mại như những nhãn dán cứng nhắc, ấn định để loại trừ, tuyển chọn hoặc đưa ra quyết định bổ nhiệm tuyệt đối.
primary_domain: tri-nhan
secondary_domains:
- dung-nhan
definition: Việc sử dụng sai lệch các bài đánh giá tính cách để dán nhãn vĩnh viễn cho cá nhân, bỏ qua sự phụ thuộc vào bối cảnh của hành vi, các kỹ năng bù đắp và sự phát triển đặc tính theo thời gian.
mechanism:
- Áp dụng các bài kiểm tra phân loại nhị nguyên (như MBTI, DISC).
- Dán nhãn cá nhân theo các kiểu tính cách cố định, không thể thay đổi.
- Đưa ra quyết định tuyển dụng, giao việc hoặc thăng tiến mang tính ấn định dựa trên việc khớp kiểu tính cách.
- Cản trở cơ hội phát triển và trưởng thành dựa trên định kiến về kiểu tính cách.
conditions:
- Tổ chức phụ thuộc vào các bài kiểm tra tâm lý đo lường mang thương hiệu để tự động lọc ứng viên hoặc phân công trách nhiệm.
exceptions:
- Sử dụng các thuật ngữ đặc tính chung như một từ vựng chung không ràng buộc để thảo luận về phong cách giao tiếp.
applications:
  governance:
  - Cấm sử dụng phân loại tính cách làm bộ lọc sàng lọc hoặc rào cản trong tuyển dụng và phân công việc.
  coaching:
  - Tập trung phát triển vào các kỹ năng
  - Các chiến lược tự điều chỉnh
  - Và khả năng nhạy bén với bối cảnh thay vì các hồ sơ cứng nhắc.
risks:
- Hạn chế sự phát triển của đội ngũ do bỏ qua tính chủ động và khả năng học hỏi của cá nhân.
