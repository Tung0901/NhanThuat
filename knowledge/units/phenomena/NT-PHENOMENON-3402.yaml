id: NT-PHENOMENON-3402
type: phenomenon
title: Nguyên tắc quyền uy
summary: Ý thức tuân phục sâu xa đối với quyền uy khiến con người tuân theo một cách mù quáng những yêu cầu từ các chuyên gia hoặc nhà lãnh đạo được công nhận.
primary_domain: tri-nhan
domain_area: NT-DA-0030
definition: Lối tắt tâm lý trong đó chỉ riêng những biểu tượng của quyền uy (chức danh, đồng phục, chứng chỉ) đã bỏ qua tư duy phản biện và buộc con người phải phục tùng.
mechanism:
- Một cá nhân gặp gỡ một người thể hiện các biểu tượng của quyền uy.
- Cá nhân đó giả định rằng người có quyền uy sở hữu kiến thức và quyền lực vượt trội.
- Cá nhân mặc định tuân phục mà không đánh giá tính logic của yêu cầu.
conditions:
- Các tình huống có độ bất định cao, nơi lời khuyên của chuyên gia được coi trọng.
exceptions:
- Khi người có quyền uy hoạt động hoàn toàn ngoài lĩnh vực chuyên môn của họ (dù hiệu ứng hào quang đôi khi lấn át điều này).
applications:
  marketing:
  - Sử dụng bác sĩ mặc áo blouse trắng để bán kem đánh răng, bất kể dữ liệu y khoa thực tế.
risks:
- 'Sự phục tùng mù quáng dẫn đến những thất bại tổ chức thảm khốc hoặc hành vi phi đạo đức (xem: thí nghiệm Milgram).'
evidence:
  level: strong
  references:
  - 'Cialdini, R. B. (1984). ''Influence: The Psychology of Persuasion''.'
