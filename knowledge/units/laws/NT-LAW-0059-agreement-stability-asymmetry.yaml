id: NT-LAW-0059
type: law
status: frozen
version: 0.2.0
title: Sự Bất Đối Xứng về Độ Ổn Định của Thỏa Thuận
summary: Độ ổn định của thỏa thuận phân bố bất đối xứng giữa các bên. Bên ít phụ thuộc có thể phá vỡ với chi phí thấp hơn, nên cấu trúc thỏa thuận phải tính đến điều đó.
primary_domain: thanh-su
secondary_domains:
- dung-nhan
definition: 'Sự bất đối xứng về độ ổn định của thỏa thuận là quy luật về phân bố rủi ro phá vỡ: mức độ bền vững của một thỏa thuận khác nhau giữa các bên tùy theo phương án thay thế và chi phí rời bỏ.'
conditions:
- Các bên có mức độ phụ thuộc khác nhau vào thỏa thuận.
- Chi phí rời bỏ thỏa thuận không cân xứng giữa các bên.
exceptions:
- Cơ chế chia sẻ rủi ro và điều khoản điều chỉnh làm cân bằng độ ổn định.
- Thỏa thuận có giá trị quan hệ dài hạn làm tăng chi phí phá vỡ cho cả hai bên.
applications:
  negotiation:
  - Đánh giá độ ổn định của thỏa thuận theo góc nhìn từng bên trước khi ký kết.
  - Thiết kế điều khoản điều chỉnh theo bối cảnh để duy trì tính bền vững.
  governance:
  - Duy trì cơ chế rà soát định kỳ các thỏa thuận dài hạn quan trọng.
  partnership:
  - Cân bằng lại quyền lợi khi cán cân phương án thay thế dịch chuyển.
risks:
- Đối tác phá vỡ thỏa thuận khi có phương án thay thế tốt hơn.
- Thỏa thuận có lợi trước mắt nhưng bất ổn về dài hạn do bất đối xứng.
- Bên yếu thế chịu toàn bộ rủi ro điều chỉnh khi thị trường thay đổi.
