title: Sự tuân thủ cưỡng ép
summary: Đơn vị tri thức cấu trúc về Sự tuân thủ cưỡng ép trong quản trị và hành vi tổ chức.
primary_domain: dung-nhan
secondary_domains:
- tri-nhan
definition: Định nghĩa chính thức về Sự tuân thủ cưỡng ép (Coercive Compliance) trong kiến trúc Nhân Thuật.
conditions:
- Bối cảnh quản trị vận hành.
exceptions:
- Các trường hợp đè quyền trong khủng hoảng khẩn cấp.
applications:
