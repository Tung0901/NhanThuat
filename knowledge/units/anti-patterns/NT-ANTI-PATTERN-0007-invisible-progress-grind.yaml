id: NT-ANTI-PATTERN-0007
type: anti-pattern
status: frozen
version: 0.1.0
title: Guồng quay tiến độ vô hình
summary: Đòi hỏi nỗ lực cao liên tục nhưng không hiển thị rõ ràng kết quả, thiếu phản hồi về tác động hoặc không công nhận việc hoàn thành các cột mốc.
primary_domain: tu-than
secondary_domains:
- thanh-su
- tri-nhan
definition: Vận hành thiếu các vòng phản hồi tiến độ, khiến người lao động cảm thấy nỗ lực của họ biến mất vào một khoảng không vô định không thể kiểm chứng.
mechanism:
- Yêu cầu nỗ lực liên tục
- Bỏ qua phản hồi về tiến độ
- Gây ra sự mệt mỏi về tâm lý
- Gánh chịu sự sụp đổ về mức độ gắn kết.
conditions:
- Các dự án kéo dài vận hành mà không có buổi demo cột mốc hoặc đánh giá tiến độ định kỳ.
exceptions:
- Nghiên cứu tự định hướng với chu kỳ ghi nhận kết quả bị trì hoãn dài hạn.
applications:
  workflow-audit:
  - Đảm bảo các đội ngũ nhận được sự hiển thị tức thì về các cột mốc đầu ra.
  project-management:
  - Triển khai các buổi đánh giá sprint và trưng bày sản phẩm hoàn thành.
risks:
- Tạo ra các sự kiện ăn mừng giả tạo nhằm che giấu việc thiếu tiến độ thực sự.
evidence:
  level: provisional
