id: NT-PRINCIPLE-0083
type: principle
status: frozen
version: 0.2.0
title: Tối ưu chi phí phối hợp thông qua độ tin cậy
summary: Đầu tư vào độ tin cậy để giảm chi phí phối hợp dài hạn. Mỗi điểm thiếu tin cậy buộc hệ thống tăng kiểm tra và đệm an toàn tốn kém.
primary_domain: hop-chung
secondary_domains:
- thanh-su
definition: Tối ưu chi phí phối hợp thông qua độ tin cậy là nguyên tắc đầu tư vào tính ổn định của con người, quy trình và hệ thống nhằm giảm nhu cầu kiểm tra, đối chiếu và xử lý sai sót trong phối hợp.
conditions:
- Công việc phụ thuộc lẫn nhau giữa nhiều vai trò.
- Chi phí phối hợp hiện tại đủ lớn để đo lường và cải thiện.
exceptions:
- Quan hệ một lần không đủ thời gian thu hồi đầu tư độ tin cậy.
- Công việc độc lập ít giao tiếp không cần tối ưu chi phí phối hợp.
applications:
  operations:
  - Đo lường chi phí kiểm tra và sửa lỗi tại các điểm giao thoa giữa các bộ phận.
  - Đầu tư tiêu chuẩn và tự động hóa tại các điểm phối hợp đắt đỏ nhất.
  process-design:
  - Thiết kế giao diện bàn giao rõ ràng để giảm sai sót chuyển tiếp.
  management:
  - Xem độ tin cậy của đồng nghiệp là tài sản vận hành cần đầu tư, không phải yếu tố tự có.
risks:
- Đầu tư độ tin cậy hình thức không giải quyết nguyên nhân gốc.
- Tối ưu chi phí phối hợp bằng cách cắt giao tiếp cần thiết.
- Đo lường sai chi phí thực của thiếu tin cậy.
evidence:
  level: supported
  references:
  - EV-REQ-0001-01
relations:
