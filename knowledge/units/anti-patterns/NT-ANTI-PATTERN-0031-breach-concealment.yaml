id: NT-ANTI-PATTERN-0031
type: anti-pattern
status: frozen
version: 0.2.0
title: Hành vi che giấu vi phạm
summary: Sai sót và vi phạm bị che giấu thay vì được báo cáo kịp thời. Sự cố nhỏ không được xử lý tích tụ thành rủi ro lớn không thể đảo ngược.
primary_domain: tri-nhan
secondary_domains:
- hop-chung
definition: Hành vi che giấu vi phạm là phản-mẫu tuân thủ trong đó cá nhân hoặc bộ phận cố tình không báo cáo sai sót, sự cố hoặc vi phạm chính sách nhằm tránh hậu quả trước mắt.
conditions:
- Văn hóa trừng phạt sai sót và thiếu kênh báo cáo an toàn.
- Mục tiêu tuân thủ bị đo bằng số lượng vi phạm phát hiện được.
exceptions:
- Trường hợp vi phạm do cố ý trục lợi vẫn thuộc diện xử lý riêng.
- Thông tin nhạy cảm được bảo vệ theo quy trình hợp pháp.
applications:
  governance:
  - Thiết kế kênh báo cáo sự cố an toàn và có thời hạn miễn trừ khi hợp tác.
  - Rà soát chính sách để báo cáo sớm không gây bất lợi so với che giấu.
  risk-management:
  - Đo lường chất lượng phát hiện sự cố thay vì chỉ đếm số vụ vi phạm.
  culture:
  - Lãnh đạo công khai khen thưởng việc báo cáo sớm các sai sót nghiêm trọng.
risks:
- Sự cố tích tụ bùng phát với quy mô lớn và chi phí cao.
- Mất niềm tin khiến kênh báo cáo chính thức bị vô hiệu.
- Rủi ro pháp lý và danh tiếng tăng theo thời gian che giấu.
evidence:
  level: supported
  references:
  - EV-REQ-0001-01
relations:
