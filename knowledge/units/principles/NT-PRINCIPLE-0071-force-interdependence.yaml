id: NT-PRINCIPLE-0071
type: principle
status: frozen
version: 0.2.0
title: Thiết lập sự phụ thuộc lẫn nhau
summary: Thiết kế công việc đòi hỏi sự phụ thuộc lẫn nhau thực chất để tạo phối hợp tự nhiên. Phụ thuộc được thiết kế đúng giảm nhu cầu kiểm soát và tăng gắn kết công việc.
primary_domain: hop-chung
secondary_domains:
- dung-nhan
definition: Thiết lập sự phụ thuộc lẫn nhau là nguyên tắc tổ chức công việc trong đó các vai trò buộc phải chia sẻ thông tin, nguồn lực hoặc kết quả để hoàn thành mục tiêu chung, thay vì mỗi vai trò vận hành độc lập hoàn toàn.
conditions:
- Mục tiêu chung cần nỗ lực phối hợp của nhiều vai trò.
- Chi phí phối hợp thấp hơn lợi ích hợp tác mang lại.
exceptions:
- Công việc chuyên môn hóa cao, độc lập tự nhiên có thể không cần phụ thuộc cưỡng bức.
- Khoảng cách địa lý hoặc múi giờ lớn làm chi phí phối hợp vượt lợi ích.
applications:
  team-design:
  - Thiết kế mục tiêu và sản phẩm bàn giao chung cho các nhóm cần hợp tác.
  - Đặt chỉ số đo lường kết quả hợp tác, không chỉ kết quả cá nhân.
  process-design:
  - Tạo điểm giao thoa bắt buộc trong quy trình thay vì để các bộ phận hoạt động biệt lập.
  management:
  - Ghi nhận và thưởng cho hành vi hợp tác thực chất.
risks:
- Phụ thuộc cưỡng bức tạo ma sát không cần thiết.
- Một mắt xích yếu kéo chậm toàn bộ chuỗi.
- Phối hợp hình thức gia tăng cuộc họp mà không tăng kết quả.
evidence:
  level: supported
  references:
  - EV-REQ-0001-01
