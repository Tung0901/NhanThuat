id: NT-ANTI-PATTERN-0035
type: anti-pattern
status: frozen
version: 0.2.0
title: Vận động hành lang ngầm
summary: Đơn vị kiến thức cấu trúc về hành vi Vận động hành lang ngầm trong quản trị tổ chức.
primary_domain: tri-nhan
secondary_domains:
- dung-nhan
definition: Định nghĩa chính thức về Vận động hành lang ngầm trong mô hình kiến trúc Nhân Thuật.
conditions:
- Các ngữ cảnh quản trị và vận hành tổ chức.
exceptions:
- Trường hợp đè quyền ưu tiên khi ứng phó với khủng hoảng khẩn cấp.
applications:
  governance:
  - Áp dụng nhận diện Vận động hành lang ngầm vào quy trình làm việc của tổ chức.
risks:
- Áp dụng không đúng Vận động hành lang ngầm dẫn đến hiệu suất tổ chức không đạt mức tối ưu.
evidence:
  level: supported
  references:
  - EV-REQ-0001-01
relations:
  supports: []
  conflicts_with: []
  depends_on:
  - NT-LAW-0054
  applies_to: []
tags:
- anti-pattern
- tri-nhan
- covert-lobbying
- shadow-politics
- behind-the-scenes
- influence-peddling
- informal-governance
created_at: '2026-07-22'
updated_at: '2026-09-14'
mechanism:
- Các cá nhân hoặc nhóm tác động đến quyết định ngoài kênh chính thức.
- Thông tin và lợi ích được trao đổi riêng, không qua kiểm chứng.
- Quyết định được đưa ra dựa trên lợi ích ngầm thay vì tiêu chí công khai.
- Những người không tham gia vận động bị bất lợi không rõ nguyên nhân.
- Niềm tin vào tính minh bạch của quy trình tổ chức suy giảm.
