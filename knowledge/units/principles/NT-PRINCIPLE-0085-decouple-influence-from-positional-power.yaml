id: NT-PRINCIPLE-0085
type: principle
status: frozen
version: 0.2.0
title: Tách ảnh hưởng khỏi quyền lực vị trí
summary: Tách ảnh hưởng khỏi quyền lực vị trí để tạo môi trường cạnh tranh ý tưởng công bằng. Ảnh hưởng nên đến từ chất lượng lập luận và đóng góp thực chất.
primary_domain: dung-nhan
secondary_domains:
- tri-nhan
definition: Tách ảnh hưởng khỏi quyền lực vị trí là nguyên tắc thiết kế cơ chế để tiếng nói của cá nhân được đánh giá theo năng lực và lập luận, không bị áp đảo tự động bởi chức danh người phát biểu.
conditions:
- Tổ chức cần khai thác chuyên môn phân tán ngoài các vị trí lãnh đạo.
- Văn hóa hiện tại có khoảng cách quyền lực gây ức chế phát biểu.
exceptions:
- Quyết định cuối cùng vẫn thuộc về vai trò chịu trách nhiệm, sau khi đã tiếp nhận các luận cứ.
- Trong khủng hoảng cần chuỗi chỉ huy tập trung.
applications:
  meeting-design:
  - Thu thập ý kiến độc lập trước khi người có quyền lực cao phát biểu.
  - Luân phiên người chủ trì để giảm áp lực thứ bậc.
  governance:
  - Ghi nhận đóng góp theo chất lượng lập luận trong biên bản quyết định.
  management:
  - Chủ động mời chuyên gia ngoài cấp bậc phát biểu trong quyết định chuyên môn.
risks:
- Mỗi ý kiến được coi trọng hình thức làm loãng chất lượng thảo luận.
- Khoảng cách quyền lực ngầm vẫn tiếp tục chi phối.
- Bỏ qua trách nhiệm của người ra quyết định cuối cùng.
evidence:
  level: supported
  references:
  - EV-REQ-0001-01
